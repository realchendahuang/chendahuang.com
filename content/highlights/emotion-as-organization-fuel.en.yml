content: |
  I increasingly feel that the value of emotion is very valuable.

  Why can we Homo sapiens unite to do great things?

  It's precisely because we collectively believe in some story, some emotion, some totem, some myth, some narrative, that we form organizations, cooperate with each other, grow bigger and stronger, and create brilliance together.

  Isn't that a kind of value of emotion?
