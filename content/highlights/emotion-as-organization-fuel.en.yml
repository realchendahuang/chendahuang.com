content: |
  I'm increasingly convinced that the value of emotion is deeply valuable.

  Why can we Homo sapiens band together to do great things?

  Precisely because we collectively believe in some story, some emotion, some totem, some myth, some narrative — that's what forms organizations, drives cooperation, grows us stronger, and makes greatness happen.

  Isn't that itself a kind of emotional value?