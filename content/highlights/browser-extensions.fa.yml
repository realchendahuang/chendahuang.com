content: |
  افزونههای مرورگری را به اشتراک میگذارم که سالهاست همراه مناند.

  - **Wetab**: افزونهی تب جدید. چیزهای پرکاربردت را میگذاری توش، موتور جستجو را سفارشی میکنی و با یک حساب کاربری رایگان بین دستگاهها سینک میشود. من توش یک موتور جستجوی X مبتنی بر گوگل ساختم — خیلی بهتر از موتور پیشفرض است.
  - **Video Speed Controller**: سرعت ویدیو را دقیق تنظیم میکند؛ عالی برای اینکه با بازده بالا دانش جذب کنی.
  - **XHunt**: برای X ضروری است. رتبهبندی هر KOL و داغترین پستهای لحظه را همین حالا ببین.
  - **X Mutual-Follow Radar**: روی صفحه، فالوهای دوجانبه و یکطرفه را علامت میزند و میتواند نسبت following / followers را هم نشان بدهد.
  - **FireShot**: از صفحه وب اسکرینشات بگیر، ویرایش کن و به صورت PDF، JPEG، GIF، PNG یا BMP ذخیره کن.
  - **Proton Pass**: مدیر رمز عبور با طراحی ظریف و سینک بین چند دستگاه.
  - **Immersive Translate**: کهنهکارِ افزونههای ترجمهی دوزبانه، وصل به API مدل DeepSeek V4 Flash.
  - **Codex**: برای اتصال Codex به Chrome ضروری است. با آن میتوانی هر کاری را در مرورگر خودکار کنی — مثلاً نوشتن ایمیل اعتراض وقتی اکانتت بسته میشود.