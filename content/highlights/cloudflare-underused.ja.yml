content: |
  みんな Cloudflare を使いこなせてる度合いは、まだ 1% に届いてない気がする。

  今や機能を出しすぎてる。

  - オブジェクトストレージは R2
  - バックエンド API は Worker
  - AI ゲートウェイは AI Gateway
  - 重い計算は Container
  - キャッシュは KV
  - データベースは D1
  - PostgreSQL を使うなら、HyperDrive で接続すればいい

  などなど、まだまだたくさんある。想像できなければできないほど、できないことはない。

  なにより本当に安い。無料枠だけで長く使える。無料枠って何だ？ 一銭も払わないってことだよ、サイバー菩薩。