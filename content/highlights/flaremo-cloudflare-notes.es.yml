  Un software de notas desarrollado de forma nativa sobre la pila de Cloudflare: FlareMo.

  Registra una cuenta gratuita de Cloudflare, despliega, y ya tienes 10G de almacenamiento de archivos y 5G de almacenamiento de datos.

  Gratis para siempre: el equipo no te cuesta un céntimo, el tráfico no te cuesta un céntimo, los datos se respaldan en varias regiones y trae de serie alta disponibilidad.

  Sirviendo 24 horas al día, en la nube y desde cualquier sitio, con compatibilidad total con el ecosistema de Memos.

  Progreso de entonces: en un día terminé de montar las funciones básicas completas, y ya se puede usar del todo.

  Después iré añadiendo más tutoriales de uso y despliegue, casos de test de ingeniería, tecnología relacionada con los AI Agents y soporte multiplataforma. Build in public.