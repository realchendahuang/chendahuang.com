content: |
  اعلام میکنم:

  Cloudflare یک شرکت واقعاً AI-native است.

  واقعاً دارد تجربهی توسعهدهنده را حول محور عاملهای هوش مصنوعی (AI agents) از نو میسازد.

  Temporary Accounts که تازه منتشر شده به یک عامل AI اجازه میدهد کد بنویسد، مستقیم دیپلوی کند، URL موقت بگیرد، خودش را تست کند و خودش را تکرار کند.

  از روان هم روانتر.

  کنارش با Skills رسمی Cloudflare، نصب با یک دستور:

  `npx skills add cloudflare/skills`

  اصلاً AI-native یعنی چه؟

  این است GOATِ واقعیِ AI-native.