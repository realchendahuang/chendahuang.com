content: |
  昨天我发 Command GOAT 和 OpenCode Go 的额度对比，Command Code 的 CEO 亲自跑来评论了。

  他说我其实还少算了一笔缓存的帐，我顺着去研究了一下，发现Command Code有点东西。

  Coding Agent 本身就是一个巨大的 Prefix Cache 机器。一个几十万 Token 的 Session，跑到下一轮的时候，真正新增的可能只有几千 Token，前面 System Prompt、Tools、代码上下文、历史对话基本都没变。缓存命中率越高，这些老 Context 就越便宜。

  Command Code他们前段时间专门狠狠干了一轮 Cache Thrashing，主要采取的策略如下：

  同一个 Session 尽量固定到相同的 GPU Pod，保持 KV Cache 热着；尽量维持 Stable Prefix，Provider fallback 也不乱改 Context；再加上他们那套 Tool Call Repair，模型参数写错了 Harness 直接本地修，少让模型来回报错重试。

  v0.33.0 的 Changelog 甚至直接写了：Major Cache Overhaul，median cost reduction 2.9×。他们现在官方宣称缓存命中率已经能长期做到 95～99% 左右。

  同一个模型，同样是10美元套餐，因为缓存带来的差异，这玩意累积起来，效果天差地别。
