  Ich habe ein leicht abgedrehtes Skill gebaut:

  **Dahuang AI Tone**

  Alle reden übers „Ent-AI-flaven". Aber was ist der AI-Flavor überhaupt?

  Es kann zwei Dinge:

  - Einen normalen Text in den AI-Flavor eines bestimmten Modells umschreiben
  - Umgekehrt zeigen, wo ein Text nach AI klingt und nach welchem Modell-Klischee

  Sein Wert:

  Erst den AI-Flavor riechen, dann weißt du, wie du ihn loswirst.

