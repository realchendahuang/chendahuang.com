content: |
  AI 時代、いま最もありふれた先延ばし：
  ツールの貯め込み、講座の購入、コミュニティ参加、モデル変更、prompt 調整。
  毎日すごく頑張ってる。
  でもずっと一つの問題に向き合えていない：
  自分の手元に、AI で解決する価値のある本物のビジネスがあるのかどうか。
  刃を研ぐための研究は忙しい。
  でも多くの人は、そもそも豚を屠る勇気がない。