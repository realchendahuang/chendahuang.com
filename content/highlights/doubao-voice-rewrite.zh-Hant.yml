  給大家分享一個洗稿的小技巧。

  可以用豆包輸入法語音轉文字。

  一邊看著需要整理的稿子。

  一邊口述，把它按照自己的話複述出來。

  這樣的 AI 味更少。

  效率還高，還不花錢，還不用充會員。

  在任何場合都能隨時隨地語音輸入，提高輸出效率。