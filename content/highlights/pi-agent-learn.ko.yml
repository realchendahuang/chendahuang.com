content: |
  한 형님이 물었다:

  공부할 만한 Claude Code 분석 문서가 있냐?

  내 답은, AI 시대에는 반드시 어디서나 AI를 먼저 떠올리고, AI가 학습을 돕게 하라는 것이다.

  정말로 에이전트가 어떻게 동작하는지 배우고 싶다면,

  Pi Agent 프로젝트를 보라.

  참새는 작아도 오장육부가 다 있다는 격으로, 학습하기에 아주 좋고 코드 품질도 높다.

  Claude Code는 오픈소스가 아니다. 그건 소스 코드 유출이다.

  Pi Agent가 진짜 오픈소스다.
