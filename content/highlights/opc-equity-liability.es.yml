content: |
  Hoy un amigo ha compartido en mis comentarios un tema sobre la responsabilidad accionarial de las empresas de un solo socio.

  Primero, muchas gracias a este amigo por su amable aviso.

  Su opinión es que hay que hacer que un familiar tuyo tenga al menos un 1% de las acciones.

  El problema de la sociedad limitada de un solo socio: cuando solo hay un accionista, si no se puede demostrar que el dinero de la empresa y el dinero personal están separados, el accionista puede responder de forma solidaria por las deudas de la empresa. Esa es la lógica del artículo 23 de la Ley de Sociedades.

  Si la empresa tiene varios accionistas, pasa de ser «unipersonal» a «sociedad limitada ordinaria», y así se esquiva el especial riesgo de carga de la prueba de la unipersonal, ganando una barrera de protección de bajo coste.

  Espero que os sirva de referencia.

  Pero en el día a día hay que mantener separadas las cuentas públicas y privadas, y procurar poder explicar cada dinero importante.

  - De dónde viene el dinero, por qué viene, y en qué cuenta ha entrado.
  - En qué se ha gastado, por qué se ha gastado y quién lo ha aprobado.
  - Cuando sacas dinero de la empresa: ¿es sueldo, reembolso, préstamo o dividendos?

  Si aclaramos estas tres cosas, el riesgo baja muchísimo.