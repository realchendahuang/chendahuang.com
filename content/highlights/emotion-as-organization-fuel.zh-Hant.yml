content: |
  我現在越來越覺得情緒的價值是很有價值的。

  我們智人為什麼能團結在一起去幹大事？

  就是因為共同相信某種故事、某種情緒、某種圖騰、某種神話、某種敘事，才形成了組織，互相合作，做大做強，共創輝煌。

  這難道不是一種情緒的價值嗎？