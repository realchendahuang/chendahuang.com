content: |
  Hoy es el primer día oficial en la oficina OPC. Os cuento mi proceso al montar la OPC.

  Mi intención inicial era solo tener una entidad con la que cobrar de forma legal y poder publicar productos. Así que busqué por internet información para registrar una empresa.

  No pedía demasiado de la ciudad: Nankín, Suzhou, Hangzhou, Ningbo... con tal de que fuera zona desarrollada de la costa, todo valía.

  Por casualidad, un día vine a Nankín por trabajo y, sin nada que hacer, estuve ojeando los boletines de Nankín. Di con el teléfono de contacto de una comunidad OPC, y lo añadí.

  Después de presentarle brevemente mi proyecto, el responsable lo vio con buenos ojos y me organizó una visita esa misma tarde.

  Su condición era trabajar en sus instalaciones tres días a la semana; si la aceptaba, podía registrar la empresa allí.

  Como es un proyecto bajo capital público de Nankín, sus condiciones son buenísimas: agua, luz, internet y mantenimiento, todo gratis, en teoría durante tres años. Encima hay contables que te ayudan a registrar la empresa, a hacer el sello, a tramitar la licencia de actividad y a ponerte en contacto con el banco para abrir la cuenta. Una ayuda que te deja sin palabras.

  Después de un par de semanas de trámites de registro, por fin tuve todos los papeles.

  El director del parque me dejó elegir un puesto de trabajo. Mis exigencias no eran altas: con tener asiento, banqueta y corriente eléctrica, me vale.

  El director me hizo rellenar tres formularios para solicitar el programa: presentar las ventajas de tu proyecto, la situación de los miembros del equipo, y la especialidad de integrarlo con IA. Si lo escribes bien y es convincente, hay opciones de conseguir una subvención de política pública de entre 50 y 100 mil yuanes.

  Yo creo que Nankín lo está haciendo muy bien en esto. También podéis mirar si vuestra ciudad tiene políticas parecidas, o si vuestra capital de provincia ofrece algo mejor.

  Las buenas políticas no esperan a nadie: hay que preguntar mucho. Cuando llegué hoy, el parque ya tenía muchísimas empresas instaladas: he llegado bastante tarde.

  Eso es todo por hoy. De aquí en adelante iré compartiendo mi experiencia de emprendimiento y repasos del proceso.

  Gracias por vuestra preocupación.