content: |
  TUI، برای اینکه رک باشم، دارد بوی گندیدگی میدهد.
  زشتترین جنبه آن این نیست که سخت است؛ این است که سیستماتیک پهنای باند شناختی انسان را پایین میآورد.
  خیال میکنی با ابزار گفتگوی پربازده داری، در واقع تو دائماً داری سه کار میکنی:
  یادآوری کلیدهای میانبر و حالتها
  پیدا کردن اطلاعات توی جریان متحرک حروف
  و دعا کردن که اشتباهی وارد حالت عجیبی نشده باشی
  این دیگر تعامل نیست، این ستیز با یک رابط است.
  رابط واقعاً پربازده باید حالت را جلوی چشمت پهن کند تا با چشم و حس فضاییات آن را بفهمی، نه اینکه مجبورت کند همه چیز را داخل حافظه کوتاهمدت بچپانی. TUI برعکس عمل میکند — چگالی اطلاعات را به اوج میرساند، اما خوانایی و قابلیت بازیابی را زیر پا له میکند.
  بدتر اینکه عادت خیلی بدی را هم تربیت میکند: اینکه مهارت واقعی را در حفظ کلیدبندی یک ابزار ببینی. نتیجه اینکه آدم انرژی زیادی صرف سازگار شدن با رابط میکند، نه فکر کردن به مسئله.
  یک ابزار خوب باید هزینه فکر کردن را کم کند، نه اینکه هزینه فکر کردن را به نحوه کار کردن با رابط منتقل کند.
  محبوبیت امروز TUI تا حد زیادی پوشاندن تنبلی و غرور در طراحی تعامل با فیلتر گیکوارگی است.
