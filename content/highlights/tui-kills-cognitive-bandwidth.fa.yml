title: "TUI دارد میگندد: سیستماتیک پهنای باند شناختیات را پایین میآورد"
description: "همه حالت را به زور داخل حافظه کوتاهمدتت میچپاند و هزینه فکر کردن را به کار کردن با رابط منتقل میکند."
