  Teile eine Schätze-Website: Buzzing

  Sie passt zu Menschen, die ihre Informationsquellen erweitern und aus der Informationsblase ausbrechen wollen.

  Sie erfasst laufend heiße internationale Inhalte aus Hacker News, Reddit, BBC, Reuters, Bloomberg, Product Hunt und mehr und übersetzt die Titel ins Chinesische.

  Ihr größter Wert: Du kannst die Titel erst einmal auf Chinesisch durchscannen.

  Siehst du einen Artikel, der dich interessiert oder lesenswert ist, klickst du rein und liest die Details.

  Dann kombiniert mit der immersiven Übersetzung für zweisprachiges Lesen.