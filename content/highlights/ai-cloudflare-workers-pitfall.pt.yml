content: |
  Muita gente usa IA pra escrever projetos Cloudflare e quebra — não por causa de sintaxe.
  O problema real é:
  a IA escreve Workers como se fossem Node.js
  usa Binding como process.env
  esquece o await
  salva estado de requisição em variável global
  não sabe que request de asset estático é grátis
  e chama o próprio R2 de dentro do Worker via REST API
  Todas essas armadilhas eu juntei no Cloudflare Playbook.
  E de quebra ainda escrevi