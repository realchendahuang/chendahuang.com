content: |
  Мне кажется, что мы всё ещё используем меньше 1% возможностей Cloudflare.

  Оно выпустило просто невероятно много функций.

  - Объектное хранилище — R2
  - Бэкенд-API — Workers
  - ИИ-шлюз — AI Gateway
  - Тяжёлые вычисления — Container
  - Кэширование — KV
  - База данных — D1
  - Используешь PostgreSQL? Подключай через HyperDrive

  И это только начало — список тянется бесконечно. Что ни придумаешь — оно это умеет.

  А главное — это реально копеечно дёшево. Одного бесплатного тарифа хватает надолго. Что такое бесплатный тариф? Это значит ноль денег — кибер-бодхисаттва, настоящий святой.