  X पर राय होनी ही चाहिए।

  जिनके पास राय नहीं, वे सिर्फ़ सूचना का शोर पैदा कर रहे हैं।

  रुख़ हो तो लोग आपको याद रखते हैं।

  अंतर्दृष्टि हो तो लोग आपको फ़ॉलो करना चाहते हैं।

  X पर री-पोस्ट करने वालों की कमी नहीं — कमी उन लोगों की है जो किसी बात को शुरू से आख़िर तक समझा सकें।