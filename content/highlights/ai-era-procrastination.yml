content: |
  在 AI 时代。现在最普遍的拖延症：
  囤工具、买课程、加社群、换模型、调 prompt。
  每天都很努力。
  但始终不敢面对一个问题：
  我手上到底有没有一个真实业务，值得我拿 AI 去解决？
  研究磨刀很忙。
  可很多人根本不敢杀猪。
