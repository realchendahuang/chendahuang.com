content: |
  내가 선언한다:

  Cloudflare는 진정한 AI 네이티브 기업이다.

  정말로 AI 에이전트를 중심으로 개발자 경험을 다시 짓고 있다.

  방금 출시된 Temporary Accounts를 쓰면 AI 에이전트가 코드를 작성하고, 바로 배포하고, 임시 URL을 받아 스스로 테스트하고, 스스로 반복할 수 있다.

  매끄러움 그 이상이다.

  여기에 Cloudflare 공식 Skills까지 조합하면, 명령 한 줄로 설치된다:

  `npx skills add cloudflare/skills`

  AI 네이티브가 대체 뭔지 아는가?

  이것이 바로 AI 네이티브의 GOAT다.
