content: |
  Tencent의 Workbuddy를 살짝 시험해 봤다 — 전형적인 시나리오가 있다: Meituan 쿠폰 받기.

  로그인 단계에서 QR 코드를 생성해 줘서, 그걸 스캔해 로그인했다.

  그러고는 그냥 "쿠폰 받아줘" 한마디 내뱉었더니, 그렇게 많은 걸 받아 줬다.

  쿠폰 받기 같은 시나리오에 AI 에이전트를 쓰는 것 — 정말 어메이징하다.
