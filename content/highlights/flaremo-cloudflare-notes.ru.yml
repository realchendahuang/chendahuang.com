content: |
  Приложение заметок, нативно построенное на стеке Cloudflare — FlareMo.

  Регистрируете бесплатный аккаунт Cloudflare — после развёртывания получаете 10 ГБ под файлы и 5 ГБ под данные.

  Бесплатно навсегда: ноль затрат на инфраструктуру, ноль на трафик, данные реплицированы по регионам, высокая доступность с рождения.

  Работает в облаке 24/7, полностью совместимо с экосистемой Memos.

  Статус разработки на тот момент: ядро собрано за день, уже полностью пригодно к использованию.

  Дальше: больше туториалов по использованию и развёртыванию, инженерные тест-кейсы, приёмы работы с ИИ-агентами и мультиплатформенная поддержка. Строю на публике.