content: |
  Le TUI, pour dire les choses crûment, a commencé à puer.
  Ce qu'il a de plus dégoûtant, ce n'est pas qu'il soit difficile à utiliser — c'est qu'il réduit systématiquement la bande passante cognitive des humains.
  Vous croyez dialoguer efficacement avec l'outil, mais en réalité vous ne faites que répéter trois choses :
  vous remémorer les raccourcis et les modes,
  localiser l'information dans un flux de caractères qui défile,
  et prier pour ne pas avoir déclenché un état bizarre par un faux mouvement.
  Ce n'est plus de l'interaction, c'est un combat avec l'interface.
  Une interface vraiment efficace devrait étaler l'état sous vos yeux et laisser vos yeux et votre sens de l'espace le comprendre, au lieu de vous forcer à tout entasser dans votre mémoire à court terme. Le TUI fait exactement l'inverse — il pousse la densité d'information à l'extrême, tout en écrasant la lisibilité et la capacité de récupération au minimum.
  Pire encore, il cultive une très mauvaise habitude : considérer la maîtrise des touches d'un outil comme une compétence en soi. Résultat, on dépense une énergie énorme à s'adapter à l'interface au lieu de réfléchir au problème.
  Un bon outil devrait réduire le coût de la réflexion, pas déplacer ce coût vers la question de savoir comment manipuler l'interface.
  La popularité actuelle du TUI, c'est en grande partie un filtre geek qui maquille la paresse et l'arrogance de sa conception d'interaction.
