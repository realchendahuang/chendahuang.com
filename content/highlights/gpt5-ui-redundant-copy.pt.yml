content: |
  Falou com precisão cirúrgica, essa é a mania comum da geração GPT-5:

  sempre escrever a demanda interna no copy da interface, pra provar o próprio esforço. Pra provar: olha, eu realmente fiz, tô com uma cara ótima, né, não dei corpo mole não, coloquei todas as suas demandas em cima da mesa pra você.

  E o copy na interface é absurdamente redundante. Da 5.0 pra 5.6, foi geração após geração, e o problema continua lá — já entrou na medula.

  Quem já fez produto de frontend de verdade entende:

  - todo texto na interface, pequeno ou grande, é copy direcionado ao usuário
  - o que deveria ser retorno pro desenvolvedor, na conversa, nunca deveria ir pro produto

  Mas não é só o copy que é ruim: ele ainda escreve o retorno interno no produto pra "mostrar" que realmente fez alguma coisa.