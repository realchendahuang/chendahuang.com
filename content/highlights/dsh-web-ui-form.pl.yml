content: |
  Myślę, że DeepSeek Harness trafił w formę.

  Zamiast wchodzić od razu w nieludzki TUI, dostarcza Web UI.

  I zajmuje ledwo co miejsca — bo nie ma żadnego instalatora. Żadnego frameworka Electron wpychającego silnik przeglądarki do środka. To naprawdę sporo zaoszczędzonego miejsca.

  Jedyną wadą jest to, że żyje w przeglądarce — ale możesz zainstalować go jako PWA i wtedy czuje się dokładnie jak natywny klient.

  Instalowanie aplikacji webowej jako aplikacji przez Chrome jest naprawdę przydatne. Na zrzucie ekranu to strona internetowa, a zachowuje się dokładnie jak aplikacja desktopowa.
