  Czym jest zarządzanie wiedzą?

  Większość ludzi na hasło „zarządzanie wiedzą” reaguje tak: zapisywanie artykułów, porządkowanie linków, robienie notatek, budowanie pięknej biblioteki.

  Ale wychodząc od pierwszych zasad, problem, który zarządzanie wiedzą naprawdę ma rozwiązać, brzmi:

  **Czy informacje, które widzę dziś, mogą nadal pomagać mi w podejmowaniu decyzji w przyszłości?**

  Ludzka pamięć jest ograniczona, uwaga jest ograniczona, a doświadczenie łatwo się wymyka.

  Jeśli materiał zostanie tylko zapisany w zakładkach, najpewniej skończy jako cmentarzysko informacji.

  Naprawdę wartościowe zarządzanie wiedzą powinno dokonać jednej przemiany:

  zamienić zewnętrzne informacje i osobiste doświadczenia w zdolność działania, którą można odzyskać, wywołać, ponownie wykorzystać i aktualizować.

  - Artykuł, tylko zapisany w zakładkach, jest jedynie materiałem.
  - Wydestylujesz z niego tezę – i staje się informacją.
  - Połączysz go z własnymi projektami, scenariuszami i decyzjami – dopiero wtedy zaczyna się stawać wiedzą.
  - W końcu, gdy pomaga ci pisać artykuły, budować produkty, podejmować decyzje i projektować workflow, staje się zdolnością.

  Dlatego coraz mocniej czuję, że celem zarządzania wiedzą nie powinna być biblioteka.

  To bardziej infrastruktura poznawcza.

  Pomaga ci wchłaniać informacje, porządkować osądy, utrwalać metody i nieprzerwanie produkować treści, produkty i działania.

  Zwłaszcza teraz, gdy istnieją agenci AI, zarządzanie wiedzą robi się dużo ciekawsze.

  Kiedyś polegaliśmy na ludziach: porządkowanie, klasyfikowanie, szukanie, ponowne wykorzystanie.

  Od teraz sporo z tego można oddać agentom:

  automatyczne streszczenia, automatyczne tagowanie, automatyczne linkowanie do projektów, automatyczne generowanie konspektów, automatyczne oznaczanie nieaktualnej wiedzy – a nawet zamienianie materiałów wprost w artykuły, propozycje, slajdy i zadania.

  To też powód, dla którego ostatnio zainteresowałem się zarządzaniem wiedzą.

  Na pozór to robienie notatek.

  U podstaw to budowanie systemu poznawczego, który procentuje na długi czas.