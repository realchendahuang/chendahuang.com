content: |
  یک بررسیِ کوتاهِ انتخابِ فنیِ راه‌حل‌های Docker روی مک.

  - **Colima**: متن‌باز و رایگان، خیلی سبک، اما عملاً فقط خطِ فرمان. مناسبِ کسانی که از دست‌کاریِ دستی بدشان نمی‌آید و توی ترمینال زندگی می‌کنند.
  - **Apple Container**: مسیرِ جدیدِ کانتینریِ اپل — ارزشِ پیگیری دارد، اما اکوسیستمش هنوز خیلی اولِ راه است. حتی Docker Compose هم هنوز پشتیبانی نمی‌شود.
  - **OrbStack**: هم GUI دارد، هم سبک و سریع است و پشتیبانیِ اکوسیستمی کاملی دارد. ایرادش: متن‌باز نیست — نسخه‌ی تجاری‌اش لایسنس می‌خواهد، اما نسخه‌ی شخصی رایگان است.
  - **Docker Desktop**: محصولِ رسمی، اما نتیجه سنگین و بادکرده با تجربه‌ی افتضاح. روی مک، تا می‌توانی از آن دوری کن.
