content: |
  आज एक दोस्त ने मेरे कमेंट सेक्शन में वन-पर्सन कंपनियों की इक्विटी और देयता की समस्याओं पर कुछ बातें शेयर कीं।

  सबसे पहले, इस दोस्त का धन्यवाद इस नेक आगाही के लिए।

  उनका मत: आपको परिवार के किसी सदस्य के पास कम से कम 1% शेयर रखने चाहिए।

  वन-पर्सन लिमिटेड कंपनी की समस्या: जब केवल एक ही शेयरहोल्डर हो और आप कंपनी का पैसा निजी पैसे से साफ़-साफ़ अलग नहीं कर सकते, तो शेयरहोल्डर कंपनी के कर्ज़ों के लिए संयुक्त देयता वहन कर सकता है। कंपनी कानून का अनुच्छेद 23 बिल्कुल इसी तर्क पर है।

  अगर कंपनी में कई शेयरहोल्डर हों, तो यह "वन-पर्सन कंपनी" से "साधारण लिमिटेड लायबिलिटी कंपनी" बन जाती है, जिससे वन-पर्सन कंपनी का विशेष बोझ-साबित करने का जोखिम टल जाता है और आपको कम लागत वाली एक अतिरिक्त सुरक्षा मिल जाती है।

  उम्मीद है यह सबके लिए एक संदर्भ का काम करे।

  लेकिन रोज़मर्रा में हमें बिज़नेस और निजी खाते साफ़-साफ़ अलग रखने चाहिए और हर बड़ी रक़म की व्याख्या कर सकने का लक्ष्य रखना चाहिए।

  - पैसा कहाँ से आया, क्यों आया, और किस खाते में गया।
  - पैसा कहाँ गया, क्यों ख़र्च हुआ, और किसने मंज़ूरी दी।
  - जब आप कंपनी से पैसा निकालते हैं, तो वह सैलरी है, रीइम्बर्समेंट है, लोन है, या डिविडेंड?

  ये तीन बातें साफ़ कर लो, और जोखिम काफ़ी घट जाता है।