  ऑपरेशन के दिन 7 पर 2000 फ़ॉलोअर्स पार — एक त्वरित रिव्यू।

  असली ताक़त एक ही शब्द में: परोपकार।

  मैंने मुख्य रूप से दो तरह की व्यावहारिक सामग्री शेयर की:

  - macOS के भारी इस्तेमाल वाली सॉफ़्टवेयर सूची (48k रीड्स)
  - Cloudflare का फ्री-टियर टेबल + Playbook (X पर अच्छे नंबर; एक आदमी ने इसे खुरच कर Zhihu पर भी लिख दिया, कई सौ बुकमार्क्स जुटा लिए)
  - साथ ही OPC वन-पर्सन-कंपनी रिसोर्स रिकमेंडेशन (38k रीड्स)

  मैं फ़ॉलोअर्स बढ़ाने के बारे में नहीं सोच रहा था — मैंने बस जो कुछ समझा था उसे व्यवस्थित किया और मुफ़्त में बाँट दिया। और ग्रोथ उससे भी तेज़ आई।

  मैं ऐसी व्यावहारिक सामग्री देता रहूँगा। सबका साथ देने के लिए धन्यवाद।