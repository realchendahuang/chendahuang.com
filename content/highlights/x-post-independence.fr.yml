  Un petit truc pour poster sur X :

  chaque post doit se suffire à lui-même.

  Parce que tu n'es pas le centre du monde : personne n'ira ouvrir ton profil pour comprendre le contexte.

  Un inconnu qui te voit pour la première fois doit repartir avec une opinion, ou un know-how.

  C'est ça, un post qui a de la valeur.