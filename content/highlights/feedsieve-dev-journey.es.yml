  Últimamente me tenían harto las cuentas basura como «Fu Bu Hei».

  En un arrebato de ira escribí una extensión de navegador — se llama «FeedSieve».

  Tras varias rondas de iteración ya está en buen punto, y está a punto de salir a la luz.

  Los que la necesitéis, guardad este post — pronto la abriré en código abierto y la subiré a Chrome Web Store.
