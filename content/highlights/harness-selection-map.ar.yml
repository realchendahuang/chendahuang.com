  هذا هو تشكيلتي الحالية.
  
  بالنسبة للنماذج الصينية، أنصح بربط ZCode (DeepSeek V4 Flash، GLM 5.3 Flash، من هذا القبيل).
  
  أما GPT فمباشرةً Codex.
  
  تريد سرعة؟ استخدم Pi.
  
  تريد سرعة وراحة بال معًا؟ استخدم OMP.
  
  تريد بناء عملاء مخصصين للشركات؟ استخدم DSH.
  
  تريد تدريب صبرك؟ استخدم Workbuddy.
