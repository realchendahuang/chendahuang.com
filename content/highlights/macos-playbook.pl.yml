  Zrobiłem macOS Playbook.

  Dla ludzi, którzy właśnie kupili Maca, właśnie przeszli z Windows albo zawsze czuli, że ich Mac nigdy tak do końca nie „kliknął”.

  Zawiera:

  - Co instalować w pierwszej kolejności po kupieniu Maca
  - Jak użytkownicy Windowsa odnajdują się na macOS
  - Jak wybierać narzędzia typu Rectangle / AltTab / Homebrew
  - Jak pracować między urządzeniami
  - Jak skonfigurować terminal, Git, SSH i środowisko AI codingu
  - Jak ogarnąć konserwację systemu, rozwiązywanie problemów, bezpieczne kopie zapasowe i migrację urządzeń

  Playbook: [chendahuang.com/playbooks](/playbooks)