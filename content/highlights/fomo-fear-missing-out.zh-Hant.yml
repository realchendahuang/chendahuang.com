content: |
  給大家介紹一個概念，叫 FOMO，全稱 Fear of Missing Out，錯失恐懼。
  相信很多人都有這個毛病：刷到好東西就想收藏，看到新工具、新趨勢就想跟，總覺得不跟上就會錯過什麼重要的東西。結果就是收藏夾越來越滿，腦子越來越亂，注意力就在這個過程中一點一點被消耗掉了。
