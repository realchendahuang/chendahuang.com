  أشارككم خاطرة صغيرة عن النشر على X:

  لكل منشور استقلاليته.

  لأنك لست مركز هذا العالم؛ فلن يتكلف أحد الدخول إلى صفحتك ليعرف غايات الأمر وأصله.

  فغريبٌ يمر بك في خلاصته أول مرة، يجب أن يجني فوراً رأياً، أو قاعدة عملية (know-how).

  فبهذين المنشورات تصبح ذات قيمة.