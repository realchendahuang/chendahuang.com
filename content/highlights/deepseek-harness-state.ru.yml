content: |
  Я недавно прошёлся по репозиторию и Discussions DeepSeek Harness, и проект находится на очень интересной стадии:

  У DeepSeek Harness уже 150k+ звёзд и более 12 000 коммитов в репозитории.

  И всё же официальный README по-прежнему прямо заявляет: сейчас это только Developer Preview, и ломающие изменения ещё будут.

  rc.7 вышел 17 августа. Создание Issues и PR ограничено; обратная связь идёт через Discussions.

  Сообщество огромное, но ядро разработки сосредоточено в руках немногих. Баги продолжают вылезать — например, та проблема с unknown tool "".

  Чего больше всего не хватает: тестового покрытия, совместимости с провайдерами и надёжности сессий.

  Архитектурно проект по-прежнему привлекателен — как фундамент операционной системы для агентов:

  - Everything is a Plugin
  - Композиционная архитектура Cordis
  - Preset / Skill / MCP / Agent / Provider — всё плагинизировано

  Проект на стадии «влияние опережает инженерные возможности».