content: |
  As opiniões sobre o «plano Soja americano» do Gemini vêm cheias de substância, então preparei um pequeno resumo dos comentários:
  Muita gente acha que o Gemini não é bom de usar, e a razão de fundo é que confundem o posicionamento dele com o de uma máquina-ferramenta de engenharia principal.
  Na real, o posicionamento dele é mais o de um canivete suíço completo: leve, versátil, de custo marginal baixíssimo, mas com limites bem definidos em engenharia complexa e execução autônoma.
  Na entrada de informação, a análise nativa de YouTube é uma das capacidades mais tranquilas. Sem scripts de download nem ferramentas de transcrição para montar em local: envia o link e ele extrai na nuvem a transcrição completa com marcações de tempo, capturas de frames-chave e resumos estruturados.
  O workflow real de muita gente já tem uma divisão clara do trabalho: Grok acompanha as discussões e o pulso em tempo real no X, e Gemini processa os podcasts técnicos e os vídeos de fundo com mais de meia hora.
  Em visão e desenvolvimento front-end, a base multimodal dele é bem sólida. Páginas inteiras de anotações manuscritas, tabelas complexas ou digitalizações de baixa resolução: a precisão do reconhecimento é altíssima e ele alucina pouco.
  E ao prototipar front-end é de uma velocidade absurda, com estrutura de código natural, sem aquela marca de geração rígida e redundante.
  Muitos desenvolvedores independentes usam prompts fixos para ele gerar estruturas de slides numa única página, ou para produzir rápido páginas utilizáveis a partir de capturas de design.
  Em custo e combinação de ferramentas, a conta do ecossistema dele fecha muito bem. A assinatura de 20 dólares por mês aceita grupo familiar de até 6 pessoas, vem com vários TB de Google Drive e se integra a fundo com Docs e Sheets.
  Delegar a ele a busca de informação, a análise multimodal e a construção de páginas leves, e deixar o código complexo do núcleo para modelos de código dedicados: uma forma eficaz de reduzir o custo total das ferramentas de desenvolvimento.
  E há alguns usos avançados que já se mostraram eficazes:
  Primeiro, aproveitar as preferências lógicas dele, relativamente diretas, para encarregá-lo de revisar a sobre-engenharia e o código redundante que outros grandes modelos costumam produzir;
  Segundo, combiná-lo com o NotebookLM para montar uma base de conhecimento privada focada em materiais específicos;
  Terceiro, destinar a cota premium para necessidades derivadas como síntese de voz e processamento de imagens.
  Mas ao usá-lo é preciso ter bem claros os limites dele.
  Primeiro, ele não foi feito para tarefas complexas de terminal Agent: quando pedem para modificar regras do sistema ou implantar ambientes, ele costuma recusar a execução ou não seguir instruções de vários passos;
  Segundo, o código de negócio profundo deve passar por revisão cruzada dos seus modelos principais para não enterrar defeitos ocultos; terceiro, ele é bem sensível ao ambiente de rede: com nós de qualidade instável, é fácil esbarrar em restrições do serviço ou numa experiência degradada.
