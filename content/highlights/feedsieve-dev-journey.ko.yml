content: |
  요즘 "Fu Bu Hei" 같은 쓰레기 계정들 때문에 정말 짜증이 났다.

  분노가 치밀어 오르는 김에 브라우저 확장 프로그램을 하나 만들었다 — 이름은 "FeedSieve"다.

  여러 차례의 반복을 거쳐 이제 좋은 상태에 이르렀고, 곧 출시한다.

  필요한 사람은 북마크해 두라 — 곧 오픈소스로 공개하고 Chrome 웹 스토어에도 올릴 것이다.
