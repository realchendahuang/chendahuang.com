content: |
  Found something great — DeepSeek actually built web search straight into its API.
  Call the deepseek-v4-flash model through the Responses interface, and just declare a web_search tool in the request parameters to use their server-side search directly.
  No integrating a third-party search engine, no applying for a separate search API key.
  The whole search pipeline is hosted by the official team.
