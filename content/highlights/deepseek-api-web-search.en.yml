content: |
  Found something great — DeepSeek actually built web search into its API.
  Call the deepseek-v4-flash model via the Responses format interface, and just declare the web_search tool in the request parameters to directly use their server-side search.
  No need to integrate a third-party search engine, no need to apply for a separate search API key.
  The entire search flow is officially hosted.
