  X पर पोस्ट करने की एक छोटी टिप शेयर कर रहा हूँ:

  हर पोस्ट अपने दम पर खड़ी होनी चाहिए।

  क्योंकि आप दुनिया का केंद्र नहीं हैं — कोई आपकी प्रोफ़ाइल में जाकर पूरी कहानी जोड़ने नहीं आएगा।

  पहली बार जब कोई अजनबी आपकी पोस्ट पर स्क्रॉल करके आए, तो उसे तुरंत एक राय या एक कौशल-सीख मिलनी चाहिए।

  केवल ऐसी पोस्ट्स ही मूल्य रखती हैं।