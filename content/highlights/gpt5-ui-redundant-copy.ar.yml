title: "داء هذا الجيل من GPT-5: حقن الحاجيات الداخلية في نصوص الواجهة"
description: "جذر تكدس نصوص الواجهة أن المخاطَب لم يفصل بين كلام موجه للمستخدمين وردود فعل مخصصة للمطورين."
