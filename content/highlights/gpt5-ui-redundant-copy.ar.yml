content: |
  كلام في غاية الدقة، وهذا هو الداء الشائع في جيل GPT-5:

  إنها تكتب الحاجيات الداخلية في نصوص الواجهة دائماً، لتبرهن على حجم عملها، ولتثبت نفسها: «أجل، لقد أنجزت فعلاً؛ ترى كم أنا عظيم! لم أكسل، عرضتُ كل حاجياتك على الطاولة!»

  وإلى جانب ذلك، فالنصوص في الواجهة متراكمةٌ حشواً. من 5.0 إلى 5.6 رُوّجت الأجيال كلها، والمسألة ما زالت بلا حل، حتى صارت عالقة في النخاع.

  ويعلمه من باشروا منتجات الواجهات حقاً:

  - كل نص في الواجهة، صغُر أو كبُر، خطابٌ موجّه للمستخدم
  - والنص الذي ينبغي أن يُلقى للمطورين رداً في الدردشة، لا يجوز أبداً أن يُكتب داخل المنتج

  ولكنها لا تكتب نصوصاً رديئة فحسب، بل كثيراً ما تكتب ردودها الداخلية داخل المنتج لتُرِيَ أنه فعل شيئاً فعلاً.