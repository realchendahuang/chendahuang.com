title: "موجة TUI هذه — Claude Code يتحمل جزءاً كبيراً من المسؤولية"
description: "بعد أن أرسى Claude Code الاعتماد على فكرة أن TUI هي الطريقة الأصيلة، صار كل مقلّد يصنع حواجز مصطنعة أمام المستخدمين."
