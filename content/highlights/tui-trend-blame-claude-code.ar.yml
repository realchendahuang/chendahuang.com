content: |
  حالياً كثير من أدوات AI Coding Agent لا تتوقف عن إطلاق TUI، وهذه الموجة، Claude Code يتحمل جزءاً كبيراً من المسؤولية عنها.
  لقد أوصل مهمة محادثة AI داخل الطرفية لكتابة الكود إلى أقصى درجات الإتقان.
  لكن المشكلة أن يبدو وكأن Coding Agent متقدماً حقاً يجب أن تكون واجهته الافتراضية طرفية، بينما تصبح نسخة الـ Web مجرد ملحق، بل يُسخر منها لأنها ليست بمستوى المبرمجين بما يكفي.
  وما النتيجة؟
  تبدأ ببناء TUI معقدة
  بألوانها وأشرطة حالتها واختصاراتها وتبديل أنماطها
  ثم تسميها «غامرة» و«فعالة» و«محترمة للمبرمجين»
  حقاً؟
  لمجموعة صغيرة تقضي أيامها داخل الطرفية، نعم إنها ممتعة فعلاً. لكن بالنسبة لكثيرين آخرين، هذا صنع عوائق مصطنعة. الميزات مخبأة خلف المفاتيح والأنماط، فالمستخدم الجديد يحدق حائراً، وحتى المستخدم القديم مضطر لإعادة التأقلم مع تفضيلات مفاتيح كل أداة على حدة.
  واجهة Web UI يمكن بكل بساطة أن تكون سريعة ونظيفة، وبعد تثبيتها كـ PWA يكاد لا يوجد فرق بينها وبين تطبيق سطح المكتب، والتحديث أسهل كذلك. الإصرار على حشر التفاعل قسرياً في نموذج الطرفيات الخاص بالثمانينات ثم احتقار الـ Web بالمقابل، فيه قدر لا بأس به من حب الذات.
  Claude Code قوي بذاته، ولا إشكال في هذا. لكنه نشر هذا الذوق والاعتماد على المسار القائلين بأن TUI هي الأصالة الوحيدة، ومن قلده بعده أصبح أبعد عن المنطق بكثير.
  الأدوات صُنعت لكي يستخدمها الناس، لا لإثبات من الأكثر «جيكيّة».
  تغليف تفاعل معادٍ للإنسانية وتسميته رفاهية، أمر مضحك حقاً.
