content: |
  今天有朋友在我的留言區分享了關於一人公司股權責任的問題。

  首先，非常感謝這位朋友的善意提醒。

  他的觀點是，一定要讓自己的家人持有至少 1% 的股份。

  一人有限公司的問題在於：只有一個股東時，如果說不清公司錢和個人錢是分開的，股東可能就要對公司債務承擔連帶責任。《公司法》第 23 條就是這個邏輯。

  如果公司有多個股東，公司就從「一人公司」變成「普通有限責任公司」，藉此避開一人公司的特殊舉證風險，給自己多一層低成本緩衝。

  希望能給大家做個參考。

  但我們平時要注意公私帳要分明，爭取做到每一筆重要的錢都能說清楚。

  - 錢從哪裡來、為什麼來、進了哪個帳戶。
  - 錢花到哪裡去、為什麼花、誰批准的。
  - 你從公司拿錢，是薪水、報銷、借款，還是分紅。

  這三件事情我們講清楚了，風險就能大大降低。
