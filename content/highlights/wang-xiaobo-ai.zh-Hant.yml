content: |
  我是王小波門下走狗，

  他有趣，但不油滑。
  他幽默，但有邏輯。
  他反感愚蠢，也反感一本正經地愚蠢。

  如果王小波活在 AI 時代，

  他可能會說：

  終於有個東西，可以幫普通人少幹點蠢活，多留點時間，去想一些真正有意思的事了。

  這也是我喜歡 AI 的原因。

  不是因為它神。

  是因為它能讓人少受一點無聊勞動的折磨。
