  X では、必ず意見を持て。

  意見のない人は、ただ情報ノイズを生んでいるだけ。

  自分なりの考えがあってこそ、他人はあなたを覚える。

  洞察があってこそ、他人はあなたをフォローしたくなる。

  X に不足してるのは転載屋じゃない。物事を突き詰めて解説できる人だ。