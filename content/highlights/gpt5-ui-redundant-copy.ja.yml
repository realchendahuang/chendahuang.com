content: |
  言い得て妙だ。これが GPT-5 世代の持病だ：

  いつも社内の要望を画面のコピーに書いて、自分の仕事量を証明しようとする。自分を証明しようとする。「おい、俺は確かにやったぞ。すごいだろ、サボってないぞ、お前の要望を全部テーブルの上に並べたぞ」。

  しかも画面のコピーが非常に冗長。5.0 から 5.6 まで、こんなに何世代も反復してきたのに、この問題は一向に変わってない。骨の髄まで染み込んでる。

  本当にフロントエンドプロダクトを作ったことのある人ならみんな分かる：

  - 画面上の小さい字も大きな字も、すべてユーザー向けのコピー
  - チャットで開発者にフィードバックすべき文言は、絶対にプロダクトの中に書いてはいけない

  それなのにこいつはコピーが下手なだけでなく、社内フィードバックをプロダクトに書いて「俺は確かに何かをやった」と「見せびらかす」ことがよくある。