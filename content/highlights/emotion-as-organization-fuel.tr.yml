content: |
  Duygunun değerinin son derece değerli olduğuna giderek daha çok inanıyorum.

  Neden biz Homo sapiens'ler bir araya gelip büyük işler yapabiliyoruz?

  Tam da ortaklaşa bir hikayeye, bir duyguya, bir toteme, bir mite, bir anlatıya inandığımız için — organizasyonlar bu şekilde oluşur, işbirliğini bu besler, bizi güçlendirir ve büyüklüğü bu mümkün kılar.

  Bu da başlı başına bir tür duygusal değer değil mi?