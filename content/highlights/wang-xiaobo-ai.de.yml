content: |
  Ich bin ein Hund, der unter Wang Xiaobos Tor schlüpft,

  Er war unterhaltsam, aber nicht schmierig.
  Er war humorvoll, aber mit Logik.
  Er verabscheute Dummheit – und ebenso die Dummheit, darauf zu bestehen, wie ernsthaft man sei.

  Wenn Wang Xiaobo im AI-Zeitalter leben würde,

  würde er vielleicht sagen:

  Endlich gibt es etwas, das normalen Menschen ein paar dumme Arbeiten abnimmt und mehr Zeit lässt, um über wirklich interessante Dinge nachzudenken.

  Genau deshalb mag ich AI.

  Nicht, weil es göttlich ist.

  Sondern weil es Menschen etwas Leid öder Arbeit ersparen kann.