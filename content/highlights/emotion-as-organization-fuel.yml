content: |
  我现在越来越觉得情绪的价值是很有价值的。

  我们智人为什么能团结在一起去干大事情？

  就是因为共同相信某种故事、某种情绪、某种图腾、某种神话、某种叙事，才形成了组织，互相合作，做大做强，共创辉煌。

  这难道不是一种情绪的价值吗？
