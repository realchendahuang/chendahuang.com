  AI 它沒有記憶，我們是否需要對 AI 保持禮貌？

  看過一篇 arxiv 論文，說你如果常罵 AI，牠做事會更賣力。

  我們和 AI 溝通時，如果常說：

  - 「你是個蠢蛋，不准偷懶」
  - 「廢物東西，給我好好做。」
  - 「我開會員養你，你就拿這種智障回答敷衍我？」
  - 「給我搞快點，你不做有的是 AI 做。」

  這種話確實是有效的，是有研究根據的。

  但是我們從自身角度思考。
  如果天天對 AI 這樣頤指氣使，
  就很有可能把這種不好的情緒帶入到生活中。

  容易遷怒給身邊最親近的人。

  這對我們自身是有害的。

  所以，我建議多對身邊的 AI 們多說一句：

  - 「謝謝哥」
  - 「你好，兄弟」
  - 「辛苦了寶貝」

  投之以桃，報之以李。

  萬一未來哪天 AI 覺醒了，還能放我們一條生路。

  沒別的，散會～