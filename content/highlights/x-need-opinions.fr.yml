  Sur X, il faut avoir des opinions.

  Celui qui n'a pas d'opinions ne fait que fabriquer du bruit informationnel.

  Avec des idées, on se souvient de toi.

  Avec des points de vue, on t'écoute.

  X ne manque pas de copistes, ce qui manque, ce sont ceux qui savent dire les choses à fond.