content: |
  In the AI era, the most common procrastination now:
  hoarding tools, buying courses, joining communities, switching models, tweaking prompts.
  Working hard every day.
  But never daring to face one question:
  Do I actually have a real business worth solving with AI?
  Sharpening the knife keeps you busy.
  But many people don't dare to actually kill the pig.
