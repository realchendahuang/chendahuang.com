content: |
  솔직히 말해서, 일부 극커 커뮤니티는 이제 더 이상 그냥 마이너한 수준이 아니라 완전한 자기도취 상태다.

  그들의 시그니처: 불편함을 세련됨으로, 진입 장벽을 취향으로 포장하기.

  보통 사람이 쉽고 직관적이고 빠르게 익힐 수 있는 것이라면, 본능적으로 충분히 하드코어하지 않다, 너무 대중적이다, 자기들 수준에 못 미친다고 느낀다.

  반대로 조작이 불편할수록, 정보가 깊숙이 묻혀 있을수록, 사적인 은어와 온갖 단축키를 따로 익혀야 할수록 — 그게 진짜 도구의 모습이라고 여긴다.

  이건 더 이상 효율의 문제가 아니다. 고통을 통해 자신의 정체성을 확인하는 것이다.

  "남들은 견디지 못할 인터랙션을 나는 견뎌낸다" — 이 말이 입 밖에 나오는 순간, 우월감은 저절로 완성된다.

  서클이 작을수록 이런 자화자찬은 서로를 더 쉽게 부추긴다.

  결국 이렇게 변한다: 감히 못 쓰겠다고 말하는 사람은 그저 이해하지 못하는 사람, 즉 아웃사이더가 된다.

  진짜 유능한 사람은 복잡한 것을 단순하게 만든다. 그런데 어떤 극커들은 단순한 것을 복잡하게 만들어 놓고, 그 복잡함 위에 올라서서 모두를 내려다본다.
