category: "essay"
title: "극커의 자기도취: 불편함을 명예로 착각하기"
description: "불편함이 곧 클래스, 장벽이 곧 취향 — 일반인이 쉽고 직관적으로 쓸 수 있는 건 하드코어하지 않다고 여긴다."
