content: |
  كثيرون يكتبون مشاريع Cloudflare بالذكاء الاصطناعي، والفشل ليس بسبب نحو اللغة.
  المشكلة الحقيقية:
  يكتب الذكاء الاصطناعي Workers كأنها Node.js في أغلب الأحيان
  ويستخدم Binding كما لو كان process.env
  وينسى await
  ويسمن قيم عامة (globals) لتخزين حالة الطلب على نحو خاطئ
  ولا يعلم أن طلبات الموارد الثابتة مجانية
  ويستدعي R2 الخاص به من Worker عبر REST API
  وجمعت كل هذه الحفر في Playbook الخاص بـ Cloudflare.
  وكتبت أيضاً على الطريق