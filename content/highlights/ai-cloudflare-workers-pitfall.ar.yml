title: "فشل الذكاء الاصطناعي في مشاريع Cloudflare ليس بسبب نحو الكود"
description: "غالباً ما يكتب الذكاء الاصطناعي Workers كأنها Node.js، ويعامل Binding كمتغير بيئة."
date: 2026-06-22
