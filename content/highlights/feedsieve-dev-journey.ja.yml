  最近、「Fu Bu Hei」みたいなゴミアカウントに本当にうんざりしていた。

  カッとなってブラウザ拡張を書いた——名前は「FeedSieve」。

  何度もイテレーションを重ねていい感じに仕上がったので、もうすぐ公開する。

  使いたい人はこのポストをマークしておいて——近いうちにオープンソース化して Chrome Web Store にも出す。
