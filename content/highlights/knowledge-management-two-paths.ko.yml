content: |
  요즘 지식 관리에 대해 다시 생각해 보고 있다.

  알고 보니 여기에는 두 가지 길이 있다.

  **하나는 Feishu 기반으로 구축하는 것.**

  그 장점은 직접적이다:

  무료, 다중 기기 동기화, 공유 가능, 협업이 쉽고, 형태도 충분히 풍부하다.

  문서, 다차원 테이블, 스프레드시트, 슬라이드, 캔버스, Todo, 지식 베이스 — 이 모듈들이 조합되면 이미 개인과 팀의 많은 지식 관리 시나리오를 커버할 수 있다.

  특히 다차원 테이블을 눈여겨본다.

  지식 허브로 쓰기에 아주 적합하다.

  정보 수집, 자료 보관, 상태 관리, 구조화 정리, 콘텐츠 재생산 — 모두 그것을 중심으로 돌아갈 수 있다.

  여기에 Feishu CLI와 AI 에이전트까지 더하면, Feishu는 더 이상 사무용 도구일 뿐인 소프트웨어가 아니다.

  에이전트가 조작할 수 있는 지식 워크플로 시스템에 더 가까워진다.

  **다른 하나는 Cloudflare 기반으로 직접 만드는 것.**

  이 길은 더 자유롭고, 제품화에도 더 적합하다.

  지금 내가 만들고 있는 FlareMo가 바로 Cloudflare 기반 지식 관리 제품의 시도다.

  Cloudflare의 장점은 바닥 능력이 완비되어 있다는 것이다:

  프런트엔드, 백엔드, 데이터베이스, 객체 스토리지, 벡터 검색, AI — 모두 조합할 수 있다.

  하지만 개발이 필요하다.

  데이터 구조, 검색 경험, 권한 시스템, 제품 로직도 직접 설계해야 한다.

  그래서 지금 내 판단은:

  - Feishu는 오늘 당장 쓸 수 있는 지식 관리 시스템을 빠르게 구축하기에 좋다.
  - Cloudflare는 지식 관리를 진짜 통제 가능하고 반복 가능한 제품으로 만들기에 좋다.

  두 길 모두 연구할 가치가 있다.

  하나는 워크플로에 치우쳐 있고,

  하나는 제품화에 치우쳐 있다.
