content: |
  У многих первый рефлекс при выборе Coding Agent вполне естественный:
  Claude — значит Claude Code; GPT — значит Codex; GLM — значит ZCode; DeepSeek — конечно, в первую очередь смотрим на собственный Harness от DeepSeek.
  И логика эта целиком здравая. Главный плюс первой стороны — она лучше всех знает свои модели.
  Какой Prompt любит модель, какой дизайн Tool Schema самый стабильный, как организовать длинный Context, какие возможности добавила новая версия, где она чаще всего спотыкается — первая сторона обычно узнаёт всё это раньше третьих.
  Поэтому для продуктов вроде Claude Code и Codex, где модель и Harness долго итерируются вместе, комбинация от первой стороны зачастую оказывается самым сильным вариантом ответа.
  Но с открытыми моделями вроде DeepSeek и GLM становится интересно — потому что натренировать хорошую модель и собрать хороший Harness — две совершенно разные инженерные дисциплины.
  Когда Coding Agent реально запускается, всплывает масса проблем помимо модели: как читать файлы, как править код, как управлять Agent Loop, как сжимать Context, как использовать Cache, как восстанавливаться после ошибок Tool Call, как распределять Subagent'ы, как управлять правами.
  От того, насколько хорошо это сделано, напрямую зависит, окажется ли в итоге одна и та же модель удобной в работе.
  Есть и ещё одна проблема: модели обновляются слишком быстро.
  Сегодня сильнее всех GLM, через месяц DeepSeek может выпустить ещё более пробивной Flash, ещё через какое-то время его догонит новая модель. Если весь Coding workflow привязан к продукту одной конкретной первой стороны, то со сменой модели часто приходится менять и инструменты с привычками.
  Вот именно здесь и ценность стороннего Harness.
  Можно закрепить привычные инструменты, Skills, MCP, права и workflow, а менять только модель под ними. Сегодня гоняешь DeepSeek, завтра переключаешься на GLM, послезавтра на что-то ещё — рабочую среду каждый раз заново с нуля строить не нужно.
  Поэтому меня волнует другое: в каком Harness эта модель сделает работу лучше всего.
  У первой стороны — своё преимущество в подгонке под модель, но третья сторона может быть сильнее в инструментах, Context, Cache, Agent Loop и расширяемости.
  В эпоху открытых моделей модель и Harness уже вполне можно выбирать по отдельности.
