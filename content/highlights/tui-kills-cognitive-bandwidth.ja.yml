content: |
  TUI ってやつ、あえて嫌な言い方をするけど、もう臭いを出し始めてる。
  一番ムカつくのは使いにくいことじゃなくて、人間の認知帯域を体系的に下げてるところだ。
  ツールと効率的に会話してるつもりで、実際にはずっと 3 つのことを繰り返してる：
  ショートカットとモードを思い出す
  流れていく文字のストリームから情報を探し出す
  うっかり変な状態に入ってないことを祈る
  もうこれはインタラクションじゃない、インターフェースと格闘してるんだ。
  本当に効率的なインターフェースは、状態を目の前に広げて見せて、目と空間感覚で理解させてくれるものだ。全部を短期記憶に詰め込むことを強制するようなものじゃない。TUI はまさにその逆——情報密度は極限まで積み上げるのに、可読性と復元性は最低まで踏みにじる。
  さらに悪いことに、すごく悪い習慣まで育ててる：あるツールのキーバインドを使いこなせるかどうかを、能力そのものだと思い込むことだ。その結果、人は問題を考えるんじゃなくて、インターフェースへの順応に大量のエネルギーを注ぐことになる。
  いいツールは考えるコストを下げるべきであって、考えるコストを「このインターフェースをどう操作するか」に移すべきじゃない。
  TUI の今の流行は、かなりな割合で、インタラクションデザインにおける自分の怠惰と傲慢を、オタクフィルターで隠してるだけだ。
