content: |
  Sobre contorno de rede: se você assinou um serviço de proxy e também montou nós próprios de VPS, e quer gestão unificada, roteamento unificado e uma URL de assinatura só na saída.
  Quer manter as regras de roteamento, a filtragem de nós e a lógica de combinação no lado do servidor, em vez de configurar repetidamente em cada cliente.
  Quer rodar com o deploy leve da Cloudflare, sem manter servidor, banco de dados e tarefa pesada em background.