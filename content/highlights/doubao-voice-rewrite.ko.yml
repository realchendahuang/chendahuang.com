content: |
  글 다시 쓰기에 관한 작은 요령을 공유한다.

  Doubao 키보드의 음성-텍스트 변환을 사용한다.

  정리해야 할 초안을 눈앞에 두고.

  입 밖으로 말하며, 자기 말로 다시 풀어낸다.

  그렇게 하면 AI 냄새가 적다.

  효율적이고, 무료이며, 멤버십도 필요 없다.

  어디서든 언제든 음성 입력으로 출력 효율을 높일 수 있다.
