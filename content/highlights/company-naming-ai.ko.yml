content: |
  내 회사 이름 짓기 삽질기를 들려주겠다.

  GPT 5.5와 Gemini 3.1 Pro를 썼다. 두 모델로 몇 번이고 브레인스토밍을 반복했는데, 이삼 일이 지나도 좋은 이름이 나오지 않았다.

  왜일까? 이 모델들에겐 창의성이 없기 때문이다. 내놓는 이름 옵션마다 그저 화려한 단어의 퇴적과 글자 조합일 뿐이었다.

  내 아이디어를 던지면, 그들은 같은 빙글빙글 도는 말을 계속 굴려 내게 돌려보냈다. 혈압이 치솟을 지경이었다.

  또 하나 큰 문제가 있다: 간신히 마음에 드는 이름 몇 개를 정해도 Qichacha를 열어 보면 — 이런 — 이미 등록돼 있거나 기존 이름과 불길할 정도로 비슷하다.

  여기서 추천할 만한 것이 알리바바의 88 Cha다. Qichacha 같은 건데 무료다. 이름이 겹치지 않는지 확인하는 데 쓸 수 있다.

  계속 기존 이름을 반복하고 싶지 않다면 네 글자 이름을 고르고, 생각의 폭을 넓혀야 한다.

  무엇보다 여러 모델을 번갈아 써라 — 서로 다른 여러 뇌.

  AI에게 네가 훌륭하다고 생각하는 이름들을 참고로 줘라. DeepSeek(深度求索), ByteDance(字节跳动)처럼.

  네가 좋다고 생각하는 이름을 AI가 연구하게 하라. 여럿의 장점을 두루 빌려야만 진짜 좋은 이름이 나올 수 있다.
