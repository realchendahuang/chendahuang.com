  Лян Вэньфэн сказал на встрече с инвесторами:
  «Конечная точка интеллекта, возможно, вся воплощённая. Потому что обычному человеку нужен не компьютер — ему нужен труд».
  Эти слова точны. Обычные люди никогда не хотели более умный компьютер; им нужен «труд», который реально делает работу. Каким бы сильным ни был текст — это лишь промежуточное состояние. https://t.co/2xg5o5hNjt