content: |
  요즘 AI Coding Agent들이 하나같이 TUI부터 올리는 이 풍조에는, Claude Code가 상당한 책임이 있다.
  터미널에서 AI와 대화하며 코드를 짜는 일을 극한까지 끌어올린 건 사실이다.
  하지만 문제는, 어쩐지 진짜 고급 Coding Agent은 기본이 터미널 UI여야 한다는 분위기가 돼서, Web 쪽은 오히려 부속물 취급, 심하면 프로그래머답지 않다고 조롱받기까지 한다는 점이다.
  그래서 결과가 뭔가?
  복잡한 TUI부터 만들고
  갖가지 색상, 상태바, 단축키, 모드 전환
  그러고는 "몰입형" "효율적" "프로그래머 존중"이라고 포장한다
  정말인가?
  하루 종일 터미널에 살고 있는 소수에게는 확실히 좋다. 하지만 더 많은 사람에게는 그냥 인위적으로 장벽을 만드는 것일 뿐이다. 기능은 키와 모드 속에 숨어 있고, 신규 사용자는 얼어 붙고, 기존 사용자도 도구마다 제각각인 키맵에 다시 적응해야 한다.
  Web UI는 충분히 빠르고 깔끔하게 만들 수 있다. PWA로 설치하면 데스크톱 클라이언트와 거의 차이가 없고, 업데이트도 더 편하다. 굳이 상호작용을 80년대 터미널 패러다임으로 되돌려 놓고서 Web을 깎아내리는 건 제법 자기만족이다.
  Claude Code 자체는 강하다, 그건 문제없다. 하지만 TUI가 정통이라는 미감과 경로 의존을 유행시킨 뒤로, 뒤따르는 무리들이 더 심해졌다.
  도구는 사람이 쓰라고 있는 것이지, 누가 더 "긱"인지 증명하라고 있는 게 아니다.
  인간에게 반하는 상호작용을 고급으로 포장하는 건 정말 우스운 일이다.
