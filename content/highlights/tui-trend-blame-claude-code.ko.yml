title: "TUI 이 풍조, Claude Code가 할 책임이 크다"
description: "'TUI가 정통'이라는 경로 의존을 퍼뜨린 뒤로, 따라 하는 쪽은 전부 인위적으로 장벽을 만들고 있을 뿐이다."
