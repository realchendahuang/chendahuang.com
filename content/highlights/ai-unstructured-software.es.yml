  ¿Dónde está la nueva oportunidad de software en la era de la IA?

  Una de las grandes oportunidades es procesar la parte que el software tradicional no puede registrar: los datos de contexto no estructurados.

  Por ejemplo, un CRM de verdad AI-native, al registrar el descuento que se le dio a un cliente, puede anotar de paso por qué se dio ese descuento y no otro, por qué se descartaron las demás opciones, y quién convenció a quién en la discusión.

  El software tradicional tiene demasiada información oculta así, imposible de registrar. En la era de la IA, con la capacidad de entender texto y vídeo, se puede extraer toda esa información escondida y redundante, convertirla en datos estructurados y analizarla.