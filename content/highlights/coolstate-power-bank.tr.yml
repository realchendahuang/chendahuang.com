  Bir arkadaşım fotoğraftaki power bank'in markasını sordu.

  Pekala, tanıtıma başlama zamanı.

  Bu, CoolState Power Bank No. 25 Super SE (CoolState, eski Zimi).

  140 yuan'ın biraz üzerinde, 25.000 mAh, 120W'a kadar çıkış, dahili şarj kablosu.

  MacBook Air'imi yoğun bir öğleden sonra boyunca idare ettiriyor.

  Starbucks, McDonald's, KFC, kır ve diğer her yer için mükemmel ofis arkadaşı!