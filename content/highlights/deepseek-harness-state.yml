content: |
  我最近又翻了一遍 DeepSeek Harness 的仓库和 Discussions，感觉这个项目现在正处在一个很有意思的阶段：

  DeepSeek Harness 目前已经有 15 万+ Star、仓库累计超过 1.2 万次 Commit。

  但官方 README 依然非常明确地写着：现在只是 Developer Preview，还会发生破坏兼容性的改动。

  rc.7 于 8 月 17 日发布。Issues 和 PR 限制创建，反馈走 Discussions。

  社区很大但核心开发集中。Bug 频出，比如 unknown tool "" 问题。

  最缺的是测试覆盖、Provider 兼容性、会话可靠性。

  架构上还是有吸引力的，像 Agent 操作系统底座：

  - Everything is a Plugin
  - Cordis 组合架构
  - Preset / Skill / MCP / Agent / Provider 全部插件化

  项目现在处在「影响力超前于工程能力」的阶段。
