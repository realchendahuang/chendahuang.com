content: |
  Bugün bir arkadaş yorum bölümümde tek kişilik şirketlerdeki öz sermaye ve sorumluluk meseleleriyle ilgili bazı noktalar paylaştı.

  Öncelikle, bu arkadaşa nazik uyarısı için çok teşekkürler.

  Görüşü şu: hisselerin en az %1'ini bir aile ferdinin tutmasını sağlamalısın.

  Tek kişilik limited şirketin sorunu: yalnızca tek bir hissedar olduğunda ve şirket parasını kişisel paradan net biçimde ayıramadığında, hissedar şirket borçları için müşterek sorumluluk üstlenebilir. Şirketler Kanunu'nun 23. maddesi tam olarak bu mantıktır.

  Şirketin birden fazla hissedarı varsa, "tek kişilik şirket" statüsünden "olağan limited şirket"e geçer; bu da tek kişilik şirketin özel ispat yükü riskinden kaçınır ve kendine düşük maliyetli fazladan bir koruma katmanı sağlar.

  Umarım herkes için bir referans olur.

  Ama günlük hayatta iş ve kişisel hesapları net biçimde ayırmalı ve önemli her meblağı açıklayabilmeyi hedeflemeliyiz.

  - Para nereden geldi, neden geldi ve hangi hesaba girdi.
  - Para nereye gitti, neden harcandı ve kim onayladı.
  - Şirketten para çektiğinde bu maaş mı, geri ödeme mi, kredi mi yoksa temettü mü?

  Bu üç şeyi netleştirdiğimizde risk dramatik biçimde düşer.
