  A notes app natively built on the Cloudflare tech stack — FlareMo.

  Register a free Cloudflare account, and once deployed you get 10G of file storage and 5G of data storage.

  Free forever — no cost for infrastructure, no cost for traffic, data backed up across regions, high availability built in from birth.

  Serving in the cloud 24/7, fully compatible with the Memos ecosystem.

  Development progress at the time: got the core functionality up in a day, already fully usable.

  Going forward: more usage and deployment tutorials, engineering test cases, AI-agent techniques, and multi-platform support. Build in public.