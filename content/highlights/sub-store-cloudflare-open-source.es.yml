  He mudado a Cloudflare mi agregación de suscripciones de VPN.

  He abierto un proyecto que agrega enlaces de suscripción de VPN y se despliega gratis en Cloudflare.

  Agrupa todos tus enlaces de suscripción de proxys y tus nodos de red propios en una sola URL, y de paso puedes ponerle reglas de enrutamiento.

  Lo de verdad: con una sola URL vale para todos los clientes, sin tener que configurar cada cliente por separado.

  GitHub: https://github.com/realchendahuang/sub-store-cloudflare

