content: |
  在 AI 時代，現在最普遍的拖延症：
  囤工具、買課程、加社群、換模型、調 prompt。
  每天都很努力。
  但始終不敢面對一個問題：
  我手上到底有沒有真實業務，值得我拿 AI 去解決？
  研究磨刀很忙。
  可很多人根本不敢殺豬。