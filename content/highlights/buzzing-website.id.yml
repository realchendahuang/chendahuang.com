  Berbagi situs harta karun: Buzzing

  Situs ini cocok untuk siapa pun yang ingin memperluas sumber informasi dan keluar dari ruang gema informasinya.

  Situs ini terus-menerus menarik konten panas dari Hacker News, Reddit, BBC, Reuters, Bloomberg, Product Hunt, dan sumber-sumber luar negeri lainnya, lalu menerjemahkan judul-judulnya ke bahasa Mandarin.

  Nilai terbesarnya: kamu bisa memindai dulu judul-judulnya dalam bahasa Mandarin.

  Kalau ada yang menarik perhatianmu dan tampak layak dibaca, klik untuk melihat detailnya.

  Pada saat itu, padukan dengan Immersive Translate untuk membaca dwibahasa.