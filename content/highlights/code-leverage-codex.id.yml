  Menyampaikan sebuah opini:

  Kode adalah daya ungkit kita, orang-orang biasa.

  Codex adalah daya ungkit dari daya ungkit.

  Tarik Codex keluar, itu seperti mencabut kayu bakar dari bawah kuali — semuanya langsung ambruk.

  Seperti kata pepatah: kalau fondasinya tidak kokoh, gunung berguncang dan bumi bergetar.

  Ayo dong, AI-AI dalam negeri — berbenah dan bangkit!