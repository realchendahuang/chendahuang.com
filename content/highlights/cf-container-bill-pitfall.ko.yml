content: |
  Cloudflare Container 피해자가 나타났다.

  작성 중인 코드가 아직 디버깅 단계라 stop 명령이 적용되지 않았다.

  그 바람에 Container 하나가 7일 동안 계속 실행되면서 4달러가 청구됐다.
