  Lately I've been studying DeepSeek Harness. There's a concept called Preset worth paying attention to.

  Preset can be understood as the distribution unit of an agent. Load different Presets on the same model, and it becomes completely different agents.

  What's the biggest difference between a Preset and a Skill?

  - A financial-report-analysis Skill: teaches the agent how to analyze financial reports.
  - A financial-report-analysis Preset: bundles the financial-report-analysis Skill, web search, Browser, PDF, Python, subagents, research prompts, and context strategy all together — handing you an out-of-the-box agent.

  In the future, two market layers will likely emerge at once.

  - One: a Plugin / Skill marketplace, mainly for developers and power users building agents;
  - One: a Preset / Agent marketplace, truly aimed at ordinary users.

  This is actually very close to the App Store logic. The App Store showcases a complete app; a Preset showcases a complete agent application.

  In the past, people shared prompts. Then they started sharing skills. Next, they'll probably be sharing Presets.