content: |
  Điểm nhanh qua cách chọn lựa Docker trên Mac.

  - **Colima**: mã nguồn mở miễn phí, cực nhẹ, nhưng về cơ bản chỉ dùng được bằng dòng lệnh. Dành cho người không ngại vọc vạch và sống trong terminal.
  - **Apple Container**: hướng container mới của Apple — đáng theo dõi, nhưng hệ sinh thái vẫn còn rất sớm. Thậm chí Docker Compose cũng chưa được hỗ trợ.
  - **OrbStack**: có giao diện, nhẹ và nhanh, hệ sinh thái hỗ trợ tốt. Nhược điểm: không mã nguồn mở — bản thương mại cần license, nhưng bản cá nhân thì miễn phí.
  - **Docker Desktop**: sản phẩm chính hãng, nhưng nặng nề phình to, trải nghiệm tệ. Trên Mac, tránh được thì cứ tránh.
