  Je partage un site pépite : Buzzing

  Il est fait pour ceux qui veulent élargir leurs sources d'infos, briser la chambre d'écho.

  Il scrape en continu les contenus chauds de Hacker News, Reddit, BBC, Reuters, Bloomberg, Product Hunt et autres, et traduit les titres en chinois.

  Sa plus grande valeur : d'abord survoler les titres en chinois.

  Si tu vois un article qui t'intéresse et vaut le détour, tu cliques pour voir les détails.

  Là tu peux coupler ça avec Immersive Translate pour une lecture bilingue.