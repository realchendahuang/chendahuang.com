content: |
  Нашёл отличную штуку — DeepSeek встроил веб-поиск прямо в API.
  Вызывай модель deepseek-v4-flash через интерфейс Responses, и достаточно объявить инструмент web_search в параметрах запроса, чтобы использовать их серверный поиск напрямую.
  Никакой интеграции стороннего поисковика, никакого отдельного ключа поискового API.
  Весь поисковый пайплайн хостится официальной командой.
  Оригинал: https://t.co/D4AXo7crHw