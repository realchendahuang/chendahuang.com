content: |
  आज मेरा OPC ऑफ़िस में औपचारिक रूप से शिफ़्ट होने का पहला दिन है। बताता हूँ कि मैंने OPC कैसे शुरू की।

  मेरा मूल उद्देश्य सरल था: पेमेंट लेने और प्रोडक्ट प्रकाशित करने के लिए एक अनुपालनकारी इकाई चाहिए। इसलिए ऑनलाइन कंपनी रजिस्ट्रेशन की जानकारी खोजने लगा।

  शहर के प्रति मैं पसंदगी नहीं रखता था: नानजिंग, सूझोऊ, हांगझोऊ, निंगबो — कोई भी विकसित तटीय शहर उम्मीदवार था।

  संयोग से, एक दिन मैं काम के सिलसिले में नानजिंग में था, और बे-मतलब नानजिंग से जुड़े WeChat अकाउंट्स स्क्रॉल करते हुए मुझे एक OPC समुदाय संपर्क का फ़ोन नंबर मिला। तो मैंने उन्हें ऐड कर लिया।

  अपने प्रोजेक्ट का त्वरित परिचय देने के बाद, प्रभारी व्यक्ति ने OK कहा और उसी दोपहर साइट विज़िट का इंतज़ाम कर दिया।

  उनकी माँग: हफ़्ते में तीन दिन साइट पर काम करना। अगर मैं वह मान लूँ, तो वे मुझे यहाँ कंपनी रजिस्टर करने देंगे।

  चूँकि यह नानजिंग की राज्य संपत्ति के अंतर्गत है, नीति की शर्तें बेहतरीन हैं — पानी, बिजली, इंटरनेट और प्रॉपर्टी फ़ीस सब मुफ़्त, सैद्धांतिक रूप से तीन साल तक। उन्होंने तो मेरी कंपनी रजिस्टर करने, कंपनी की मुहर बनवाने, बिज़नेस लाइसेंस दिलाने और बैंक खाता खुलवाने के लिए एक बुककीपिंग अकाउंटेंट भी नियुक्त कर दिया। यानी छूना लगभग अविश्वसनीय है।

  रजिस्ट्रेशन प्रक्रिया के दो-तीन हफ़्तों के बाद, आख़िरकार मेरे पास सारे काग़ज़ात आ गए।

  पार्क मैनेजर ने मुझसे एक वर्कस्टेशन चुनने को कहा। वर्कस्टेशन के लिए मेरा मापदंड छोटा है — बस एक सीट, एक स्टूल और बिजली।

  फिर उन्होंने मुझसे तीन प्रोजेक्ट एप्लीकेशन फ़ॉर्म भरवाए, मुख्य रूप से मेरे प्रोजेक्ट की ताक़त, टीम की प्रोफ़ाइल और AI से जुड़ी बढ़त को कवर करते हुए। अगर एप्लीकेशन ठोस और भरोसेमंद हों, तो 50,000–100,000 युआन की नीतिगत सब्सिडी की संभावना है।

  नानजिंग ने सच में इसे अच्छे से संभाला है। सबको जाँचना चाहिए कि उनके अपने शहर में भी ऐसी नीतियाँ हैं या नहीं, या उनकी राजधानी में इससे बेहतर कुछ मिलता है या नहीं।

  अच्छी नीतियाँ इंतज़ार नहीं करतीं — जाकर पूछना पड़ता है। जब मैं आज पहुँचा, इस पार्क में पहले से काफ़ी कंपनियाँ आ चुकी थीं; मैं असल में पीछे हूँ।

  आज के लिए बस इतना। अपनी स्टार्टअप यात्रा और रास्ते में आए रिव्यूज़ शेयर करता रहूँगा।

  सबका ख़याल रखने के लिए धन्यवाद।