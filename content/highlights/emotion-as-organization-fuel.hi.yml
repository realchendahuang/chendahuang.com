content: |
  मैं तेज़ी से विश्वास करने लगा हूँ कि भावना का मूल्य बहुत कीमती है।

  हम Homo sapiens क्यों साथ मिलकर बड़े काम कर सकते हैं?

  ठीक इसलिए क्योंकि हम सामूहिक रूप से किसी कहानी, किसी भावना, किसी टोटेम, किसी मिथक, किसी आख्यान पर विश्वास करते हैं — यही संगठन बनाता है, सहयोग को प्रेरित करता है, हमें मज़बूत बनाता है, और महानता को संभव बनाता है।

  क्या यह अपने आप में एक तरह की भावनात्मक कीमत नहीं है?
