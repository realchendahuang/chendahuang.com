  أُعلن رأياً:

  الكود رافعةُ نحن العاديين.

  وCodex رافعةٌ فوق الرافعة.

  فإن نزعتَ Codex، فنزعتَ الحطبَ من تحت القدر.

  كما يقال: إذا ضعفت حجارة الأساس، اهتزت الأرض وارتجّت الجبال.

  فهيا أيتها الذكاءات الاصطناعية الوطنية، قومي وانهضي!