content: |
  Wiele osób pisze projekty Cloudflare za pomocą AI, a kiedy coś wybucha, to nie chodzi o składnię.
  Prawdziwe problemy:
  AI pisze Workery tak, jakby były Node.js
  traktuje Bindingi jak process.env
  zapomina o await
  chowa stan żądania w zmiennych globalnych
  nie wie, że żądania do statycznych zasobów są darmowe
  i wywołuje własne R2 z wewnątrz Workera przez REST API
  Wszystkie te pułapki zebrałem w Cloudflare Playbook.
  A przy okazji — pracowałem też nad