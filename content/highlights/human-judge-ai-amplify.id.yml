  Manusia yang menilai. AI yang memperkuat.

  Perhatian manusia itu terbatas. Manusia hanya mengurus bagian penilaian yang paling krusial.

  Kamu harus menaruh perhatianmu yang terbatas di tempat yang bernilai, dan biarkan AI mengambil lebih banyak pekerjaan receh.

  Itulah alasan alur kerja AI ada.

  Biarkan alur kerja AI melahap semua pekerjaan receh; manusia memegang penilaian akhir — review atau penerimaan hasil yang paling bernilai, paling inti, dan menjadi tujuan akhir.

  Itulah kondisi yang ingin saya capai. Akhir-akhir ini saya juga sedang iseng-iseng meneliti alur kerja semacam ini.
