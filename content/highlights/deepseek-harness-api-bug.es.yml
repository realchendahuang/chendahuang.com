content: |
  Problemas de compatibilidad entre DeepSeek Harness y APIs de terceros:

  Cuando el Agent llama a herramientas como Bash lanza `ToolNotFoundError: unknown tool ""`, como si la herramienta no estuviera registrada.

  En realidad, el formato de datos que devuelve la puerta de enlace no es el mismo que el oficial de DeepSeek, y el nombre de la herramienta se pierde por el camino.

  Unos cuantos hilos de GitHub Discussions relacionados:

  - buscar "unknown tool" en deepseek-ai/dsh#issues
  - los que montan su propia puerta de enlace (OpenRouter / OneAPI / new-api) son los que más caen en esta trampa

  Idea para rastrearlo: captura una petición de tool_call y su respuesta completas, y compara si el nombre de la herramienta en el log de la puerta de enlace queda como cadena vacía.