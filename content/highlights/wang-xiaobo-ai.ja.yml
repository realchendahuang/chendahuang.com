content: |
  私は王小波の門下の走狗（信奉者）。

  彼は面白いが、ちゃらちゃらしてない。
  彼はユーモアがあるが、ロジックがある。
  彼は愚かさを嫌い、まじめくさった愚かさも嫌った。

  もし王小波が AI 時代に生きていたら、

  彼はこう言うかもしれない：

  ついに、普通の人にくだらない仕事を減らさせて、本当に面白いことを考える時間を残してくれるものが出てきたな。

  これが私が AI を好きな理由でもある。

  AI が神がかってるからじゃない。

  人を退屈な労働の苦しみから少し解放してくれるからだ。