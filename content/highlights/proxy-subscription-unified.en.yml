content: |
  About circumvention, if you've bought an airport and also set up your own VPS nodes, you want to manage them uniformly, route them uniformly, and output a single subscription link.
  You want to maintain routing rules, node filtering, and combination logic on the server side, rather than reconfiguring them in every client.
  You want to run it with Cloudflare's lightweight deployment, without maintaining servers, database services, and complex background tasks.
