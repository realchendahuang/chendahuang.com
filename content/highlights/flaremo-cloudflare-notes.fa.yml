content: |
  یک اپ یادداشت که بومی روی استک فناوری Cloudflare ساخته شده — FlareMo.

  یک حساب رایگان Cloudflare ثبت کن و بعد از دیپلوی، ۱۰ گیگ ذخیرهسازی فایل و ۵ گیگ ذخیرهسازی داده میگیری.

  تا ابد رایگان — نه هزینهای برای زیرساخت، نه هزینهای برای ترافیک، دادهها در چند منطقه پشتیبانگیری میشوند و در دسترسپذیری بالا از بدو تولد همراهت است.

  شبانهروز در ابر سرویس میدهد و کاملاً با اکوسیستم Memos سازگار است.

  پیشرفت توسعه در آن زمان: قابلیتهای اصلی را در یک روز بالا آوردم و کاملاً قابل استفاده شد.

  از این به بعد: آموزشهای بیشتر برای استفاده و دیپلوی، کیسهای تست مهندسی، تکنیکهای عاملهای AI و پشتیبانی چندپلتفرمی. در ملاء عام بساز (Build in public).