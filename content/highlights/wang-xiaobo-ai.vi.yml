content: |
  Mình là một môn đồ trung thành của Wang Xiaobo.

  Ông hóm hỉnh, nhưng không bao giờ bợm mép.
  Ông hài hước, nhưng lúc nào cũng có logic.
  Ông ghét sự ngu ngốc — và thứ ngu ngốc long trọng, đầy vẻ nghiêm túc thì ông cũng ghét không kém.

  Nếu Wang Xiaobo sống ở kỷ nguyên AI,

  có lẽ ông sẽ nói:

  cuối cùng cũng có thứ giúp người bình thường bớt đi chút lao động chân tay ngu ngốc, và giữ lại thêm chút thời gian cho những suy nghĩ thật sự thú vị.

  Đó cũng là lý do mình thích AI.

  Không phải vì nó thần thánh.

  Mà vì nó có thể giúp con người bớt đi một chút giày vò của công việc tẻ nhạt.
