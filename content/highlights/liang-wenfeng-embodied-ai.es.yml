  Liang Wenfeng dijo en una reunión de inversores:
  «El final de la inteligencia puede que sea siempre encarnada: para una persona normal, lo que necesita no es un ordenador, sino mano de obra.»
  Esa frase da en el clavo. Lo que la gente normal ha querido siempre no es un ordenador más listo, sino «mano de obra» que haga cosas. Por muy fuerte que sea el texto, es solo un estado intermedio. https://t.co/2xg5o5hNjt