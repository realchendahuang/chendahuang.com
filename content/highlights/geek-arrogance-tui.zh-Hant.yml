url: "https://x.com/realchendahuang/status/2087949970083389490"
content: |
  說真的，有些極客群體已經不是小眾那麼簡單了，是徹底的孤芳自賞。
  他們最典型的特徵就是：把難受當高級，把門檻當品味。
  一個東西如果好用、直觀、普通人也能快速上手，他們就會下意識覺得不夠硬核、太大眾、掉價。
  反過來，越是操作彆扭、資訊藏得深、需要專門學一套黑話和快捷鍵的東西，他們就越覺得這才叫真正的工具。
  這已經不是在追求效率了，這是在用痛苦來確認自己的身分。
  我能忍受別人忍受不了的互動——這句話一出口，優越感就有了。
  圈子越小，這種自我感動就越容易互相強化。
  最後演變成：誰敢說不好用，誰就是不懂，誰就是外行。
  真正厲害的人，是把複雜的事情變簡單。而有些極客，是把簡單的事情搞複雜，然後站在複雜上面俯視別人。
