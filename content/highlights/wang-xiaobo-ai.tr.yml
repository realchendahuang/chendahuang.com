content: |
  Wang Xiaobo'nun sadık bir müridiyim.

  Espriliydi ama asla şaklaban değildi.
  Komikti ama hep mantıklıydı.
  Aptallıktan nefret ederdi — ciddi ve samimi aptallıktan da aynı şekilde nefret ederdi.

  Wang Xiaobo AI çağında yaşasaydı,

  muhtemelen derdi ki:

  sonunda sıradan insanların biraz daha az aptalca iş yapmasını ve gerçekten ilginç düşünceler için biraz daha fazla zaman ayırmasını sağlayan bir şey çıktı.

  AI'ı sevmemin nedeni de bu.

  İlahi olduğu için değil.

  İnsanları sıkıcı işlerin eziyetinden biraz olsun kurtarabildiği için.
