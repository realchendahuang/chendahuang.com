  最近在思考一個計畫。
  打算把個人知識管理、資訊收集、知識輸出全部搬到 Cloudflare 上。
  免費帳號本身就內建 10GB 的物件儲存和 5GB 的資料庫。
  等於是一個自己架的、在雲端上的、永久免費的知識管理系統啊。
