  En X, hay que tener opinión sí o sí.

  Quien no tiene opinión solo genera ruido informativo.

  Con criterio propio, los demás te recuerdan.

  Con visión, los demás te quieren seguir.

  En X no faltan copipasters: faltan los que saben explicar las cosas hasta el fondo.