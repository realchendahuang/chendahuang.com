  Przekroczyłem 2000 obserwujących w 7. dniu działań – krótkie podsumowanie.

  Sedno jest jedno: altruizm.

  Dzieliłem się głównie dwoma rodzajami praktycznych treści:

  - Listą oprogramowania do intensywnego używania macOS (48 tys. odsłon)
  - Tabelą darmowych limitów Cloudflare + Playbook (niezłe wyniki na X; jakiś gość nawet to wyciągnął i przepisał na Zhihu, uzbierając kilkaset zakładek)
  - Plus rekomendacje zasobów dla jednoosobowych firm OPC (38 tys. odsłon)

  Nie myślałem o tym, jak zwiększyć liczbę obserwujących – po prostu uporządkowałem to, czego się nauczyłem, i oddałem za darmo. A wzrost przyszedł dzięki temu szybciej.

  Dalej będę wrzucał tego typu praktyczne treści. Dzięki wszystkim za wsparcie.