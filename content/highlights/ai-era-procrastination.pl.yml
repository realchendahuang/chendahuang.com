content: |
  W erze AI najpowszechniejsza forma prokrastynacji:
  gromadzenie narzędzi, kupowanie kursów, wchodzenie do społeczności, zmienianie modeli, dopieszczanie promptów.
  Zajęty każdego dnia.
  A mimo to nigdy nie odważysz się zmierzyć z jednym pytaniem:
  czy faktycznie mam prawdziwy biznes, w który warto rzucać AI?
  Ostrzenie noża zajmuje cię bez reszty.
  Ale mnóstwo ludzi nigdy nie odważy się faktycznie zabić świni.