title: "خودشیفتگی گیک‌ها: درد کشیدن را پرستیژ گرفتن"
description: "سختی را نشانه‌ی جایگاه دانستن، مانع را نشانه‌ی سلیقه — اگر چیزی برای آدم‌های عادی آسان و شهودی باشد، یعنی به اندازه‌ی کافی هاردکور نیست."
