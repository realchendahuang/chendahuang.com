content: |
  راستش را بخواهید، بعضی از اجتماع‌های گیک دیگر فقط «خاص و کوچک» نیستند — کاملاً خودشیفته شده‌اند.

  حرکتِ امضاشان این است: ناخوشایندی را نشانه‌ی پیچیدگی می‌گیرند و سدِ ورود را نشانه‌ی سلیقه.

  اگر چیزی ساده، شهودی و سریع باشد و آدم‌های معمولی زود یادش بگیرند، ناخودآگاه احساس می‌کنند به اندازه‌ی کافی هاردکور نیست، زیادی عامه‌پسند است و در شأنشان نیست.

  برعکس، هرچه تعامل با ابزار ناجورتر باشد، اطلاعات کمرنگ‌تر و دفن‌شده‌تر باشد، و هرچه بیشتر لازم باشد یک اصطلاحات خصوصی و یک عالمه میانبر یاد بگیری — بیشتر با خودشان فکر می‌کنند شکلِ واقعیِ یک ابزار همین است.

  این دیگر درباره‌ی کارایی نیست. این است که با درد کشیدن، هویت خودت را تأیید کنی.

  «من می‌توانم تعامل‌هایی را تاب بیاورم که بقیه نمی‌توانند» — همین که این جمله از دهانت بیرون بیاید، حسِ برتری خودش نوشته می‌شود.

  هرچه حلقه کوچک‌تر باشد، این خودستایی راحت‌تر از خودش تغذیه می‌کند.

  آخرش به اینجا می‌رسد: هر کسی جرئت کند بگوید «به درد نمی‌خورد»، یعنی چیزی سر در نمی‌آورد — یعنی آدمِ بیرونی است.

  آدم‌های واقعاً توانا کارهای پیچیده را ساده می‌کنند. بعضی گیک‌ها اما کارهای ساده را پیچیده می‌کنند و بعد از فرازِ همین پیچیدگی، به همه‌ی بقیه از بالا نگاه می‌کنند.
