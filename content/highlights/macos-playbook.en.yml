  I made a macOS Playbook.

  For people who just bought a Mac, just switched from Windows to Mac, or always felt their Mac wasn't working smoothly.

  Inside it covers:

  - What software to install first after buying a Mac
  - How Windows users adapt to macOS
  - How to choose tools like Rectangle / AltTab / Homebrew
  - How to use cross-device collaboration
  - How to configure the terminal, Git, SSH, and AI Coding environment
  - How to handle system maintenance, troubleshooting, secure backup, and device migration

  Playbook: [chendahuang.com/playbooks](/playbooks)
