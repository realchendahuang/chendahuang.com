  Ich äußere eine Meinung:

  Code ist der Hebel für uns normale Menschen.

  Codex ist der Hebel des Hebels.

  Nimm Codex weg – dann bricht dir das Fundament weg.

  Wie man so schön sagt: Ist das Fundament wackelig, bebt die Welt.

  Chinesische AIs, werdet endlich stark!