  最近被「福不黑」這種垃圾帳號給搞得煩了。
  一怒之下寫了一個瀏覽器擴充功能，叫做「福濾娃」。
  迭代了好幾個版本以後，我覺得已經完美了，馬上就要上線了。
  有需要的朋友們可以 mark 一下，稍後我會開源並上架 Chrome 商店。