content: |
  La verdad, algunas comunidades frikis ya no son solo de nicho — son directamente solipsistas.

  Su jugada estrella: tratar la incomodidad como sofisticación y las barreras de entrada como gusto.

  Si algo es fácil, intuitivo y la gente normal lo aprende en seguida, sienten instintivamente que no es lo bastante hardcore, que es demasiado mainstream, que está por debajo de ellos.

  Al revés: cuanto más torpe es el manejo, más escondida está la información y más exige aprenderse una jerga propia y atajos de teclado, más les parece que eso sí es una herramienta de verdad.

  Esto ya no es buscar eficiencia. Es usar el dolor para confirmar la propia identidad.

  «Puedo soportar interacciones que otros no soportan» — en cuanto lo dices en voz alta, ya tienes tu sentimiento de superioridad.

  Cuanto más pequeño es el círculo, más fácil se refuerza esta autocomplacencia entre todos.

  Hasta que acaba en: quien se atreva a decir que no es usable es que no entiende nada, es un ajeno.

  La gente realmente buena simplifica lo complejo. Algunos frikis, en cambio, complican lo simple — y luego se suben encima de esa complejidad para mirar por encima del hombro a los demás.
