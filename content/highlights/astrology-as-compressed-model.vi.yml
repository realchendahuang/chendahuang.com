content: |
  Vừa nghĩ ra một góc nhìn khá thú vị.

  Cung hoàng đạo, con giáp, chiêm tinh, bói toán — những thứ này có lẽ có thể hiểu là những "mô hình nén" của nhân loại trong thời đại ít tính toán.

  Người xưa không có cơ sở dữ liệu, không có công cụ thống kê, cũng không có AI.

  Tất cả những gì họ có thể làm là quan sát mùa vụ, hiện tượng thiên văn, lịch nông vụ, tính cách, lẽ đời xã hội và các chu kỳ xã hội trong thời gian dài, rồi nén cái kinh nghiệm phức tạp đó thành một hệ thống ký hiệu dễ nhớ, dễ lan truyền.

  12 cung hoàng đạo, 12 con giáp, Bát tự, quẻ dịch — về bản chất đều là cách thu gọn thế giới phức tạp xuống chiều kích thấp hơn.

  Tất nhiên, không thể coi chúng là dự đoán khoa học chặt chẽ được.

  Nhưng chúng cũng chưa hẳn là mê tín thuần túy.

  Chúng giống như một sự chưng cất kinh nghiệm — được người xưa dựng nên, bằng câu chuyện, ký hiệu và quy tắc, trong thời kỳ mà sức tính toán khan hiếm, dữ liệu khan hiếm và công cụ khan hiếm.
