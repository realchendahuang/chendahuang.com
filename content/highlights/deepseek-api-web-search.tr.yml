content: |
  Harika bir şey buldum — DeepSeek web aramayı doğrudan API'sinin içine yerleştirmiş.
  Responses arayüzü üzerinden deepseek-v4-flash modelini çağır; istek parametrelerinde bir web_search aracı tanımlaman yeterli, sunucu tarafı aramayı doğrudan kullanırsın.
  Üçüncü taraf arama motoru entegrasyonu yok, ayrıca arama API anahtarı başvurusu da yok.
  Arama boru hattının tamamı resmî ekip tarafından barındırılıyor.
  Orijinal: https://t.co/D4AXo7crHw