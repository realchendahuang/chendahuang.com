content: |
  वर्षों से साथ रखे मेरे ब्राउज़र एक्सटेंशन साझा कर रहा हूँ।

  - **Wetab**: एक नए-टैब वाला एक्सटेंशन। इसमें अपनी अक्सर इस्तेमाल होने वाली चीज़ें रखें, सर्च इंजन कस्टमाइज़ करें, और अकाउंट के साथ डिवाइसों में मुफ्त सिंक करें। मैंने इसमें Google-आधारित X सर्च इंजन बनाया — जो अंतर्निर्मित से कहीं बेहतर है।
  - **Video Speed Controller**: वीडियो की गति को बारीकी से समायोजित करें, ज्ञान कुशलता से सोखने के लिए बढ़िया।
  - **XHunt**: X के लिए ज़रूरी। हर KOL की लीडरबोर्ड और अभी के सबसे हॉट पोस्ट देखें।
  - **X Mutual-Follow Radar**: पेज पर परस्पर-फ़ॉलो और एकतरफ़ा फ़ॉलो को चिह्नित करता है, और following / followers अनुपात भी दिखा सकता है।
  - **FireShot**: वेबपेज स्क्रीनशॉट कैप्चर करें, संपादित करें और PDF, JPEG, GIF, PNG या BMP में सेव करें।
  - **Proton Pass**: सुरुचिपूर्ण डिज़ाइन वाला पासवर्ड मैनेजर, मल्टी-डिवाइस सिंक के साथ।
  - **Immersive Translate**: द्विभाषी अनुवाद का पुराना एक्सटेंशन, DeepSeek V4 Flash API से जुड़ा हुआ।
  - **Codex**: Codex को Chrome से जोड़ने के लिए ज़रूरी। इससे आप ब्राउज़र में कुछ भी ऑटोमेट कर सकते हैं — जैसे अकाउंट बैन होने पर अपील ईमेल लिखना।
