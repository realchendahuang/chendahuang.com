content: |
  اخیراً دارم DeepSeek Harness را مطالعه میکنم. یک مفهوم به اسم Preset هست که ارزش توجه دارد.

  Preset را میتوان واحد توزیع یک عامل (agent) در نظر گرفت. روی همان مدل، Presetهای مختلف بار کن و به عاملهای کاملاً متفاوت تبدیل میشود.

  بزرگترین تفاوت بین یک Preset و یک Skill چیست؟

  - یک Skill تحلیل گزارش مالی: به عامل یاد میدهد چطور گزارشهای مالی را تحلیل کند.
  - یک Preset تحلیل گزارش مالی: Skill تحلیل گزارش مالی، جستجوی وب، Browser، PDF، Python، زیرعاملها (subagents)، پرامپتهای پژوهشی و استراتژی کانتکست را همه با هم ترکیب میکند — و یک عامل آمادهی استفاده (out-of-the-box) تحویلت میدهد.

  در آینده، به احتمال زیاد دو لایه بازار همزمان شکل میگیرند.

  - یکی: بازار Plugin / Skill، عمدتاً برای توسعهدهندهها و کاربران حرفهای که عامل میسازند؛
  - یکی: بازار Preset / Agent، که واقعاً کاربران عادی را هدف میگیرد.

  این در واقع خیلی به منطق App Store نزدیک است. App Store یک اپ کامل را نمایش میدهد؛ یک Preset هم یک اپلیکیشن عاملِ کامل را نمایش میدهد.

  در گذشته مردم Prompt به اشتراک میگذاشتند. بعد شروع کردند به اشتراکگذاری Skill. بعدش به احتمال زیاد نوبت اشتراکگذاری Preset است.