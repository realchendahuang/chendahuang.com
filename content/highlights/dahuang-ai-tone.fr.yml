  J'ai fait un Skill un peu barré :

  **Dahuang AI Tone**

  Tout le monde parle de « retirer l'accent IA ». Mais c'est quoi, l'accent IA ?

  Il peut faire deux choses :

  - transformer un texte normal en accent IA d'un modèle donné
  - et inversement, pointer ce qui dans un texte ressemble à de l'IA, à quel modèle

  Sa valeur :

  d'abord savoir sentir l'accent IA, ensuite savoir comment l'effacer.

  GitHub : https://github.com/realchendahuang/dahuang-ai-tone