content: |
  Encontré algo bueno: resulta que DeepSeek oficial trae la búsqueda de internet integrada en la API.
  Si llamas al modelo deepseek-v4-flash con la interfaz en formato Responses, con declarar la herramienta web_search en los parámetros de la petición ya puedes usar directamente la búsqueda que ejecuta su servidor.
  Nada de integrarte buscadores de terceros por tu cuenta, ni pedir claves extra de la interfaz de búsqueda.
  Todo el flujo de búsqueda lo gestiona oficialmente.
