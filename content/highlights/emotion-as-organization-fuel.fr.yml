content: |
  Je suis de plus en plus convaincu que la valeur des émotions a beaucoup de valeur.

  Pourquoi nous, homo sapiens, arrivons à nous unir pour faire de grandes choses ?

  Parce que c'est en croyant ensemble en une histoire, des émotions, un totem, un mythe, une narration, qu'on forme des organisations, qu'on coopère, qu'on grandit, qu'on crée de la gloire commune.

  Ça, c'est pas une valeur des émotions, ça ?