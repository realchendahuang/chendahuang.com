content: |
  ضجّرتني مؤخراً الحسابات الرديئة مثل «Fu Bu Hei».

  وفي نوبة غضب، كتبتُ إضافة متصفح — اسمها «FeedSieve».

  بعد عدة جولات من التطوير أصبحت في حالٍ جيدة، وهي على وشك الانطلاق.

  من يحتاجها فليضع هذه التغريدة في المفضلة — سأجعلها قريباً مفتوحة المصدر وأنشرها في Chrome Web Store.
