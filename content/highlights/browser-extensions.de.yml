content: |
  Ich teile meine über Jahre gehüteten Browser-Plugins.

  - **Wetab**: Neue-Tab-Plugin, bringe deine häufig genutzten Dinge unter, eigene Suchmaschine einstellbar, mit Login kostenloser Multi-Device-Sync. Ich habe mir damit eine Google-basierte X-Suchmaschine gebaut – viel besser als das Standardzeug.
  - **Video Speed Controller**: flexibles Anpassen der Videogeschwindigkeit, ideal für effiziente Wissensaufnahme.
  - **XHunt**: ein Muss für X, zeigt die Rankings jedes KOL und die aktuell heißesten Posts.
  - **X-Follow-Radar**: markiert gegenseitige und einseitige Follow-Beziehungen auf der Seite und kann die following / followers-Rate einblenden.
  - **FireShot**: Webscreenshots erfassen, bearbeiten und als PDF, JPEG, GIF, PNG oder BMP speichern.
  - **Proton Pass**: elegant gestaltetes Passwort-Tool, Multi-Device-Sync.
  - **Immersive Übersetzung**: langjähriges zweisprachiges Übersetzungs-Plugin, angebunden an die DeepSeek V4 Flash API.
  - **Codex**: ein Muss, um Codex mit Chrome zu verbinden – damit lässt sich alles im Browser automatisieren, etwa eine Einspruch-Mail schreiben, wenn das Konto gesperrt wurde.