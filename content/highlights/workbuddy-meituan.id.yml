content: |
  Mencoba Workbuddy dari Tencent — ada skenario klasik ini: mengklaim kupon Meituan.

  Di langkah login, ia membuatkan kode QR untukku dipindai dan masuk.

  Lalu aku cuma teriak "ayo ambilkan kuponku" dan ia mengambil sebanyak itu untukku.

  Memakai AI agent untuk hal seperti klaim kupon — benar-benar amazing.
