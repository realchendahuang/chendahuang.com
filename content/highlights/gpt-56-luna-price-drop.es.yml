  Es que no me lo creo: OpenAI está desatado. GPT-5.6-Luna baja un 80%: 0,2 dólares por entrada, 1,2 por salida y 0,02 por acierto de caché.
  Comparado con DeepSeek V4 Pro, en el uso típico de escribir código, con 100 millones de tokens y un 95% de acierto de caché, DeepSeek se queda en unos 20 yuanes y Luna en unos 26.
  Y si tienes el plan de Codex, con Luna tu cantidad se multiplica por cinco: ¡un aumento de uso de nada menos que cinco veces! https://t.co/fBVVfyN2OC