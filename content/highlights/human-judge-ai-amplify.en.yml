content: |
  Humans handle judgment. AI handles amplification.

  Human attention is limited. Humans only handle the most critical part of judgment.

  You must allocate your limited attention to valuable places. Let AI do more of the garbage work.

  This is the meaning of AI workflows.

  Let AI workflows wrap up all the garbage work, while humans handle the final judgment — the review or acceptance of the most valuable, most core, final-goal results.

  This is the state I'd like to reach. I've also been casually studying these workflows lately.
