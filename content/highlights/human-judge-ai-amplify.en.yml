content: |
  Humans do the judging. AI does the amplifying.

  Human attention is limited. Humans handle only the most critical slice of judgment.

  You have to spend your limited attention where it's worth something, and let AI take on more of the grunt work.

  That's the whole point of AI workflows.

  Let the AI workflow swallow all the grunt work; humans handle final judgment — the review or acceptance of the most valuable, most core, end-goal results.

  That's the state I want to reach. I've been casually researching these workflows lately too.