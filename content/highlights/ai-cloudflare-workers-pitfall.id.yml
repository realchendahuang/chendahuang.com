content: |
  Banyak orang memakai AI untuk menulis proyek Cloudflare, dan saat proyeknya meledak, bukan soal sintaks.
  Masalah yang sebenarnya:
  AI menulis Workers seperti menulis Node.js
  memperlakukan Binding seperti process.env
  lupa menulis await
  menyimpan status permintaan di variabel global
  tidak tahu bahwa permintaan aset statis itu gratis
  dan memanggil R2 miliknya sendiri dari dalam Worker lewat REST API
  Semua jebakan ini sudah saya kumpulkan di Cloudflare Playbook.
  Omong-omong, saya juga sempat mengerjakan