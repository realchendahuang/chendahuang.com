content: |
  Biraz zaman aldı ama Sub-Store'u Cloudflare üzerinde dağıttım.

  Kendi kurduğum düğümleri ve havaalanının yedek düğümlerini tekte birleştirdim ve otomatik aboneliğe ACL4SSR yönlendirme kurallarını ekledim.

  Tek bir abonelik bağlantısıyla halledildi:

  - Birden fazla sağlayıcının düğümlerini birleştirme
  - Düğüm filtreleme
  - Yönlendirme kuralı yapılandırma
  - Otomatik yapılandırma güncellemeleri

  Pürüzsüzden de pürüzsüz.
