  Я сделал довольно абсурдный Skill:

  **Dahuang AI Tone**

  Все говорят про «убирать вкус ИИ». Но что это вообще такое — «вкус ИИ»?

  Он умеет две вещи:

  - Переписать обычный текст в «вкус ИИ» конкретной модели
  - Или наоборот: указать, где в тексте «пахнет ИИ» и на чью модель это похоже

  Его ценность:

  Сначала надо почувствовать «вкус ИИ», и только потом поймёшь, как его снять.

  GitHub: https://github.com/realchendahuang/dahuang-ai-tone