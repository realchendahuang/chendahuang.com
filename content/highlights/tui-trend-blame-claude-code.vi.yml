title: "Cơn mốt TUI này, Claude Code phải chịu trách nhiệm rất lớn"
description: "Một khi lệ phụ thuộc con đường «TUI mới là chính thống» lan ra, bọn bắt chước đều tự tạo rào cản cho người dùng."
