  Zuletzt scrolle ich seltener durch X.

  Keine Ahnung, ob ich in den Weisen-Modus getreten bin.

  Nach ehrlicher Selbstprüfung merke ich: Mich treibt eine Frage um:

  Kann das, was ich täglich durchscrolle, am Ende ein echtes Produkt werden?

  Egal wie viele Tool-Updates man ansehen kann – besser ist es, ein konkretes Szenario komplett durchzuziehen.

  In dieser Zeit will ich mehr Energie in Produkt, Community und langfristige Inhalte stecken.