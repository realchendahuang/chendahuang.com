  Я в полном восторге — OpenAI окончательно свихнулся. GPT-5.6-Luna подешевела на 80 %: вход $0,2, выход $1,2, попадание в кеш $0,02.
  По сравнению с DeepSeek V4 Pro при типичной нагрузке на написание кода — 100 млн токенов с 95 % попаданий в кеш — DeepSeek выходит примерно в 20 юаней, Luna — примерно в 26.
  А если у тебя тариф Codex, то на Luna ты получаешь в пять раз больше прежнего объёма — целых пять раз больше использования! https://t.co/fBVVfyN2OC