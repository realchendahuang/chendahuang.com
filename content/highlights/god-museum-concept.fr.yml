  Le nom du recueil mythologique Orient-Occident est trouvé — God-Museum · Musée des Dieux :

  fourrer dans le même univers les panthéons sans lien entre eux de la Classique des monts et des mers, du Voyage en Occident, de la Grèce antique, des pays nordiques et de l'Égypte antique, sans qu'ils se tapent dessus.

  La même loi de la foudre s'appelle Zeus en Grèce, Leizhenzi en Orient ;

  la même grande inondation, les Orientaux se souviennent que Nüwa a réparé le ciel, les Hébreux se souviennent de l'arche de Noé.

  Si on pousse vraiment le questionnement, tout le monde mythologique doit être réordonné.

