  Thử Tencent Workbuddy một phen — có một kịch bản kinh điển: giành coupon Meituan.

  Đến bước đăng nhập, nó tự tạo mã QR cho mình quét để vào.

  Rồi mình chỉ cần ra lệnh “đi giành coupon cho tôi”, và nó tự đi giành về đủ số đó.

  Dùng AI agent làm mấy việc kiểu giành coupon — đỉnh thật sự.
