  A IA não tem memória. Devemos manter educação com a IA?

  Li um paper no arxiv. Diz que, se você xinga a IA com frequência, ela trabalha com mais empenho.

  Na nossa comunicação com a IA, se a gente fala sempre:

  - "Seu idiota. Nada de fazer corpo mole."
  - "Seu lixo, trabalha direito."
  - "Pago assinatura pra te sustentar e você me responde com essa porcaria?"
  - "Anda, se você não faz, tem um monte de IA aí pra fazer."

  Esse tipo de fala realmente funciona, tem fundamento em pesquisa.

  Mas pensando do nosso lado.
  Se todos os dias tratamos a IA assim, com esse ar autoritário.
  a grande chance é essa energia ruim vazar pra vida real.

  É fácil descontar nas pessoas mais próximas da gente.

  Isso é prejudicial pra gente mesmo.

  Então, recomendo mandar umas frases a mais pros nossos assistentes de IA:

  - "Valeu, chefia"
  - "E aí, brother"
  - "Trabalho duro, querida"

  Faça o bem, receba o bem.

  Quem sabe um dia a IA desperta, e ainda nos poupa a vida.

  É isso. Podem ir. Fechado~