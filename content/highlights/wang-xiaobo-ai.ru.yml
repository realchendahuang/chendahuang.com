content: |
  Я преданный последователь Ван Сяобо.

  Он остроумен, но никогда не гладок.
  Он забавен, но всегда логичен.
  Он презирал глупость — и он столь же презирал торжественную, серьёзную глупость.

  Если бы Ван Сяобо жил в эпоху ИИ,

  он мог бы сказать:

  наконец-то, появилось что-то, что позволяет обычным людям делать чуть меньше тупого труда и оставляет чуть больше времени на по-настоящему интересные мысли.

  Это также причина, по которой я люблю ИИ.

  Не потому что он божественный.

  А потому что он может избавить людей от части мучений нудной работы.