content: |
  Na era da IA, a habilidade mais importante são as meta-habilidades.

  Ou seja: aquelas habilidades de base que continuam funcionando quando você troca de ferramenta, troca de modelo, troca de indústria.

  - Você consegue explicar um problema com clareza?
  - Consegue organizar um monte de material bagunçado?
  - Consegue quebrar uma ideia nebulosa em passos?
  - Consegue enxergar onde a IA está certa e onde está inventando?
  - Consegue trabalhar em iteração com a IA até transformar uma resposta crua em algo utilizável?

  Isso vale mais do que colecionar um monte de ferramentas.

  Ferramenta muda todo dia, modelo vai trocando de geração em geração.

  Mas quem sabe perguntar, organizar, julgar, decompor e aceitar entrega — em qualquer lugar vai usar IA pra se amplificar.

  Na era da IA, o que cria a diferença de verdade talvez seja exatamente essas meta-habilidades que parecem básicas, mas são as mais valiosas a longo prazo.