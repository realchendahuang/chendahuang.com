content: |
  Sinceramente, algumas comunidades geeks não são só nicho — elas são abertamente solipsistas.

  A jogada delas: tratar desconforto como sofisticação e barreira de entrada como bom gosto.

  Se algo é fácil, intuitivo e qualquer pessoa comum pega rápido, elas sentem na hora que não é hardcore o bastante, é mainstream demais, abaixo delas.

  Ao contrário: quanto mais esquisita a operação, quanto mais escondida a informação, quanto mais exige decorar um jargão próprio e atalhos de teclado — mais elas acham que isso sim é ferramenta de verdade.

  Isso não é mais busca por eficiência. É usar a dor pra confirmar a própria identidade.

  “Eu aguento interação que os outros não aguentam” — é só dizer isso em voz alta que a superioridade aparece.

  Quanto menor o círculo, mais fácil essa autocomplacência se reforça em grupo.

  Até virar: quem ousar dizer que não é usável é porque não entendeu nada, é leigo.

  Gente realmente boa simplifica o que é complexo. Já alguns geeks complicam o que é simples — e depois sobem em cima da complexidade pra olhar os outros de cima.
