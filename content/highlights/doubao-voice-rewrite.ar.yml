content: |
  أشارككم حيلة صغيرة في إعادة صياغة النصوص.

  استخدم لوحة مفاتيح دوباو لتحويل الصوت إلى نص.

  وأنت تنظر إلى المادة التي تحتاج إعادة تنظيم،

  تُفيض بالكلام معيداً صياغتها بكلماتك أنت.

  فتكون النكهة الاصطناعية أقل.

  وكفاءة أعلى، بلا مال، وبلا اشتراكات.

  ويمكنك الإدخال الصوتي في أي مكان وأي وقت، لترفع كفاءة إنتاجك.