  A guy asked:

  is there a good write-up of Claude Code to study?

  My answer: in the AI era, always think with AI — let AI help you learn.

  If you genuinely want to learn how agents work,

  go look at the Pi Agent project.

  Small but complete — perfect for learning, and the code quality is high.

  Claude Code isn't open source; that's a leaked source dump.

  Pi Agent is the genuinely open-source one.