content: |
  احساس میکنم خیلیها هنوز کمتر از ۱٪ از Cloudflare Workers را میفهمند.

  Workers کارگران سایبریاند.

  کارهای کثیف و خستهکنندهی پشت وبسایتت را برایت انجام میدهند.

  ارسال فرم، آپلود فایل، صدا زدن AI، اعتبارسنجی ورود، رسیدگی به اعلانهای پرداخت و API یک محصول کوچک — Workers همهاش را انجام میدهد.

  عجیبترین چیز دربارهی Workers: کاربران رایگان روزی ۱۰۰,۰۰۰ درخواست سهمیه دارند، بدون اینکه یک ریال خرج کنند.

  ۱۰۰,۰۰۰ یعنی چه؟

  فرض کن سایتت روزی ۱,۰۰۰ کاربر دارد. حتی اگر ۲۴ ساعته روشن باشد و هر ثانیه یک نفر سر بزند، میشود روزی ۸۶,۴۰۰ بازدید — باز هم برای تمام کردن سهمیه کافی نیست.

  اگر واقعاً بتوانی آن همه سهمیهی رایگان را تمام کنی...

  پس منتظر چه هستی؟ داری پولدار میشوی.

  حالا میتوانی منطق را بنویسی و مستقیم بدهی به یک Worker تا اجرا کند.
  کنارش از فریمورک API هونو (Hono) استفاده کن که بهترین روش است.

  این همان چیزی است که Cloudflare Workers را اینقدر دلچسب میکند.

  پول بدهم؟ برو بابا.

  Cloudflare دلش مهربان است.

  طاقت ندارد ببیند پول خرج میکنی.