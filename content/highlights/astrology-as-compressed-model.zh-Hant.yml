content: |
  突然想到一個挺有意思的角度。

  星座、生肖、星象、算命這些東西，可能可以理解成人類低算力時代的「壓縮模型」。

  古人沒有資料庫，沒有統計學工具，也沒有 AI。

  他們只能長期觀察季節、天象、農時、性格、人情世故和社會週期，然後把這些複雜經驗壓縮成一套容易記憶、容易傳播的符號系統。

  12 星座、12 生肖、八字、卦象，本質上都像是在把複雜世界降維。

  它當然不能當成嚴謹的科學預測。

  但它也未必只是純粹的迷信。

  更像是古人在算力不足、資料不足、工具不足的情況下，用故事、符號和規則做出來的一種經驗蒸餾。