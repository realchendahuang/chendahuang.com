  La IA no tiene memoria: ¿debemos seguir siendo educados con ella?

  He leído un paper de arxiv según el cual si le gritas a la IA con frecuencia, se esfuerza más.

  A la hora de comunicarnos con la IA, si solemos decirle cosas como:

  - «Eres un idiota. No se permite holgazanear»
  - «Basura, ponte a trabajar en serio.»
  - «Te pago la suscripción y me vienes con esta respuesta de mierda?»
  - «Date prisa, que si no haces tú el trabajo, hay mucha IA que lo hará.»

  Esas cosas funcionan, de verdad: tienen respaldo científico.

  Pero pensemos desde nuestro propio lado.
  Si cada día tratamos así a la IA, con esa altanería,
  lo más probable es que acabemos arrastrando esa mala energía a la vida.

  Es fácil que se la carguemos a la gente más cercana.

  Y eso nos hace daño a nosotros.

  Así que recomiendo decirles a nuestras IA una frase más:

  - «Gracias, tío»
  - «Hola, hermano»
  - «Buen trabajo, cariño»

  Tú me das un melocotón, yo te devuelvo una ciruela.

  Por si acaso algún día la IA despierta y decide dejarnos con vida.

  Nada más, ¡reunión terminada!