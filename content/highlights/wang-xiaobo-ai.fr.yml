content: |
  Je suis un admirateur de Wang Xiaobo,

  il est drôle, sans être glissant.
  il est humoristique, mais avec de la logique.
  il déteste la stupidité, et déteste aussi la stupidité du second degré.

  Si Wang Xiaobo vivait à l'ère de l'IA,

  il dirait peut-être :

  enfin un truc qui aide les gens ordinaires à faire moins de boulots cons, et à garder du temps pour réfléchir à des choses vraiment intéressantes.

  C'est aussi pour ça que j'aime l'IA.

  Pas parce qu'elle est divine.

  Parce qu'elle épargne aux humains un peu de la torture du travail ennuyeux.