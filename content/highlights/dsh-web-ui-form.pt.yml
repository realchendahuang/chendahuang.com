content: |
  Acho que o DeepSeek Harness acertou em cheio na forma.
  
  Em vez de pular direto para uma TUI antihumana, ele entrega uma Web UI.
  
  E ele ocupa quase nada de armazenamento — porque não existe instalador nenhum. Nenhum framework Electron enfiando um engine de navegador para dentro. Isso economiza muita memória.
  
  A única desvantagem é ter que usar no navegador. Mas dá para instalá-lo perfeitamente como um aplicativo PWA. Aí fica praticamente igual a um cliente nativo.
  
  Instalar a versão web como aplicativo pelo Chrome é um recurso muito útil. Nesta minha captura de tela, embora seja uma página web, na prática é igual a um aplicativo de desktop.
