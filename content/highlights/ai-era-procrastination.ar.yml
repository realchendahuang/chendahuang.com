content: |
  في عصر الذكاء الاصطناعي. الإرجاء الأكثر شيوعاً الآن:
  ادخار الأدوات، وشراء الدورات، والانضمام للمجتمعات، وتبديل النماذج، وضبط prompt.
  تعمل كل يوم بجدّ.
  لكنك لا تجرؤ أبداً على مواجهة سؤال:
  هل أملك في يدي عملاً حقيقياً يستحق أن أحلّه بالذكاء الاصطناعي؟
  الاشتغال بشحذ السكين يملأ الوقت.
  لكن كثيرين لا يجرؤون على الذبح أصلاً.