  Testei rapidinho o Workbuddy da Tencent, e tem um cenário clássico chamado pegar cupom do Meituan.

  Na etapa de login, ele gerou um QR code e me pediu pra escanear e entrar.

  Depois eu só gritei "me ajuda a pegar cupom", e ele pegou aquele monte pra mim.

  Usar um AI Agent num cenário tipo pegar cupom é muito amazing.