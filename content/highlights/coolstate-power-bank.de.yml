  Ein Freund fragte mich, welche Powerbank auf dem Bild das ist?

  Na gut, jetzt beginne ich die Werbetrommel zu rühren.

  Das ist der Cuktech Nr. 25 Super-Batterieblock SE (Cuktech war früher ZMI).

  Etwas über 140 Yuan, 25000 mAh, bis zu 120 W Ausgang, Kabel fest eingebaut.

  Damit hält mein MacBook Air einen kompletten Nachmittag intensives Arbeiten durch.

  Ein perfektes Arbeitsgerät für Starbucks, McDonald's, KFC – und überall auf dem Land!