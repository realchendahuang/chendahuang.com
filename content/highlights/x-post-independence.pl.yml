  Dzielę się małą wskazówką do postowania na X:

  każdy post musi stać samodzielnie.

  Bo nie jesteś centrum świata – nikt nie wejdzie na twój profil, żeby składać całą historię w całość.

  Gdy nieznajomy pierwszy raz na ciebie trafi, powinien od razu dostać tezę albo kawałek wiedzy praktycznej.

  Tylko takie posty mają wartość.