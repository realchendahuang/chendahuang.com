content: |
  Рассказываю про свою текущую конфигурацию OpenCode. Она построена вокруг трёх ключевых потребностей:
  Управление контекстом — длинные сессии без переполнения контекста, экономия денег и токенов
  Система памяти — запоминание пользовательских предпочтений, проектных решений и прошлых уроков между сессиями
  Внешние возможности — поиск по документации, поиск по коду, автоматизация десктопа
  Основные плагины, которые я использую:
  1. opencode-dcp (open source) — плагин динамической обрезки контекста.
  Когда контекст достигает порога, он автоматически сжимает старое содержимое в технические выжимки: сохраняет ключевую информацию, выбрасывает шум, чистит дубликаты и удаляет из контекста малоценный мусор вроде ошибок инструментов
  2. opencode-goal-plugin
  Плагин режима Goal — добавляет управление целями для длинных задач
  3. Hermes Memory (если будет спрос, выложу в open source)
  Мой самый тяжёлый плагин — я перенёс многослойную механику памяти Hermes agent на OpenCode.
  4. context7-MCP
  Свежая официальная документация библиотек и фреймворков.
  5. grep-MCP
  Поиск кода по GitHub — ищем реальное использование по всему коду GitHub.
  6. open-computer-use (автоматизация десктопа)
  Позволяет AI напрямую управлять приложениями macOS — клики, ввод, прокрутка, перетаскивание, скриншоты, чтение дерева доступности.
