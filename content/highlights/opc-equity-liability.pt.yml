content: |
  Hoje um amigo compartilhou na minha seção de comentários questões de participação e responsabilidade de empresas de uma pessoa.

  Primeiro, muito obrigado ao amigo pelo aviso bem intencionado.

  A opinião dele: é preciso fazer um familiar segurar pelos menos 1% das ações.

  O problema da empresa de responsabilidade limitada com um único sócio: quando só existe um sócio, se não der pra provar que o dinheiro da empresa está separado do dinheiro pessoal, o sócio pode responder solidariamente pelas dívidas da empresa. O artigo 23 da Lei de Sociedades segue exatamente essa lógica.

  Se a empresa tem vários sócios, ela deixa de ser "empresa de um só" e vira "sociedade limitada comum", evitando o risco especial de ônus de prova da empresa de um só, ganhando uma camada extra de proteção de baixo custo.

  Espero que sirva de referência pra todos.

  Mas no dia a dia, precisamos separar bem as contas públicas e pessoais. Buscar conseguir explicar cada dinheiro importante.

  - De onde veio o dinheiro, por que veio, e em qual conta entrou.
  - Pra onde o dinheiro foi, por que foi gasto, e quem aprovou.
  - Quando você tira dinheiro da empresa, é salário, reembolso, empréstimo ou dividendo.

  Se essas três coisas ficam claras, o risco cai drasticamente.