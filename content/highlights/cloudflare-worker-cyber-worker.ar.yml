content: |
  في شعوري، ما يفهمه كثيرون عن Cloudflare Worker لا يزال دون 1%.

  إن Worker عاملٌ سايبراني.

  مخصص لتولي الأعمال القذرة والمرهقة خلف موقعك.

  من تقديم النماذج، ورفع الملفات، واستدعاء الذكاء الاصطناعي، والتحقق من تسجيل الدخول، ومعالجة إشعارات الدفع، إلى صنع واجهة لمنتج صغير — كل ذلك يستطيعه.

  وأغرب ما في Worker: للمستخدم المجاني حصة 100 ألف طلب يومياً، دون أن يُخرج سنتاً.

  وما معنى 100 ألف مرة؟

  لو كان لموقعك 1000 مستخدم يومياً، وحتى لو لم يتوقف موقعك 24 ساعة، وطرق زائر كل ثانية، فلن يتجاوز اليوم 86400 طلب؛ فلا يصل إلى السقف أصلاً.

  أما إن نجحت فعلاً في استنزاف الحصة المجانية،

  فماذا تنتظر؟ أنت رجلٌ ثريٌ.

  الآن بوسعك كتابة المنطق وتسليمه لـ Worker ليشغّله مباشرة.
  ومع إطار Hono للواجهات، تكون هذه الممارسة الأفضل.

  وهذا أشهى ما في Cloudflare Worker.

  تريد إنفاق المال؟ لا إنفاق أبداً.

  فقلب Cloudflare طيب.

  لا يطيق أن ترزح تحت الإنفاق.