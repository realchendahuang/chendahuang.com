content: |
  Nama untuk kompendium mitologi Timur-Barat sudah ditetapkan — God-Museum · Museum Para Dewa:

  Jejalkan *Klasik Gunung dan Laut*, *Perjalanan ke Barat*, panteon Yunani kuno, Nordik, dan Mesir kuno — kumpulan kisah yang selama ini tidak pernah bersentuhan — ke dalam satu semesta, dan buat mereka tidak saling bentrok.

  Hukum petir yang sama disebut Zeus di Yunani, dan Leizhenzi di Timur;

  banjir besar yang sama dikenang di Timur sebagai Nüwa menambal langit, dan oleh bangsa Ibrani sebagai Bahtera Nuh.

  Kalau benang itu terus dikejar dengan serius, seluruh dunia mitologi harus diatur ulang.

  Coba online: https://chendahuang.com/god-museum/
