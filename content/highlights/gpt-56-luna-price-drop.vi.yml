  Mình thật sự choáng — OpenAI phát điên rồi. GPT-5.6-Luna giảm giá 80%: 0,2 USD đầu vào, 1,2 USD đầu ra, 0,02 USD cho cache hit.
  So với DeepSeek V4 Pro, ở mức sử dụng code điển hình — 100 triệu token với 95% trúng cache — DeepSeek chạy hết khoảng 20 tệ, còn Luna khoảng 26 tệ.
  Còn nếu bạn đang dùng gói Codex, chạy Luna sẽ được lượng dùng gấp năm lần trước đây — hẳn một cú tăng gấp 5! https://t.co/fBVVfyN2OC
