content: |
  I am a loyal follower of Wang Xiaobo,

  He's interesting, but not slick.
  He's humorous, but logical.
  He detests stupidity, and also detests solemn stupidity.

  If Wang Xiaobo lived in the AI era,

  he might say:

  Finally there's something that can help ordinary people do a bit less stupid work and leave a bit more time to think about some truly interesting things.

  This is also why I like AI.

  Not because it's divine.

  But because it can spare people a bit of the torment of boring labor.
