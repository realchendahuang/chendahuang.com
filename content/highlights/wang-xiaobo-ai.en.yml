  I am a dogged disciple of Wang Xiaobo.

  He's witty, but never slick.
  He's funny, but always logical.
  He loathed stupidity — and he loathed solemn, earnest stupidity just as much.

  If Wang Xiaobo lived in the AI era,

  he might say:

  finally, something that lets ordinary people do a little less dumb labor and keeps a little more time for genuinely interesting thoughts.

  That's also why I like AI.

  Not because it's divine.

  But because it can spare people a bit of the torment of tedious work.