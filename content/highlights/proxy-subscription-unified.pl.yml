  Jeśli kupiłeś jakiś „airport” do omijania blokad i do tego postawiłeś własne węzły na VPS, a chcesz nimi zarządzać ujednolicenie, routować ujednolicenie i wyprowadzić wszystko jako jeden link subskrypcji.
  Chcesz, żeby reguły routingu, filtrowanie węzłów i logika ich łączenia były utrzymywane po stronie serwera, a nie konfigurowane klient po kliencie.
  Chcesz to uruchomić na lekkim wdrożeniu Cloudflare – bez serwerów, bez usług baz danych, bez skomplikowanych zadań w tle do utrzymania.