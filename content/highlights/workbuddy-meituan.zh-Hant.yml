content: |
  小試了一下騰訊的 Workbuddy，有一個很經典的場景，叫做領美團優惠券。

  在登入環節，它產生了一個 QR Code，讓我掃碼登入。

  然後我再吼一聲「幫我領優惠券」，它就幫我領了那麼多。

  把 AI Agent 用在領優惠券這樣的場景，非常 amazing。
