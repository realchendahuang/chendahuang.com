  یک روز کامل وقت گذاشتم و «حذف بوی AI از مقالهها» را جدی جدی تحقیق کردم.

  Humanizerهای معروف بازار، Skillهای حذف بوی AI و رویکردهای مبتنی بر prompt را مقایسه کردم.

  بعد تجربهی خودم از استفاده از LLM از سال ۲۰۲۳ تا حالا را هم به آن اضافه کردم — روزبهروز عذاب کشیده از بوهای AI مدلهای GPT، Claude، Gemini و Doubao.

  و این را ساختم:

  **Dahuang Human Tone**

  یک Skill حذف بوی AI که برای بافتار چینی ساخته شده.

  آرزوی من:

  هیچ مقالهی AIای نباید خواندنش عذاب باشد.

  GitHub: https://github.com/realchendahuang/dahuang-human-tone