content: |
  Heute hat ein Freund in meinen Kommentaren etwas zu Anteils- und Haftungsfragen bei One-Person-Companies geteilt.

  Erst einmal: großen Dank für die freundliche Erinnerung dieses Freundes.

  Seine Position: Die eigenen Familienmitglieder sollten mindestens 1 % der Anteile übernehmen.

  Das Problem der One-Person-GmbH: Gibt es nur einen Gesellschafter und lässt sich nicht klären, ob Firmen- und Privatgeld getrennt sind, kann der Gesellschafter für Unternehmensschulden mit solidarisch haftbar gemacht werden. § 23 des Unternehmensgesetzes funktioniert nach dieser Logik.

  Hat die Firma mehrere Gesellschafter, wird aus der „One-Person-Company" eine „gewöhnliche GmbH" – und man umgeht die spezielle Beweispflicht der One-Person-Company. Eine kostengünstige Puffer-Schicht mehr.

  Ich hoffe, es ist für euch eine Referenz.

  Aber generell gilt: Geschäftskonto und Privatkonto strikt trennen. Versucht, dass jede wichtigere Geldbewegung klar erklärbar ist.

  - Woher das Geld kommt, warum es kommt, auf welches Konto es geht.
  - Wohin das Geld fließt, warum es fließt, wer es genehmigt hat.
  - Ob du Geld aus der Firma als Gehalt, Spesenabrechnung, Darlehen oder Dividende ziehst.

  Haben wir diese drei Dinge klar, sinkt das Risiko deutlich.