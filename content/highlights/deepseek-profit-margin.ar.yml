  أشارككم معلومة باردة؛ قد يظن الناس أن DeepSeek تبيع الـ tokens بخسارة.

  ومع أن واجهتها رخيصة، فقد أشارت الشركة رسمياً إلى أن هامش ربحها في هذا الجانب يبلغ 545%!!!

  إذن DeepSeek ليست مجرد بوذا سايبراني للذكاء الاصطناعي، بل إن تقنيتها أيضاً فائقة القوة.

