  Ya tengo el nombre de la enciclopedia mitológica de Oriente y Occidente: God-Museum · el Museo de los Dioses:

  meter los panteones independientes del Clásico de las Montañas y los Mares, Viaje al Oeste, la Antigua Grecia, el norte de Europa y el Antiguo Egipto en un mismo universo, y lograr que no se peleen.

  La misma ley del rayo en Grecia se llama Zeus, y en Oriente Leizhenzi;

  el mismo gran diluvio, los orientales lo recuerdan como Nüwa remendando el cielo, y los hebreos como el arca de Noé.

  Si preguntamos en serio, habría que reordenar todo el mundo mitológico.

