content: |
  東西の神話図鑑の名前が決まった——God-Museum・神々の博物館：

  『山海経』『西遊記』、古代ギリシャ、北欧、古代エジプトという、互いに何の関係もない神譜を同じ宇宙に詰め込んで、喧嘩させない。

  同じ雷の理法は、ギリシャではゼウス、東洋では雷震子と呼ばれる；

  同じ大洪水は、東洋人は女媧が天を補修した物語として覚え、ヘブライ人はノアの方舟として覚えている。

  真面目に突き詰めていけば、神話の世界全体を作り直さなきゃいけなくなる。

