content: |
  Bir erişim (circumvention) havaalanı satın aldıysan ve kendi VPS düğümlerini de kurduysan ve hepsinin birleşik yönetilmesini, birleşik yönlendirilmesini ve tek bir abonelik bağlantısı olarak çıkmasını istiyorsan.
  Yönlendirme kurallarının, düğüm filtrelemenin ve kombinasyon mantığının istemci istemci yapılandırmak yerine sunucu tarafında tutulmasını istiyorsan.
  Cloudflare'in hafif dağıtımıyla çalıştırmak istiyorsan — sunucu, veritabanı hizmeti veya karmaşık arka plan görevi bakımı istemiyorsan.
