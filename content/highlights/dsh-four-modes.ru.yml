content: |
  Я потратил время на четыре режима DeepSeek Harness — вот плюсы, минусы и сценарии для каждого.
  
  1. Standard — лучше всего для повседневной разработки
  Standard — это полноценный Coding Agent DeepSeek Harness по умолчанию. В нём есть всё нужное для повседневной разработки, и он особенно хорош для задач, где пока не знаешь, в чём проблема, и агенту нужно исследовать самостоятельно.
  
  Но поскольку основная масса работы идёт по схеме LLM → Tool → LLM → Tool → LLM → Tool, с усложнением задач накапливается всё больше круговых вызовов Tool Calling, растут задержка и расход токенов.
  
  Итак: задачи с приоритетом исследования — на Standard.
  
  2. PTC — режим эффективности для сложных задач
  PTC позволяет модели написать блок TypeScript, объединяющий несколько вызовов инструментов в одно выполнение.
  
  Standard может выглядеть так: поиск файлов → возврат в модель → чтение файла → возврат в модель → поиск → возврат в модель → правка → возврат в модель.
  PTC превращается в: модель пишет TypeScript → один запуск → поиск + цикл + фильтрация + чтение + обработка → возврат итогового результата.
  
  Это сокращает круговые вызовы и не пускает огромные объёмы бессмысленных промежуточных данных в контекст модели. Поэтому массовая пакетная, повторяющаяся, структурная обработка — вот где PTC блистает.
  
  3. Minimal — только Bash + Editor для модели
  Его главная сила — простота: мало инструментов, маленькие схемы инструментов, низкие фиксированные накладные расходы промпта.
  
  Но нет Web, нет Skills, нет Subagent, нет Workflow — сложные задачи приходится продавливать одним агентом. И в Minimal нет полноценного Context Compaction из Standard. Так что хотя на коротких задачах фиксированные расходы токенов невелики, на очень длинных сессиях с большим объёмом вывода Bash он может и не сэкономить токены.
  
  Minimal — выбор для чётких, хорошо определённых мелких задач: чем яснее и короче, тем лучше.
  
  4. Creator — агент создаёт агентов
  Это Standard плюс Cordis Runtime, эксперименты с плагинами и создание Preset. Он превращает даже самого агента во что-то компонуемое и создаваемое.
  
  Честно говоря, это мило: модель сама разворачивает свой ларёк, чтобы продавать товар, а потом сама же хлопочет над своим ларьком — полная самообеспеченность.
  
  Но самая большая проблема Creator — повышенные права доступа. Имей это в виду.
