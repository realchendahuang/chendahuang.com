content: |
  科学上网（プロキシ）について、機場（プロキシサービス）を買って、さらに自分の VPS ノードを立てているなら、それらを統一管理して、統一分流して、一つのサブスクリンクとして出力したい。
  分流ルール、ノードのフィルタリング、組み合わせロジックをサーバー側でメンテしたい。各クライアントで繰り返し設定したくない。
  Cloudflare の軽量デプロイ方式で動かしたい。サーバー、データベースサービス、複雑なバックグラウンドタスクはメンテしたくない。