content: |
  Hoje é o primeiro dia oficial no escritório OPC. Vou contar a experiência de abrir minha OPC.

  Minha intenção inicial era só ter um CNPJ válido pra receber dinheiro e publicar produto. Então fui atrás das informações de registro de empresa na internet.

  Não tinha muita exigência de cidade: Nanquim, Suzhou, Hangzhou, Ningbo — qualquer uma que fosse região litorânea desenvolvida, entrava nas minhas opções.

  Por coincidência do destino, certo dia fui a trabalho pra Nanquim, sem ter o que fazer, fiquei rolando os blogs da região. Tropecei no telefone de um contato da comunidade OPC. E adicionei ele.

  Depois de apresentar meu projeto resumidamente, o responsável achou que era ok, e marcou uma visita presencial pra tarde.

  O que pediram: três dias por semana trabalhando presencialmente no local, e se eu aceitasse, podia registrar a empresa lá.

  Como é um projeto ligado ao capital estatal de Nanquim, os termos eram muito bons: água, luz, internet e condomínio tudo grátis, em tese por três anos, e ainda tinha um contador que registrava a empresa por mim, fazia o carimbo, tirava o alvará, e me ajudava a abrir conta no banco. Comovente até demais.

  Depois de umas duas ou três semanas de processo de registro, finalmente saíram todos os documentos.

  O gerente do parque me deixou escolher um posto de trabalho. Minha exigência era simples: só precisava de cadeira, mesa e tomada.

  O gerente me fez preencher três formulários de projeto, apresentando a vantagem do projeto, a situação do time e o diferencial em relação com IA. Se escrevesse bem e parecesse confiável, tinha chance de ganhar um subsídio de política de 50 a 100 mil reais.

  Acho que essa parte de Nanquim tá muito bem feita. Vocês também podem dar uma olhada se a sua cidade tem políticas parecidas, ou se a capital do seu estado tem alguma melhor.

  Política boa não espera, tem que ficar de ouvido atento. Quando cheguei hoje, já tinha um monte de empresa instalada no parque, cheguei relativamente tarde.

  Por hoje é só. Daqui pra frente vou compartilhando toda a minha experiência empreendendo e a retrospectiva do processo.

  Obrigado pela preocupação de todos.