content: |
  Моя частота листания X недавно снизилась.

  Не уверен, не вошёл ли я в режим мудреца.

  После честной рефлексии я понял, что меня волнует один вопрос больше всего:

  может ли то, что я листаю каждый день, в итоге стать настоящим продуктом?

  Смотреть сотню обновлений инструментов — не чета пробитию одного конкретного сценария.

  В эти дни я хочу вкладывать больше энергии в продукты, сообщество и долгосрочный контент.