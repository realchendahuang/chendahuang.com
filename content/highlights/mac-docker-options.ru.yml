content: |
  Краткий разбор выбора вариантов Docker на Mac.

  - **Colima**: бесплатный и открытый, очень лёгкий, но по сути только командная строка. Для тех, кто не против повозиться и живёт в терминале.
  - **Apple Container**: новое направление контейнеров от Apple — стоит следить, но экосистема ещё на самой ранней стадии. Даже Docker Compose пока не поддерживается.
  - **OrbStack**: есть GUI, лёгкий и быстрый, с отличной поддержкой экосистемы. Минус: не открытый — коммерческая версия требует лицензию, но личная бесплатна.
  - **Docker Desktop**: официальный продукт, но тяжёлый и раздутый, с отвратительным опытом. На Mac по возможности избегай его.