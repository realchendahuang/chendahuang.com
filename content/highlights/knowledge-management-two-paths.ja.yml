content: |
  最近、ナレッジ管理のことを考え直してる。

  ここには実は二つの路線があると気づいた。

  **一つは飛書（Feishu）で組み立てる路線。**

  その強みはとても直接的：

  無料、複数端末同期、共有可能、コラボが楽、形態も充分に豊か。

  ドキュメント、多次元テーブル、スプレッドシート、スライド、キャンバス、Todo、ナレッジベース。これらのモジュールを組み合わせれば、かなりの個人・チームのナレッジ管理シーンをカバーできる。

  特に多次元テーブルに注目してる。

  ナレッジ中枢としてとても向いてる。

  情報収集、資料アーカイブ、状態管理、構造化整理、コンテンツの再生産。すべてこれを軸に展開できる。

  さらに飛書 CLI と AI Agent が加われば、飛書はただのオフィスソフトではなくなる。

  どちらかというと、Agent から操作できるナレッジワークフローシステムになる。

  **もう一つは Cloudflare で自社開発する路線。**

  こっちはより自由で、プロダクト化にも向いてる。

  例えば今作っている FlareMo は、まさに Cloudflare ベースでナレッジ管理プロダクトを作ろうというものだ。

  Cloudflare の利点は、基盤の能力がしっかり揃ってる点：

  フロント、バックエンド、データベース、オブジェクトストレージ、ベクトル検索、AI 能力を全部組み合わせられる。

  でも開発が必要だ。

  データ構造、検索体験、権限システム、プロダクトロジックも自分で設計しなきゃいけない。

  だから今の自分の判断は：

  - 飛書は、すぐ使えるナレッジ管理システムを素早く組み立てるのに向いてる。
  - Cloudflare は、ナレッジ管理を本当にコントロール可能で反復可能なプロダクトにするのに向いてる。

  この二つの路線は、どちらも研究に値する。

  一つはワークフロー寄り。

  一つはプロダクト化寄り。