content: |
  Depois de anos de uso pesado no macOS, resumo esses softwares absurdamente bons:

  - **QuickRecorder**: fera pra gravar a tela, leve e poderoso.
  - **ClashParty**: contorno de rede, núcleo Mihomo, muitos protocolos, atualização rápida, interface bonita.
  - **V2rayN**: contorno de rede, muitos protocolos; a interface é meio retrô, mas é estável e grátis.
  - **Teclado Doubao**: entrada de voz precisa pra caramba, suporta macOS, iOS, Android, e Windows ainda vem aí.
  - **Brave**: navegador com privacidade em primeiro lugar, filtro de anúncio embutido, limpa mais que extensão de filtro, melhor companhia pra ver YouTube.
  - **Mos**: deixa a rolagem do mouse mais suave.
  - **Amphetamine**: deixa o notebook sem apagar a tela mesmo com a tampa fechada, melhor companhia do Vibe Coding.
  - **UU Remoto**: ferramenta de acesso remoto da NetEase, grátis e rápida. Depois que tem ela, quem limita a qualidade da tela nunca é a assinatura, é a sua internet. Costumo usar pra controlar o macOS de casa pelo celular e ver o resultado do Vibe Coding — o mapeamento de teclas é eficiente demais.
  - **Tencent Lemon**: lixeiro do macOS feito pela Tencent, desinstala software de forma suave e o ícone na barra de status é bom de usar.
  - **Mole**: o lixeiro mais forte do macOS; a versão de terminal é grátis, a de UI é paga.
  - **Tailscale**: software de rede privada remota baseado em WireGuard. Com ela, você conecta no seu computador de casa de qualquer canto do mundo.
  - **Obsidian**: na era da IA, a ferramenta de gestão de conhecimento com dados locais em primeiro lugar. O ecossistema é bom demais; combinada com o Web Clipper oficial do navegador faz mágica.