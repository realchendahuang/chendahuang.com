content: |
  خطرت لي فجأة زاوية طريفة.

  الأبراج الفلكية، والبروج الصينية، والأحوال النجمية، والكهانة — قد نفهم كل أولئك باعتبارها «نماذج مضغوطة» من عصر كانت قدرة الإنسان الحاسوبية فيه منخفضة.

  لم يكن لدى القدماء قواعد بيانات، ولا أدوات إحصائية، ولا ذكاء اصطناعي.

  لم يملكوا إلا ملاحظةً طويلة الأمد للفصول، والأحوال السماوية، والأوقات الزراعية، والطبائع، وخبرة الحياة والناس، والدورات الاجتماعية، ثم ضغطوا هذه الخبرات المعقدة في نظام رموز سهل الحفظ سهل الانتشار.

  والأبراج الاثنا عشر، والبروج الصينية الاثنا عشر، والركائز الثمانية (با-زي)، والهيكساغرامات — كلها في جوهرها أشبه بتقليص أبعاد العالم المعقد.

  وتأكيداً، لا يمكن اعتبارها تنبؤاً علمياً صارماً.

  لكنها ليست بالضرورة خرافةً محضة أيضاً.

  بل أشبه ما تكون بنوع من تقطير الخبرة، صنعه القدماء بقصصٍ ورموزٍ وقواعد، حين قصرت قدراتهم الحاسوبية، وبياناتهم، وأدواتهم.