  宝サイトをシェア：Buzzing

  情報源を広げたい人、情報の壁を打ち破りたい人にぴったり。

  Hacker News、Reddit、BBC、Reuters、Bloomberg、Product Hunt など海外のホットコンテンツを継続的に集めて、タイトルを中国語に翻訳してくれる。

  最大の価値は、まず中国語でタイトルにざっと目を通せること。

  興味があって読む価値のある記事があれば、そのときに詳細をクリックする。

  そのときはイマーシブ翻訳と合わせてバイリンガル読書ができる。