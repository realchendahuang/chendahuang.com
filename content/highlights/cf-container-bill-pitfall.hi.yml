  Cloudflare Container का एक पीड़ित सामने आ गया है।

  क्योंकि मैं जो कोड लिख रहा था वह अभी डीबगिंग चरण में था, stop कमांड कभी प्रभावी नहीं हुआ।

  तो एक Container लगातार 7 दिनों तक चलता रहा और मुझसे $4 काट लिए।
