content: |
  تصفحتُ مؤخراً مرة أخرى مستودع DeepSeek Harness ومناقشاته، وأرى أن المشروع الآن في مرحلة شيقة جداً:

  يملك DeepSeek Harness الآن أكثر من 150 ألف نجمة، وأكثر من 12 ألف إيداع (commit) متراكم في المستودع.

  لكن README الرسمي ما يزال يصرح بوضوح تام: نحن الآن في Developer Preview فقط، وستحدث تغييرات تكسر التوافق.

  صدرت rc.7 في 17 أغسطس. وإنشاء Issues وPR مقيد، والملاحظات تمر عبر Discussions.

  المجتمع واسع لكن التطوير الأساسي مركّز. والأخطاء (bugs) متكررة، كمشكلة unknown tool "".

  وما ينقص أكثر: تغطية الاختبارات، وتوافق المزوّدين (Providers)، وموثوقية الجلسات.

  ولكن البنية لا تزال جذابة، أشبه بقاعدة نظام تشغيل للوكلاء:

  - Everything is a Plugin
  - بنية التجميع Cordis
  - Preset / Skill / MCP / Agent / Provider كلها وحدات قابلة للتركيب (plugins)

  المشروع الآن في مرحلة «تأثير يتخطى القدرة الهندسية».