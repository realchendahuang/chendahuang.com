  Dia 7 de operação quebrou os 2000 seguidores, retrospectiva rápida.

  O núcleo é uma palavra só: ajudar o próximo.

  Compartilhei principalmente dois tipos de conteúdo útil:

  - lista de software pra uso pesado no macOS (48 mil leituras)
  - tabela de franquia grátis da Cloudflare + Playbook (numa boa no X, e ainda foi roubado e reescrito por um brother e postado no Zhihu, que rendeu até centenas de favoritos)
  - e também a recomendação de recursos da OPC, empresa de uma pessoa só (38 mil leituras)

  Não pensei em como ganhar seguidor: só organizei o que pesquisei direito e entreguei de graça. Resultado: cresci mais rápido.

  Daqui pra frente continuo produzindo esse tipo de conteúdo prático. Obrigado pelo apoio de todos.