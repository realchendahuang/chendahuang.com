content: |
  Andei pesquisando o DeepSeek Harness. Tem um conceito chamado Preset que merece atenção.

  Preset dá pra entender como a unidade de distribuição do Agent. O mesmo modelo carregado com Presets diferentes pode virar Agents completamente diferentes.

  Qual a maior diferença entre Preset e Skill?

  - Uma Skill de análise de relatório financeiro: ensina o Agent a analisar relatórios.
  - Um Preset de análise de relatório financeiro: já combina a Skill de análise, busca na web, Browser, PDF, Python, Subagents, prompt de pesquisa e estratégia de contexto, e entrega um Agent pronto pra usar sem configuração.

  É provável que no futuro venham duas camadas de mercado ao mesmo tempo.

  - Uma é o Plugin / Skill Marketplace, voltado a devs e usuários avançados montando Agents;
  - a outra é o Preset / Agent Marketplace, voltado de verdade ao usuário comum.

  Isso já é muito próximo da lógica da App Store. A App Store exibe um App completo. O Preset exibe uma aplicação Agent completa.

  Antes o pessoal compartilhava Prompt. Depois começou a compartilhar Skill. Daqui pra frente, provavelmente vamos compartilhar Preset.