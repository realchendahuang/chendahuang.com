  یک Skill نسبتاً مسخره ساختم:

  **Dahuang AI Tone**

  همه از «حذف بوی AI» حرف میزنند. اما اصلاً بوی AI چیست؟

  دو کار میتواند بکند:

  - یک متن عادی را با بوی AIِ یک مدل مشخص بازنویسی کند
  - یا برعکس: اشاره کند کجای یک متن بوی AI میدهد و لحنش شبیه کدام مدل است

  ارزشش:

