  我做了一個有點離譜的 Skill：

  **Dahuang AI Tone**

  大家都在聊「去 AI 味」。但 AI 味到底是什麼？

  它可以做兩件事：

  - 把一段正常文字，改成指定模型的 AI 味
  - 反過來指出一段文字哪裡像 AI、像哪種模型腔

  它的價值是：

  先聞得出 AI 味，才知道怎麼去掉 AI 味。

  GitHub：https://github.com/realchendahuang/dahuang-ai-tone