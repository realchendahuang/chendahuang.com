content: |
  جرّبت تقريبًا كل عملاء Harness GUI مفتوحة المصدر في السوق، ومعظمها من حيث تجربة التصميم شيء يصعب وصفه.
  OpenChamber هو أفضل عميل Harness GUI مفتوح المصدر صياغةً بين ما استخدمته: أنيق، مستقر، وحتى الأخطاء العابرة لا تعيق استخدامه على المدى الطويل.
  لكنه لا يعمل إلا مع OpenCode ولا يمكن التحويل إلى Harness آخر. ولاحظ بعض المستخدمين أن الأداء العام لـ OpenCode ليس كافيًا، فيصبح عبئًا يبطئ النموذج.
  لذا جعلت أفكر في مشروع: أجعل الواجهة الأمامية لـ OpenChamber هيكلًا، وأستبدل نواتها بـ oh my pi، فقد يلبي هذا احتياجاتي الشخصية أكثر.
  لماذا لا أستخدم Pi Agent الأصلي، بل Oh My Pi؟
  لأن Pi Agent الأصلي مرن أكثر من اللازم، فلا سبيل إلى بناء GUI عام حوله.
  وكتسوية، يعد Oh My Pi توزيعة من Pi Agent، وتجربة تفاعل الإضافات فيه مستقرة نسبيًا ككل.
  لذلك أرى أن صناعة OpenChamber + Oh My Pi منتجًا جاهزًا للعمل فور فتح الصندوق حاجة كامنة حقيقية.
  سميت المشروع OMPChamber، وهو حتى الآن في طور تطوير واختبار مكثفين، ومن يحتاجه فليضع له star.
  https://github.com/realchendahuang/OMPChamber
