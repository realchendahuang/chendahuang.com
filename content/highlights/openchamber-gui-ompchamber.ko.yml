title: "OpenChamber는 가장 손에 맞는 Harness GUI — 커널은 OMP로 갈아끼웠다"
description: "OpenChamber 프런트엔드 뼈대 + Oh My Pi 커널 = OMPChamber, 집중 개발·테스트 중."
