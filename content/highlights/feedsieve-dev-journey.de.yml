content: |
  Diese Müll-Accounts wie „Fu Bu Hei“ haben mich in letzter Zeit echt genervt.

  Aus einer Wutattacke heraus habe ich eine Browser-Erweiterung geschrieben – sie heißt „FeedSieve“.

  Nach mehreren Iterationsrunden ist sie jetzt an einem guten Punkt und geht bald live.

  Wer sie braucht, sollte diesen Beitrag markieren – ich werde sie bald als Open Source veröffentlichen und im Chrome Web Store anbieten.
