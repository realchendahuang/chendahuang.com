content: |
  Je vous partage un petit truc pour réécrire un texte.

  Utilise la dictée vocale de l'IME Doubao.

  Tu regardes le texte à retravailler.

  Et en même temps tu craches, tu le reformules avec tes propres mots.

  Comme ça, l'accent IA est bien plus faible.

  En plus c'est efficace, ça coûte rien, et pas besoin d'abonnement.

  Dans n'importe quel contexte, tu peux faire de la saisie vocale n'importe quand, pour booster ta production.