  Oświadczam:

  Cloudflare to prawdziwie natywna dla AI firma.

  Naprawdę przebudowuje doświadczenie deweloperów wokół agentów AI.

  Właśnie wydane Temporary Accounts pozwalają agentowi AI pisać kod, wdrażać bezpośrednio, dostawać tymczasowy URL, testować się i iterować się.

  Gładsze niż gładkie.

  Połącz to z oficjalnymi Skills Cloudflare, jedna komenda do instalacji:

  `npx skills add cloudflare/skills`

  Co w ogóle znaczy "natywne dla AI"?

  TO jest GOAT natywności AI.