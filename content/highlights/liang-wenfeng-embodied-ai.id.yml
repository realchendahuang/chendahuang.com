content: |
  Liang Wenfeng berkata dalam pertemuan investor:
  "Titik akhir kecerdasan mungkin semuanya embodied. Karena bagi orang normal, yang dia butuhkan bukanlah komputer — melainkan tenaga manusia."
  Kalimat itu sangat tepat. Orang biasa tidak pernah menginginkan komputer yang lebih pintar; yang mereka inginkan adalah "tenaga manusia" yang benar-benar bisa bekerja. Seteks apa pun teksnya, ia hanyalah keadaan antara. https://t.co/2xg5o5hNjt
