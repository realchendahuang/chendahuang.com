content: |
  AI 時代，最重要的能力，是元技能。

  說白了，就是那些你換一個工具、換一個模型、換一個行業，依然能用的底層本事。

  - 你能不能把問題講清楚？
  - 能不能把一堆亂材料整理明白？
  - 能不能把一個模糊想法拆成幾步？
  - 能不能看出 AI 哪些地方說得對，哪些地方在胡扯？
  - 能不能和 AI 來回磨，把一個粗糙答案慢慢改成能用的東西？

  這些東西，比收藏一堆工具更值錢。

  工具每天都在變，模型也會一代一代換。

  但會提問、會整理、會判斷、會拆解、會驗收的人，走到哪裡都能用 AI 放大自己。

  AI 時代真正拉開差距的，可能就是這些看起來很基礎，但長期最值錢的元技能。