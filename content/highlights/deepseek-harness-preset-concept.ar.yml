content: |
  درستُ DeepSeek Harness مؤخراً. وهناك مفهوم اسمه Preset يستحق الانتباه.

  يمكن فهم Preset بوصفه وحدة توزيع الوكيل. فالنموذج الواحد إذا حُمِّل عليه Preset مختلفة، يتحول في النهاية إلى وكلاء متباينة كلياً.

  ما أعظم فرق بين Preset وSkill؟

  - Skill لتحليل التقارير المالية: يعلّم الوكيل كيف يحلل البيانات المالية.
  - Preset لتحليل التقارير المالية: يجمع مباشرة بين Skill التحليل، والبحث في الويب، والمتصفح، وPDF، وPython، والوكلاء الفرعيين، ومطالبة البحث، واستراتيجيات السياق — فيسلّمك وكيلاً جاهزاً يعمل فوراً.

  وفي المستقبل الغالب ظهور طبقتين من الأسواق معاً.

  - طبقة سوق الإضافات/المهارات (Plugin / Skill Marketplace)، لمن يبني وكلاءً من المطورين والمستخدمين المتقدمين؛
  - وطبقة سوق Preset / Agent، الموجّهة فعلاً للمستخدمين العاديين.

  وهذا في الحقيقة أقرب ما يكون إلى منطق App Store. فـ App Store يعرض تطبيقاً كاملاً، بينما يعرض Preset تطبيق وكيل (Agent) كاملاً.

  في السابق كان الناس يتشاركون المطالبات (prompts). ثم بدؤوا يتشاركون المهارات (Skills). وبعدها الغالب أن يتشاركوا Preset.