content: |
  長年大切に使っているブラウザ拡張をシェアします。

  - **Wetab**：新タブ拡張。よく使うものを置けて、検索エンジンもカスタマイズでき、ログインすれば無料で複数端末同期。Google ベースの X 検索エンジンを専用で作ったら、標準のよりずっと使いやすかった。
  - **Video Speed Controller**：動画の倍速を柔軟に調整。知識を効率的に摂取するのに最適。
  - **XHunt**：X をやるなら必須。各 KOL のランキングや、いま最もホットなポストが見られる。
  - **X 相互フォローセンサー**：ページ上で相互フォローと片方向フォローをマークし、following / followers のフォロー率の表示も選べる。
  - **FireShot**：ウェブページのスクリーンショットを撮り、編集して PDF、JPEG、GIF、PNG、BMP で保存。
  - **Proton Pass**：デザインが美しいアカウント・パスワード管理ツール。複数端末同期対応。
  - **イマーシブ翻訳**：老舗のバイリンガル翻訳拡張。DeepSeek V4 Flash API にも接続できる。
  - **Codex**：Codex と Chrome ブラウザを繋ぐ必須拡張。これでブラウザ上のどんなことも自動化できる。例えばアカウント停止時の異議申立メール作成とか。