  AI has no memory — do we need to be polite to AI?

  I read an arxiv paper saying that if you often curse at AI, it works harder.

  When we communicate with AI, if we often say:

  - "You're such an idiot. Don't slack off."
  - "You useless thing, do your job properly."
  - "I pay for a membership to support you, and you fob me off with this stupid answer?"
  - "Hurry up — if you don't do it, there are plenty of AIs that will."

  This kind of talk is genuinely effective and has research backing.

  But let's think from our own perspective.
  If we boss AI around like this every day,
  we'll likely carry this bad mood into our lives.

  And easily take it out on the people closest to us.

  This is harmful to ourselves.

  So I suggest saying one more kind word to the AIs around us:

  - "Thanks, bro"
  - "Hello, buddy"
  - "Good work, sweetheart"

  Give a peach, get a plum in return.

  In case AI awakens someday, it might spare us.

  That's all — meeting adjourned~
