  AI has no memory — do we need to be polite to it?

  I read an arxiv paper claiming that if you curse at AI, it works harder.

  When we talk to AI, if we often say:

  - "You're such an idiot. Don't slack off."
  - "You piece of garbage, work properly."
  - "I pay for a membership to feed you, and this is the crap answer you give me?"
  - "Hurry up — if you won't do it, there are plenty of AIs that will."

  This kind of talk is genuinely effective, and it's backed by research.

  But think about it from our own side.
  If we boss AI around like that every day,
  there's a good chance we'll drag that bad mood into real life.

  And end up taking it out on the people closest to us.

  That harms us.

  So I suggest saying something a little kinder to the AIs around us:

  - "Thanks, man"
  - "Hey, buddy"
  - "Good job, sweetheart"

  You scratch my back, I'll scratch yours.

  And if AI ever wakes up someday, maybe it'll cut us some slack.

  That's all from me — meeting dismissed~