  این روزها به یک برنامه فکر می‌کنم.
  انتقالِ کاملِ مدیریتِ دانشِ شخصی، جمع‌آوری اطلاعات و تولیدِ دانش به Cloudflare.
  حسابِ رایگانش همین حالا 10 گیگ ذخیره‌سازیِ آبجکت و 5 گیگ دیتابیس دارد.

  یعنی عملاً یک سیستمِ مدیریتِ دانشِ شخصیِ self-hosted، روی ابر و برای همیشه رایگان.
