  أمضيت بعض الوقت وأنجزت نشر Sub-Store على Cloudflare.

  ودمجت عقدي المبنية ذاتياً مع عقد الاحتياط لدى المزودين في واحدة، مع اشتراك تلقائي لقواعد توزيع الحركة ACL4SSR.

  وحققت برابط اشتراك واحد مباشرة:

  - الدمج بين عقد عدة مزودين
  - فلترة العقد
  - ضبط قواعد توزيع الحركة
  - تحديث الإعدادات تلقائياً

  سلاسة من الطراز الأول.