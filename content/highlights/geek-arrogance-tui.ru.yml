content: |
  Честно говоря, некоторые гик-сообщества — это уже не просто нишевость, а прямо-таки солипсизм.
  
  Их фирменный приём: выдавать неудобство за утончённость, а барьеры входа — за вкус.
  
  Если что-то легко, интуитивно и быстро осваивается обычными людьми, они подсознательно чувствуют, что это недостаточно хардкорно, слишком массово, ниже их достоинства.

  И наоборот: чем неудобнее взаимодействие, чем глубже зарыта информация, чем больше нужно учить приватный жаргон и кучу шорткатов — тем сильнее им кажется, что вот так выглядит настоящий инструмент.

  Это уже не про эффективность. Это подтверждение собственной идентичности через боль.

  «Я способен выносить взаимодействия, которые другие не выносят» — как только эта фраза слетает с языка, превосходство пишется само.

  Чем меньше круг, тем легче это самолюбование подпитывает само себя.

  В итоге всё превращается в: кто посмеет назвать это неудобным — тот просто не понял, тот аутсайдер.

  По-настоящему сильные люди делают сложное простым. А некоторые гики делают простое сложным, а потом взбираются на эту сложность и смотрят на всех свысока.
