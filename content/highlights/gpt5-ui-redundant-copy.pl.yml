  Świetnie ujęte – to wada wrodzona generacji GPT-5:

  Ciągle wpisuje wewnętrzne wymagania do tekstów interfejsu, żeby udowodnić swój wkład pracy. Żeby się udowodnić – no popatrz, naprawdę to zrobiłem, czy nie jestem świetny, nie obijałem się, rozłożyłem wszystkie twoje wymagania na stole.

  A teksty w interfejsie są napompowane ponad wszelką miarę. Od 5.0 aż po 5.6 – generacja za generacją – i nadal tego nie naprawiono. To siedzi w kościach.

  Każdy, kto naprawdę wdrażał produkty frontendowe, wie:

  - Każdy tekst na widoku, duży czy mały, to tekst skierowany do użytkownika
  - Teksty, które powinny trafić do dewelopera jako informacja zwrotna w czacie, nigdy nie powinny być pisane do produktu

  Ale ono nie tylko pisze słabe teksty – często wpisuje do produktu wewnętrzne informacje zwrotne, żeby „pokazać”, że faktycznie coś zrobiło.