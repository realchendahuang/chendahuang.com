content: |
  Aplauso de pie para el control remoto de ZCode — el ejemplo perfecto de dirigir un Agent local desde el móvil.
  El coste de puesta en marcha es casi cero: registras una cuenta desde el móvil, sin necesidad de membresía. Escaneas el QR que aparece en el PC y de paso lo vinculas a WeChat o Feishu.
  Lo mejor es el tunneling gratuito integrado: la red deja de ser un tema. Tumbado en el sofá o tomando un café fuera, un mensaje desde el móvil basta para llamar cuando quieras al Agent de tu computadora y ponerlo a correr código.
