content: |
  Belakangan ini saya sangat jengkel dengan akun spam seperti "Fu Bu Hei".
  
  Dalam ledakan amarah, saya menulis sebuah ekstensi browser — namanya "FeedSieve".
  
  Setelah beberapa putaran iterasi, kondisinya sudah bagus, dan sebentar lagi tayang.
  
  Buat yang membutuhkannya, tandai saja — saya akan segera open-source dan memasangnya di Chrome Web Store.
