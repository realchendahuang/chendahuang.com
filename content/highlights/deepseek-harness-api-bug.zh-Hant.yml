  DeepSeek Harness + 第三方 API 相容問題：

  Agent 呼叫 Bash 等工具時報 `ToolNotFoundError: unknown tool ""`，看上去像是工具沒註冊。

  實際上是閘道回傳的資料格式跟 DeepSeek 官方不一樣，工具名在中間被弄丟了。

  幾個相關的 GitHub Discussions 連結：

  - 在 deepseek-ai/dsh#issues 裡搜尋 "unknown tool"
  - 自建閘道（OpenRouter / OneAPI / new-api）的人最容易踩這個坑

  排查思路：抓一次完整的 tool_call 請求和回應，對比閘道日誌裡的工具名是不是空字串。