content: |
  C'est aujourd'hui le premier jour au bureau OPC. Je vous raconte mon parcours d'ouverture d'une OPC.

  Mon intention de départ, c'était juste d'avoir une structure légale pour encaisser de l'argent et mettre des produits en ligne. Alors j'ai cherché sur le net les infos de création de société.

  Je n'avais pas d'exigence particulière sur la ville : Nanjing, Suzhou, Hangzhou, Ningbo — dès que c'était une zone côtière développée, tout était candidat.

  Par un heureux hasard, un jour j'étais en déplacement à Nanjing, quelques heures creuses, je scrollais des comptes WeChat locaux. Je suis tombé sur le téléphone d'un contact de la communauté OPC. Et je l'ai ajouté.

  Après une brève présentation de mon projet, le responsable a dit OK et m'a programmé une visite des lieux l'après-midi.

  Leur exigence : travailler sur place trois jours par semaine. Si j'acceptais, je pouvais enregistrer ma société ici.

  Comme c'est un projet du capital d'État de Nanjing, leurs conditions politiques sont excellentes : eau, électricité, internet, foncier — tout est gratuit, théoriquement trois ans gratuits, et il y a même un comptable mandataire pour m'aider à créer la société, graver le sceau, obtenir la licence de registre, m'aider à contacter la banque pour ouvrir le compte. Jusqu'à l'émotion, trop touchant.

  Après deux-trois semaines de procédure d'enregistrement, j'ai enfin eu tous les documents.

  Le manager du parc m'a fait choisir mon poste de travail. Mes exigences : une chaise, un tabouret, de l'électricité, et c'est tout.

  Le manager m'a fait remplir trois formulaires de demande de projet, pour présenter surtout les avantages du projet, la situation de l'équipe, et nos points forts en lien avec l'IA. Si c'est bien écrit et crédible, on peut gagner une subvention politique de 50 000 à 100 000 yuans.

  Je trouve que Nanjing gère vraiment bien ce sujet. Vous pouvez aussi regarder si votre ville a des politiques semblables, ou si la capitale de votre province a mieux.

  Les bonnes politiques ne t'attendent pas : il faut se renseigner partout. Quand j'arrive aujourd'hui, le parc avait déjà accueilli beaucoup de sociétés ; j'étais plutôt en retard.

  Voilà pour le partage du jour, ensuite je vous partage en continu toute mon expérience entrepreneuriale et mes bilans de parcours.

  Merci de votre attention.