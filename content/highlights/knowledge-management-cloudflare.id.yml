  Belakangan ini saya sedang memikirkan sebuah rencana.
  Memindahkan manajemen pengetahuan pribadi, pengumpulan informasi, dan output pengetahuan saya seluruhnya ke Cloudflare.
  Akun gratis saja sudah menyertakan 10G penyimpanan objek dan 5G database.

  Kurang lebih ini seperti sistem manajemen pengetahuan yang self-hosted, berbasis cloud, dan gratis selamanya.
