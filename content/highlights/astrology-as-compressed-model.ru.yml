content: |
  Только что пришёл к одному довольно интересному ракурсу.

  Знаки зодиака, тотемные животные, астрология, гадания — всё это, пожалуй, можно понять как «сжатые модели» эпохи низких вычислительных мощностей человечества.

  У древних не было баз данных, статистических инструментов и ИИ.

  Всё, что они могли, — долго наблюдать за сезонами, небесными явлениями, сельскохозяйственными календарями, характерами, социальными условностями и циклами общества, а затем сжимать этот сложный опыт в систему символов, которую легко запомнить и легко распространять.

  12 знаков зодиака, 12 тотемных животных, Восемь иероглифов, гексаграммы — всё это, по сути, способы снизить размерность сложного мира.

  Конечно, их нельзя принимать как строгий научный прогноз.

  Но это и не обязательно чистое суеверие.

  Скорее это дистилляция опыта — созданная древними, с историями, символами и правилами, в условиях, когда не хватало вычислительных мощностей, данных и инструментов.