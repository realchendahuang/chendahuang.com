title: "ZCode 원격 제어 극찬: 휴대폰으로 로컬 Agent를 지휘하다"
description: "QR 코드 스캔해서 WeChat/Feishu에 연동, 무료 터널링 내장 — 소파에서도 집에 있는 Agent로 코드를 돌린다."
