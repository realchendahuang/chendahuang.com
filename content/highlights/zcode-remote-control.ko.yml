content: |
  ZCode의 원격 제어는 진심으로 극찬하고 싶다. 모바일에서 로컬 Agent를 원격 지휘하는 모범 사례 그 자체다.
  조작 비용이 거의 0이다: 휴대폰으로 계정만 등록하면 되고 유료 멤버십도 필요 없다. 컴퓨터의 QR 코드를 스캔해서 WeChat이나 Feishu에 연결해 주면 끝이다.
  가장 기가 막힌 건 무료 터널링이 자체 내장돼 있어 네트워크 환경을 전혀 신경 쓸 필요가 없다는 점. 소파에 누워 있든, 밖에서 커피를 마시든, 휴대폰으로 메시지 한 줄만 보내면 언제든 컴퓨터 속 Agent를 불러 코드를 돌릴 수 있다.
