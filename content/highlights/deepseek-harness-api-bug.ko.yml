content: |
  DeepSeek Harness + 서드파티 API 호환성 문제:

  에이전트가 Bash 같은 도구를 호출할 때 `ToolNotFoundError: unknown tool ""` 오류가 나는데, 도구가 등록된 적 없는 것처럼 보인다.

  실제로는 게이트웨이가 반환하는 데이터 형식이 DeepSeek 공식 API와 달라서, 도구 이름이 중간 어딘가에서 유실되는 것이다.

  관련 GitHub Discussions 링크 몇 개:

  - deepseek-ai/dsh#issues에서 "unknown tool" 검색
  - 자체 호스팅 게이트웨이(OpenRouter / OneAPI / new-api)를 쓰는 사람들이 이 함정에 가장 잘 빠진다

  디버깅 방법: tool_call 요청과 응답을 통째로 캡처해서, 게이트웨이 로그의 도구 이름이 빈 문자열인지 확인하라.
