  Lately I've been thinking about a plan.
  Moving my personal knowledge management, information collection, and knowledge output entirely onto Cloudflare.
  A free account already comes with 10G of object storage and 5G of database.

  That's basically a self-hosted, cloud-based, permanently free knowledge management system.