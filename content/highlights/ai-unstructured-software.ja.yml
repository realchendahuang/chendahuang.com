  AI 時代の新しいソフトウェア機会はどこにあるのか？

  比較的大きな機会の一つは、従来のソフトウェアのレイヤーでは記録できなかった部分を処理すること。つまり、非構造化された背景データだ。

  例えば、本当に AI ネイティブな CRM ソフトウェアなら、ある顧客に割引を与えたとき、なぜこの割引であって別の割引ではないのか、他のプランがなぜ却下されたのか、その過程で誰が誰を説得したのかまで、ついでに記録できる。

  従来のソフトウェアには、こうした記録できない隠れた情報が多すぎる。AI 時代には、テキストや動画を理解する能力を活かして、こうした隠れた情報や大量の冗長な情報から構造化データを抽出して分析できる。