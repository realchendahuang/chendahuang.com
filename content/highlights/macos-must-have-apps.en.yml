content: |
  After years of deep macOS use, I've summarized these awesome pieces of software:

  - **QuickRecorder**: a screen-recording gem, small in size, powerful in function.
  - **ClashParty**: for circumvention, Mihomo core, supports many protocols, updates fast, beautiful interface.
  - **V2rayN**: for circumvention, supports many protocols, interface a bit retro, but stable and free.
  - **Doubao input method**: voice input is extremely accurate, supports macOS, iOS, Android, with Windows on the way.
  - **Brave**: a privacy-first browser with built-in ad filtering, cleaner than extension-based filtering, the best companion for watching YouTube.
  - **Mos**: makes your mouse wheel scroll more smoothly.
  - **Amphetamine**: keeps your laptop from sleeping even when the lid is closed, the best companion for Vibe Coding.
  - **UU Remote**: a remote desktop tool from NetEase, free and fast. With it, what limits image quality is never the membership but the network speed. I usually use it to remotely control macOS from my phone to check Vibe Coding results — the key mapping efficiency is too high.
  - **Tencent Lemon**: a macOS junk-cleaning tool from Tencent, uninstalling software is smooth, and the status bar icon is handy too.
  - **Mole**: the strongest macOS junk-cleaning tool, terminal version free, UI version paid.
  - **Tailscale**: a remote site-to-site networking tool based on WireGuard. With it, you can connect to your home computer from the ends of the earth.
  - **Obsidian**: in the AI era, a local-first knowledge management tool. The ecosystem is too good, and pairing it with the official Web Clipper browser extension works wonders.
