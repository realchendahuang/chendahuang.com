content: |
  À l'ère de l'IA, la procrastination la plus répandue :
  stocker des outils, acheter des cours, rejoindre des communautés, changer de modèle, régler son prompt.
  Chaque jour, très appliqué.
  Mais on ose toujours pas affronter une question :
  est-ce que j'ai réellement une vraie affaire dans les mains qui mérite que je mette l'IA dessus ?
  Aiguiser son couteau, ça occupe.
  Mais beaucoup n'osent même pas tuer le cochon.