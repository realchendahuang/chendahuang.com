  جرّبت Workbuddy من تينسنت تجربة قصيرة؛ وهناك سيناريو شهير منه اسمه جلب قسائم ميتوان.

  وفي خطوة تسجيل الدخول، ولّد رمز QR لي، وطلب مني مسحه للدخول.

  ثم هتفت صارخاً: جلّب لي القسائم! فجلبت لي كل تلك.

  وتوظيف وكيل الذكاء الاصطناعي في سيناريو كجلب القسائم شيء في غاية الإبهار.