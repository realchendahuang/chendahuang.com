content: |
  أمضيت بعض الوقت في دراسة أوضاع DeepSeek Harness الأربعة — إليكم مزايا كل وضعٍ وعيوبه وحالات استخدامه.

  1. Standard — الأفضل للتطوير اليومي
  Standard هو وكيل البرمجة الكامل الافتراضي في DeepSeek Harness. يوفّر تقريباً كل ما يحتاجه التطوير اليومي، ويناسب خصوصاً المهام التي لا تعرف فيها بعد مكان المشكلة ويحتاج الوكيل إلى الاستكشاف بنفسه.

  لكن بما أن معظم العمل يسير على نمط LLM → Tool → LLM → Tool → LLM → Tool، فإن دورات استدعاء الأدوات تتراكم كلما تعقّدت المهام، فيرتفع زمن الاستجابة ويزداد استهلاك الـToken.

  لذا: المهام الاستكشافية تُعهد إلى Standard أولاً.

  2. PTC — وضع الكفاءة للمهام المعقّدة
  في PTC يكتب النموذج كتلة TypeScript تجمع استدعاءات أدواتٍ متعددة في تنفيذٍ واحد.

  Standard قد يكون هكذا: البحث في الملفات ← العودة إلى النموذج ← قراءة الملف ← العودة إلى النموذج ← البحث ← العودة إلى النموذج ← التعديل ← العودة إلى النموذج.
  أما PTC فيصبح هكذا: يكتب النموذج TypeScript ← تنفيذ واحد ← بحث + حلقة + تصفية + قراءة + معالجة ← إرجاع النتيجة النهائية.

  وهذا يقلّص دورات الاستدعاء ويُبقي كميات ضخمة من البيانات الوسيطة عديمة الفائدة خارج سياق النموذج. لذا فإن المعالجة بالجملة والمعالجة المتكررة والمنظّمة هي مجال PTC بامتياز.

  3. Minimal — Bash + Editor فقط للنموذج
  أعظم ما يميّزه البساطة: أدوات قليلة، ومخططات أدوات صغيرة، وكلفة ثابتة منخفضة للـPrompt.

  لكن لا Web ولا Skills ولا Subagent ولا Workflow — فالمهام المعقّدة لا بد أن ينجزها وكيلٌ واحد بشق الأنفس. كما أن Minimal تفتقر إلى ضغط السياق الكامل الموجود في Standard. لذا ورغم انخفاض الكلفة الثابتة من الـToken في المهام القصيرة، فإنه في الجلسات الطويلة جداً ذات مخرجات Bash الكثيرة قد لا يوفّر Tokens فعلياً.

  لذلك Minimal هو الخيار الأمثل للمهام الصغيرة الواضحة المحددة جيداً — كلما كانت أوضح وأقصر، كان أفضل.

  4. Creator — استخدام وكيل لصنع وكلاء
  يملك كل ما في Standard إضافة إلى Cordis Runtime وتجارب الإضافات وصناعة الـPresets. بل إنه يجعل الوكيل نفسه شيئاً قابلاً للتركيب والإبداع.

  وهو أمر لطيف، بصراحة: النموذج ينصبّ بسطته ليبيع بضاعته، ثم يتولّى هو نفسه ترتيب بسطته — مكتفٍ ذاتياً.

  لكن أكبر مشاكل Creator هي صلاحياته الواسعة. انتبهوا إلى ذلك.
