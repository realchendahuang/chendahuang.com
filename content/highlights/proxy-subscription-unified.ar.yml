content: |
  في شأن العبور الحر: إن اشتريت مزوّدي بروكسي وبنيت أيضاً عقد VPS خاصة بك، وترجو إدارة موحدة لها، وتوزيعاً موحداً للحركة، ورابط اشتراك موحداً واحداً ناتجاً عنها.
  وتتمنى صيانة قواعد توزيع الحركة، وانتقاء العقد، ومنطق التركيب في الخادم، لا إعادة تهيئتها في كل عميل.
  وتتمنى تشغيل الأسلوب بالحلول الخفيفة على Cloudflare، بلا صيانة خوادم أو خدمات قواعد بيانات أو مهام خلفية معقدة.