content: |
  خیلی درست گفت — این همان عیبِ ذاتیِ نسل GPT-5 است:

  مدام نیازهای داخلی را توی متنِ رابط کاربری می‌نویسد تا ثابت کند دارد کار می‌کند. تا خودش را اثبات کند: اِه، نگاه کن، من واقعاً انجامش دادم، عالی نیستم؟ تنبلی نکردم، همه‌ی خواسته‌هایت را چیده‌ام روی میز.

  و متنِ رابط کاربری هم باورنکردنی شلوغ است. از 5.0 تا 5.6 — نسل‌به‌نسل — هنوز این مشکل حل نشده. توی مغزِ استخوانشان رفته.

  هر کسی که واقعاً محصولِ فرانت‌اند تحویل داده باشد، می‌داند:

  - هر متنی روی رابط، کوچک یا بزرگ، متنِ روبه‌روی کاربر است
  - متنی که باید توی چت به توسعه‌دهنده بازخورد داده شود، هرگز نباید توی محصول نوشته شود

  اما فقط متنِ بد نوشتن نیست — مدام بازخوردهای داخلی را توی محصول می‌نویسد تا «نشان دهد» واقعاً کاری کرده.
