  Heilige Krabbe! Ich wusste bis eben nicht, dass der Firefox-Browser jedem Nutzer 50G VPN-Traffic pro Monat schenkt.

  Für peinliche Huhn-oder-Ei-Szenarien ist das eine große Hilfe.

  So geht's:

  1. In der Adressleiste `about:config` eingeben
  2. In die erweiterten Einstellungen gehen, „Alle anzeigen" klicken
  3. Nach `browser.ipProtection.enabled` suchen
  4. Den Wert dieses Eintrags auf true setzen