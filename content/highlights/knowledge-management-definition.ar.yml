  ما إدارة المعرفة؟

  كثيرون، بمجرد ذكر إدارة المعرفة، يقفز إلى ذهنهم حفظ المقالات، وترتيب الروابط، وتدوين الملاحظات، وبناء مكتبة مواد جميلة.

  لكن من منظور المبادئ الأولى، المشكلة التي ينبغي لإدارة المعرفة أن تحلها فعلاً هي:

  **هل تظل المعلومة التي أطّلع عليها اليوم معينةً لي على إصدار الأحكام في المستقبل؟**

  ذاكرة الإنسان محدودة، وانتباهه محدود، وخبرته تتسرب سريعاً أيضاً.

  فإن كانت المادة محفوظةً فحسب، فغلبة الظن أن تتحول في النهاية إلى مقبرة معلومات.

  وإدارة المعرفة ذات القيمة الحقيقية ينبغي أن تُنجز تحولاً واحداً:

  تحويل المعلومات الخارجية والخبرة الشخصية إلى قدرة فعلٍ قابلة للبحث، والاستدعاء، وإعادة الاستخدام، والتحديث.

  - المقالُ في الحفظ البسيط مجرد مادة.
  - تستخلص منه رأياً، فيتحول معلومات.
  - تربطه بمشاريعك ومواقفك وأحكامك، فيبدأ التصيّر معرفة.
  - وأخيراً إذا أعانك على كتابة المقالات، وصنع المنتجات، وإصدار القرارات، وتصميم سير العمل، فعندها يتحول قدرة.

  لذلك أزداد يقيناً أن غاية إدارة المعرفة ليست مكتبة مواد.

  إنها أقرب إلى بنية معرفية أساسية.

  تمتص لك المعلومات، وتنظم الأحكام، وترسخ الأساليب، وتواصل إخراج المحتوى والمنتجات والأفعال.

  وبخاصة بعد ظهور وكلاء الذكاء الاصطناعي، ستزداد إدارة المعرفة إمتاعاً.

  في الماضي كنا نعتمد على الإنسان للترتيب والتصنيف والبحث وإعادة الاستخدام.

  أما مستقبلاً فكثير من الحركات تصبح قابلة للتفويض للوكيل:

  التلخيص الآلي، والوسوم الآلية، والربط التلقائي بالمشاريع، وتوليد الأطر تلقائياً، والتنبيه التلقائي إلى المعرفة المتهالكة، بل وتحويل المواد نفسها مباشرة إلى مقالات وخطط وعروض تقديمية ومهام.

  وهذا ما يفسر اهتمامي الأخير بإدارة المعرفة.

  هي في ظاهرها تدوين ملاحظات.

  وفي جوهرها بناء نظام معرفي تربوية تتراكم على المدى البعيد.