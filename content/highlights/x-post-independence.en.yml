  Sharing a small tip for X posting:

  Every post should stand on its own.

  Because you're not the center of the world, and no one will specifically open your profile to understand the full context.

  A stranger scrolling onto you for the first time should immediately get an opinion, or a piece of know-how.

  Only such posts have value.
