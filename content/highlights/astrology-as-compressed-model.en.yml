content: |
  Suddenly thought of a rather interesting angle.

  Zodiac signs, Chinese zodiac, astrology, fortune-telling — these things can perhaps be understood as "compressed models" from humanity's low-compute era.

  The ancients had no databases, no statistical tools, and no AI.

  They could only observe seasons, celestial phenomena, farming seasons, personalities, human relationships, and social cycles over the long term, then compress these complex experiences into a symbol system that was easy to remember and spread.

  The 12 zodiac signs, 12 Chinese zodiac animals, the Eight Characters, and hexagrams are all essentially ways of reducing the complex world to lower dimensions.

  Of course, they can't be treated as rigorous scientific prediction.

  But they're not necessarily pure superstition either.

  They're more like a kind of experience distillation the ancients made with stories, symbols, and rules, under conditions of insufficient compute, data, and tools.
