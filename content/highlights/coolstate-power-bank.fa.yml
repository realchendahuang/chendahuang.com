content: |
  یک دوست پرسید پاوربانک توی عکس چه برندی است.

  بسیار خب، وقتش رسیده شروع کنم به معرفی کردن.

  این CoolState Power Bank No. 25 Super SE است (CoolState همان Zimi سابق است).

  کمی بالاتر از ۱۴۰ یوآن، ۲۵,۰۰۰ میلیآمپرساعت، تا ۱۲۰ وات خروجی، کابل شارژ توکار.

  MacBook Air من را یک بعدازظهر کاملِ کار سنگین نگه میدارد.

  همراه اداری بینقص برای استارباکس، مکدونالد، کیافسی، روستا و هر جای دیگر!