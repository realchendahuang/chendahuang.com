  Saya memindahkan agregasi langganan circumvention ke Cloudflare.

  Membuka sumber sebuah proyek agregasi tautan langganan yang ter-deploy sepenuhnya gratis di Cloudflare.

  Ia melipat semua tautan langganan circumvention dan node buatanmu sendiri menjadi satu tautan, dengan aturan routing ikut terpasang.

  Benar-benar satu tautan — bisa dipakai di semua klien, tanpa konfigurasi per klien.

  GitHub: https://github.com/realchendahuang/sub-store-cloudflare

