content: |
  梁文锋在投资人会议上说：
  「智能的终点可能都是具身。因为对一个正常人来讲，他的需求并不是电脑，而是人力。」
  这句话很准。普通人要的从来不是更聪明的电脑，而是能干活的「人力」。文本再强，也只是中间态。 https://t.co/2xg5o5hNjt
