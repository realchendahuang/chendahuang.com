content: |
  Took me a while, but I got Sub-Store deployed on Cloudflare.

  Merged my self-built nodes and the airport's backup nodes into one, and paired it with ACL4SSR routing rules on auto-subscribe.

  Done with a single subscription link:

  - Merging nodes from multiple providers
  - Node filtering
  - Routing rule configuration
  - Automatic config updates

  Smoother than smooth.