  Spent some time completing the Sub-Store deployment on Cloudflare.

  Merged all my self-hosted nodes and airport backup nodes together, and paired them with ACL4SSR routing rules for automatic subscription.

  Achieved with a single subscription link:

  - Merging nodes from multiple providers
  - Node filtering
  - Routing rule configuration
  - Automatic config updates

  Smooth as hell.
