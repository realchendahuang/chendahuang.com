content: |
  發現個好東西，DeepSeek 官方居然在 API 裡內建了網路搜尋。
  用 Responses 格式的介面呼叫 deepseek-v4-flash 模型，只要在請求參數裡宣告 web_search 工具，就能直接用他們伺服器端執行的搜尋能力。
  不用自己對接第三方搜尋引擎，也不用額外申請搜尋介面金鑰。
  整套搜尋流程官方直接託管了。
