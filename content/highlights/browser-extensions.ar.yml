content: |
  أشارككم هنا إضافات المتصفح التي ادّخرتها سنوات.

  - **Wetab**: إضافة لصفحة التبويب الجديد؛ تضع فيها ما تدمنه، وتخصص محرك البحث، وبمجرد تسجيل الدخول تتزامن مجاناً بين الأجهزة. صنعتُ عليه بنفسي محرك بحث X مبنياً على Google، وهو أجود بكثير من المدمج أصلاً.
  - **Video Speed Controller**: تحكم مرن في سرعة الفيديو، مثالي لامتصاص المعرفة بكفاءة.
  - **XHunt**: ضرورية لك في X؛ ترى بها ترتيب كل مؤثر (KOL)، وأسخن المنشورات لحظياً.
  - **رادار التبادل في X**: يعلّم على الصفحة علاقات المتابعة المتبادلة وذات الاتجاه الواحد، مع خيار إظهار نسبة following / followers.
  - **FireShot**: يلتقط لقطات شاشة لصفحات الويب، ويمكنك تحريرها وحفظها بصيغ PDF أو JPEG أو GIF أو PNG أو BMP.
  - **Proton Pass**: أداة أنيقة التصميم لإدارة الحسابات وكلمات المرور، مع مزامنة عبر الأجهزة.
  - **الترجمة الغامرة (Immersive Translate)**: إضافة ترجمة ثنائية اللغة عريقة، مربوطة بواجهة DeepSeek V4 Flash.
  - **Codex**: ضرورية لربط Codex بمتصفح Chrome؛ يمنحك القدرة على أتمتة أي شيء يعمل في المتصفح، مثل كتابة رسالة استئناف حين يحظر حسابك.