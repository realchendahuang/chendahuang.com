  Где новые программные возможности эпохи ИИ?

  Большая из них — та часть, которую традиционное ПО не в состоянии фиксировать, иначе говоря, неструктурированные фоновые данные.

  Например, по-настоящему AI-native CRM при фиксации скидки, данной клиенту, может заодно записать, почему дали именно эту скидку, а не другую, почему отклонили другие варианты и кто кого переубедил.

  У традиционного ПО огромное количество подобной скрытой информации, которую оно просто не может зафиксировать. А эпоха ИИ, благодаря способности понимать текст и видео, может извлекать эту скрытую, сильно избыточную информацию в структурированные данные для анализа.