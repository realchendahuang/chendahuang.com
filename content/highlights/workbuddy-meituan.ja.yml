content: |
  テンセントの Workbuddy を試しに使ってみた。あるとても古典的なシーンがある、美団のクーポン取得という。

  ログインの段階で、QRコードを生成して、スキャンでログインさせられた。

  それから「クーポンを取って」と一声叫んだら、ちゃっちゃとこれだけ取ってくれた。

  AI Agent をクーポン取得みたいなシーンに使うのは、very amazing。