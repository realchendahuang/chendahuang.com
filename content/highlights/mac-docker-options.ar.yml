content: |
  خيارات Docker على Mac، إليكم اختياراً تقنياً موجزاً.

  - **Colima**: مجاني ومفتوح المصدر، وخفة وزنه عالية، لكنه معتمد على سطر الأوامر فقط تقريباً. يناسب من يحتضنون التجريب والذين ألفوا الأوامر.
  - **Apple Container**: اتجاه الحاويات الجديد من آبل، جدير بالمتابعة مستقبلاً، لكن نظامه البيئي هش الآن، وما زال في مراحل مبكرة جداً؛ فمثلاً لا يدعم حتى Docker Compose.
  - **OrbStack**: فيه واجهة رسومية، وخفة وسرعة، ودعم بيئي مكتمل. عيبه أنه ليس مفتوح المصدر، ونسخته التجارية تحتاج ترخيصاً، لكن النسخة الشخصية مجانية.
  - **Docker Desktop**: صنيع رسمي، لكنه ثقيل منتفخ، وتجربته كومة هزيلة. على Mac: إن استطعت تركه، فاتركه.