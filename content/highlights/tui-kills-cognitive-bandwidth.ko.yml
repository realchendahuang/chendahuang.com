content: |
  TUI라는 물건, 거칠게 말하면 이미 썩기 시작했다.
  가장 역겨운 점은 사용하기 어렵다는 게 아니라, 사람의 인지 대역폭을 체계적으로 깎아 내린다는 데 있다.
  도구와 효율적으로 대화하고 있다고 생각하지만, 사실은 계속 세 가지 일을 반복하고 있다:
  단축키와 모드를 떠올리기
  스크롤되는 문자 스트림에서 정보 찾기
  혹시라도 이상한 상태에 빠지지 않았기를 기도하기
  이건 더 이상 상호작용이 아니라, 인터페이스와 씨름하는 거다.
  진짜 효율적인 인터페이스는 상태를 눈앞에 펼쳐 보여 주고, 눈과 공간감으로 이해하게 해야지, 모든 걸 단기 기억에 쑤셔 넣으라고 강요하면 안 된다. TUI는 정반대로 간다——정보 밀도는 극한까지 쌓아 올리면서, 가독성과 회복 가능성은 최저로 짓밟는다.
  더 나쁜 건, 아주 나쁜 습관까지 길러 준다는 점이다: 어떤 도구의 키맵을 다룰 줄 아는지를 능력 자체로 여기는 습관 말이다. 결과적으로 사람은 문제를 생각하는 게 아니라, 인터페이스에 적응하는 데 막대한 에너지를 쓴다.
  좋은 도구는 생각 비용을 낮춰야지, 생각 비용을 그 인터페이스를 조작하는 법으로 전가하면 안 된다.
  TUI가 요즘 유행하는 건, 상당 부분 긱 필터로 자기 인터랙션 디자인의 게으름과 오만을 가리는 것이다.
