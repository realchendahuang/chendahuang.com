title: "انغلاق الجيكز على أنفسهم: يتعاملون مع الألم كأنه مكانة"
description: "الصعوبة طبقةٌ، والعوائق ذوقٌ — إذا كان الشيء سهلاً وبديهياً لعموم الناس، فما هو بالهاردكور الكافي."
