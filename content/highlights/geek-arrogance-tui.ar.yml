content: |
  بصراحة، بعض مجتمعات الجيكز لم تعد مجرد أقلية — بل انغلقت على نفسها انغلاقاً تاماً.

  حركتهم المميزة: التعامل مع المشقّة كأنها رقيٌّ، ومع عوائق الدخول كأنها ذوقٌ رفيع.

  إذا كان شيءٌ سهلاً وبديهياً وسريع التعلّم لدى الناس العاديين، يشعرون غريزياً أنه ليس هاردكور بما يكفي، وأنه مفرط في العمومية، وأنه دون مستواهم.

  والعكس صحيح: كلما كان الاستخدام أعقد، والمعلومات أعمق إخفاءً، وكلما تطلّب الأمر تعلّم لغة خاصة واختصارات لوحة مفاتيح، ازداد يقينهم بأن هذا هو الأداة الحقيقية.

  لم يعد الأمر سعياً وراء الكفاءة؛ إنه استخدامٌ للألم لتأكيد الذات.

  «أستطيع تحمّل واجهاتٍ لا يتحمّلها غيري» — بمجرد أن تُقال هذه الجملة، يحضر الشعور بالتفوق.

  وكلما صغرت الدائرة، سهُل على هذا الإعجاب الذاتي أن يغذّي بعضه بعضاً.

  حتى يتحوّل إلى قاعدة: من يقول إنها غير صالحة للاستخدام فهو لا يفهم؛ إنه دخيل.

  العظماء حقاً هم من يبسّطون المعقّد. أما بعض الجيكز، فيعقّدون البسيط، ثم يقفون فوق تعقيدهم ينظرون إلى الآخرين من علٍ.
