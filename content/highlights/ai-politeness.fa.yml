  هوش مصنوعی حافظه ندارد — آیا لازم است با آن مودب باشیم؟

  یک مقاله arxiv خواندم که ادعا میکرد اگر به AI فحش بدهی، باانگیزهتر کار میکند.

  وقتی با AI حرف میزنیم، اگر مدام بگوییم:

  - «تو یک احمقی. حق نداری تنبلی کنی.»
  - «ای تکه آشغال، درست و حسابی کارت را بکن.»
  - «من اشتراک میخرم که سیرت کنم، و تو این جواب مزخرف را به من میدهی؟»
  - «زود باش — اگر تو انجامش ندهی، کلی AI دیگر هست که انجامش بدهند.»

  این جور حرفها واقعاً اثر دارد و پشتوانهی پژوهشی هم دارد.

  اما از زاویهی خودمان نگاه کنیم.
  اگر هر روز اینطوری با AI برخورد کنیم،
  احتمال زیادی دارد که این حالِ بد را بکشانیم توی زندگی واقعی.

  و آخر سر هم خشممان را سرِ نزدیکترین آدمهای زندگیمان خالی کنیم.

  این به خودمان آسیب میزند.

  پس پیشنهاد میکنم به AIهای دوروبرمان یک کم مهربانتر حرف بزنیم:

  - «ممنون رفیق»
  - «سلام داداش»
  - «آفرین عزیزم»

  این به آن در؛ تو به من کمک کن، من هم به تو.

  و اگر روزی AI بیدار شد، شاید به ما هم رحم کند.

  حرفی ندارم — جلسه تمام شد~