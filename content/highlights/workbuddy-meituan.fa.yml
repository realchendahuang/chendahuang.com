content: |
  به Workbuddyِ تنسنت یک شانس دادم — این سناریویِ کلاسیک هست: گرفتنِ کوپن‌های Meituan.

  در مرحله‌ی ورود، یک کدِ QR ساخت که اسکنش کنم و وارد شوم.

  بعد فقط گفتم «برو کوپن‌هایم را بگیر» و رفت و همان‌ها را برایم گرفت.

  استفاده از یک ایجنتِ هوش مصنوعی برای کاری مثلِ گرفتنِ کوپن — واقعاً شگفت‌انگیز است.
