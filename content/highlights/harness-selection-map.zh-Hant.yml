content: |
  我目前的格局是這樣的。
  如果是中國大陸的模型，就推薦掛上 ZCode（DeepSeek V4 Flash、GLM 5.3 Flash 這種模型）。
  如果是 GPT，就直接用 Codex。
  如果想要速度快，就用 Pi。
  如果既要速度快、又要省心，就用 OMP。
  如果想幫企業做客製化的用戶端開發，就用 DSH。
  如果想鍛鍊脾氣，就用 Workbuddy。
