content: |
  Một người bạn hỏi tôi sạc dự phòng trong ảnh là hãng nào.

  Được rồi, đến lúc tôi bắt đầu rao hàng đây.

  Đây là Sạc dự phòng CoolState số 25 Super SE (CoolState chính là Zimi trước đây).

  Hơn 140 tệ một chút, 25.000 mAh, công suất đầu ra lên tới 120W, có sẵn dây sạc tích hợp.

  Nó giúp MacBook Air của tôi trụ cả một buổi chiều làm việc cường độ cao.

  Bạn đồng hành văn phòng hoàn hảo cho Starbucks, McDonald's, KFC, vùng quê và mọi nơi khác!
