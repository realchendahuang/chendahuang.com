content: |
  Hôm nay là ngày đầu mình chính thức vào văn phòng OPC. Để mình kể mọi người nghe mình bắt đầu OPC thế nào.

  Động cơ ban đầu của mình rất đơn giản: cần một pháp nhân hợp quy để nhận thanh toán và phát hành sản phẩm. Thế là lên mạng tìm thông tin đăng ký công ty.

  Mình không kén chọn thành phố: Nam Kinh, Tô Châu, Hàng Châu, Ninh Ba — thành phố ven biển phát triển nào cũng là ứng viên.

  Tình cờ một hôm mình có việc ở Nam Kinh, lúc rảnh lướt mấy tài khoản WeChat về Nam Kinh thì thấy số điện thoại liên hệ của một cộng đồng OPC. Thế là kết bạn.

  Sau khi giới thiệu nhanh dự án của mình, người phụ trách đồng ý và sắp xếp cho mình đến xem địa điểm ngay chiều hôm đó.

  Điều kiện của họ: mỗi tuần phải làm việc tại chỗ ba ngày. Nếu chấp nhận được thì họ cho đăng ký công ty tại đây.

  Vì thuộc khối tài sản nhà nước của Nam Kinh, chính sách ở đây cực kỳ ưu đãi — tiền nước, tiền điện, internet và phí quản lý đều miễn, nghe nói là ba năm. Họ còn bố trí cả kế toán để giúp mình đăng ký công ty, khắc con dấu, lấy giấy phép kinh doanh và mở tài khoản ngân hàng. Ưu đãi đến mức gần như phi lý.

  Sau hai ba tuần làm thủ tục đăng ký, cuối cùng mình cũng cầm được đủ giấy tờ.

  Quản lý khu bảo mình tự chọn một bàn làm việc. Tiêu chuẩn bàn làm việc của mình thấp lắm — chỉ cần một cái ghế, một cái bàn nhỏ và ổ điện.

  Sau đó họ cho mình điền ba mẫu đơn xin dự án, nội dung chủ yếu là thế mạnh của dự án, hồ sơ đội ngũ và lợi thế liên quan AI. Nếu hồ sơ đủ tốt và đáng tin, sẽ có cơ hội nhận trợ cấp chính sách 50.000–100.000 tệ.

  Nam Kinh làm chuyện này thật sự rất tử tế. Mọi người nên xem thành phố của mình có chính sách tương tự không, hoặc thủ phủ tỉnh mình có gì tốt hơn không.

  Chính sách tốt không chờ ai — phải tự đi mà hỏi. Hôm nay mình tới thì khu này đã có không ít công ty chuyển vào rồi; tính ra mình còn thuộc diện muộn.

  Hôm nay đến đây thôi. Mình sẽ tiếp tục chia sẻ hành trình khởi nghiệp và những bài tổng kết trên đường đi.

  Cảm ơn mọi người đã quan tâm.
