content: |
  Многие жалуются, что в DeepSeek V4 Flash нет мультимодальности.
  Я провёл исследование: самая экономичная модель зрения прямо сейчас — Qwen-3.7-Flash.
  Распознать одно изображение стоит 0,0004–0,001 юаня; распознать 1000 обычных изображений ≈ 0,6–0,8 юаня.
  На основе этого мы пришли к по-настоящему нищебродскому универсальному ИИ-стекингу:
  1. Тариф OpenCode Go за $5 — используем DeepSeek V4 Flash для написания кода
  2. https://t.co/mlvdSTaD6M