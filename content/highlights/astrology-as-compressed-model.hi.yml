content: |
  अभी-अभी एक काफ़ी दिलचस्प नज़रिया सोचा।

  राशियाँ, जन्म-वर्ष के पशु, ज्योतिष, भविष्य-कथन — इन्हें शायद मानवता के निम्न-कंप्यूट युग के "संपीड़ित मॉडल" के रूप में समझा जा सकता है।

  प्राचीन लोगों के पास न डेटाबेस था, न सांख्यिकीय उपकरण, और न AI।

  वे बस लंबे समय तक ऋतुओं, आकाशीय घटनाओं, कृषि कैलेंडर, व्यक्तित्व, सामाजिक रीति-रिवाज़ों और सामाजिक चक्रों का अवलोकन कर सकते थे, फिर उस जटिल अनुभव को याद रखने और फैलाने में आसान प्रतीक प्रणाली में संपीड़ित कर सकते थे।

  12 राशियाँ, 12 जन्म-वर्ष के पशु, आठ वर्ण (Eight Characters), हेक्साग्राम — ये सब अनिवार्य रूप से एक जटिल दुनिया को निचले आयामों में घटाने के तरीके हैं।

  बेशक, इन्हें कठोर वैज्ञानिक भविष्यवाणी नहीं माना जा सकता।

  लेकिन ये ज़रूरी नहीं कि शुद्ध अंधविश्वास भी हों।

  ये ज़्यादा अनुभव के आसवन की तरह हैं — जब कंप्यूट शक्ति कम थी, डेटा कम था, और उपकरण कम थे, तब प्राचीन लोगों ने कहानियों, प्रतीकों और नियमों से इन्हें बनाया।
