content: |
  昨日 Command GOAT と OpenCode Go の比較を投稿したら、Command Code の CEO 本人がコメントをしに来てくれた。
  
  彼曰く、一項目見落としている——キャッシュの請求だという。調べてみると、Command Code はなかなかやる。
  
  Coding Agent は本質的に巨大な Prefix Cache マシンだ。数十万トークン規模のセッションでも、次のラウンドで本当に新しいトークンは数千個程度かもしれない。システムプロンプト、ツール、コードコンテキスト、会話履歴はほとんど変わらない。キャッシュヒット率が高いほど、そうした古いコンテキストは安くなる。
  
  Command Code は最近、Cache Thrashing 対策に本気で取り組んだ。主な戦略はこれらだ：
  
  セッションを同じ GPU ポッドに固定して KV キャッシュを温めておく；安定プレフィックスをできる限り壊さず、プロバイダのフォールバックでコンテキストが乱れないようにする；さらに Tool Call Repair——ハーネスが誤ったモデルパラメータをローカルで修正し、エラーをモデルに返してリトライさせる代わりにする。
  
  v0.33.0 のチェンジログには文字通りこうある：Major Cache Overhaul、コスト中央値 2.9 倍減。今では持続的なキャッシュヒット率 95〜99% を公式にうたっている。
  
  同じモデル、同じ 10 ドルプラン——でもキャッシュのおかげで、その差は積み重なり、まったく別の結果になる。
