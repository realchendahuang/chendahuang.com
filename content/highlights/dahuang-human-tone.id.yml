  Saya menghabiskan satu hari penuh untuk meneliti "menghilangkan bau AI dari artikel".

  Membandingkan Humanizer mainstream, Skill penghilang bau AI, dan pendekatan berbasis prompt yang ada di luar sana.

  Lalu memasukkan pengalaman saya sendiri memakai LLM sejak 2023 — tersiksa hari demi hari oleh bau AI dari GPT, Claude, Gemini, dan Doubao.

  Dan membuat ini:

  **Dahuang Human Tone**

  Sebuah Skill penghilang bau AI yang dibuat untuk konteks bahasa Mandarin.

  Harapan saya:

  Tidak ada esai AI yang seharusnya menyiksa untuk dibaca.

  GitHub: https://github.com/realchendahuang/dahuang-human-tone