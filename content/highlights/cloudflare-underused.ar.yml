content: |
  في شعوري، ما يكتشفه الناس من إمكانيات Cloudflare لا يزال دون 1%.

  فقد أطلقت وظائف أكثر من أن تُعد.

  - لتخزين الكائنات: R2
  - لواجهات الخلفية: Worker
  - لبوابة الذكاء الاصطناعي: AI Gateway
  - للحوسبة الثقيلة: Container
  - للكاش: KV
  - لقاعدة البيانات: D1
  - وإن كنت تستخدم PostgreSQL، فاربطه عبر HyperDrive

  إلى آخره، والكثير الكثير أيضاً؛ ما يخطر ببالك فيه، وما لا يخطر أصلاً.

  والأهم أنه رخيص بجنون. فالحصة المجانية تدوم طويلاً. تريد معنى «حصة مجانية»؟ معناها ألا تُخرج سنتاً واحداً من جيبك. إله سايبراني حرفياً.