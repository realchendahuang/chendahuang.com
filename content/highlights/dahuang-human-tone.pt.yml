content: |
  Passei um dia inteiro pesquisando a fundo essa coisa de "tirar o gosto de IA" dos textos.

  Comparei os principais Humanizers do mercado, Skills de tirar gosto de IA e soluções baseadas em prompt.

  Tudo somado à minha experiência de usar modelos de linguagem desde 2023, martirizado por todo tipo de gosto de IA de GPT, Claude, Gemini e Doubao.

  E fiz isto:

  **Dahuang Human Tone**

  Uma Skill de tirar gosto de IA feita pro contexto da língua chinesa.

  Meu desejo:

  que nenhuma redação de IA fique ilegível.

  GitHub: https://github.com/realchendahuang/dahuang-human-tone