  Друг спросил меня, какой марки повербанк на фото.

  Ладно, настало время для моей рекламы.

  Это CoolState Power Bank No. 25 Super SE (CoolState — бывшая Zimi).

  Немного за 140 юаней, 25 000 мАч, выход до 120 Вт, встроенный кабель зарядки.

  Мой MacBook Air держится на нём целый день тяжёлой работы.

  Идеальный офисный спутник для Starbucks, McDonald's, KFC, выездов за город и всех прочих мест!