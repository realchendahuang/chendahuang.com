  Ich teile einen kleinen X-Posting-Tipp:

  Jeder Beitrag muss eigenständig sein.

  Denn du bist nicht das Zentrum dieser Welt. Niemand wird extra dein Profil öffnen, um den Zusammenhang der Dinge zu verstehen.

  Ein Fremder, der dich zum ersten Mal scrollt, sollte sofort eine Meinung oder ein Know-how mitnehmen.

  Genau solche Beiträge sind wertvoll.