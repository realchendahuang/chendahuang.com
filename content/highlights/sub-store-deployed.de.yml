content: |
  Ich habe mir die Zeit genommen und Sub-Store auf Cloudflare deployed.

  Meine eigenen Nodes und die Backup-Nodes des Airport-Dienstes sind jetzt vollständig zusammengebracht, dazu automatische Abos mit den ACL4SSR-Routing-Regeln.

  Mit einer einzigen Abo-Link bin ich direkt abgedeckt:

  - Node-Merging mehrerer Anbieter
  - Node-Filter
  - Routing-Regel-Konfiguration
  - Automatische Config-Updates

  Einfach butterweich.