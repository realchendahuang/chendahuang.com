  سألني صديق: ما ماركة بنك الطاقة في الصورة؟

  حسناً، سأبدأ الترويج.

  هذا هو بنك الطاقة الفائق Coolstate 25 SE (وCoolstate هو اسم ZMI السابق).

  بأكثر من 140 يواناً، وسعة 25000 ميلي أمبير ساعة، وقدرة إخراج قصوى 120 واط، وكابل شحن مدمج.

  يكفي MacBook Air ليعمل بعد ظهرة كاملة بأقصى جهد.

  إنه الرفيق المثالي للعمل في ستاربكس، وماكدونالدز، وكنتاكي، وفي أي مكان خارج المدينة!