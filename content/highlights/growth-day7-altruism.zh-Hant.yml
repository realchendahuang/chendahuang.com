  經營第 7 天突破 2000 追蹤者，簡單回顧一下。

  核心就一個字：利他。

  我主要分享了兩類乾貨：

  - macOS 重度使用軟體清單（48k 閱讀）
  - Cloudflare 免費額度表 + Playbook（在 X 上數據不錯，還被老哥搬運洗稿到知乎，竟然也拿到好幾百個收藏）
  - 還有 OPC 一人公司資源推薦（38k 閱讀）

  沒想著怎麼漲粉，就是把研究透徹的東西整理好、免費給出去。結果反而漲得更快。

  之後繼續輸出這類實用內容。感謝大家的支持。
