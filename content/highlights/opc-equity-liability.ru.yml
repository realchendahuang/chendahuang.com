content: |
  Сегодня друг поделился в моём разделе комментариев пунктами о проблемах капитала и ответственности компаний одного человека.

  Во-первых, огромное спасибо этому другу за добрый совет.

  Его мнение: нужно, чтобы член семьи держал как минимум 1 % акций.

  Проблема компании одного человека с ограниченной ответственностью: когда акционер всего один и нельзя чётко разделить деньги компании и личные деньги, акционер может нести солидарную ответственность по долгам компании. Статья 23 Закона о компаниях — ровно эта логика.

  Если акционеров несколько, компания переходит из статуса «компании одного человека» в «обычное ООО», уходя от особого риска бремени доказывания компании одного человека и давая себе дополнительный дешёвый уровень защиты.

  Надеюсь, это послужит всем ориентиром.

  Но в повседневной жизни мы должны чётко разделять бизнес- и личные счета и стремиться объяснить каждую значительную сумму.

  - Откуда пришли деньги, почему и на какой счёт.
  - Куда ушли деньги, зачем потрачены и кто утвердил.
  - Когда ты берёшь деньги из компании — это зарплата, возмещение, заём или дивиденды?

  Разберись в этих трёх вещах — и риск резко падает.