  El día 7 de operación pasé de 2000 seguidores; un repaso rápido.

  El núcleo, en una palabra: altruismo.

  He compartido sobre todo dos tipos de contenido útil:

  - lista de software para uso intensivo de macOS (48k lecturas)
  - tabla de cuotas gratuitas de Cloudflare + Playbook (me fue bien en X, y hasta un colega se lo llevó reescrito a Zhihu, donde le dieron unos cuantos cientos de guardados)
  - y el recopilatorio de recursos de OPC para personas que montan una empresa de un solo socio (38k lecturas)

  No pensaba en cómo ganar seguidores: solo ordenaba lo que había investigado y lo regalaba gratis. Y el resultado es que subió rápido.

  Seguiré soltando contenido práctico de este tipo. Gracias por el apoyo.