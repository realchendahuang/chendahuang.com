  Os comparto un truco para reescribir textos.

  Puedes usar el dictado por voz del input de Doubao.

  Mientras miras el texto que tienes que reordenar,

  sueltas lo que quieras y lo reescribes con tus propias palabras.

  Así tiene mucho menos olor a IA.

  Más eficiente, gratis, y sin necesidad de pagar ninguna membresía.

  En cualquier sitio y momento puedes escribir por voz, y subir tu productividad de salida.