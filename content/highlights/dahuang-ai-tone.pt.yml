  Eu fiz uma Skill meio absurda:

  **Dahuang AI Tone**

  Todo mundo fala em "tirar o gosto de IA". Mas afinal, o que é esse "gosto de IA"?

  Ela faz duas coisas:

  - transforma um texto normal no gostinho de IA de um modelo específico
  - e o contrário: aponta onde um texto parece IA e de qual modelo

  O valor dela é:

  primeiro tu sente o cheiro de IA, pra depois saber como tirar.

  GitHub: https://github.com/realchendahuang/dahuang-ai-tone