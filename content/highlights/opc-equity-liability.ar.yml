content: |
  شاركني اليوم صديق في التعليقات مسألة مسؤولية الأسهم في شركات الشخص الواحد.

  أولاً، شكرٌ جزيل لهذا الصديق على تذكيره اللطيف.

  ويرى وجوب أن يتقمص أحد أفراد العائلة 1% على الأقل من الأسهم.

  ومشكلة الشركة المحدودة ذات الشخص الواحد: إذا كان المساهم وحيداً، ولم يستطع إثبات انفصال أموال الشركة عن أمواله الشخصية، فقد يتحمل مسؤولية تضامنية تجاه ديون الشركة. وهذه هي منطق المادة 23 من قانون الشركات.

  أما إذا تعدّد المساهمون، فلا تظل الشركة «شخصاً واحداً»، بل تتحول «شركة ذات مسؤولية محدودة عادية»، فتُتجنب بذلك تحمل مخاطر الإثبات الخاصة بشركات الشخص الواحد، ويكسب المرء طبقة حماية إضافية رخيصة.

  أتمنى أن يكون هذا مرجعاً لكم.

  لكن علينا دوماً أن نفصل بين الحساب العام والخاص، وأن نجرد كل معاملة مالٍ مهمة على نحو مفهوم.

  - من أين جاء المال، ولماذا جاء، وإلى أي حساب دخل.
  - أين صُرف المال، ولماذا صرف، ومن أذن به.
  - وما تأخذه من الشركة: هل هو راتب، أم تسديد نفقات، أم قرض، أم توزيع أرباح.

  ما إن وهبنا هذه الأمور الثلاثة وضوحها، انخفضت المخاطر انخفاضاً كبيراً.