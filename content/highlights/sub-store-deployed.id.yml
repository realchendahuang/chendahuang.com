content: |
  Butuh waktu sebentar, tapi akhirnya saya berhasil men-deploy Sub-Store di Cloudflare.

  Menggabungkan node buatanku sendiri dan node cadangan airport menjadi satu, dan memasangkannya dengan aturan routing ACL4SSR pada auto-subscribe.

  Selesai dengan satu tautan langganan:

  - Menggabungkan node dari banyak penyedia
  - Penyaringan node
  - Konfigurasi aturan routing
  - Pembaruan konfigurasi otomatis

  Lebih mulus dari mulus.
