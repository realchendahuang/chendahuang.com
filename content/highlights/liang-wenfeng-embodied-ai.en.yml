content: |
  Liang Wenfeng said at an investor meeting:
  "The endpoint of intelligence may all be embodied. Because for a normal person, what they need isn't a computer, but labor."
  This is very accurate. What ordinary people want has never been a smarter computer, but "labor" that can get work done. No matter how strong text is, it's only an intermediate state. https://t.co/2xg5o5hNjt
