content: |
  요즘 X를 스크롤하는 빈도가 줄었다.

  현자 모드에 들어간 건 아닌지 모르겠다.

  곰곰이 반성해 보니, 나는 한 가지 질문이 그 무엇보다 신경 쓰인다는 걸 깨달았다:

  내가 매일 스크롤하며 지나가는 것들이 결국 진짜 제품이 될 수 있을까.

  도구 업데이트를 아무리 많이 봐도, 구체적인 시나리오 하나를 끝까지 뚫는 것만 못하다.

  요즘 나는 제품, 커뮤니티, 장기 콘텐츠에 더 많은 에너지를 쏟고 싶다.