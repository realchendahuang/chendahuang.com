  اكتشفت شيئاً عظيماً: DeepSeek دمجت رسمياً البحث عبر الإنترنت في واجهة API.
  باستدعاء نموذج deepseek-v4-flash عبر واجهة بصيغة Responses، يكفي أن تعلن أداة web_search في معاملات الطلب، فتحصل مباشرة على قدرة بحث تنفذها خوادمهم.
  لا حاجة لربط محركات البحث الخارجية بنفسك، ولا لتقديم طلبات مفاتيح بحث إضافية.
  كامل سير عمل البحث يحتضنه المصدر الرسمي مباشرة.
  النص الأصلي: https://t.co/D4AXo7crHw