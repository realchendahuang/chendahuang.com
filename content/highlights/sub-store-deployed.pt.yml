content: |
  Passei um tempinho e concluí o deploy do Sub-Store na Cloudflare.

  Fundi tudo: meus nós próprios e os nós reserva do serviço de proxy, e ainda encaixei a assinatura automática com regras de roteamento ACL4SSR.

  Com uma única URL de assinatura, realizando direto:

  - fusão de nós de vários provedores
  - filtragem de nós
  - configuração de regras de roteamento
  - atualização automática de configuração

  Um deslizar só.