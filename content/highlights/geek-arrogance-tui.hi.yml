content: |
  सच कहूँ तो, कुछ गीक समुदाय अब केवल निच-मार्केट नहीं रहे — वे पूरी तरह आत्ममुग्ध हो चुके हैं।

  उनका सिग्नेचर मूव: असुविधा को परिष्कार मानना, और एंट्री की रुकावटों को स्वाद मानना।

  अगर कोई चीज़ आम लोगों के लिए आसान, सहज और जल्दी पकड़ में आने वाली है, तो वे सहज रूप से महसूस करते हैं कि यह काफ़ी हार्डकोर नहीं है, बहुत मेनस्ट्रीम है, उनके स्तर से नीचे है।

  इसके उलट, जितना अटपटा इंटरैक्शन हो, जितनी गहरी छिपी जानकारी हो, जितनी निजी भाषा और ढेरों शॉर्टकट सीखने पड़ें — उतना ही उन्हें लगता है कि यही असली टूल है।

  यह अब एफ़िशिएंसी के बारे में नहीं है। यह दर्द के ज़रिए अपनी पहचान पक्की करना है।

  "मैं वह इंटरैक्शन झेल सकता हूँ जो दूसरे नहीं झेल सकते" — यह वाक्य मुँह से निकलते ही श्रेष्ठता की भावना तैयार है।

  दायरा जितना छोटा, यह आत्म-तारीफ़ उतनी ही आसानी से एक-दूसरे को हवा देती है।

  आख़िरकार यह बन जाता है: जो कोई इसे बेकार कहे, वह समझा ही नहीं — वह बाहरी है।

  सच में काबिल़ लोग जटिल चीज़ों को आसान बनाते हैं। कुछ गीक सरल चीज़ों को जटिल बनाते हैं, और फिर उस जटिलता के ऊपर खड़े होकर बाक़ी सबको नीचे से देखते हैं।
