content: |
  من شاگردِ سرسپرده‌ی وانگ شیائوبو هستم.

  او بامزه بود، اما هرگز چرب‌زبانی نمی‌کرد.
  او شوخ‌طبع بود، اما همیشه منطقی.
  او از حماقت بدش می‌آمد — و به همان اندازه از حماقتِ خشک و جدیِ مظلوم‌نما.

  اگر وانگ شیائوبو در عصرِ هوش مصنوعی زندگی می‌کرد،

  احتمالاً می‌گفت:

  بالاخره چیزی آمد که به آدم‌های معمولی کمک می‌کند کمی کمتر کارِ احمقانه انجام بدهند و وقتِ بیشتری برای فکرهای واقعاً جالب نگه دارند.

  برای همین هم هست که من هوش مصنوعی را دوست دارم.

  نه به این خاطر که خدایی است.

  بلکه چون می‌تواند کمی از عذابِ کارهای یکنواختِ کسل‌کننده را از آدم کم کند.
