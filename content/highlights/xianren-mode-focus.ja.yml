  最近、X を眺める頻度が下がった。

  賢者モードに入ったのかもしれない。

  ちゃんと反省してみると、もっと気になってる問題が一つある：

  毎日眺めてるこういうものが、最後に本当のプロダクトになるのか。

  ツールの更新をいくら見ても、具体的なシーンを一つ突き抜けることには敵わない。

  この期間、プロダクトとコミュニティ、長期的なコンテンツにもっと精力を注ぎたい。