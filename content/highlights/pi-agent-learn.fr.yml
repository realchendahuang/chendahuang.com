  Un type a demandé :

  est-ce qu'il existe une bonne doc d'analyse sur Claude Code pour apprendre ?

  Ma réponse : à l'ère de l'IA, il faut penser IA partout, laisser l'IA t'aider à apprendre.

  Si tu veux vraiment apprendre les principes des agents.

  Va voir le projet Pi Agent.

  Petit moineau mais cinq organes bien remplis : parfait pour apprendre, et la qualité du code est élevée.

  Claude Code n'est pas open source : c'est une fuite de code source.

  Pi Agent, lui, est vraiment open source.