content: |
  Я считаю, что DeepSeek Harness попал в форму.
  
  Вместо того чтобы сразу нырять в античеловеческий TUI, он поставляет Web UI.
  
  И он почти не занимает места — потому что установщика вообще нет. Никакого Electron-фреймворка, впихивающего внутрь браузерный движок. Экономия кучи места.

  Единственный минус — он живёт в браузере. Но его можно установить как PWA, и тогда он ощущается ровно как нативный клиент.

  Установка веб-приложения как приложения через Chrome — по-настоящему полезная штука. На этом скриншоте это веб-страница, но ведёт она себя ничем не хуже десктопного приложения.
