title: "Chủ nghĩa duy ngã của dân geek: coi khổ cực là đẳng cấp"
description: "Khó khăn là giai cấp, rào cản là gu thẩm mỹ — thứ dễ dùng và trực quan với người thường thì chắc chắn chưa đủ hardcore."
