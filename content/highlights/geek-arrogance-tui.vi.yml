content: |
  Thú thật, nhiều cộng đồng geek giờ không chỉ là kén người dùng nữa — mà thẳng thừng duy ngã.

  Chiêu bài quen thuộc của họ: coi sự bất tiện là tinh tế, coi rào cản gia nhập là gu thẩm mỹ.

  Thứ gì mà người bình thường học dễ dùng, trực quan và nhanh gọn, thì họ theo bản năng thấy nó chưa đủ hardcore, quá đại chúng, không xứng tầm.

  Ngược lại, thao tác càng rườm rà, thông tin càng bị chôn sâu, càng phải học một biệt ngữ riêng và cả đống phím tắt — họ càng thấy đó mới là hình hài của một công cụ thật sự.

  Đến đây thì không còn là chuyện hiệu quả nữa. Đây là việc dùng khổ cực để xác nhận bản sắc của mình.

  “Tôi chịu được những thao tác mà người khác không chịu nổi” — câu ấy vừa thốt ra, sự ưu việt đã tự khắc ghi.

  Vòng tròn càng nhỏ, kiểu tự khen mình này càng dễ tự nuôi lấy.

  Nó dần biến thành: ai dám chê thứ đó không dùng được thì chỉ là kẻ không hiểu — là người ngoài cuộc.

  Người giỏi thật sự là người làm cho thứ phức tạp trở nên đơn giản. Còn một số geek thì làm cho thứ đơn giản trở nên phức tạp, rồi đứng trên đống phức tạp đó nhìn xuống tất cả mọi người.
