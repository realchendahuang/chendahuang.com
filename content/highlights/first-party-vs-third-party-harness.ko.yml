content: |
  많은 사람이 Coding Agent를 고를 때의 첫 반응은 아주 자연스럽다:
  Claude면 Claude Code, GPT면 Codex, GLM이면 ZCode, DeepSeek라면 당연히 DeepSeek 자체 Harness를 먼저 고려한다.
  이 사고방식은 완전히 합리적이다. 자사의 최대 강점은 자기 모델을 가장 잘 안다는 것이니까.
  모델이 어떤 Prompt를 좋아하는지, Tool Schema를 어떻게 설계해야 가장 안정적인지, 긴 Context를 어떻게 구성할지, 새 버전에 어떤 능력이 추가됐는지, 어디서 가장 자주 넘어지는지 — 보통 서드파티보다 자사가 먼저 안다.
  그래서 Claude Code나 Codex처럼 모델과 Harness를 함께 오래 다듬어 온 제품은, 자사 조합이 가장 강한 정답이 되는 경우가 많다.
  하지만 DeepSeek, GLM 같은 오픈 모델에 이르면 이야기가 재미있어지기 시작한다. 좋은 모델을 학습시키는 것과 좋은 Harness를 만드는 것은 사실 완전히 다른 두 가지 공학이기 때문이다.
  Coding Agent가 실제로 돌아가기 시작하면, 모델 밖의 문제가 산더미처럼 나온다: 파일을 어떻게 읽을지, 코드를 어떻게 고칠지, Agent Loop를 어떻게 제어할지, Context를 어떻게 압축할지, Cache를 어떻게 활용할지, Tool Call이 실패했을 때 어떻게 복구할지, Subagent를 어떻게 스케줄링할지, 권한을 어떻게 관리할지.
  이 부분들이 잘 되어 있느냐에 따라 같은 모델의 최종 사용감이 직접 달라진다.
  또 하나 문제가 있다: 모델 업데이트 속도가 너무 빠르다.
  오늘은 GLM이 강하고, 다음 달에는 DeepSeek가 더 강한 Flash를 또 내놓을지 모르고, 조만간 또 새 모델이 따라잡는다. Coding 워크플로 전체가 어느 한 자사 제품에 묶여 있으면, 모델을 바꿀 때 도구와 습관까지 같이 바꿔야 하는 경우가 많다.
  서드파티 Harness의 가치가 바로 여기에 있다.
  익숙한 도구, Skills, MCP, 권한, 워크플로를 고정해 두고 아래의 모델만 교체하면 된다. 오늘은 DeepSeek, 내일은 GLM, 모레는 또 다른 걸로 — 작업 환경을 다시 갈아엎을 필요가 없다.
  그래서 내가 더 관심을 두는 건: 이 모델이 어떤 Harness에 놓일 때 가장 잘 일을 해내느냐다.
  자사에는 자사의 모델 적합성 강점이 있고, 서드파티도 도구, Context, Cache, Agent Loop, 확장성에서 더 강해질 수 있다.
  오픈 모델 시대에 접어들어, 이제 모델과 Harness는 완전히 따로 선택할 수 있게 됐다.
