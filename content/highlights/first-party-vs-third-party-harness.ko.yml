title: "이제 모델과 Harness는 완전히 따로 골라도 된다"
description: "자사는 자기 모델을 가장 잘 안다. 하지만 오픈 모델 시대에는 워크플로를 서드파티 Harness에 고정하고 모델만 갈아끼울 수 있다."
