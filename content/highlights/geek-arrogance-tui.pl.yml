content: |
  Szczerze mówiąc, niektóre geekowskie społeczności to już nie tylko nisza – to czysty solipsyzm.

  Ich popisowy numer: traktować niewygodę jako wyrafinowanie, a bariery wejścia jako gust.

  Jeśli coś jest łatwe, intuicyjne i szybkie do ogarnięcia dla zwykłych ludzi, instynktownie czują, że to nie jest wystarczająco hardkorowe, że to zbyt mainstreamowe, poniżej ich poziomu.

  I odwrotnie – im bardziej koślawe interakcje, im głębiej zakopana informacja, im więcej trzeba się nauczyć prywatnego żargonu i sterty skrótów klawiszowych – tym bardziej czują, że tak właśnie wygląda prawdziwe narzędzie.

  To już nie jest kwestia efektywności. To używanie bólu do potwierdzania własnej tożsamości.

  „Potrafię znieść interakcje, których inni nie zniosą” – gdy tylko to pada, poczucie wyższości pisze się samo.

  Im mniejszy krąg, tym łatwiej ten samozachwyt napędza się sam.

  W końcu przeradza się w to: kto śmie powiedzieć, że to bezużyteczne, po prostu nie rozumie – jest obcy.

  Naprawdę zdolni ludzie upraszczają to, co złożone. A niektórzy geecy komplikują to, co proste, po czym stają na czubku tej złożoności i patrzą z góry na wszystkich innych.
