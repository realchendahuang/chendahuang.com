title: "Geek-Solipsismus: Leiden als Statussymbol"
description: "Schwierigkeit als Klasse, Hürden als Geschmack — was einfach, intuitiv und für Normalsterbliche schnell zu lernen ist, kann ja nicht hart genug sein."
