content: |
  Ehrlich gesagt sind manche Geek-Kreise längst nicht mehr nur eine Nische – sie sind regelrecht solipsistisch.

  Ihre typische Masche: Unbequemlichkeit als Raffinesse, Einstiegshürden als Geschmack.

  Wenn etwas einfach, intuitiv und für normale Leute schnell zu erfassen ist, finden sie instinktiv: nicht hardcore genug, zu mainstream, unter ihrer Würde.

  Umgekehrt gilt: Je umständlicher die Bedienung, je tiefer die Informationen vergraben sind und je mehr man erst eine eigene Fachsprache und Dutzende Shortcuts lernen muss, desto sicherer sind sie, dass das ein richtiges Werkzeug ist.

  Das hat nichts mehr mit Effizienz zu tun. Hier dient der Schmerz dazu, die eigene Identität zu bestätigen.

  „Ich halte Interaktionen aus, die andere nicht aushalten“ – kaum ausgesprochen, stellt sich das Überlegenheitsgefühl ein.

  Je kleiner der Kreis, desto leichter verstärkt diese Selbstbeweihräucherung sich gegenseitig.

  Bis es so weit kommt: Wer es unbenutzbar findet, hat bloß nichts verstanden – ist ein Außenseiter.

  Wirklich starke Leute machen Komplexes einfach. Manche Geeks dagegen machen Einfaches komplex – und stehen dann auf dieser Komplexität, um auf alle anderen herabzusehen.
