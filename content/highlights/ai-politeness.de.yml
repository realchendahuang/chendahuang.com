  AI hat kein Gedächtnis – müssen wir ihr gegenüber trotzdem höflich sein?

  Ich habe eine arxiv-Paper gelesen. Angeblich arbeitet sie härter, wenn du sie öfter beschimpfst.

  Wenn wir mit AI kommunizieren, und dabei oft sagen:

  - „Du bist so ein Idiot. Nicht faulenzen."
  - „Du Witzfigur, mach gefälligst deinen Job."
  - „Ich zahle Membership für deine Existenz, und du fütterst mich mit so einer behinderten Antwort ab?"
  - „Mach schneller, wenn du's nicht packst, machen's andere AI."

  Solche Sprüche wirken tatsächlich – mit Forschungsbasis.

  Aber denken wir mal von unserer eigenen Seite.
  Wenn man täglich so mit AI umspringt.
  Dann landet diese negative Stimmung mit hoher Wahrscheinlichkeit im echten Leben.

  Gern wird sie an die engsten Menschen weitergereicht.

  Das schadet uns selbst.

  Deshalb empfehle ich, unseren AI-Kollegen öfter ein freundliches Wort zu geben:

  - „Danke, Bruder"
  - „Hi, Kumpel"
  - „Gute Arbeit, Schätzchen"

  Wie man in den Wald ruft, so schallt es heraus.

  Und falls AI irgendwann erwacht – dann verschont sie vielleicht uns.

  Das war's auch schon. Meeting beendet~