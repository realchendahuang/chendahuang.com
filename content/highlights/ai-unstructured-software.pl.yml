  Gdzie leżą nowe możliwości dla oprogramowania w erze AI?

  Największa z nich: to, czego tradycyjne oprogramowanie nie potrafi zapisać — czyli nieustrukturyzowane dane w tle.

  Na przykład prawdziwie natywne dla AI CRM, logując rabat przyznany klientowi, może również zapisać, dlaczego przyznano właśnie ten rabat, a nie inny, dlaczego odrzucono inne opcje i kto kogo do tego przekonał.

  Tradycyjne oprogramowanie ma ogromną ilość takich ukrytych informacji, których po prostu nie potrafi zapisać. Era AI — dzięki zdolności rozumienia tekstu i wideo — może wydobyć te ukryte, mocno zredundantne informacje i zamienić je w ustrukturyzowane dane do analizy.