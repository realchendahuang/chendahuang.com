content: |
  पूर्वी-पश्चिमी पौराणिक संग्रह का नाम तय हो गया — God-Museum · देवताओं का संग्रहालय:

  *शानहाई जिंग*, *जर्नी टू द वेस्ट*, प्राचीन यूनानी, नॉर्स और प्राचीन मिस्री देवताओं के पंथ — ये कहानियाँ जो कभी आपस में नहीं मिलीं — सबको एक ब्रह्मांड में ठूँस दो, और टकराने भी मत दो।

  बिजली का एक ही नियम यूनान में ज़्यूस कहलाता है और पूर्व में लेइज़ेनज़ी;

  वही महाप्रलय पूर्व में न्वा के आसमान ठीक करने के रूप में याद किया जाता है, और इब्रानियों द्वारा नूह की नाव के रूप में।

  अगर उस धागे को गंभीरता से पीछे खींचते जाओ, तो पूरी पौराणिक दुनिया को दोबारा व्यवस्थित करना पड़ेगा।

