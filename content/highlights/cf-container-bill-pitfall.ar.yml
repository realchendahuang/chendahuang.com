  ظهر الضحية الجديد لـ Cloudflare Container.

  لأن الكود المكتوب كان في طور التصحيح، لم يكُن أمر الإيقاف (stop) فعّالاً.

  فاستمرت حاوية (Container) واحدة في العمل 7 أيام متصلة، وخُصمت مني 4 دولارات.