content: |
  人負責判斷。AI 負責放大。

  人的注意力是有限的。人只負責最關鍵的那一部分判斷。

  一定要把有限的注意力分配在有價值的地方，讓 AI 去做更多雜事。

  這就是 AI 工作流存在的意義。

  讓 AI 工作流把雜事全部包下來，人負責最終的判斷——最有價值、最核心、最接近最終目標的那種審核，或是結果的驗收。

  這是我很想達成的一種狀態。我最近也在研究這些工作流。
