content: |
  Das angeblich so „tolle 5-Dollar"-OpenCode-Go, das auf X hochgejubelt wurde, ist völlig in sich zusammengefallen.
  
  OpenCode Go hatte früher ein 5-Dollar-Angebot für den ersten Monat, das das Preis-Leistungs-Verhältnis am Leben hielt — jetzt ist auch das weg, 10 Dollar von Anfang an.
  
  Im Vergleich dazu fangen die Command-GOAT-Tarife des Konkurrenten an, immer besser auszusehen.
  
  DeepSeek V4 Flash, GLM-5.3 Flash, GLM-5.3 — das sind derzeit die Modelle, die für intensives Coding und den Betrieb von Agents wirklich geeignet sind.
  
  Eigentlich teile ich Coding-Modelle inzwischen einfach in zwei Klassen ein: Hauptmodelle und Arbeitstiere.
  
  V4 Pro, GLM-5.3 und Co. sind die Hauptmodelle — die knabbern die harten Brocken an. Komplexe Architekturen, verzwickte Bugs, große Refactorings, kritische Entscheidungen: Wenn es wirklich schwer wird, gibt man es ihnen.
  
  V4 Flash und GLM-5.3 Flash gehören zu den Arbeitstieren. Repositories lesen, Code durchsuchen, Dateien ändern, Tests laufen lassen, Batch-Verarbeitung, Neuland betreten — solche schmutzige Knochenarbeit sollen die Flashes bis zum Umfallen erledigen.
  
  Beim Command-GOAT-Tarif ist das Kontingent für Arbeitstiere groß genug, und auch bei den Hauptmodellen gibt es keine offensichtlichen Schwächen.
  
  Deshalb erkläre ich hiermit: Der Command-GOAT-Tarif ist die Antwort der aktuellen Version.
