  DeepSeek Harness + third-party API compatibility issue:

  When the Agent calls tools like Bash, it reports `ToolNotFoundError: unknown tool ""`, which looks like the tool wasn't registered.

  Actually, the data format returned by the gateway differs from DeepSeek's official one, and the tool name got lost in the middle.

  A few related GitHub Discussions links:

  - Search "unknown tool" in deepseek-ai/dsh#issues
  - People using self-hosted gateways (OpenRouter / OneAPI / new-api) are most likely to hit this pitfall

  Troubleshooting approach: capture a complete tool_call request and response, and compare whether the tool name in the gateway logs is an empty string.
