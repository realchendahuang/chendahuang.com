content: |
  DeepSeek Harness + third-party API compatibility issue:

  When the agent calls tools like Bash, it errors with `ToolNotFoundError: unknown tool ""`, which looks like the tool was never registered.

  What actually happens: the gateway returns a different data format from DeepSeek's official API, and the tool name gets dropped somewhere in between.

  A few relevant GitHub Discussions links:

  - Search "unknown tool" in deepseek-ai/dsh#issues
  - People running self-hosted gateways (OpenRouter / OneAPI / new-api) are the most likely to hit this

  Debugging approach: capture a full tool_call request and response, and check whether the tool name in the gateway logs is an empty string.