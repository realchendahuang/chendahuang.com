  Делюсь сайтом-сокровищницей: Buzzing

  Он для тех, кто хочет расширить источники информации и вырваться из информационного пузыря.

  Он постоянно подтягивает горячий контент из Hacker News, Reddit, BBC, Reuters, Bloomberg, Product Hunt и других зарубежных источников и переводит заголовки на китайский.

  Его главная ценность: ты можешь сначала пробежаться по заголовкам на китайском.

  Если что-то привлекло внимание и выглядит достойным прочтения — заходи, читай подробности.

  А уже тогда можно подключить Immersive Translate для двуязычного чтения.