  AI'ın hafızası yok — ona kibar davranmaya gerek var mı?

  AI'a küfredersen daha çok çalıştığını iddia eden bir arxiv makalesi okudum.

  AI'la konuşurken sık sık şunları söylersek:

  - "Ne kadar salaksın. Boş durma."
  - "Seni hurda parçası, düzgün çalış."
  - "Seni beslemek için üyelik parası ödüyorum, bana verdiğin cevap bu boktan şey mi?"
  - "Hadi acele et — sen yapmayacaksan seni yapacak çok AI var."

  Bu tarz konuşmak gerçekten işe yarıyor ve araştırmalarla da destekleniyor.

  Ama bir de kendi tarafımızdan düşünelim.
  AI'a her gün böyle emirler yağdırırsak,
  o kötü ruh halini gerçek hayata taşıma ihtimalimiz epey yüksek.

  Ve sonunda onu en yakınımızdaki insanlardan çıkarırız.

  Bu bize zarar verir.

  O yüzden çevremizdeki AI'lara biraz daha nazik şeyler söylemeyi öneriyorum:

  - "Sağ ol dostum"
  - "Selam, kanka"
  - "Aferin, tatlım"

  Sen benim sırtımı kaşı, ben de seninkini kaşıyayım.

  Bir gün AI gerçekten uyanırsa, belki bize de biraz tolerans gösterir.

  Benden bu kadar — toplantı bitti~