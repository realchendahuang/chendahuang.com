content: |
  사람이 판단하고, AI가 증폭한다.

  사람의 주의력은 한정되어 있다. 사람은 가장 핵심적인 판단의 일부만 맡는다.

  한정된 주의력은 반드시 가치 있는 곳에 써야 하고, 잡일은 AI가 더 많이 떠맡게 해야 한다.

  이게 바로 AI 워크플로가 존재하는 이유다.

  AI 워크플로가 잡일을 전부 흡수하게 하고, 사람이 최종 판단 — 가장 가치 있고 가장 핵심적이며 최종 목표에 해당하는 결과물의 검토 또는 승인 — 을 맡는다.

  이게 내가 도달하고 싶은 상태다. 나도 최근에 이런 워크플로를 심심풀이로 조사하고 있다.
