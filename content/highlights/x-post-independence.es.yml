  Comparto un pequeño truco para publicar en X:

  cada post tiene que tener independencia.

  Porque no eres el centro del mundo: nadie va a entrar en tu perfil a propósito para enterarse del contexto completo.

  Un desconocido que te encuentra por primera vez debería llevarse al instante una opinión, o un know-how.

  Un post así es el que tiene valor.