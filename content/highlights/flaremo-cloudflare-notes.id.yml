  Aplikasi catatan yang dibangun native di atas stack teknologi Cloudflare — FlareMo.

  Daftar akun Cloudflare gratis, dan setelah di-deploy kamu mendapat 10G penyimpanan file dan 5G penyimpanan data.

  Gratis selamanya — tanpa biaya infrastruktur, tanpa biaya trafik, data dicadangkan di banyak region, ketersediaan tinggi (high availability) sudah tertanam sejak lahir.

  Melayani di cloud 24/7, sepenuhnya kompatibel dengan ekosistem Memos.

  Perkembangan pembuatan saat itu: fungsi inti selesai dalam sehari, dan sudah sepenuhnya bisa dipakai.

  Ke depannya: lebih banyak tutorial penggunaan dan deployment, test case engineering, teknik AI agent, serta dukungan multi-platform. Build in public.