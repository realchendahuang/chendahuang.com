content: |
  دیروز مقایسهی Command GOAT و OpenCode Go را منتشر کردم و CEO شرکت Command Code شخصاً آمد کامنت گذاشت.
  
  گفت یک قلم هزینه را از قلم انداختهام — قبض کشینگ. تحقیق کردم و دیدم Command Code واقعاً چیزی برای گفتن دارد.
  
  یک Coding Agent در اصل یک ماشین بزرگ Prefix Cache است. یک Session با چند صد هزار Token — وقتی به دور بعدی میرسد، واقعاً فقط چند هزار توکن جدید اضافه میشود. System Prompt، ابزارها، کانتکست کد و تاریخچهی گفتوگو تقریباً هیچ تغییری نمیکنند. هر چه نرخ Cache hit بالاتر باشد، آن کانتکستهای قدیمی ارزانتر میشوند.
  
  Command Code اخیراً یک دور جدی کارِ Cache Thrashing انجام داده، عمدتاً با این استراتژیها:
  
  Sessionها را به همان GPU Pod پین کن تا KV cache گرم بماند؛ prefix پایدار را تا حد ممکن دستنخورده نگه دار و نگذار fallback ارائهدهندهها کانتکست را به هم بریزد؛ به علاوه آن Tool Call Repair که در آن، هارنس (harness) پارامترهای اشتباه مدل را به صورت محلی اصلاح میکند، به جای اینکه خطا را به مدل برگرداند تا دوباره تلاش کند.
  
  در فهرست تغییرات v0.33.0 واقعاً نوشته شده: Major Cache Overhaul، کاهش هزینهی میانه ۲.۹ برابر. حالا رسماً ادعا میکنند نرخ Cache hit پایدار ۹۵ تا ۹۹ درصد است.
  
  همان مدل، همان پلن ۱۰ دلاری — اما به خاطر کشینگ، این تفاوت آنقدر انباشته میشود که به نتیجهای کاملاً متفاوت میرسد.
  