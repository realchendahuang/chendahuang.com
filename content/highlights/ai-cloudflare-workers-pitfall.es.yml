content: |
  Mucha gente usa IA para escribir proyectos de Cloudflare, y los fallos no son por la sintaxis.
  El problema real es:
  la IA escribe los Workers como si fueran Node.js
  usa los Bindings como process.env
  se olvida del await
  usa variables globales a lo loco para guardar el estado de la petición
  no sabe que las peticiones de recursos estáticos son gratis
  y desde el Worker llama a su propio R2 por REST API
  Todos estos errores los he recopilado en el Cloudflare Playbook.
  Y de paso también escribí un manual con ellos.