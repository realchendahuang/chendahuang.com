  Trời ơi! Tôi vừa mới biết trình duyệt Firefox cho mỗi người dùng 50G dung lượng VPN miễn phí mỗi tháng.

  Cực kỳ hữu ích cho cái tình huống oái oăm gà có trước hay trứng có trước.

  Cách dùng:

  1. Gõ `about:config` vào thanh địa chỉ
  2. Vào tùy chọn nâng cao và bấm "Show all"
  3. Tìm `browser.ipProtection.enabled`
  4. Chuyển giá trị của mục đó thành true
