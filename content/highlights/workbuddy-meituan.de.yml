  Kurz Tencent Workbuddy ausprobiert – ein klassisches Szenario: Meituan-Gutscheine abholen.

  Beim Login hat es einen QR-Code erzeugt und mich per Scan anmelden lassen.

  Dann habe ich gebrüllt: Hol mir die Gutscheine – und es hat mir so viele geholt.

  Einen AI Agent für Szenarien wie Gutscheine-Abholen einzusetzen ist ganz amazing.