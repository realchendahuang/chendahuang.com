  Eu fiz um macOS Playbook.

  Feito pra quem acabou de comprar Mac, acabou de migrar do Windows, ou sempre achou que o Mac não estava bem explorado.

  Dentro tem:

  - qual software instalar primeiro depois de comprar o Mac
  - como o usuário de Windows se adapta ao macOS
  - como escolher entre Rectangle / AltTab / Homebrew e essas ferramentas
  - como usar a colaboração entre aparelhos
  - como configurar terminal, Git, SSH e o ambiente de AI Coding
  - como lidar com manutenção do sistema, solução de problemas, backup de segurança e migração de máquina

