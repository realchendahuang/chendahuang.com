content: |
  À propos du réseau : si tu as acheté un fournisseur, et monté aussi tes propres nœuds VPS, tu veux les gérer de façon unifiée, les router de façon unifiée, et sortir un seul lien d'abonnement.
  Tu veux garder les règles de routage, le filtrage des nœuds et la logique de combinaison côté serveur, plutôt que reconfigurer chaque client.
  Tu veux une exécution à la Cloudflare, légère à déployer, sans tenir un serveur, un service de base de données ni des tâches d'arrière-plan compliquées.