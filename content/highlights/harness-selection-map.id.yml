content: |
  Ini setup saya saat ini.
  
  Untuk model buatan China, saya rekomendasikan memasang ZCode (DeepSeek V4 Flash, GLM 5.3 Flash, sejenisnya).
  
  Untuk GPT, langsung pakai Codex.
  
  Mau cepat? Pakai Pi.
  
  Mau cepat DAN tenang? Pakai OMP.
  
  Membangun aplikasi klien khusus untuk enterprise? Pakai DSH.
  
  Mau melatih kesabaranmu? Pakai Workbuddy.
