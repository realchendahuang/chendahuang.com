  Ocenia człowiek. Wzmacnia AI.

  Ludzka uwaga jest ograniczona. Człowiek obsługuje tylko najbardziej krytyczny wycinek ocen.

  Musisz wydawać swoją ograniczoną uwagę tam, gdzie coś jest warta, i pozwolić, by AI wzięło na siebie więcej brudnej roboty.

  W tym właśnie cały sens workflow AI.

  Niech workflow AI połknie całą brudną robotę; człowiek zajmuje się ostateczną oceną – przeglądem i akceptacją najbardziej wartościowych, najbardziej kluczowych rezultatów końcowych.

  To stan, do którego chcę dojść. Ostatnio też przy okazji badam te workflow.