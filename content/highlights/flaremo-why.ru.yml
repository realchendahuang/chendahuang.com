content: |
  Искал инструмент, который позволяет «записывать на бегу и потихоньку выращивать из этого знания».

  Хочу лёгкость захвата мыслей из коробки и полное отсутствие трения, как у Flomo;

  хочу зрелую открытую экосистему Memos — переносимые данные и API, с которым реально можно играть;

  но не хочу поднимать ещё один VPS и нянчиться с Docker, Postgres и вечно работающим Node-процессом.

  Что делать? Подход FlareMo: взять модель данных и API Memos как «спецификацию» и пересобрать весь рантайм на Cloudflare:

  Workers выполняют API, D1 хранит заметки, R2 держит вложения, Queues/Cron занимаются фоновыми задачами, а Vectorize + Workers AI припасены на будущее для семантического поиска и ИИ-воркфлоу.

  Встать на плечи Memos и построить личную базу знаний, живущую в пограничном облаке.