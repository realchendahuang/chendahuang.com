url: https://x.com/realchendahuang/status/2068853978004365739
content: |
  خیلیها پروژههای Cloudflare را با هوش مصنوعی مینویسند، و وقتی پروژه میترکد، مشکل سینتکس نیست.
  مشکلات واقعی:
  اینکه هوش مصنوعی Workers را مثل Node.js مینویسد
  و Bindingها را مثل process.env در نظر میگیرد
  و await را فراموش میکند
  و حالت درخواست را در متغیرهای سراسری (globals) نگه میدارد
  و نمیداند که درخواستهای استاتیک رایگاناند
  و از داخل یک Worker از طریق REST API به R2 خودش درخواست میزند
  همهی این تلهها را در Cloudflare Playbook جمع کردهام.
  و راستی، روی چیزهای دیگری هم کار کردهام