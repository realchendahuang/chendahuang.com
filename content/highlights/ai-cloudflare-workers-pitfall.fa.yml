title: "وقتی هوش مصنوعی پروژههای Cloudflare را مینویسد، پروژه خراب میشود — و ربطی به سینتکس ندارد"
description: "هوش مصنوعی مدام Workers را مثل Node.js مینویسد و Bindingها را مثل متغیر محیطی در نظر میگیرد."
date: 2026-06-22
likes: 23
