  macOS Playbook을 만들었다.

  방금 Mac을 산 사람, Windows에서 막 넘어온 사람, 혹은 늘 Mac이 좀체 손에 안 익는다고 느낀 사람을 위한 것이다.

  정리한 내용:

  - Mac을 산 뒤 제일 먼저 깔아야 할 소프트웨어
  - Windows 사용자가 macOS에 적응하는 법
  - Rectangle / AltTab / Homebrew 같은 도구는 어떻게 고를까
  - 기기 간 협업 활용법
  - 터미널, Git, SSH, AI 코딩 환경 설정법
  - 시스템 유지보수, 트러블슈팅, 안전한 백업, 기기 교체 이전 처리법

