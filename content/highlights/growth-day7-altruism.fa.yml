content: |
  روز هفتمِ فعالیت از 2000 فالوور رد شدم — یک مرور سریع.

  کلیدش یک کلمه است: دیگرخواهی.

  بیشتر دو نوع محتوای کاربردی منتشر کردم:

  - فهرست نرم‌افزارهای استفاده‌ی سنگینِ macOS (48 هزار بازدید)
  - جدولِ سقفِ رایگانِ Cloudflare + Playbook (روی X آمار خوبی گرفت؛ یک نفر حتی کپی و بازنویسیش کرد گذاشت روی Zhihu و چند صد تا بوکمارک گرفت)
  - و معرفیِ منابعِ OPC، شرکتِ یک‌نفره (38 هزار بازدید)

  به این فکر نمی‌کردم چطور فالوور جمع کنم — فقط چیزهایی را که فهمیده بودم مرتب کردم و رایگان بیرون دادم. نتیجه این شد که رشد سریع‌تر هم آمد.

  از این به بعد هم همین جور محتوای کاربردی منتشر می‌کنم. از حمایت همه ممنونم.
