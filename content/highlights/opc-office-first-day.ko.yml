content: |
  오늘이 OPC 사무실에 정식 입주하는 첫날이다. 내가 OPC를 시작한 과정을 차근차근 설명하겠다.

  내 처음 동기는 단순했다: 돈을 받고 제품을 출시할 수 있는 합법적인 주체가 필요했다. 그래서 온라인에서 회사 등록 정보를 찾아다녔다.

  도시는 크게 가리지 않았다: 난징, 쑤저우, 항저우, 닝보 — 연해 발전 도시라면 뭐든 후보였다.

  우연히도, 어느 날 난징에 출장을 왔다가 심심풀이로 난징 관련 위챗 공식 계정을 둘러보는데, OPC 커뮤니티 담당자의 전화번호를 발견했다. 그래서 바로 추가했다.

  내 프로젝트를 간단히 소개하자, 담당자가 OK라고 하며 그날 오후 현장 방문을 주선해 줬다.

  그들이 건 조건은: 주 3일 현장 근무. 받아들일 수 있다면 여기서 회사 등록을 허가해 주겠다는 것이었다.

  난징 국유자산 산하 프로젝트라 정책 조건이 매우 좋다 — 수도, 전기, 인터넷, 관리비가 전부 무료로, 이론상 3년이다. 게다가 전담 대리 회계사가 회사 등록, 도장 각인, 사업자등록증 수령, 은행 계좌 개설까지 처리해 줬다. 감동이 어이가 없을 정도다.

  2~3주간의 등록 절차를 거쳐 마침내 모든 서류를 받았다.

  단지 매니저가 여기서 업무 자리를 고르라고 했다. 내 기준은 낮다 — 자리, 의자, 전원만 있으면 된다.

  그다음에 프로젝트 신청서 세 장을 작성하게 했다. 주로 프로젝트의 강점, 팀 구성, AI 관련 특기를 적는 내용이다. 신청 내용이 탄탄하고 신뢰할 만하면 5만~10만 위안의 정책 보조금을 받을 기회가 있다.

  난징이 정말 잘 해놨다. 여러분도 자기 도시에 비슷한 정책이 있는지, 혹은 자기 성의 성도에 더 좋은 정책이 있는지 확인해 보길 바란다.

  좋은 정책은 사람을 기다려 주지 않는다 — 직접 나서서 물어봐야 한다. 내가 오늘 도착했을 때도 이 단지에는 이미 회사가 잔뜩 입주해 있었다. 나는 오히려 늦은 편이다.

  오늘은 여기까지다. 앞으로 창업 과정과 그 과정의 복기를 계속 공유하겠다.

  모두 관심 가져줘서 고맙다.
