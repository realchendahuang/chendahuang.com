  سألني أخ:

  هل توجد وثائق تحليلية جيدة عن Claude Code يمكن التعلم منها؟

  وجوابي: في عصر الذكاء الاصطناعي، اجعل الذكاء الاصطناعي في كل فكرة، ودعه يعاونك في التعلم.

  وإن أردت فعلياً تعلم مبادئ الوكيل.

  فقِد مشروع Pi Agent.

  عصفور صغير تشمل أمعاؤه كل شيء؛ إنه مثالٍ للتعلم، وجودة كوده عالية أيضاً.

  Claude Code ليس مفتوح المصدر؛ إنه تسريب شيفرة المصدر.

  أما Pi Agent فهو بحق مفتوح المصدر.