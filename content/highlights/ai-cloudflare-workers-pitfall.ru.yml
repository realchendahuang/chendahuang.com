content: |
  Многие пишут Cloudflare-проекты с помощью ИИ, и когда всё взрывается, дело не в синтаксисе.
  Настоящие проблемы:
  ИИ пишет Workers, будто это Node.js
  использует Bindings как process.env
  забывает про await
  хранит состояние запроса в глобальных переменных
  не знает, что запросы к статическим ассетам бесплатны
  и вызывает собственное R2 изнутри Worker через REST API
  Все эти грабли я собрал в Cloudflare Playbook.
