content: |
  Nazwa dla kompendium mitologii Wschodu i Zachodu jest ustalona – God-Museum · Muzeum Bogów:

  Wcisnąć *Księgę gór i mórz*, *Podróż na Zachód* oraz panteony starożytnej Grecji, Skandynawii i starożytnego Egiptu – te zbiory historii, które nigdy się nie stykały – do jednego uniwersum i sprawić, żeby się nie zderzały.

  To samo prawo pioruna w Grecji nazywa się Zeusem, a na Wschodzie Leizhenzi;

  tę samą wielką powódź na Wschodzie pamięta się jako Nüwę łatającą niebo, a Hebrajczycy jako arkę Noego.

  Jeśli poważnie pociągniesz ten wątek, cały mitologiczny świat trzeba będzie przestawić od nowa.

  Wypróbuj w sieci: https://chendahuang.com/god-museum/