content: |
  Я всё сильнее убеждаюсь: ценность эмоций по-настоящему ценна.

  Почему мы, Homo sapiens, способны объединяться ради великих дел?

  Именно потому, что мы все сообща верим в какую-то историю, какую-то эмоцию, какой-то тотем, какой-то миф, какой-то нарратив — это и формирует организации, двигает сотрудничество, делает нас сильнее и позволяет великому случаться.

  Разве это само по себе не эмоциональная ценность?