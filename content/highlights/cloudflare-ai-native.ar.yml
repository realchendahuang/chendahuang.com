  أُعلن:

  Cloudflare هي شركة AI Native حقيقية.

  إنها تعيد بالفعل بناء تجربة المطوّرين حول وكيل الذكاء الاصطناعي (Agent).

  الحسابات المؤقتة (Temporary Accounts) التي أُطلقت للتو تتيح لوكيل الذكاء الاصطناعي أن يكتب الكود ثم ينشره مباشرة، ويحصل على رابط مؤقت، ويختبر بنفسه، ويطوّر بنفسه.

  سلاسة من الطراز الأول.

  ومع Skills الرسمية من Cloudflare، التثبيت بأمر واحد:

  `npx skills add cloudflare/skills`

  أتدري ما معنى AI Native؟

  هذا هو GOAT (أعظم) شركات الذكاء الاصطناعي الأصيلة.