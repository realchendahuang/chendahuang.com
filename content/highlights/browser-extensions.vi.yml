content: |
  Chia sẻ những tiện ích trình duyệt tôi giữ bên mình suốt nhiều năm.

  - **Wetab**: tiện ích tab mới. Nhét những thứ hay dùng vào đó, tùy chỉnh công cụ tìm kiếm, đăng nhập là đồng bộ miễn phí trên nhiều thiết bị. Tôi đã dựng trong đó một công cụ tìm kiếm X dựa trên Google — dùng sướng hơn hẳn cái mặc định.
  - **Video Speed Controller**: tinh chỉnh tốc độ video, cực hợp để tiếp thu kiến thức một cách hiệu quả.
  - **XHunt**: thứ không thể thiếu khi chơi X. Xem được bảng xếp hạng của từng KOL và những bài đăng hot nhất hiện tại.
  - **X Mutual-Follow Radar**: đánh dấu quan hệ follow hai chiều và một chiều ngay trên trang, đồng thời có thể hiện tỷ lệ following / followers.
  - **FireShot**: chụp ảnh màn hình trang web, chỉnh sửa và lưu thành PDF, JPEG, GIF, PNG hoặc BMP.
  - **Proton Pass**: trình quản lý mật khẩu thiết kế thanh lịch, đồng bộ đa thiết bị.
  - **Immersive Translate**: tiện ích dịch song ngữ lâu đời, đã được cắm vào API DeepSeek V4 Flash.
  - **Codex**: thứ bắt buộc để kết nối Codex với Chrome. Có nó là tự động hóa được mọi thứ trong trình duyệt — như viết email khiếu nại khi tài khoản bị khóa.
