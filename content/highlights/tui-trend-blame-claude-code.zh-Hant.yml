content: |
  現在一堆 AI Coding Agent 動不動就上 TUI，這股風氣，Claude Code 得負很大責任。
  它把在終端裡跟 AI 對話寫代碼這件事做得很極致。
  但問題在於，好像真正高級的 Coding Agent，就得默認是終端介面，Web 端反而是附屬，甚至被嘲成不夠程式設計師。
  結果呢？
  先搞一個複雜的 TUI
  各種顏色、狀態列、快捷鍵、模式切換
  然後美其名曰「沉浸式」「高效」「尊重程式設計師」
  真的嗎？
  對一小部分每天泡在終端的人來說，確實爽。但對更多人來說，這就是在人為製造門檻。功能藏在按鍵和模式裡，新用戶一臉懵，老用戶也得重新適應各種工具自己的鍵位習慣。
  Web UI 完全可以做得又快又乾淨，裝成 PWA 之後跟桌面客戶端幾乎沒區別，更新還更方便。非要強行把互動塞回 80 年代的終端範式，然後還反過來鄙視 Web，多少有點自我感動。
  Claude Code 本身很強，這點沒問題。但它把TUI 才是正統這個審美和路徑依賴帶起來了，後面一堆跟風的就更離譜。
  工具是給人用的，不是用來證明誰更「極客」的。
  把反人類的互動包裝成高級，真是很滑稽的一件事情。
