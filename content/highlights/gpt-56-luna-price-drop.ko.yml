  정말 감탄스럽다, OpenAI가 완전 미쳤다. GPT-5.6-Luna가 80% 인하됐다: 입력 0.2달러, 출력 1.2달러, 캐시 히트 0.02달러.
  DeepSeek V4 Pro와 비교하면, 코딩의 전형적인 사용량 기준 — 1억 토큰 중 95%가 캐시 히트 — DeepSeek는 대략 20위안, Luna는 약 26위안이다.
  그리고 Codex 요금제를 쓰고 있다면, Luna를 돌리면 기존 사용량의 다섯 배를 쓸 수 있다 — 무려 다섯 배 사용량 증가! https://t.co/fBVVfyN2OC
