content: |
  Today a friend shared some points in my comment section about equity and liability issues with one-person companies.

  First, many thanks to this friend for the kind heads-up.

  His view: you should have a family member hold at least 1% of the shares.

  The problem with a one-person limited company: when there's only one shareholder and you can't clearly separate company money from personal money, the shareholder may bear joint liability for the company's debts. Article 23 of the Company Law is exactly this logic.

  If the company has multiple shareholders, it shifts from a "one-person company" to an "ordinary limited liability company," dodging the special burden-of-proof risk of a one-person company and giving yourself an extra layer of low-cost protection.

  Hope this serves as a reference for everyone.

  But day to day, we should keep business and personal accounts clearly separate and aim to explain every significant sum.

  - Where the money came from, why, and which account it went into.
  - Where the money went, why it was spent, and who approved it.
  - When you take money out of the company, is it salary, reimbursement, a loan, or dividends?

  Get these three things straight and the risk drops dramatically.