content: |
  Today a friend shared in my comment section about equity and liability issues related to one-person companies.

  First, many thanks to this friend for the kind reminder.

  Their view is that you must let a family member hold at least 1% of the shares.

  The problem with a one-person limited company is: when there's only one shareholder, if you can't clearly separate company money from personal money, the shareholder may bear joint liability for the company's debts. Article 23 of the Company Law is this logic.

  If the company has multiple shareholders, it changes from a "one-person company" to an "ordinary limited liability company," thereby avoiding the special burden-of-proof risk of a one-person company and giving yourself an extra layer of low-cost buffer.

  I hope this serves as a reference for everyone.

  But in daily life, we must keep public and private accounts separate. Strive to be able to clearly account for every important sum of money.

  - Where the money came from, why it came, and which account it entered.
  - Where the money went, why it was spent, and who approved it.
  - When you take money from the company, is it salary, reimbursement, a loan, or dividends.

  If we can clearly explain these three things, the risk can be greatly reduced.
