  보물 같은 사이트를 하나 공유한다: Buzzing

  정보 소스를 넓히고, 정보의 벽을 깨고 싶은 사람에게 잘 맞는 사이트다.

  Hacker News, Reddit, BBC, Reuters, Bloomberg, Product Hunt 등 해외 소스의 인기 콘텐츠를 계속 가져와서 제목을 중국어로 번역해 보여 준다.

  가장 큰 가치는 제목을 먼저 중국어로 훑어볼 수 있다는 것이다.

  눈에 들어오고 읽을 가치가 있어 보이는 글이 있다면 클릭해서 자세히 보면 된다.

  그때 Immersive Translate와 함께 쓰면 이중언어로 읽을 수 있다.
