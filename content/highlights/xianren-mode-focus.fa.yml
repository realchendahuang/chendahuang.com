content: |
  این اواخر تعداد دفعاتِ مرورِ X پایین آمده.

  نمی‌دانم واردِ «حالتِ حکیمانه» شده‌ام یا نه.

  بعد از یک خودکاویِ صادقانه، فهمیدم بیش از هر چیز به یک سؤال اهمیت می‌دهم:

  چیزهایی که هر روز مرورشان می‌کنم، آخرش می‌توانند به یک محصولِ واقعی تبدیل شوند؟

  دیدنِ صد تا آپدیتِ ابزار، هیچ‌وقت به‌اندازه‌ی شکافتنِ کاملِ یک سناریویِ مشخص ارزش ندارد.

  این روزها می‌خواهم انرژی بیشتری بگذارم روی محصول، کمونیتی و محتوای بلندمدت.
