content: |
  این چیدمانِ فعلی من است.

  برای مدل‌های چینی، پیشنهاد می‌کنم ZCode را سوار کنی (DeepSeek V4 Flash، GLM 5.3 Flash و این جور مدل‌ها).

  برای GPT هم مستقیم برو سراغ Codex.

  سرعت می‌خواهی؟ از Pi استفاده کن.

  هم سرعت می‌خواهی هم خیالِ راحت؟ از OMP.

  برای سازمان‌ها اپِ کلاینتِ سفارشی می‌سازی؟ DSH.

  می‌خواهی صبرت را تمرین بدهی؟ Workbuddy.
