  AI 時代新的軟體機會在哪裡？

  比較大的一個機會，是處理在傳統軟體層面無法被記錄下來的這一部分，也就是說，一些非結構化的背景資料。

  比如說，真正 AI native 的 CRM 軟體，在記錄給某個客戶的折扣時，可以順帶記錄為什麼要給這個折扣，而不是另一個折扣，以及其他方案為什麼被否決，這其中是誰說服了誰？

  傳統的軟體有太多這樣的隱藏資訊是沒有辦法記錄的，而 AI 時代可以利用對文字、對影片的理解能力，把這些隱藏的資訊、這些大量的冗餘資訊，提取出結構化的資料來進行分析。