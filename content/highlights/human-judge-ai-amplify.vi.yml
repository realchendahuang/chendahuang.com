content: |
  Con người đảm nhận phán quyết. AI đảm nhận việc khuếch đại.

  Sự chú ý của con người là có hạn. Con người chỉ xử lý phần phán quyết quan trọng nhất.

  Bạn phải dành sự chú ý có hạn của mình vào nơi đáng giá, còn để AI gánh thêm phần việc chân tay.

  Đó chính là toàn bộ ý nghĩa của các AI workflow.

  Cứ để AI workflow nuốt hết phần việc chân tay; con người lo khâu phán quyết cuối — duyệt và nghiệm thu những kết quả giá trị nhất, cốt lõi nhất, hướng tới mục tiêu cuối cùng.

  Đó là trạng thái mình muốn đạt tới. Dạo này mình cũng đang tìm hiểu mấy workflow kiểu này.
