content: |
  أشارككم إعدادات OpenCode التي أستخدمها حاليًا. إعداداتي مبنية حول ثلاثة مطالب جوهرية:
  إدارة السياق — جلسات طويلة لا تُفجّر السياق، مع توفير في المال والـ token
  نظام الذاكرة — يتذكر تفضيلات المستخدم وقرارات المشروع والدروس السابقة عبر الجلسات
  القدرات الخارجية — البحث في الوثائق، البحث في الكود، أتمتة سطح المكتب
  أهم الإضافات التي أستخدمها:
  1. opencode-dcp (مفتوح المصدر) إضافة تقليم ديناميكي للسياق.
  حين يبلغ السياق حد العتبة يضغط تلقائيًا المحتوى القديم إلى ملخصات تقنية، فيحتفظ بالمعلومات الأساسية ويطرح الضجيج، وينظف المحتوى المكرر تلقائيًا، ويستبعد من السياق المحتوى منخفض القيمة كأخطاء الأدوات
  2. opencode-goal-plugin
  إضافة وضع Goal، تضيف إدارة أهداف للمهام الطويلة
  3. Hermes Memory (سأفتح مصدره لاحقًا إن ظهر طلب)
  هذه أثقل إضافة عندي — نقلت آلية الذاكرة الطبقية لـ Hermes agent إلى OpenCode.
  4. context7-MCP
  للاطلاع على أحدث الوثائق الرسمية للمكتبات والأطر.
  5. grep-MCP
  بحث في كود GitHub، للعثور على استخدامات حقيقية في كود GitHub بكامله.
  6. open-computer-use (أتمتة سطح المكتب)
  تجعل AI يشغل تطبيقات macOS مباشرة — نقر، كتابة، تمرير، سحب وإفلات، لقطات شاشة، وقراءة شجرة الوصول accessibility tree.
