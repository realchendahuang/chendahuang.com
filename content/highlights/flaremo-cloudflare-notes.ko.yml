content: |
  Cloudflare 기술 스택 위에 네이티브로 만든 메모 앱 — FlareMo.

  무료 Cloudflare 계정을 등록하면, 배포가 끝나는 순간 파일 저장 공간 10G와 데이터 저장 공간 5G를 갖게 된다.

  영원히 무료 — 인프라에 한 푼도, 트래픽에 한 푼도 들지 않고, 데이터는 여러 지역에 백업되며, 높은 가용성이 태생부터 내장되어 있다.

  24시간 내내 클라우드에서 서빙되며, Memos 생태계와 완전히 호환된다.

  당시 개발 진척: 하루 만에 핵심 기능을 세우는 데 성공했고, 이미 완전히 쓸 수 있는 상태다.

  앞으로: 더 많은 사용·배포 튜토리얼, 엔지니어링 테스트 케이스, AI 에이전트 기술, 그리고 멀티플랫폼 지원을 추가할 예정이다. Build in public.
