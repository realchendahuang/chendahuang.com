content: |
  Os presento un concepto llamado FOMO, por sus siglas en inglés Fear of Missing Out: el miedo a perderse algo.
  Seguro que mucha gente tiene esta manía: ves algo bueno y quieres guardarlo; ves una herramienta nueva o una tendencia y quieres sumarte; siempre sientes que si no te subes al carro te pierdes algo importante. El resultado: la carpeta de guardados cada vez más llena, la cabeza cada vez más revuelta, y la atención se va consumiendo poco a poco en ese proceso.