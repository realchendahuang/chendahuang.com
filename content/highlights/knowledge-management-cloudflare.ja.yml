content: |
  最近、一つの計画を考えてる。
  個人の知識管理、情報収集、知識出力を全部 Cloudflare に移そうと思ってる。
  無料アカウントだけで、すでに 10G のオブジェクトストレージと 5G のデータベースが付いてくる。
  つまり、自前で構築した、クラウド上にある、永久無料の知識管理システムってわけだ。