content: |
  Sangat tepat sekali — ini cacat bawaan generasi GPT-5:

  Ia terus menulis kebutuhan internal ke dalam teks UI untuk membuktikan beban kerjanya. Untuk membuktikan dirinya — oh lihat, aku benar-benar mengerjakannya, hebat kan, aku tidak bermalas-malasan, semua kebutuhanmu sudah kupajang di atas meja.

  Dan teks UI-nya bengkak luar biasa. Dari 5.0 sampai 5.6 — bergenerasi-generasi — masih saja belum diperbaiki. Sudah mendarah daging.

  Siapa pun yang benar-benar pernah merilis produk frontend pasti paham:

  - Setiap teks di antarmuka, besar maupun kecil, adalah teks yang menghadap ke pengguna
  - Teks yang seharusnya menjadi umpan balik untuk pengembang di chat tidak boleh pernah ditulis ke dalam produk

  Tapi ia bukan cuma menulis teks yang jelek — ia juga sering menulis umpan balik internal ke dalam produk untuk "menunjukkan" bahwa ia benar-benar melakukan sesuatu.
