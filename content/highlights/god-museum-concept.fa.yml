  اسم دائرةالمعارف اسطوره‌های شرق و غرب مشخص شد — God-Museum · موزه‌ی خدایان:

  پانتئون‌های *کلاسیک کوه‌ها و دریاها*، *سفر به غرب*، یونان باستان، اسکاندیناوی و مصر باستان — این دسته داستان‌هایی که هرگز به هم برنخورده‌اند — را توی یک جهان جا بده، بی‌آنکه با هم بپرند.

  یک قانونِ صاعقه در یونان «زئوس» نام دارد و در شرق «لی‌ژن‌زی»؛

  همان سیلِ بزرگ را در شرق به نام «نووا آسمان را وصله کرد» به یاد دارند و عبری‌ها به نام «کشتی نوح».

  اگر جدی دنبال این نخ بروی، کل دنیای اسطوره باید از نو چیده شود.

  آنلاین امتحانش کنید: https://chendahuang.com/god-museum/
