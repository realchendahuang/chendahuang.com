content: |
  Sharing over a year of hard-won, blood-and-tears indie dev pitfalls.

  In 2026, if an indie developer wants to build an app, the best practice is:

  **Do Web + PWA first at the MVP stage.** Fast to develop, fast to debug, fast to iterate.

  Web stack:

  React + TanStack Start + Vite + TypeScript + shadcn/ui + Base UI + Tailwind CSS + better-auth + Vercel AI SDK + oxfmt / oxlint

  Unified backend:

  Hono + Cloudflare Workers

  Web debugging:

  Chrome DevTools MCP + Codex Chrome extension

  Once the product genuinely runs, then do mobile.

  Mobile stack:

  React Native + Expo + Expo Router + NativeWind + React Native Reusables + Reanimated + Gesture Handler + EAS Build / Submit / Update

  The core idea is simple:

  Validate the demand with Web + PWA first.

  Once you really have users, bring out React Native + Expo for the real app.