  Vou compartilhar um truque de reescrever texto.

  Dá pra usar o teclado Doubao com voz pra texto.

  Fica olhando o texto que você precisa reescrever.

  E vai falando, recontando do seu jeito.

  Assim o cheiro de IA fica bem menor.

  E ainda é eficiente, de graça, sem assinar nada.

  Em qualquer lugar, a qualquer hora, entrada por voz, turbinando sua produção.