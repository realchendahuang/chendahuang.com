content: |
  Aklıma oldukça ilginç bir açı geldi.

  Burçlar, doğum hayvanları, astroloji, falcılık — bunlar belki de insanlığın düşük hesaplama çağındaki "sıkıştırılmış modelleri" olarak anlaşılabilir.

  Eskilerin ne veritabanı vardı ne istatistik aracı ne de AI.

  Yapabildikleri tek şey, mevsimleri, gökyüzü olaylarını, tarım takvimlerini, kişilikleri, toplumsal gelenekleri ve toplum döngülerini uzun zaman dilimleri boyunca gözlemleyip o karmaşık deneyimi hatırlaması ve yayılması kolay bir sembol sistemine sıkıştırmaktı.

  12 burç, 12 doğum hayvanı, Sekiz Karakter, heksagramlar — hepsi temelde karmaşık bir dünyayı daha düşük boyutlara indirmenin yolları.

  Elbette katı bir bilimsel tahmin olarak ele alınamazlar.

  Ama tamamen saf batıl inanç da sayılmazlar.

  Daha çok bir deneyim damıtması gibidirler — hesap gücü kıtken, veri kıtken ve araçlar kıtken eskilerin hikayeler, semboller ve kurallarla inşa ettiği bir şey.