  एक दोस्त ने पूछा कि फोटो में पावर बैंक किस ब्रांड का है।

  ठीक है, मेरे प्रचार का समय आ गया।

  यह है CoolState Power Bank No. 25 Super SE (CoolState पहले Zimi था)।

  140 युआन से थोड़ा ज़्यादा, 25,000 mAh, 120W तक आउटपुट, अंतर्निर्मित चार्जिंग केबल के साथ।

  यह मेरे MacBook Air को पूरी दोपहर की भारी मेहनत में चलाता रहता है।

  Starbucks, McDonald's, KFC, गाँव-देहात और हर दूसरी जगह के लिए परफेक्ट ऑफिस साथी!
