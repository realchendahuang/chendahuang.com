content: |
  TUI 這東西，說難聽點，已經開始發臭了。
  它最噁心的地方不在於難用，而在於它在系統性降低人的認知頻寬。
  你以為你在跟工具高效對話，其實你在不斷做三件事：
  回憶快捷鍵和模式
  在滾動的字符流裡定位信息
  祈禱自己沒有誤觸進入某個奇怪狀態
  這已經不是互動了，這是在跟介面搏鬥。
  真正高效的介面，應該是把狀態攤開給你看，讓你用眼睛和空間感去理解，而不是逼你把所有東西都塞進短期記憶裡。TUI 反其道而行之——它把信息密度堆到極致，卻把可讀性和可恢復性踩到最低。
  更糟的是，它還在培養一種很壞的習慣：把會不會用某個工具的鍵位當成能力本身。結果就是，人花大量精力在適應介面，而不是在思考問題。
  一個好的工具應該降低思考成本，而不是把思考成本轉移到如何操作這個介面上。
  TUI 現在的流行，很大程度是在用極客濾鏡掩蓋自己互動設計上的懶惰和傲慢。
