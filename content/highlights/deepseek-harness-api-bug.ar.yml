content: |
  مشكلة توافق DeepSeek Harness مع واجهات الطرف الثالث:

  عند استدعاء الوكيل لأدوات مثل Bash يظهر `ToolNotFoundError: unknown tool ""`، وكأن الأداة غير مسجلة.

  والحقيقة أن تنسيق البيانات الذي ترجعه البوابة مختلف عن التنسيق الرسمي لـ DeepSeek، فيضيع اسم الأداة في الطريق.

  بعض روابط Discussions ذات الصلة على GitHub:

  - ابحث عن «unknown tool» في deepseek-ai/dsh#issues
  - من يبنون بواباتهم الخاصة (OpenRouter / OneAPI / new-api) هم أسرع من يقع في هذه الحفرة

  منهج الفحص: التقط طلباً واستجابة كاملين لأداة tool_call، وقارن هل اسم الأداة في سجلات البوابة سلسلةٌ فارغة.