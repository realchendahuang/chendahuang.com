content: |
  Có một bạn hỏi:

  có bài viết nào hay về Claude Code để học không?

  Mình trả lời: trong kỷ nguyên AI, gặp gì cũng nghĩ bằng AI — để AI giúp bạn học.

  Nếu thật sự muốn học cách agent vận hành,

  thì đi xem dự án Pi Agent.

  Nhỏ mà đủ — rất hợp để học, mà chất lượng code cũng cao.

  Claude Code không mã nguồn mở; đó chỉ là bản source bị rò rỉ.

  Pi Agent mới là thứ mã nguồn mở thật sự.
