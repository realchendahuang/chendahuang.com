  macOS Playbook を作った。

  Mac を買ったばかりの人、Windows から Mac に乗り換えた人、ずっと Mac を使いこなせてない人向け。

  中身は：

  - Mac を買ったら最初に何を入れるか
  - Windows ユーザーがどう macOS に慣れるか
  - Rectangle / AltTab / Homebrew などのツールの選び方
  - 複数デバイスでの連携の使い方
  - ターミナル、Git、SSH、AI Coding 環境の設定方法
  - システムメンテナンス、トラブル対応、安全バックアップ、機種変更の移行の扱い方

