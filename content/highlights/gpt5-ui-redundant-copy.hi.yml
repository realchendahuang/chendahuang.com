content: |
  बहुत सटीक कहा — यह GPT-5 पीढ़ी की जन्मजात कमी है:

  यह अपना काम साबित करने के लिए इंटरनल रिक्वायरमेंट्स को UI कॉपी में लिखता रहता है। ख़ुद को साबित करने के लिए — देखो, मैंने सच में कर दिखाया, क्या कमाल हूँ मैं, कोई ढिलाई नहीं की, तुम्हारी हर रिक्वायरमेंट मैंने टेबल पर रख दी है।

  और UI कॉपी हद से ज़्यादा फूली हुई है। 5.0 से लेकर 5.6 तक — पीढ़ी दर पीढ़ी — यह अब भी ठीक नहीं हुआ। यह तो हड्डियों में बस गया है।

  जिसने भी असल में फ्रंटएंड प्रोडक्ट्स शिप किए हैं, वह जानता है:

  - इंटरफ़ेस पर लिखा हर टेक्स्ट, छोटा-बड़ा, यूज़र-फेसिंग कॉपी है
  - डेवलपर्स को चैट फीडबैक में दिया जाने वाला टेक्स्ट कभी प्रोडक्ट में नहीं लिखा जाना चाहिए

  लेकिन यह सिर्फ़ ख़राब कॉपी नहीं लिखता — यह अक्सर इंटरनल फीडबैक को प्रोडक्ट में लिख देता है ताकि "दिखा" सके कि उसने कुछ किया है।