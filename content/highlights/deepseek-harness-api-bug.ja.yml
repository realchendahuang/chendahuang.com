content: |
  DeepSeek Harness + サードパーティ API の互換問題：

  Agent が Bash などのツールを呼ぶと `ToolNotFoundError: unknown tool ""` が出て、あたかもツールが未登録なように見える。

  実際はゲートウェイが返すデータ形式が DeepSeek 公式と違っていて、ツール名が途中で消されてしまっている。

  関連する GitHub Discussions のリンク：

  - deepseek-ai/dsh#issues で "unknown tool" を検索
  - 自前ゲートウェイ（OpenRouter / OneAPI / new-api）を使う人が一番踏みやすい罠

  調査の考え方：tool_call のリクエストとレスポンスを丸ごと一度キャプチャして、ゲートウェイのログにあるツール名が空文字列になってないかを比較する。