content: |
  문득 꽤 흥미로운 관점이 떠올랐다.

  별자리, 띠, 점성술, 사주 같은 것들은 인류의 저연산(low-compute) 시대의 '압축 모델'로 이해할 수 있을지도 모른다.

  옛사람들에게는 데이터베이스도, 통계 도구도, AI도 없었다.

  그들이 할 수 있는 일이라고는 계절, 천문 현상, 농사 달력, 성격, 인간관계의 이치, 사회의 순환을 오랜 세월 관찰한 뒤, 그 복잡한 경험을 외우기 쉽고 퍼뜨리기 쉬운 상징 체계로 압축하는 것이 전부였다.

  12별자리, 12띠, 사주팔자, 괘상 — 이 모두는 본질적으로 복잡한 세계를 저차원으로 줄이는 방식이다.

  물론 엄밀한 과학적 예측으로 받아들일 수는 없다.

  하지만 그렇다고 순전한 미신인 것도 아니다.

  오히려 계산 능력이 부족하고, 데이터가 부족하고, 도구가 부족했던 시절에 옛사람들이 이야기와 상징과 규칙으로 빚어낸 일종의 경험 증류에 가깝다.
