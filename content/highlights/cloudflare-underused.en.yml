  I feel people still use less than 1% of Cloudflare's capabilities.

  It now has way too many features.

  - Object storage with R2
  - Backend API with Worker
  - AI gateway with AI Gateway
  - Heavy compute with Container
  - Caching with KV
  - Database with D1
  - If you use PostgreSQL, you can connect it with HyperDrive

  And so on, there's much more — only what you can't think of, nothing it can't do.

  The key is it's damn cheap. The free tier lasts a long time. What's a free tier? It means not spending a dime — a cyber bodhisattva.
