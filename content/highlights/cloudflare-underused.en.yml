  I feel like we've still developed less than 1% of Cloudflare.

  It has shipped way too many features.

  - Object storage with R2
  - Backend API with Workers
  - AI gateway with AI Gateway
  - Heavy compute with Container
  - Caching with KV
  - Database with D1
  - Using PostgreSQL? Hook it up with HyperDrive

  And that's just the start — the list goes on and on. If you can dream it up, it can probably do it.

  The kicker is it's genuinely dirt cheap. The free tier alone lasts you a long time. What's a free tier? It means paying zero — a cyber-bodhisattva, an actual saint.