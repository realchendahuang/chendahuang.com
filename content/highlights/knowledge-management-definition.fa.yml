  مدیریت دانش چیست؟

  اسمِ «مدیریت دانش» را که می‌آوری، اولین واکنشِ بیشتر آدم‌ها این است: بوکمارک کردن مقاله، مرتب کردن لینک‌ها، یادداشت برداشتن، ساختن یک کتابخانه‌ی قشنگ.

  اما اگر از اصولِ اولیه نگاه کنیم، مسئله‌ای که مدیریتِ دانش واقعاً باید حل کند این است:

  **اطلاعاتی که امروز می‌بینم، می‌تواند در آینده به کمکِ قضاوت‌هایم بیاید؟**

  حافظه‌ی انسان محدود است، توجه محدود است و تجربه هم راحت از دست می‌رود.

  اگر یک مطلب فقط بوکمارک شود، به احتمالِ زیاد آخرش به گورستانِ اطلاعات تبدیل می‌شود.

  مدیریتِ دانشِ واقعاً ارزشمند باید یک تبدیل را کامل کند:

  اطلاعاتِ بیرونی و تجربه‌ی شخصی را تبدیل کند به قابلیتِ عمل — چیزی که قابلِ جست‌وجو، فراخوانی، استفاده‌ی مجدد و به‌روزرسانی باشد.

  - مقاله‌ای که فقط بوکمارک شده، فقط مطلبِ خام است.
  - دیدگاهش را بیرون بکشی، می‌شود اطلاعات.
  - وصلش کنی به پروژه‌ها، سناریوها و قضاوت‌های خودت — تازه آن موقع است که شروع می‌کند به دانش تبدیل شدن.
  - و آخرش وقتی به کارت بیاید برای مقاله نوشتن، محصول ساختن، تصمیم گرفتن و طراحیِ ورک‌فلو — آن وقت است که می‌شود توانایی.

  برای همین بیشتر و بیشتر حس می‌کنم نقطه‌ی پایانِ مدیریتِ دانش نباید یک کتابخانه باشد.

  بیشتر شبیه زیرساختِ شناختی است.

  کمکت می‌کند اطلاعات را جذب کنی، قضاوت‌ها را منظم کنی، روش‌ها را تهنشین کنی و مدام محتوا، محصول و عمل تولید کنی.

  مخصوصاً حالا که ایجنت‌های هوش مصنوعی آمده‌اند، مدیریتِ دانش خیلی جالب‌تر می‌شود.

  قبلاً برای مرتب کردن، دسته‌بندی، جست‌وجو و استفاده‌ی مجدد به آدم‌ها وابسته بودیم.

  از این به بعد خیلی از این کارها را می‌شود سپرد به ایجنت‌ها:

  خلاصه‌سازیِ خودکار، تگ‌گذاریِ خودکار، اتصالِ خودکار به پروژه، تولیدِ خودکارِ پیش‌طرح، یادآوریِ خودکارِ دانشِ منقضی‌شده — حتی تبدیلِ مستقیمِ مطلب به مقاله، پیشنهادنامه، اسلاید و تسک.

  برای همین هم هست که این روزها به مدیریتِ دانش علاقه‌مند شده‌ام.

  رویِ پوستش یادداشت‌برداری است.

  تهِش، ساختنِ یک سیستمِ شناختی است که در بلندمدت بهره‌ی مرکب می‌دهد.
