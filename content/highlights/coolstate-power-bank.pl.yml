  Znajomy zapytał mnie, jakiej marki jest power bank na zdjęciu.

  No dobrze, czas zacząć pitchować.

  To jest CoolState Power Bank No. 25 Super SE (CoolState to dawna firma Zimi).

  Trochę ponad 140 juanów, 25 000 mAh, do 120W mocy wyjściowej, wbudowany kabel do ładowania.

  Utrzymuje mojego MacBooka Air przez całe popołudnie ciężkiej pracy.

  Idealny towarzysz pracy w terenie dla Starbucksa, McDonalda, KFC, wsi i każdego innego miejsca!