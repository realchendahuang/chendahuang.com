  Mình làm một cuốn macOS Playbook.

  Dành cho những người vừa mua Mac, vừa chuyển từ Windows sang, hoặc luôn cảm thấy chiếc Mac của mình chưa bao giờ thực sự hợp tay.

  Gồm có:

  - Sau khi có Mac nên cài gì trước tiên
  - Người dùng Windows thích nghi với macOS thế nào
  - Cách chọn các công cụ như Rectangle / AltTab / Homebrew
  - Cách làm việc xuyên các thiết bị
  - Cách dựng terminal, Git, SSH và môi trường code bằng AI
  - Cách xử lý bảo trì hệ thống, xử lý sự cố, sao lưu an toàn và chuyển máy

  Playbook: [chendahuang.com/playbooks](/playbooks)
