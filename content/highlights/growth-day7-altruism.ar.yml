  في اليوم السابع من الإدارة تجاوزت 2000 متابع، وإليكم مراجعة سريعة.

  الجوهر كلمة واحدة: الإيثار.

  وأعظم ما شاركته صنفان من المادة النافعة:

  - قائمة برامج macOS للاستخدام الثقيل (48 ألف قراءة)
  - جدول الحصص المجانية لـ Cloudflare + الدليل العملي (أرقام ممتازة على X، بل إن أخاً نسخه وأعاد صياغته إلى Zhihu، فحصد عدة مئات من الحفظ!)
  - وأيضاً توصية موارد شركة الشخص الواحد OPC (38 ألف قراءة)

  لم أكن أفكر في كيفية كسب المتابعين؛ فقط نظمت ما وقفت عليه من أبحاث وأهديته مجاناً. فكانت النتيجة أن النمو جاء أسرع.

  وسأواصل نشر هذا الضرب من المحتوى النافع. شكراً لدعمكم جميعاً.