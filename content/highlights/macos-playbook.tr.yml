  Bir macOS Playbook hazırladım.

  Yeni Mac almış, Windows'tan Mac'e geçmiş ya da Mac'inin hiç oturmadığını hisseden insanlar için.

  İçinde şunlar var:

  - Mac aldıktan sonra ilk ne kurulmalı
  - Windows kullanıcıları macOS'a nasıl uyum sağlar
  - Rectangle / AltTab / Homebrew gibi araçlar nasıl seçilir
  - Cihazlar arası nasıl çalışılır
  - Terminal, Git, SSH ve AI kodlama ortamı nasıl kurulur
  - Sistem bakımı, sorun giderme, güvenli yedekleme ve cihaz geçişi nasıl yapılır

  Playbook: [chendahuang.com/playbooks](/playbooks)
