content: |
  J'ai baissé la fréquence de scroll sur X, dernièrement.

  Je ne sais pas si je suis entré en mode moine retiré du monde.

  Après une introspection sérieuse, je me suis rendu compte que je me préoccupe davantage d'une question :

  est-ce que tout ce que je scroll chaque jour finit par devenir un vrai produit.

  Voir des mises à jour d'outils, même en masse, ne vaut pas de transpercer un scénario concret jusqu'au bout.

  Cette période, j'ai envie de consacrer plus d'énergie au produit, à la communauté et au contenu de long terme.