title: "TUI đã bắt đầu bốc mùi: giảm băng thông nhận thức một cách có hệ thống"
description: "Nó ép bạn nhét mọi trạng thái vào trí nhớ ngắn hạn, rồi đẩy chi phí suy nghĩ sang việc vận hành giao diện."
