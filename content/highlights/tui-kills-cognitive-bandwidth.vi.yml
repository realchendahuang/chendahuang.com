content: |
  TUI này, nói thẳng là, đã bắt đầu bốc mùi rồi.
  Cái khiến nó ghê tởm nhất không phải là khó dùng, mà là nó đang có hệ thống làm giảm băng thông nhận thức của con người.
  Bạn tưởng bạn đang trò chuyện hiệu quả với công cụ, thực ra bạn đang lặp đi lặp lại ba việc:
  nhớ phím tắt và chế độ
  định vị thông tin trong dòng ký tự cuộn liên tục
  và cầu nguyện là mình không lỡ tay rơi vào một trạng thái kỳ quặc nào đó
  Này không còn là tương tác nữa, này là vật lộn với giao diện.
  Một giao diện thực sự hiệu quả phải là dàn trải trạng thái ra cho bạn nhìn, để đôi mắt và cảm giác không gian của bạn tự hiểu, chứ không phải ép bạn nhét tất cả vào trí nhớ ngắn hạn. TUI thì làm ngược lại — nó chất mật độ thông tin lên tận cực hạn, mà lại giẫm đạp tính dễ đọc và khả năng khôi phục xuống thấp nhất.
  Tệ hơn nữa, nó còn nuôi một thói quen rất xấu: coi việc thuộc phím của một công cụ nào đó là năng lực bản thân. Hệ quả là người ta bỏ rất nhiều công sức để thích nghi với giao diện, thay vì suy nghĩ về vấn đề.
  Một công cụ tốt phải giảm chi phí suy nghĩ, chứ không phải chuyển chi phí suy nghĩ sang việc làm sao vận hành cái giao diện này.
  Cơn mốt TUI bây giờ, phần lớn là dùng filter geek để che giấu sự lười biếng và kiêu ngạo trong thiết kế tương tác của chính nó.
