content: |
  Liang Wenfeng bir yatırımcı toplantısında şöyle dedi:
  "Zekânın son noktası hep gömülü (embodied) olabilir. Çünkü normal bir insan için gereken bir bilgisayar değil — emektir."
  Bu söz çok isabetli. Sıradan insanlar hiçbir zaman daha akıllı bir bilgisayar istemedi; işini gerçekten yapan bir "emek" istiyor. Metin ne kadar yetenekli olursa olsun, sadece bir ara durumdur. https://t.co/2xg5o5hNjt
