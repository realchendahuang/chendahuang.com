  Dzielę się skarbem wśród stron: Buzzing

  Jest dla każdego, kto chce poszerzyć swoje źródła informacji i wyrwać się ze swojej bańki informacyjnej.

  Ciągle ściąga gorące treści z Hacker News, Reddit, BBC, Reuters, Bloomberg, Product Hunt i innych zagranicznych źródeł, a nagłówki tłumaczy na chiński.

  Jego największa wartość: najpierw przeglądasz nagłówki po chińsku.

  Jeśli coś przykuwa twoją uwagę i wygląda na warte przeczytania, klikasz i czytasz szczegóły.

  W tym momencie połącz to z Immersive Translate, żeby czytać dwujęzycznie.