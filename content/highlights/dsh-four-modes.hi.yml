content: |
  मैंने DeepSeek Harness के चार मोड पर कुछ समय बिताया — यहाँ हर एक के फ़ायदे, नुकसान और उपयोग के मामले हैं।

  1. Standard — रोज़मर्रा के डेवलपमेंट के लिए सबसे अच्छा
  Standard DeepSeek Harness का डिफ़ॉल्ट संपूर्ण Coding Agent है। यह रोज़मर्रा के डेवलपमेंट की हर ज़रूरत के साथ आता है, और उन कार्यों के लिए विशेष रूप से उपयुक्त है जहाँ आपको अभी तक पता नहीं है कि समस्या कहाँ है और एजेंट को खुद तलाशना पड़ता है।

  लेकिन चूँकि अधिकांश काम LLM → Tool → LLM → Tool → LLM → Tool है, इसलिए कार्य जटिल होने पर Tool Calling के round trips बढ़ जाते हैं, जिससे विलंबता और टोकन लागत बढ़ती है।

  इसलिए: तलाश-प्रथम कार्य Standard पर जाएँ।

  2. PTC — जटिल कार्यों के लिए दक्षता मोड
  PTC मॉडल को TypeScript का एक ब्लॉक लिखने देता है जो कई टूल कॉल को एक ही निष्पादन में जोड़ता है।

  Standard शायद ऐसा हो: फ़ाइलें खोजें → मॉडल के पास लौटें → फ़ाइल पढ़ें → मॉडल के पास लौटें → खोजें → मॉडल के पास लौटें → संपादित करें → मॉडल के पास लौटें।
  PTC ऐसा बन जाता है: मॉडल TypeScript लिखता है → एक बार चलाएँ → खोज + लूप + फ़िल्टर + पढ़ें + प्रोसेस करें → अंतिम परिणाम लौटाएँ।

  इससे round trips घटते हैं और बड़ी मात्रा में अर्थहीन मध्यवर्ती डेटा मॉडल कॉन्टेक्स्ट में नहीं जाता। इसलिए बैच्ड, दोहराए जाने वाले, संरचित प्रोसेसिंग वह जगह है जहाँ PTC चमकता है।

  3. Minimal — मॉडल के लिए बस Bash + Editor
  इसकी सबसे बड़ी ताकत सरलता है: कम टूल, छोटे टूल स्कीमा, कम निश्चित prompt ओवरहेड।

  लेकिन कोई Web नहीं, कोई Skills नहीं, कोई Subagent नहीं, कोई Workflow नहीं — जटिल कार्यों को एक ही एजेंट से ज़बरदस्ती करना पड़ता है। और Minimal में Standard जैसी पूर्ण Context Compaction की कमी है। इसलिए जबकि छोटे कार्यों का निश्चित टोकन ओवरहेड कम है, बहुत लंबे sessions में जहाँ बहुत ज़्यादा Bash आउटपुट होता है, यह वास्तव में टोकन नहीं बचा सकता।

  Minimal साफ़-सुथरे, सुस्पष्ट छोटे कार्यों के लिए चुनाव है — जितना स्पष्ट और छोटा, उतना बेहतर।

  4. Creator — एजेंट से एजेंट बनाना
  इसमें Standard के साथ Cordis Runtime, प्लगइन प्रयोग और Preset निर्माण शामिल है। यह एजेंट को ही रचना-योग्य और सृजन-योग्य बना देता है।

  सच कहूँ तो काफ़ी प्यारा: मॉडल खुद अपनी दुकान लगाकर सामान बेचता है, फिर अपनी ही दुकान को सँवारता है — आत्मनिर्भर।

  लेकिन Creator की सबसे बड़ी समस्या इसके ऊँचे अनुमति स्तर हैं। इसे ध्यान में रखें।
