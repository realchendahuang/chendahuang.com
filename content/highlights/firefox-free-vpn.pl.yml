  O kurczę! Dopiero się dowiedziałem, że przeglądarka Firefox daje każdemu użytkownikowi 50G darmowego ruchu VPN miesięcznie.

  Bardzo przydatne w tej niezręcznej sytuacji z jajkiem i kurą.

  Jak używać:

  1. Wpisz `about:config` w pasku adresu
  2. Przejdź do ustawień zaawansowanych i kliknij "Show all"
  3. Wyszukaj `browser.ipProtection.enabled`
  4. Przełącz wartość tej pozycji na true