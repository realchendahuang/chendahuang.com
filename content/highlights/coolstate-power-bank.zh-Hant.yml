  有朋友問我，圖裡面的充電寶是什麼牌子？

  好了，我要開始推坑了。

  這是酷態科 25 號超級電能塊 SE（酷態科就是曾經的紫米）。

  140 多塊錢，25000 毫安時，最高 120 瓦輸出，自帶充電線。

  可以讓我的 MacBook Air 持續一下午高強度工作。

  是星巴克、麥當勞、肯德基、下鄉等場所的辦公良品！