content: |
  Mam wrażenie, że wciąż wykorzystaliśmy mniej niż 1% możliwości Cloudflare.

  Wypuścił o wiele za dużo funkcji.

  - Przechowywanie obiektów z R2
  - Backendowe API z Workers
  - Bramka AI z AI Gateway
  - Ciężkie obliczenia z Container
  - Cache z KV
  - Baza danych z D1
  - Używasz PostgreSQL? Podepnij go przez HyperDrive

  A to dopiero początek — lista ciągnie się i ciągnie. Jeśli potrafisz to sobie wymarzyć, on prawdopodobnie to potrafi.

  Najlepsze jest to, że jest naprawdę śmiesznie tani. Sam darmowy tier wystarcza ci na długo. Co to jest darmowy tier? To znaczy płacisz zero — cyber-bodhisattwa, prawdziwy święty.