content: |
  Let me introduce a concept called FOMO, short for Fear of Missing Out.
  I believe many people have this problem: wanting to bookmark everything good they see, wanting to follow every new tool and trend, always feeling that not following means missing something important. The result is a bookmark folder that gets fuller and fuller, a mind that gets messier and messier, and attention that gets consumed bit by bit in the process.
