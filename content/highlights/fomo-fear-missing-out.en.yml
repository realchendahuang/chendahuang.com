content: |
  Let me introduce a concept: FOMO, short for Fear of Missing Out.

  I'm sure plenty of people have this problem: you see something good and want to bookmark it, you see a new tool or trend and want to jump on it, always feeling that if you don't, you'll miss something important. The result: your bookmarks get fuller and fuller, your head gets messier and messier, and your attention gets nibbled away bit by bit along the way.