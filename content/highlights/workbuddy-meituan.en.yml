  Tried Tencent's Workbuddy a bit, and there's a classic scenario called claiming Meituan coupons.

  At the login step, it generated a QR code for me to scan and log in.

  Then I just shouted "help me claim coupons," and it claimed that many for me.

  Using AI Agents in scenarios like claiming coupons is very amazing.
