  Gave Tencent's Workbuddy a spin — there's this classic scenario: claiming Meituan coupons.

  At the login step, it generated a QR code for me to scan and sign in.

  Then I just barked "go claim my coupons" and it went and claimed that many for me.

  Using an AI agent for something like claiming coupons — absolutely amazing.