content: |
  DeepSeek Harness は、その形式がとても良いと思う。
  
  最初から反人間的な TUI を押し付けるのではなく、Web UI を出してきた。
  
  しかもほとんどストレージを取らない。なぜならインストーラがそもそも存在しないからだ。Electron 系のフレームワークでブラウザエンジンを無理やり同梱することもない。かなりストレージを節約できる。
  
  唯一の欠点はブラウザで使うこと。だが、PWA としてアプリにインストールすればまったく問題ない。これならネイティブクライアントと大差ない。
  
  Chrome でウェブ版をアプリとしてインストールするのは、とても実用的な機能だ。例えばこのスクリーンショットの例では、ウェブページなのに、実際はデスクトップアプリと変わらない使い心地だ。
