content: |
  Tên của bộ tổng hợp thần thoại Đông Tây đã chốt — God-Museum · Bảo tàng các vị thần:

  Dồn *Sơn Hải Kinh*, *Tây Du Ký*, thần hệ Hy Lạp cổ đại, Bắc Âu và Ai Cập cổ đại — những bộ truyện chưa từng chạm mặt nhau — vào chung một vũ trụ, và khiến chúng không xung đột.

  Cùng một quy luật sấm sét, ở Hy Lạp gọi là Zeus, còn ở phương Đông gọi là Lôi Chấn Tử;

  cùng một trận đại hồng thủy, phương Đông nhớ là Nữ Oa vá trời, người Do Thái nhớ là tàu Nô-ê.

  Cứ nghiêm túc truy theo sợi chỉ đó, cả thế giới thần thoại đều phải được sắp xếp lại.

  Dùng thử online: https://chendahuang.com/god-museum/
