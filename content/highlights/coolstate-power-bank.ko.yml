content: |
  친구가 사진 속 보조배터리가 무슨 브랜드냐고 물었다.

  좋다, 이제 내가 소개를 시작하겠다.

  이것은 CoolState Power Bank No. 25 Super SE다 (CoolState는 옛날 Zimi다).

  140위안 남짓, 25,000mAh, 최대 120W 출력, 충전 케이블 내장.

  MacBook Air가 오후 내내 고강도 작업을 버틸 수 있게 해 준다.

  스타벅스, 맥도날드, KFC, 시골, 그 밖의 모든 장소에서 쓸 최고의 사무 동반자다!
