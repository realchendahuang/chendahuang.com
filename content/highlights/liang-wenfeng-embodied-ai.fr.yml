content: |
  Liang Wenfeng a dit à la réunion d'investisseurs :
  « La destination finale de l'intelligence, c'est peut-être l'incarnation. Parce que pour une personne normale, son besoin n'est pas un ordinateur, c'est de la main-d'œuvre. »
  Cette phrase est très juste. Ce que veulent les gens normaux, ce n'est jamais un ordinateur plus malin, c'est de la « main-d'œuvre » qui sait faire le boulot. Le texte, si fort soit-il, n'est qu'un état intermédiaire. https://t.co/2xg5o5hNjt