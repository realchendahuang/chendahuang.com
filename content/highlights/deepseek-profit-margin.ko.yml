  재미있는 사실 하나 — DeepSeek가 토큰을 손해 보며 판다고 생각할 수도 있다.

  API 가격은 싸게 책정돼 있지만, 공식 측은 이 사업 부문의 마진율이 545%라고 언급한 적이 있다!!!

  그래서 DeepSeek는 사이버 AI 보살일 뿐만 아니라, 기술적으로는 괴물이기도 하다.

