content: |
  Baru kepikiran sebuah sudut pandang yang cukup menarik.

  Zodiak, shio, astrologi, peramalan nasib — semua ini mungkin bisa dipahami sebagai "model terkompresi" dari era komputasi minim umat manusia.

  Orang zaman dulu tidak punya database, tidak punya alat statistik, dan tidak punya AI.

  Yang bisa mereka lakukan hanyalah mengamati musim, fenomena langit, kalender pertanian, kepribadian, adat pergaulan, dan siklus masyarakat dalam rentang waktu yang panjang, lalu memampatkan pengalaman rumit itu menjadi sistem simbol yang mudah diingat dan mudah disebarkan.

  12 zodiak, 12 shio, Ba Zi, heksagram — semuanya pada dasarnya seperti cara mereduksi dunia yang rumit ke dimensi yang lebih rendah.

  Tentu saja, semua itu tidak bisa dianggap sebagai prediksi ilmiah yang ketat.

  Tapi belum tentu juga murni takhayul belaka.

  Mereka lebih seperti sulingan pengalaman — dibuat oleh orang zaman dulu dengan cerita, simbol, dan aturan, di masa ketika komputasi langka, data langka, dan alat juga langka.