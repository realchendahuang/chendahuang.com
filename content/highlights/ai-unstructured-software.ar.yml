  أين تقع فرصة البرمجيات الجديدة في عصر الذكاء الاصطناعي؟

  من الفرص الكبرى معالجة الجزء الذي لا تستطيع البرمجيات التقليدية تسجيله؛ أي بعض البيانات الخلفية غير المنظمة.

  فمثلاً برنامج CRM أصيلٌ في الذكاء الاصطناعي (AI-native): عند تسجيل خصمٍ مُنح لعميلٍ ما، يمكنه تسجيل سبب منح هذا الخصم دون غيره، ولماذا رُفضت الحلول الأخرى، ومن أقنع من داخل هذه الحكاية؟

  تحتوي البرمجيات التقليدية على كثير من هذه المعلومات الخفية التي يستحيل تسجيلها؛ وفي عصر الذكاء الاصطناعي يمكن الاستفادة من فهم النصوص والفيديو لاستخراج بنية منظمة من هذه المعلومات الخفية المتراكمة الهائلة، ثم تحليلها.