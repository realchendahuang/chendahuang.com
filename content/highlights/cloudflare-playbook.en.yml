  I made a Cloudflare Playbook.

  For all indie developers who want to build products with AI Coding.

  Inside it covers:

  - How to choose common Cloudflare services
  - How to use Workers / Pages / D1 / R2 / KV / AI Gateway
  - Whether the free tier is actually enough
  - When to buy the $5 Workers Paid
  - The pitfalls where AI-written CF code most easily fails
  - How to configure Cloudflare Skills and MCP for Codex / Claude Code
  - Which open-source projects you can directly reference

  My goal is simple:

  Write code with AI, deploy globally with Cloudflare.

  Playbook: [chendahuang.com/playbooks](/playbooks)
