  La persona juzga. La IA amplifica.

  La atención de la persona es limitada: solo se encarga de la parte más crítica del juicio.

  Hay que repartir la atención limitada en los sitios con valor, y dejarle a la IA más trabajo basura.

  Ese es el sentido de los flujos de trabajo de IA.

  Que el flujo de IA se coma todo el trabajo basura, y la persona haga el juicio final: la revisión o la validación de resultados más valiosa, más central, la del objetivo final.

  Ese es el estado que me gustaría alcanzar. Últimamente también estoy estudiando estos flujos cuando tengo tiempo.