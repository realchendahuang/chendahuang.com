  Я сделал macOS Playbook.

  Для тех, кто только купил Mac, только перешёл с Windows или всегда чувствовал, что их Mac так и не прижился.

  В нём разобрано:

  - Что установить в первую очередь после покупки Mac
  - Как пользователи Windows адаптируются к macOS
  - Как выбирать инструменты вроде Rectangle / AltTab / Homebrew
  - Как работать между устройствами
  - Как настроить терминал, Git, SSH и среду ИИ-программирования
  - Как решать вопросы обслуживания системы, поиска неисправностей, безопасного резервного копирования и миграции устройств

  Playbook: [chendahuang.com/playbooks](/playbooks)