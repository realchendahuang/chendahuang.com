  Ich habe ein macOS Playbook gebaut.

  Passt für alle, die frisch einen Mac haben, gerade von Windows gewechselt sind – oder das Gefühl haben, Mac nie richtig bedient zu haben.

  Drin gesammelt:

  - Welche Software direkt nach dem Mac-Kauf installieren
  - Wie Windows-Nutzer sich an macOS gewöhnen
  - Wie sich Tools wie Rectangle / AltTab / Homebrew auswählen lassen
  - Wie die Zusammenarbeit über Geräte hinweg läuft
  - Wie Terminal, Git, SSH und AI-Coding-Umgebung eingerichtet werden
  - Was bei Systempflege, Fehlerbehebung, sicheren Backups und Umzug auf neue Geräte zu tun ist

  Playbook: [chendahuang.com/playbooks](/playbooks)