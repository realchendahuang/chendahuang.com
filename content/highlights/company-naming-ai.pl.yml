  Opowiem wam o mojej sadze z nazywaniem firmy.

  Używałem GPT 5.5 i Gemini 3.1 Pro, burząc mózg z oboma modelami w kółko — dwa, trzy dni i dalej żadnej dobrej nazwy.

  Dlaczego? Bo te modele nie mają kreatywności. Każda nazwa, którą mi podawały, to była sterta wymyślnych słów i kombinacji znaków.

  Wrzucasz swój własny pomysł, a one odbijają ci tę samą kolistą gadkę, w kółko i w kółko, aż skoczyło mi ciśnienie.

  Jest jeszcze jeden duży problem: gdy w końcu trafisz na kilka nazw, które ci odpowiadają, otwierasz Qichachę i — cholera — albo są już zarejestrowane, albo niepokojąco podobne do czegoś istniejącego.

  Tutaj mogę polecić 88 Cha od Alibaby, jak darmowa Qichacha — użyj jej do sprawdzenia kolizji nazw.

  Jeśli nie chcesz ciągle powtarzać istniejących nazw, postaw na czteroznakową nazwę i trzymaj myślenie szeroko.

  Przede wszystkim przełączaj się między kilkoma modelami — kilkoma różnymi mózgami.

  Wrzuć AI kilka nazw, które uważasz za świetne, jako referencje, na przykład DeepSeek (深度求索) czy ByteDance (字节跳动).

  Pozwól AI przestudiować nazwy, które uważasz za dobre. Tylko czerpiąc z najlepszego u wielu, może powstać naprawdę wielka nazwa.