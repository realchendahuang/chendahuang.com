content: |
  Na era da IA, a procrastinação mais comum hoje:
  empilhar ferramentas, comprar cursos, entrar em comunidades, trocar de modelo, ajustar prompt.
  Todo dia muito empenho.
  Mas nunca encarando a pergunta:
  será que eu tenho um negócio real nas mãos que valha a pena resolver com IA?
  Afiar a faca dá muito trabalho.
  Mas muita gente nunca tem coragem de abater o porco.