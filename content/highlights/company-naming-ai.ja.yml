content: |
  会社名を決めたときの経験を話そう。

  俺は GPT 5.5 と Gemini 3.1 Pro を使い、この二つのモデルで何度もブレインストーミングを繰り返し、2〜3 日考えてもいい名前が思いつかなかった。

  なぜか？ このモデルたちには革新性がないからだ。提示される名前の選択肢は、どれも言葉の寄せ集めと文字の組み合わせにすぎない。

  自分からアイデアを出しても、彼らは同じ話をぐるぐる繰り返して、高血圧になりかけだった。

  もう一つの大きな問題は、ようやく満足のいく名前をいくつか思いついても、企查查（企業情報検索）を開くと、おいおい、もう登録されてるか、似た名前があるかのどっちか。

  ここでおすすめなのがアリババの 88 查。企查查みたいなものだけど無料。似た名前がないか調べられる。

  名前をずっと繰り返したくないなら、4 文字の名前にするのがおすすめ。発想は絶対に広く持つこと。

  何種類かのモデルを必ず切り替えること。何種類もの頭脳に切り替えること。

  AI にいい名前の例を参考として渡すといい。例えば DeepSeek 深度求索、ByteDance 字节跳动。

  自分がいいと思う名前を AI に参考にさせろ。百家の長所を集めてこそ、すごい名前が生まれる。