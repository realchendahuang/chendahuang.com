content: |
  給大家講講我公司取名的經歷吧。

  我是用 GPT 5.5 和 Gemini 3.1 Pro，用這兩個模型經歷了多次的頭腦風暴，想了兩三天都沒想到好名字。

  為什麼呢？因為我發現這些模型沒有創新。牠給你的名字選項都是詞藻的堆砌和字的組合。

  你提出自己的想法，牠就來回鬼打牆地給你繞來繞去，氣得我高血壓都犯了。

  還有一個很大的問題，你好不容易想到幾個比較滿意的名字，打開企查查一看，好傢伙，要嘛被註冊了，要嘛有雷同的。

  這裡可以推薦一下阿里巴巴的 88 查，類似於企查查，但是免費，可以用它查查有沒有雷同的名字。

  取名字如果不想一直重複，最好取四個字的，思路一定要開闊。

  一定要多換幾種模型，換幾種不同的腦子。

  可以給 AI 一些好名字作為參考，比如說 DeepSeek 深度求索、ByteDance 字節跳動。

  把你認為的好名字，讓 AI 去參考參考。博採眾家之長，才會有牛逼的名字出現。