content: |
  Dzielę się rozszerzeniami przeglądarki, które trzymam przy sobie od lat.

  - **Wetab**: rozszerzenie do nowej karty. Wrzucasz tam często używane rzeczy, dostosowujesz wyszukiwarki i synchronizujesz na urządzeniach za darmo z kontem. Zbudowałem w nim wyszukiwarkę X opartą na Google — o wiele lepszą niż wbudowana.
  - **Video Speed Controller**: precyzyjna regulacja prędkości wideo, świetna do wydajnego przyswajania wiedzy.
  - **XHunt**: must-have dla X. Widzisz ranking dla każdego KOL-a i najgorętsze posty w tej chwili.
  - **X Mutual-Follow Radar**: oznacza na stronie wzajemne obserwacje i jednostronne obserwacje oraz może pokazywać stosunek obserwowanych do obserwujących.
  - **FireShot**: robienie zrzutów ekranu stron, edycja i zapis jako PDF, JPEG, GIF, PNG lub BMP.
  - **Proton Pass**: elegancko zaprojektowany menedżer haseł z synchronizacją na wielu urządzeniach.
  - **Immersive Translate**: weteran wśród rozszerzeń do dwujęzycznego tłumaczenia, podpięty do API DeepSeek V4 Flash.
  - **Codex**: niezbędny do połączenia Codex z Chrome. Dzięki niemu możesz zautomatyzować w przeglądarce wszystko — na przykład napisać e-mail z odwołaniem, gdy zablokują ci konto.