content: |
  Petit test du Workbuddy de Tencent, avec le scénario classique : aller chercher des coupons Meituan.

  À l'étape de la connexion, il a généré un QR code pour me faire scanner et me logger.

  Puis j'ai juste crié « va me chercher des coupons », et il m'en a pris plein comme ça.

  Mettre un agent IA sur un scénario comme faire des coupons, c'est très amazing.