  नॉलेज मैनेजमेंट क्या है?

  नॉलेज मैनेजमेंट का ज़िक्र करो और ज़्यादातर लोगों की पहली प्रतिक्रिया होती है: आर्टिकल्स बुकमार्क करना, लिंक्स व्यवस्थित करना, नोट्स लेना, एक खूबसूरत लाइब्रेरी बनाना।

  लेकिन पहले सिद्धांतों से देखें, तो जो समस्या नॉलेज मैनेजमेंट को असल में हल करनी है वह है:

  **क्या आज मैं जो जानकारी देखता हूँ, वह भविष्य में मेरे फ़ैसलों में मदद करती रह सकती है?**

  इंसान की याददाश्त सीमित है, ध्यान सीमित है, और अनुभव आसानी से फिसल जाता है।

  अगर कोई सामग्री सिर्फ़ बुकमार्क हो जाए, तो संभवतः वह सूचना का क़ब्रिस्तान बनकर रह जाती है।

  सच में मूल्यवान नॉलेज मैनेजमेंट को एक परिवर्तन पूरा करना चाहिए:

  बाहरी जानकारी और निजी अनुभव को एक ऐसी क्रिया-क्षमता में बदलना जो पुनःप्राप्त, कॉल करने योग्य, दोबारा इस्तेमाल योग्य और अपडेट हो सके।

  - एक आर्टिकल, केवल बुकमार्क किया हुआ, सिर्फ़ सामग्री है।
  - तुम उसका दृष्टिकोण निकालो और वह सूचना बन जाता है।
  - तुम उसे अपने प्रोजेक्ट्स, परिदृश्यों और फ़ैसलों से जोड़ो — तभी वह ज्ञान बनना शुरू होता है।
  - आख़िर में, जब वह तुम्हें आर्टिकल लिखने, प्रोडक्ट बनाने, फ़ैसले लेने और वर्कफ़्लो डिज़ाइन करने में मदद करता है, तो वह क्षमता बन जाता है।

  तो मैं तेज़ी से महसूस करता हूँ कि नॉलेज मैनेजमेंट का अंतिम बिंदु लाइब्रेरी नहीं होना चाहिए।

  यह कॉग्निटिव इन्फ्रास्ट्रक्चर जैसा है।

  जो तुम्हें जानकारी सोखने, फ़ैसलों को व्यवस्थित करने, तरीक़े जमाने और सामग्री, प्रोडक्ट व क्रिया उत्पन्न करते रहने में मदद करता है।

  ख़ासकर अब जब AI एजेंट मौजूद हैं, नॉलेज मैनेजमेंट और दिलचस्प हो गया है।

  पहले हम व्यवस्थित करने, वर्गीकृत करने, खोजने और दोबारा उपयोग करने के लिए इंसानों पर निर्भर थे।

  आगे चलकर, उसमें से बहुत कुछ एजेंटों को सौंपा जा सकता है:

  ऑटो-समराइज़, ऑटो-टैग, प्रोजेक्ट्स से ऑटो-लिंक, ऑटो-आउटलाइन जनरेशन, पुरानी हो चुकी जानकारी को ऑटो-फ़्लैग — यहाँ तक कि सामग्री को सीधे आर्टिकल्स, प्रपोज़ल्स, स्लाइड्स और टास्क्स में बदलना।

  यही वजह है कि मुझे हाल में नॉलेज मैनेजमेंट में दिलचस्पी हुई है।

  सतह पर यह नोट लेना है।

  गहराई में, यह एक ऐसी संज्ञानात्मक प्रणाली बनाना है जो लंबी अवधि में चक्रवृद्धि से बढ़े।