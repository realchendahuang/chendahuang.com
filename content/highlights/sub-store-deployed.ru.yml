content: |
  Понадобилось время, но я развернул Sub-Store на Cloudflare.

  Объединил свои собственные узлы и резервные узлы аэропорта в один, и поставил правила маршрутизации ACL4SSR на авто-подписку.

  Сделано одной ссылкой подписки:

  - Объединение узлов от нескольких провайдеров
  - Фильтрация узлов
  - Настройка правил маршрутизации
  - Автоматическое обновление конфигов

  Гладче некуда.