  Compartilhando um site-tesouro: Buzzing.

  Ele serve pra quem quer ampliar as fontes de informação e furar a bolha de informação.

  O site fica capturando conteúdo gringo bombando — Hacker News, Reddit, BBC, Reuters, Bloomberg, Product Hunt etc. — e traduz os títulos pro chinês.

  O maior valor dele é você passar os olhos nos títulos em chinês.

  Se vê um artigo interessante que merece leitura, aí clica pra ver os detalhes.

  Nesse momento dá pra combinar com a Tradução Imersiva pra leitura bilíngue.