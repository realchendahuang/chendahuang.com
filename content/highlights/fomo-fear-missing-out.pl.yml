  Przedstawiam wam pewną koncepcję: FOMO, czyli Fear of Missing Out, lęk przed pominięciem.

  Jestem pewien, że wielu z was zna ten problem: widzisz coś dobrego i chcesz to zapisać, widzisz nowe narzędzie czy trend i chcesz na niego wskoczyć, bo zawsze czujesz, że jak nie, to przegapisz coś ważnego. Efekt? Zakładki robią się coraz pełniejsze, w głowie coraz większy bałagan, a uwaga – kawałek po kawałku – jest po drodze podgryzana.