  Spędziłem cały dzień na porządnym researchu "usuwania smaku AI z artykułów".

  Porównałem popularne Humanizery, Skille do usuwania smaku AI i podejścia oparte na promptach.

  Potem dodałem do tego własne doświadczenie z używania LLM-ów od 2023 roku — dzień po dniu męczony smakami AI od GPT, Claude, Gemini i Doubao.

  I powstało to:

  **Dahuang Human Tone**

  Skill do usuwania smaku AI zbudowany pod chiński kontekst.

  Moje życzenie:

  Żaden esej napisany przez AI nie powinien być męczący w czytaniu.

  GitHub: https://github.com/realchendahuang/dahuang-human-tone