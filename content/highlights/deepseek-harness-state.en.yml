content: |
  I went back through the DeepSeek Harness repo and Discussions recently, and this project is at a very interesting stage:

  DeepSeek Harness already has 150k+ stars and over 12,000 commits in the repo.

  Yet the official README still states very clearly: it's only a Developer Preview right now, and breaking changes are still coming.

  rc.7 was released on August 17. Issue and PR creation is restricted; feedback goes through Discussions.

  The community is huge, but core development is concentrated in few hands. Bugs keep popping up — like the unknown tool "" issue.

  What's most missing: test coverage, provider compatibility, and session reliability.

  Architecturally it's still attractive, like the foundation of an agent operating system:

  - Everything is a Plugin
  - Cordis composition architecture
  - Preset / Skill / MCP / Agent / Provider all pluginized

  The project is at the "influence runs ahead of engineering" stage.