  استقر اسم موسوعة الأساطير الشرقية والغربية: God-Museum · متحف الآلهة:

  وضعُ عدة أنساب إلهية متباينة تماماً — «سجل الجبال والبحار»، و«رحلة إلى الغرب»، واليونان القديمة، والاسكندنافية، ومصر القديمة — في عالمٍ واحد، من دون أن تتصادم.

  الظاهرة الرعدية الواحدة تُسمى في اليونان «زيوس»، وفي الشرق «لي تشن زي»؛

  والطوفان العظيم نفسه: يذكره الشرقيون بأنه إصلاح «نوا» للسماء، ويذكره العبرانيون بسفينة نوح.

  وإن استقصيت الأمر بجدية، وجب إعادة ترتيب العالم الأسطوري كله.

  جرّبه على الإنترنت: https://chendahuang.com/god-museum/