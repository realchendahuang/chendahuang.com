content: |
  Hari ini hari pertama saya resmi pindah ke kantor OPC. Saya ceritakan langkah-langkah saya mendirikan OPC.

  Motivasi awal saya sederhana: punya entitas yang sah untuk menerima pembayaran dan menerbitkan produk. Jadi saya mencari info pendaftaran perusahaan di internet.

  Saya tidak rewel soal kota: Nanjing, Suzhou, Hangzhou, Ningbo — kota pesisir maju mana pun jadi kandidat.

  Kebetulan, suatu hari saya sedang dinas di Nanjing, dan sambil iseng scroll akun WeChat seputar Nanjing, saya menemukan nomor kontak komunitas OPC. Ya sudah, saya tambahkan.

  Setelah perkenalan singkat proyek saya, orang yang bertanggung jawab bilang OK dan mengatur kunjungan lapangan sore itu juga.

  Permintaan mereka: bekerja di lokasi tiga hari seminggu. Kalau saya bisa menerimanya, mereka mengizinkan saya mendaftarkan perusahaan di sini.

  Karena ini di bawah aset milik negara Nanjing, syarat kebijakannya luar biasa — air, listrik, internet, dan biaya properti semuanya gratis, secara teori selama tiga tahun. Mereka bahkan menugaskan akuntan pembukuan untuk mendaftarkan perusahaan untukku, mengukir stempel perusahaanku, mengurus izin usaha, dan mengatur pembukaan rekening bank — sampai-sampai bikin tersentuh sampai nyaris tidak masuk akal.

  Setelah proses pendaftaran dua atau tiga minggu, akhirnya semua dokumen selesai.

  Manajer taman menyuruhku memilih workstation sendiri. Standarku untuk workstation rendah — cuma butuh kursi, bangku, dan listrik.

  Lalu mereka menyuruhku mengisi tiga formulir aplikasi proyek, utamanya mencakup keunggulan proyekku, profil tim, dan keunggulan terkait AI. Kalau aplikasinya solid dan kredibel, ada peluang dapat subsidi kebijakan 50.000–100.000 yuan.

  Nanjing benar-benar menangani ini dengan baik. Semua orang sebaiknya cek apakah kota masing-masing punya kebijakan serupa, atau apakah ibu kota provinsinya menawarkan yang lebih baik.

  Kebijakan bagus tidak menunggu — kamu harus bertanya. Saat saya tiba hari ini, taman ini sudah banyak perusahaan yang pindah masuk; sebenarnya saya sudah cukup terlambat.

  Sekian dulu untuk hari ini. Ke depannya saya akan terus berbagi perjalanan startup dan retrospeksinya di sepanjang jalan.

  Terima kasih atas perhatiannya, semua.
