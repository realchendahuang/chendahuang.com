content: |
  आजकल ढेर सारे AI Coding Agent कोई भी मौका देखो TUI ठूंस रहे हैं, और इस रुझान के लिए Claude Code की बहुत बड़ी ज़िम्मेदारी है।
  इसने टर्मिनल में AI से बातचीत करके कोड लिखने के काम को अपनी पराकाष्ठा पर पहुँचा दिया है।
  लेकिन समस्या यह है कि जैसे सच में एडवांस्ड Coding Agent का डिफ़ॉल्ट इंटरफ़ेस टर्मिनल ही होना चाहिए, Web वर्ज़न सिर्फ़ एक अपेंडिज हो, और उसपर ताना भी मारा जाए कि वह काफ़ी प्रोग्रामर-जैसा नहीं है।
  और नतीजा?
  पहले एक जटिल TUI बनाओ
  ढेर सारे रंग, स्टेटस बार, शॉर्टकट, मोड स्विचिंग के साथ
  फिर उसे 'इमर्सिव', 'एफ़िशिएंट', 'प्रोग्रामर का सम्मान' जैसे नाम दे दो
  सच में?
  जिन थोड़े-से लोगों का हर दिन टर्मिनल में बीतता है, उनके लिए यह सच में मज़ेदार है। लेकिन बहुत सारे और लोगों के लिए यह जानबूझकर बनाई गई दीवार है। फ़ीचर्स कुंजियों और मोड्स के पीछे छिपे हैं, नए यूज़र हक्का-बक्का, और पुराने यूज़र्स को भी हर टूल की अपनी कीबाइंडिंग के हिसाब से दोबारा ढलना पड़ता है।
  Web UI बिल्कुल तेज़ और साफ बनाई जा सकती है — PWA की तरह इंस्टॉल करने पर डेस्कटॉप क्लाइंट से लगभग कोई फ़र्क़ नहीं, और अपडेट भी आसान। इंटरैक्शन को ज़बरदस्ती 80 के दशक के टर्मिनल पैराडाइम में धकेलना, और फिर ऊपर से Web को नीचा दिखाना — इसमें काफ़ी कुछ आत्ममुग्धता है।
  Claude Code खुद बहुत कमाल का है, इसमें कोई दो राय नहीं। लेकिन उसने 'TUI ही असली रास्ता है' वाला स्वाद और path dependence चला दिया, और पीछे-पीछे आई नक़लें इससे भी बेहूदा हैं।
  टूल लोगों के काम आने के लिए बनते हैं, यह साबित करने के लिए नहीं कि कौन ज़्यादा 'गीक' है।
  इंसान-विरोधी इंटरैक्शन को हाई-क्लास के कपड़े पहनाना — यह सच में बहुत हास्यास्पद बात है।
