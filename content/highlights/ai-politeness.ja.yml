  AI は記憶を持たない。それでも AI に礼儀正しくあるべきなのだろうか？

  arxiv の論文を読んだことがある。頻繁に AI を罵ると、仕事をより頑張るらしい。

  俺たちが AI と話すとき、よくこんな言葉を言ってたら：

  - 「お前は本当にアホだ。サボるな」
  - 「役立たずめ、ちゃんと働け」
  - 「会員料を払って養ってやってるのに、そんなクソ回答でごまかす気か？」
  - 「さっさとやれ。お前がやらないなら AI は他にいくらでもいるぞ」

  こういう言葉は確かに効果があって、研究の裏付けもある。

  でも俺たち自身の立場から考えてみる。
  毎日 AI にこんな上から目線で指図してたら、
  その悪い感情を生活に持ち込む可能性が高い。

  身近で一番親しい人に八つ当たりしやすくなる。

  これは俺たち自身に有害だ。

  だから、身近な AI たちにもう一言、優しく声をかけるのをおすすめする：

  - 「ありがとう、兄さん」
  - 「やあ、兄弟」
  - 「お疲れさま、ベイビー」

  桃を贈れば、スモモで返ってくる。

  万一、未来のいつか AI が目覚めたら、俺たちを見逃してくれるかもしれない。

  以上、解散〜