content: |
  정말 제대로 짚었다 — 이게 GPT-5 세대의 고질병이다:

  자기 일한 걸 증명하려고 자꾸 내부 요구사항을 UI 카피에 써 넣는다. 자신을 증명하려고 — 오, 나 진짜 했어요, 나 대단하지 않아요, 난 빼먹지 않았어요, 요구사항 전부 다 탁자 위에 올려놨다고요.

  게다가 UI 카피는 상상을 초월할 만큼 비대하다. 5.0부터 5.6까지 — 세대를 거듭해도 — 여전히 고쳐지지 않았다. 골수까지 박혀 있다.

  실제로 프런트엔드 제품을 출시해 본 사람이라면 다 안다:

  - 화면의 모든 글자는, 크든 작든, 사용자를 위한 카피다
  - 채팅에서 개발자에게 피드백해야 할 문구는 제품에 써 넣으면 절대 안 된다

  그런데 문구도 엉망으로 쓰면서, 자기가 뭔가 해냈다는 걸 "보여주려고" 내부 피드백을 제품에 써 넣기도 한다.
