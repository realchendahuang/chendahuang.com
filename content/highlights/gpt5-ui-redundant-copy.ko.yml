title: "GPT-5 세대의 고질병: 내부 요구사항을 UI 카피에 써 버리기"
description: "UI 카피가 비대해진 근본 원인은, 사용자에게 보여줄 문구와 개발자에게 돌아갈 피드백을 결코 분리하지 않기 때문이다."
