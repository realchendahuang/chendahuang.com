content: |
  Tôi ngày càng tin rằng giá trị của cảm xúc là vô cùng đáng giá.

  Vì sao chúng ta, loài Homo sapiens, có thể tụ họp lại để cùng làm nên chuyện lớn?

  Chính xác là vì chúng ta cùng tin vào một câu chuyện nào đó, một cảm xúc nào đó, một vật tổ nào đó, một huyền thoại nào đó, một tự sự nào đó — đó là thứ tạo nên tổ chức, thúc đẩy hợp tác, khiến chúng ta lớn mạnh hơn, và làm nên sự vĩ đại.

  Chẳng phải chính điều đó đã là một dạng giá trị cảm xúc hay sao?
