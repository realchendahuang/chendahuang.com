content: |
  O TUI, para falar sem rodeios, já começou a apodrecer.
  O que ele tem de mais nojento não é ser difícil de usar — é reduzir sistematicamente a largura de banda cognitiva das pessoas.
  Você acha que está conversando com a ferramenta de forma eficiente, mas na verdade está fazendo três coisas repetidamente:
  lembrar atalhos e modos,
  localizar informação num fluxo de caracteres que rola,
  e rezar para não ter caído por acidente em algum estado esquisito.
  Isso já não é interação — é briga com a interface.
  Uma interface de verdade eficiente deveria espalhar o estado na sua frente e deixar seus olhos e seu senso espacial entenderem, em vez de forçar você a guardar tudo na memória de curto prazo. O TUI faz exatamente o contrário — empurra a densidade de informação ao extremo enquanto pisa na legibilidade e na capacidade de recuperação até o mínimo.
  Pior, ele cultiva um hábito péssimo: tratar o domínio dos atalhos de uma ferramenta como uma habilidade em si. Resultado: a gente gasta uma energia enorme se adaptando à interface em vez de pensar no problema.
  Uma boa ferramenta deveria reduzir o custo de pensar, não transferir esse custo para descobrir como operar a interface.
  A popularidade atual do TUI é, em boa medida, um filtro geek que maquia a preguiça e a arrogância do design de interação.
