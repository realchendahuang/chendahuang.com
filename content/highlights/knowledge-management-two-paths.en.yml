content: |
  Lately I've been rethinking knowledge management.

  I realized there are actually two paths here.

  **One is building on Feishu.**

  Its advantages are direct:

  free, multi-device sync, shareable, easy collaboration, and rich enough in form.

  Documents, multi-dimensional tables, spreadsheets, slides, canvas, Todo, knowledge bases — these modules combined already cover a lot of personal and team knowledge-management scenarios.

  I'm especially bullish on the multi-dimensional tables.

  They're well suited as a knowledge hub.

  Information collection, material archiving, status management, structured organization, content re-production — all of it can revolve around them.

  Add the Feishu CLI and AI agents, and Feishu stops being just an office tool.

  It becomes more like a knowledge workflow system agents can operate.

  **The other path is building your own on Cloudflare.**

  This path is freer and better suited to productization.

  FlareMo, the thing I'm building now, is an attempt at a knowledge-management product on Cloudflare.

  Cloudflare's advantage is that the underlying capabilities are complete:

  frontend, backend, database, object storage, vector search, AI — all combinable.

  But it takes development.

  And you have to design the data structure, search experience, permission system, and product logic yourself.

  So my current take:

  - Feishu is for quickly standing up a knowledge-management system you can use today.
  - Cloudflare is for turning knowledge management into a truly controllable, iterable product.

  Both paths are worth studying.

  One leans workflow.

  One leans productization.