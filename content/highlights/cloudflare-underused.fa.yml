content: |
  احساس میکنم ما هنوز کمتر از ۱٪ از Cloudflare را توسعه دادهایم.

  تعداد قابلیتهایی که منتشر کرده از حد گذشته است.

  - ذخیرهسازی اشیا با R2
  - API بکاند با Workers
  - دروازهی AI با AI Gateway
  - محاسبات سنگین با Container
  - کش با KV
  - پایگاه داده با D1
  - از PostgreSQL استفاده میکنی؟ با HyperDrive وصلش کن

  و این فقط شروعش است — فهرست ادامه دارد و ادامه دارد. هر چیزی که تصورش را بکنی، احتمالاً بلد است انجامش بدهد.

  نکتهی خفنش این است که واقعاً ارزان است. پلن رایگانش به تنهایی تا مدتها کفایت میکند. پلن رایگان یعنی چه؟ یعنی یک ریال هم پرداخت نمیکنی — یک بودیساتوای سایبری، یک قدیس واقعی.