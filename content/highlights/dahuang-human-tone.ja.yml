content: |
  1 日かけて「文章から AI 味を落とす」ことをしっかり研究した。

  市販のメジャーな Humanizer、AI 味除去 Skill、Prompt スキームを総合的に比較した。

  さらに 2023 年から大規模言語モデルを使ってきて、GPT、Claude、Gemini、豆包（Doubao）の各種 AI 味に何度も苦しめられてきた経験を掛け合わせた。

  それで作ったのがこれ：

  **Dahuang Human Tone**

  中国語コンテキスト向けの AI 味除去 Skill。

  俺の願いは：

  世界から読みにくい AI 作文を無くすこと。

  GitHub：https://github.com/realchendahuang/dahuang-human-tone