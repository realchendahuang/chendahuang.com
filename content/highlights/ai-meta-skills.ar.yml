content: |
  في عصر الذكاء الاصطناعي، أهم قدرة هي المهارات النووية.

  وبصراحة، هي تلك القدرات الجوهرية التي تظل نافعة حتى لو غيّرت أداة، أو غيّرت نموذجاً، أو غيّرت مجالاً بأكمله.

  - هل تستطيع صياغة المشكلة بوضوح؟
  - هل تستطيع ترتيب كومة مواد مشوشة؟
  - هل تستطيع تفكيك فكرة غامضة إلى خطوات؟
  - هل تميّز في كلام الذكاء الاصطناعي بين الصواب والهرتقة؟
  - هل تقدر على مداراة الذكاء الاصطناعي جيئةً وذهاباً لتحويل إجابة خشنة إلى شيء قابل للاستخدام؟

  وكل ذلك أثمن بكثير من ادخار مجموعة أدوات.

  فتتغير الأدوات كل يوم، وتتبدل النماذج جيلاً بعد جيل.

  أما من يجيد السؤال، والترتيب، والحكم، والتفكيك، والتحقق، فحيثما حل استطاع أن يضخّم نفسه بالذكاء الاصطناعي.

  وما يوسع الفجوة فعلاً في عصر الذكاء الاصطناعي قد يكون هذه المهارات النووية التي تبدو أساسية، لكنها الأعلى قيمة في المدى الطويل.