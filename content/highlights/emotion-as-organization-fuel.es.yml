content: |
  Cada vez tengo más claro que el valor de la emoción es valiosísimo.

  ¿Por qué los sapiens somos capaces de unirnos para hacer cosas grandes?

  Porque compartimos la creencia en ciertas historias, ciertas emociones, ciertos tótems, ciertos mitos, ciertas narrativas: así se forman organizaciones, se colabora, se crece y se hace historia juntos.

  ¿No es eso una forma de valor de la emoción?