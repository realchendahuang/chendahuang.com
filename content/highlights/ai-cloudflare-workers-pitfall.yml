content: |
  很多人用 AI 写 Cloudflare 项目，翻车不是因为语法。
  真正的问题是：
  AI 经常把 Workers 当 Node.js 写
  把 Binding 当 process.env 用
  忘记 await
  乱用全局变量存请求状态
  不知道静态资源请求免费
  从 Worker 里用 REST API 调自己的 R2
  这些坑我都整理进了 Cloudflare Playbook。
  顺便还写了
