content: |
  동서양 신화 도감의 이름을 정했다 — God-Museum · 신들의 박물관:

  *산해경*, *서유기*, 고대 그리스, 북유럽, 고대 이집트 — 서로 한 번도 닿은 적 없는 이 신 계보들을 하나의 우주에 욱여넣고, 서로 충돌하지 않게 만든다.

  같은 번개의 법칙이 그리스에서는 제우스, 동양에서는 뇌진자로 불린다;

  같은 대홍수를 동양인들은 여와의 하늘 꿰매기로 기억하고, 히브리인들은 노아의 방주로 기억한다.

  그 실마리를 끝까지 진지하게 쫓다 보면, 신화의 세계 전체를 다시 배열해야 한다.

  온라인 체험: https://chendahuang.com/god-museum/
