  Это моя текущая схема.

  Для китайских моделей рекомендую ставить ZCode (DeepSeek V4 Flash, GLM 5.3 Flash — вот такого рода).

  Для GPT — сразу Codex.

  Нужна скорость? Используй Pi.

  Нужна скорость И спокойствие? Используй OMP.

  Делаешь кастомные клиентские приложения для корпораций? Используй DSH.

  Хочешь потренировать терпение? Используй Workbuddy.
