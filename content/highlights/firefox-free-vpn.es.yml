  ¡Dios santo! Me acabo de enterar de que el navegador Firefox da a cada usuario 50G de VPN gratis al mes.

  Ayuda un montón en esos escenarios incómodos de «el huevo o la gallina».

  Cómo se usa:

  1. En la barra de direcciones, escribe `about:config`
  2. Entra en las preferencias avanzadas y pulsa «mostrar todas»
  3. Busca `browser.ipProtection.enabled`
  4. Cambia el valor de esa entrada a true