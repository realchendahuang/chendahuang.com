content: |
  Liang Wenfeng powiedział na spotkaniu z inwestorami:
  „Cel inteligencji może być w całości ucieleśniony. Bo zwykły człowiek nie potrzebuje komputera – potrzebuje siły roboczej.”
  Te słowa są w punkt. Zwykli ludzie nigdy nie chcieli mądrzejszego komputera; chcą „siły roboczej”, która faktycznie wykonuje robotę. Nieważne, jak zdolny jest tekst – to tylko stan przejściowy. https://t.co/2xg5o5hNjt