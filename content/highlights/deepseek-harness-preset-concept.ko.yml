content: |
  요즘 DeepSeek Harness를 연구하고 있다. Preset이라는 개념이 주목할 만하다.

  Preset은 에이전트의 배포 단위로 이해할 수 있다. 같은 모델에 다른 Preset을 로드하면 완전히 다른 에이전트가 된다.

  Preset과 Skill의 가장 큰 차이는 무엇일까?

  - 재무 보고서 분석 Skill: 에이전트에게 재무 보고서를 분석하는 방법을 가르친다.
  - 재무 보고서 분석 Preset: 재무 보고서 분석 Skill, 웹 검색, Browser, PDF, Python, 서브에이전트, 리서치 프롬프트, 컨텍스트 전략을 전부 하나로 묶어서 — 열자마자 바로 쓸 수 있는 에이전트를 건네준다.

  미래에는 두 층의 마켓플레이스가 동시에 생길 가능성이 크다.

  - 하나는 Plugin / Skill 마켓플레이스. 주로 개발자와 파워 유저가 에이전트를 조립하는 곳.
  - 하나는 Preset / Agent 마켓플레이스. 진짜로 일반 사용자를 겨냥한 곳.

  이것은 사실상 App Store의 논리에 매우 가깝다. App Store가 완성된 앱 하나를 보여 준다면, Preset은 완성된 에이전트 애플리케이션 하나를 보여 준다.

  예전에는 사람들이 Prompt를 공유했다. 그러다 Skill을 공유하기 시작했다. 다음 단계는 아마 Preset을 공유하는 시대일 것이다.
