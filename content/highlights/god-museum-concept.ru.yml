  Название для свода восточной и западной мифологии определено — God-Museum · Музей богов:

  Запихнуть «Шань хай цзин», «Путешествие на Запад», древнегреческий, скандинавский и древнеегипетский пантеоны — эти наборы историй, которые никогда не пересекались, — в одну вселенную и не дать им столкнуться.

  Один и тот же закон грома: в Греции его зовут Зевсом, а на Востоке — Лэйчжэньцзы;

  один и тот же великий потоп: на Востоке его помнят как то, как Нюйва чинила небо, а евреи — как Ноев ковчег.

  Если серьёзно продолжать тянуть эту нить, весь мифологический мир придётся перестроить.

