content: |
  هر روز بیشتر به این باور میرسم که ارزش احساس عمیقاً ارزشمند است.

  چرا ما انسانهای خردمند میتوانیم دور هم جمع شویم و کارهای بزرگ بکنیم؟

  دقیقاً به این خاطر که همگی به یک داستان، یک احساس، یک توتم، یک افسانه، یک روایت باور داریم — همین است که سازمانها را میسازد، همکاری را به حرکت درمیآورد، ما را قویتر میکند و بزرگی را ممکن میکند.

  آیا این خودش یک جور ارزش احساسی نیست؟