content: |
  Setelah bertahun-tahun memakai macOS secara intens, ini software-software yang menurutku benar-benar hebat:

  - **QuickRecorder**: aplikasi rekam layar yang luar biasa — kecil, tapi kuat.
  - **ClashParty**: circumvention dengan inti Mihomo — dukungan protokol banyak, update cepat, dan tampilannya bagus.
  - **V2rayN**: circumvention dengan banyak protokol; UI-nya agak jadul, tapi stabil dan gratis.
  - **Kibor Doubao**: input suara dengan akurasi yang luar biasa. Mendukung macOS, iOS, Android; Windows menyusul.
  - **Brave**: browser yang mengutamakan privasi dengan penyaring iklan bawaan — lebih bersih daripada penyaring berbasis ekstensi, dan pendamping terbaik untuk menonton YouTube.
  - **Mos**: membuat scroll wheel mouse-mu terasa mulus seperti sutra.
  - **Amphetamine**: menjaga laptop tetap terjaga meski tutupnya ditutup — pendamping terbaik untuk vibe coding.
  - **UU Remote**: tools remote desktop dari NetEase, gratis dan cepat. Dengan ini, yang membatasi kualitas gambar bukan lagi keanggotaan — melainkan kecepatan jaringanmu. Saya biasanya memakainya untuk remote ke Mac dari HP memeriksa hasil vibe coding; pemetaan tombolnya efisien banget.
  - **Tencent Lemon**: pembersih sampah Mac dari Tencent — uninstall aplikasi mulus, dan ikon menu bar-nya praktis.
  - **Mole**: pembersih sampah Mac terkuat — versi terminal gratis, versi UI berbayar.
  - **Tailscale**: jaringan remote berbasis WireGuard. Dengan ini, kamu bisa menjangkau komputer kecil di rumah dari ujung dunia mana pun.
  - **Obsidian**: di era AI, tools manajemen pengetahuan yang local-first. Ekosistemnya terlalu bagus — padukan dengan ekstensi browser Web Clipper resmi dan hasilnya ajaib.
