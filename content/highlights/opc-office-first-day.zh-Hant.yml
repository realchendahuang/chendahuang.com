content: |
  今天是正式進駐 OPC 辦公室的第一天。我來跟大家講講我開 OPC 的過程經歷。

  我的初衷只是想有個合規的主體可以收錢、可以上架產品，所以就在網路上找相關的公司註冊資訊。

  我對城市沒有太大的要求：南京、蘇州、杭州、寧波，只要是沿海發達地區，都是我的備選。

  機緣巧合之下，某天來南京出差，閒來無事，滑了滑南京相關的微信公眾號，翻到了一個 OPC 社區聯絡人的電話，然後就加了上去。

  在簡單介紹了自己的專案以後，負責人覺得 OK，就安排下午去現場參觀。

  他們提出的要求是每週要有三天時間駐場辦公，如果我能接受的話，就可以讓我在這裡註冊公司。

  因為是南京國資旗下的專案，他們的政策條件非常好，水電網、物業全部免費，理論上免費三年，甚至還有專門的記帳會計幫我註冊公司、幫我刻章、幫我拿營業執照、幫我聯絡銀行開戶，感動到誇張啊。

  在經歷了兩三個星期的註冊流程以後，終於拿到了所有的材料。

  園區經理讓我在這裡選一個自己的工位。我對工位的要求並不高，只要有座位、有椅子、有電就行。

  園區經理讓我填三張申請專案的表格，主要是介紹自己專案的優勢、團隊成員的狀況，以及跟 AI 結合的專長。如果寫得好、夠可靠的話，就有機會拿到 5~10 萬的政策補貼。

  我覺得南京這一塊做得是真的好。大家也可以看看自己的城市有沒有相關的政策，或是自己的省會有沒有更好的政策。

  好的政策不等人，一定要多多去打聽。我今天到的時候，其實這個園區已經有很多公司進駐了，我算是比較晚的了。

  今天要分享的就是這些，之後我會持續分享我整個創業的經驗和過程回顧。

  感謝大家的關心。
