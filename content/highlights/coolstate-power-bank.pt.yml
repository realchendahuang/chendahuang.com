  Um amigo me perguntou: que marca é esse power bank da foto?

  Tá bom, vou começar o jabá.

  É o CoolState Energy Block 25 SE (a CoolState é a antiga ZMI).

  140 e poucos reais, 25000 mAh, até 120 watts de saída, com cabo de carga embutido.

  Meu MacBook Air aguenta uma tarde inteira de trabalho pesado.

  Perfeito pra Starbucks, McDonald's, KFC, ou pra quando você "desce pro interior pra trabalhar"!