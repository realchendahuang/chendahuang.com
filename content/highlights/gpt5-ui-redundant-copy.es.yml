content: |
  Qué certero. Esta es la manía común de la generación GPT-5:

  siempre escribe en los textos de la interfaz sus necesidades internas, para demostrar su carga de trabajo. Para demostrarse: mira, yo sí lo he hecho, ¿a que soy una pasada?, no he holgazaneado, he puesto todos tus requisitos sobre la mesa.

  Y además los textos de la interfaz son muy redundantes. De la 5.0 a la 5.6, tantas generaciones iterando y siguen sin cambiar ese problema: ya lo llevan metido hasta los huesos.

  Todo el que haya hecho de verdad producto de frontend lo entiende:

  - en la interfaz, tanto la letra pequeña como la grande, todo es texto dirigido al usuario
  - el texto que debe llegar al desarrollador en el chat, jamás debe escribirse dentro del producto

  Pero no solo escribe mal los textos: además mete el feedback interno en el producto para «demostrar» que ha hecho algo.