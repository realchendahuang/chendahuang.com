content: |
  概念を一つ紹介する。FOMO、正式名称は Fear of Missing Out、日本語で言う「取り残される恐怖」だ。
  多くの人がこの悪癖を持ってると思う：いいものを見たら保存したくなる、新しいツールやトレンドを見たら追いかけたくなる、追わないと何か大事なものを逃す気がする。結果、保存フォルダはどんどん溜まる一方、頭の中はどんどん散らかり、注意力はその過程で少しずつ消耗されていく。