  Un amigo me preguntó qué marca era el power bank de la foto.

  Vale, empiezo a hacerle publicidad.

  Es el Cuktech 25 Power Bank SE (Cuktech es la antigua ZMI).

  Algo más de 140 yuanes, 25.000 mAh, hasta 120 W de salida, con cable de carga incluido.

  Da para que mi MacBook Air aguante una tarde entera de trabajo intenso.

  ¡Un imprescindible de oficina para Starbucks, McDonald's, KFC y hasta para teletrabajar desde el pueblo!