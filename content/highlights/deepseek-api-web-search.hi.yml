content: |
  एक बढ़िया चीज़ मिली — DeepSeek ने सच में अपने API में ही वेब सर्च बना दिया है।
  Responses इंटरफ़ेस के ज़रिए deepseek-v4-flash मॉडल को कॉल करें, और रिक्वेस्ट पैरामीटर में बस एक web_search टूल घोषित करें, ताकि उनका सर्वर-साइड सर्च सीधे इस्तेमाल हो।
  न तो तीसरे पक्ष के सर्च इंजन को एकीकृत करना पड़ता है, न अलग सर्च API कुंजी के लिए आवेदन करना।
  पूरी सर्च पाइपलाइन आधिकारिक टीम द्वारा होस्ट की जाती है।
