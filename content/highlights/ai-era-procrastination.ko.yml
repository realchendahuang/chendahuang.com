content: |
  AI 시대에 가장 널리 퍼진 미루기:
  도구를 모으고, 강의를 사고, 커뮤니티에 들어가고, 모델을 바꾸고, 프롬프트를 손본다.
  매일매일 바쁘게 산다.
  그러나 감히 한 가지 질문을 마주하지 못한다:
  내 손에 정말 AI를 던질 만한 진짜 사업이 있는가?
  칼을 가는 데에는 몹시 바쁘다.
  하지만 많은 사람은 감히 돼지를 잡지 못한다.
