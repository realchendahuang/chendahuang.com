  Wo liegen die neuen Softwarechancen im AI-Zeitalter?

  Eine ziemlich große Chance: den Teil verarbeiten, den klassische Software nie festhalten konnte – also unstrukturierte Hintergrunddaten.

  Zum Beispiel kann eine wirklich AI-native CRM-Software, wenn sie den Rabatt für einen Kunden erfasst, gleich mit erfassen, warum dieser und kein anderer Rabatt gewährt wurde, warum die anderen Optionen abgelehnt wurden – und wer dabei wen überzeugt hat?

  Klassische Software hat massig solcher versteckten Informationen, die sie schlicht nicht erfassen kann. Das AI-Zeitalter kann mit Verständnis für Text und Video genau diese verborgenen, redundanten Datenmengen zu strukturierten Daten extrahieren und analysieren.