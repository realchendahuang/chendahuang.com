  I moved circumvention subscription aggregation to Cloudflare.

  Open-sourced a completely free circumvention subscription link aggregation project deployed on Cloudflare.

  It helps you aggregate all your circumvention subscription links and self-hosted network nodes into a single link, while also adding routing rules.

  Truly achieving the goal of using just one link across all clients, without needing to configure each client separately.

  GitHub: https://github.com/realchendahuang/sub-store-cloudflare

