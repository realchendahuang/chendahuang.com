  I moved my circumvention subscription aggregation to Cloudflare.

  Open-sourced a subscription-link aggregation project that deploys completely free on Cloudflare.

  It folds all your circumvention subscription links and self-built nodes into one link, with routing rules attached.

  Truly one link — usable in every client, no per-client configuration.

