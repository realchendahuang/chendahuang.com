content: |
  Son zamanlarda "Fu Bu Hei" gibi spam hesaplar beni resmen çıldırttı.
  
  Öfkeyle bir tarayıcı eklentisi yazdım — adı "FeedSieve".
  
  Birkaç tur yinelemeden sonra iyi bir noktaya geldi, yayına çıkmak üzere.
  
  İhtiyacı olanlar yer imlerine eklesin — yakında açık kaynak yapıp Chrome Web Mağazası'na koyacağım.
