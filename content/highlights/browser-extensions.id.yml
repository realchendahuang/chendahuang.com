content: |
  Berbagi ekstensi browser yang bertahun-tahun saya simpan baik-baik.

  - **Wetab**: ekstensi tab baru. Taruh hal-hal yang sering kamu pakai di dalamnya, kustomisasi mesin pencari, dan sinkronisasi lintas perangkat gratis dengan akun. Di dalamnya saya membuat mesin pencari X berbasis Google — jauh lebih baik daripada bawaan.
  - **Video Speed Controller**: atur kecepatan video secara presisi, cocok untuk menyerap ilmu secara efisien.
  - **XHunt**: wajib punya untuk pengguna X. Lihat papan peringkat untuk setiap KOL dan postingan paling panas saat ini.
  - **X Mutual-Follow Radar**: menandai hubungan saling follow dan follow satu arah di halaman, serta bisa menampilkan rasio following / followers.
  - **FireShot**: tangkap screenshot halaman web, edit, lalu simpan sebagai PDF, JPEG, GIF, PNG, atau BMP.
  - **Proton Pass**: pengelola kata sandi dengan desain elegan, sinkronisasi lintas perangkat.
  - **Immersive Translate**: ekstensi terjemahan dwibahasa yang legendaris, sudah terhubung ke API DeepSeek V4 Flash.
  - **Codex**: wajib untuk menghubungkan Codex ke Chrome. Dengannya kamu bisa mengotomatiskan apa saja di browser — misalnya menulis email banding saat akunmu diblokir.