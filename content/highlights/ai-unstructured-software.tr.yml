  AI çağının yeni yazılım fırsatları nerede yatıyor?

  Büyük bir tanesi: geleneksel yazılımın kaydedemediği kısım — yani yapılandırılmamış arka plan verileri.

  Örneğin gerçekten AI-native bir CRM, müşteriye verilen indirimi kaydederken bu indirimin neden başka bir indirim yerine verildiğini, diğer seçeneklerin neden reddedildiğini ve kimin kimi ikna ettiğini de kaydedebilir.

  Geleneksel yazılım bu türden muazzam miktarda gizli bilgiyi kaydedemiyor. AI çağı, metni ve videoyu anlama yeteneğiyle bu gizli, fazlasıyla tekrarlı bilgiyi analiz için yapılandırılmış veriye çekebiliyor.