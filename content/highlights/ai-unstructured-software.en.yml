  Where do the new software opportunities of the AI era lie?

  A big one: the part that traditional software can't record — in other words, unstructured background data.

  For example, a truly AI-native CRM, when logging a discount given to a client, can also log why this discount was given instead of another, why the other options were rejected, and who talked whom into it.

  Traditional software has a huge amount of hidden information like this that it simply can't record. The AI era, with its ability to understand text and video, can pull this hidden, highly redundant information out into structured data for analysis.