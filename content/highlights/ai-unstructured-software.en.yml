  Where are the new software opportunities in the AI era?

  A fairly big one is processing the part that traditional software can't record — that is, some unstructured background data.

  For example, a truly AI-native CRM, when recording a discount given to a client, can also record why this discount was given rather than another, why other options were rejected, and who persuaded whom in the process.

  Traditional software has too much hidden information like this that can't be recorded, while the AI era can use its understanding of text and video to extract structured data from these hidden, redundant pieces of information for analysis.
