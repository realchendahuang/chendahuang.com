content: |
  A simple tech selection for Docker options on Mac.

  - **Colima**: free and open source, very lightweight, but basically command-line only. Good for people who accept tinkering and are used to the command line.
  - **Apple Container**: Apple's new container direction, worth watching in the future, but the ecosystem is currently weak and still at a very early stage. For example, Docker Compose isn't even supported.
  - **OrbStack**: has a GUI, is light and fast, and has well-developed ecosystem support. The downside is it's not open source — the commercial version requires a license, but the personal version is free.
  - **Docker Desktop**: the official product, but it's heavy and bloated, with a terrible experience. On Mac, avoid it if you can.
