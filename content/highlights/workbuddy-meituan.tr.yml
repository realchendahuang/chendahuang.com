  Tencent'in Workbuddy'sini denedim — şöyle klasik bir senaryo var: Meituan kuponlarını almak.

  Giriş adımında, tarayıp giriş yapmam için bir QR kod üretti.

  Sonra sadece "kuponlarımı almaya git" diye bağırdım ve o da benim için o kadarını alıverdi.

  Kupon alma gibi bir şey için AI ajanı kullanmak — kesinlikle harika.
