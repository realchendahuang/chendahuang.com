content: |
  कल मैंने Command GOAT और OpenCode Go की तुलना पोस्ट की थी, और Command Code के CEO ने खुद आकर टिप्पणी की।

  उन्होंने कहा कि मैं एक मद गिनना भूल गया था — कैशिंग का बिल। मैंने इसमें गहराई से देखा, और Command Code में कुछ खास है।

  एक Coding Agent मूलतः एक विशाल Prefix Cache मशीन है। कई सौ हज़ार टोकन वाले Session में, अगले दौर तक सच में नए टोकन सिर्फ़ कुछ हज़ार ही हो सकते हैं। System prompt, tools, कोड कॉन्टेक्स्ट और बातचीत का इतिहास मुश्किल से बदलता है। कैश हिट दर जितनी ज़्यादा, पुराने कॉन्टेक्स्ट उतने ही सस्ते।

  Command Code ने हाल ही में Cache Thrashing पर एक गंभीर दौर का काम किया, मुख्यतः इन रणनीतियों के साथ:

  Session को उसी GPU Pod पर पिन करें ताकि KV cache गर्म रहे; stable prefix को जितना संभव हो उतना बरकरार रखें और provider fallback को कॉन्टेक्स्ट से छेड़छाड़ न करने दें; साथ ही उनका Tool Call Repair, जहाँ harness गलत मॉडल पैरामीटर को स्थानीय रूप से ठीक करता है, बजाय त्रुटियों को दोबारा कोशिश करने के लिए मॉडल को वापस भेजने के।

  v0.33.0 के चेंजलॉग में सचमुच लिखा है: Major Cache Overhaul, median cost reduction 2.9×। अब वे आधिकारिक तौर पर लगातार 95–99% की कैश हिट दर का दावा करते हैं।

  वही मॉडल, वही $10 प्लान — लेकिन कैशिंग की वजह से, यह अंतर बढ़ते-बढ़ते एक बिल्कुल अलग नतीजे में बदल जाता है।
