content: |
  Делюсь браузерными расширениями, которые я держу при себе годами.

  - **Wetab**: расширение для новой вкладки. Складывай сюда часто используемое, настраивай поисковые системы и синхронизируй между устройствами бесплатно через аккаунт. Я сделал в нём поисковую систему по X на базе Google — она куда лучше встроенной.
  - **Video Speed Controller**: точная регулировка скорости видео, отлично подходит для эффективного усвоения знаний.
  - **XHunt**: маст-хэв для X. Смотри рейтинг каждого KOL и самые горячие посты прямо сейчас.
  - **X Mutual-Follow Radar**: помечает на странице взаимные и односторонние подписки, а также может показывать соотношение following / followers.
  - **FireShot**: захват скриншотов веб-страниц, редактирование и сохранение в PDF, JPEG, GIF, PNG или BMP.
  - **Proton Pass**: элегантно оформленный менеджер паролей с синхронизацией между устройствами.
  - **Immersive Translate**: ветеран двуязычного перевода, подключён к API DeepSeek V4 Flash.
  - **Codex**: незаменим для подключения Codex к Chrome. С ним можно автоматизировать что угодно в браузере — например, написать апелляцию, когда заблокировали аккаунт.