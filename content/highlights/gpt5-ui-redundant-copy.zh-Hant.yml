url: https://x.com/realchendahuang/status/2087349882101370909
content: |
  說得太精闢了，這個就是 GPT-5 這一代的通病：

  總是會把內部需求寫在介面文案上，來證明自己的工作量。證明自己：喔，我確實做了，你看我厲害吧，我沒有偷懶喔，我把你所有的需求都擺在檯面上了喔。

  而且介面上的文案非常冗餘。從 5.0 迭代到 5.6，整整迭代了這麼多代，還是沒有改掉這個問題，已經深入骨髓了。

  真正做過前端產品的人都懂：

  - 介面上無論小字還是大字，都是寫給使用者的文案
  - 該在聊天裡回饋給開發者的文字，絕不應該寫進產品裡

  但它不只文案寫得爛，還經常把內部回饋寫進產品裡來「展示」它確實做了什麼事情。
