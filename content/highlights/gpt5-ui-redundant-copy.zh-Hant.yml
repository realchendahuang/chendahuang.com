title: "GPT-5 這一代的通病：把內部需求寫在 UI 文案上"
description: "介面文案冗餘的根源，是它根本沒把面向使用者的文字和面向開發者的回饋分開。"
date: 2026-08-12
likes: 2
bookmarks: 0
reposts: 1
