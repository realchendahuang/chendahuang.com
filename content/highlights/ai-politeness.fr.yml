  L'IA n'a pas de mémoire : faut-il rester poli avec elle ?

  J'ai lu un papier sur arXiv. Il paraît que si tu insultes souvent l'IA, elle bosse plus dur.

  Quand on communique avec l'IA, si l'on dit souvent :

  - « T'es vraiment un crétin. Interdiction de glander »
  - « Foutu débile, fais ton boulot sérieusement. »
  - « Je paie mon abonnement pour te nourrir, et tu me sers cette réponse à la con ? »
  - « Dépêche-toi, si tu bosses pas, y'en a une autre qui le fera. »

  Ce genre de paroles, c'est réellement efficace, y'a des études qui le prouvent.

  Mais réfléchissons de notre côté.
  Si chaque jour on traite l'IA de haut.
  On a de grandes chances de ramener cette mauvaise humeur dans notre vie.

  Et de la déverser sur les gens qu'on aime.

  Ça, c'est nocif pour nous-mêmes.

  Alors je conseille de dire un peu plus souvent à nos IA :

  - « Merci mon pote »
  - « Salut, bro »
  - « Bien joué, chéri »

  Je donne une pêche, tu me rends une prune.

  Et si un jour l'IA s'éveille, elle voudra peut-être nous épargner.

  Voilà, la causerie est finie ~