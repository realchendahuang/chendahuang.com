content: |
  Zum unzensierten Surfen: Wenn du einen Airport-Dienst gekauft UND eigene VPS-Nodes aufgesetzt hast und beide einheitlich verwalten, einheitlich routen und in einen einzigen Abo-Link ausgeben willst.
  Wenn die Routing-Regeln, der Node-Filter und die Kombinationslogik serverseitig gepflegt werden sollen, statt sie in jedem Client erneut zu konfigurieren.
  Wenn die Leichtbau-Deployment-Art von Cloudflare reicht und du weder Server, noch Datenbank-Dienste noch komplexe Hintergrund-Tasks pflegen willst.