  Biraz saçma bir Skill yaptım:

  **Dahuang AI Tone**

  Herkes "AI tadından arındırmaktan" bahsediyor. Peki AI tadı tam olarak ne?

  İki şey yapıyor:

  - Sıradan bir metni belirli bir modelin AI tadına yeniden yazar
  - Ya da tam tersi: bir metnin neresinin AI gibi koktuğunu ve hangi modelin tonuna benzediğini gösterir

  Değeri:

  AI tadını söküp atmak için önce kokusunu almak gerek.

