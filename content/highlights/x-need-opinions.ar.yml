  على X، لا بد لك من رأي.

  فمن لا رأي له إنما يضيف ضجيج معلومات.

  برأيك المستقل يحفظك الآخرون.

  وبصيرتك النافذة تجعل الآخرين يميلون لمتابعتك.

  ليست X بحاجة إلى عمال نقل، بل إلى من يشقّون الأمور حتى أعماقها.