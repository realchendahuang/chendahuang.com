content: |
  Tôi cảm thấy chúng ta vẫn mới khai thác chưa tới 1% sức mạnh của Cloudflare.

  Nó đã phát hành quá nhiều tính năng.

  - Lưu trữ đối tượng với R2
  - Backend API với Workers
  - AI gateway với AI Gateway
  - Tính toán nặng với Container
  - Cache với KV
  - Cơ sở dữ liệu với D1
  - Đang dùng PostgreSQL? Nối với HyperDrive

  Và đó mới chỉ là khởi đầu — danh sách còn dài dài. Bạn nghĩ ra được gì, nó gần như làm được nấy.

  Điểm đắt giá nhất là nó thực sự rẻ như cho. Riêng gói miễn phí đã đủ dùng rất lâu rồi. Gói miễn phí nghĩa là gì? Nghĩa là không phải trả một xu — một vị bồ tát cyber, một vị thánh thực thụ.
