content: |
  Ich glaube immer stärker: Der Wert von Emotionen ist enorm wertvoll.

  Warum können wir Homo sapiens uns zusammentun, um große Dinge zu tun?

  Eben weil wir gemeinsam an bestimmte Geschichten, bestimmte Emotionen, bestimmte Totems, bestimmte Mythen, bestimmte Narrative glauben – daraus entstehen Organisationen, gegenseitige Zusammenarbeit, Wachstum, gemeinsame Erfolge.

  Ist das nicht ein Wert von Emotionen?