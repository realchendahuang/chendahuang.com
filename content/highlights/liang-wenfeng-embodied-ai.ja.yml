  梁文鋒が投資家会議で言った：
  「知能の終着点はすべて具身（くしん、身体性を持つこと）かもしれない。なぜなら普通の人にとって、必要なのはコンピュータではなく、人手だからだ。」
  この言葉は的確だ。普通の人が欲しいのは、決してもっと賢いコンピュータではなく、実際に働ける「人手」。テキストがどんなに強くても、あくまで中間状態にすぎない。 https://t.co/2xg5o5hNjt