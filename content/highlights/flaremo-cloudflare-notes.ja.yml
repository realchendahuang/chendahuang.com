  Cloudflare 技術スタックでネイティブ開発されたノートアプリ——FlareMo。

  無料の Cloudflare アカウントを登録して、デプロイが終われば、10G のファイルストレージと 5G のデータストレージが手に入る。

  永久無料、設備にお金を使わず、トラフィックにもお金を使わず、データは複数拠点にバックアップされ、生まれつき高可用性の仕組みが付いてる。

  24 時間、いつでもどこでもクラウドで動き、Memos エコシステムと完全互換。

  当時の開発ペース：1 日で基本機能の全体を組み上げ、完全に使える状態まで到達。

  今後はさらに、使い方・デプロイチュートリアル、エンジニアリングテストケース、AI Agent 関連技術、マルチ端末対応を追加していく。Build in public。