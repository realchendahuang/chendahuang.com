content: |
  Saya semakin yakin bahwa nilai emosi sangatlah bernilai.

  Kenapa kita Homo sapiens bisa bersatu untuk melakukan hal-hal besar?

  Justru karena kita secara kolektif percaya pada suatu cerita, suatu emosi, suatu totem, suatu mitos, suatu narasi — itulah yang membentuk organisasi, mendorong kerja sama, membuat kita semakin kuat, dan mewujudkan kehebatan.

  Bukankah itu sendiri adalah semacam nilai emosional?