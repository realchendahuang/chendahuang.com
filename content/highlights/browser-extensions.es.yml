content: |
  Comparto las extensiones de navegador que he ido guardando con cariño durante años.

  - **Wetab**: extensión de nueva pestaña: metes ahí lo de siempre, puedes personalizar el buscador, y con la cuenta logueada se sincroniza gratis entre dispositivos. Me monté en ella un buscador de X basado en Google, mucho mejor que el que trae de serie.
  - **Video Speed Controller**: ajusta la velocidad del vídeo con flexibilidad, ideal para absorber conocimiento de forma eficiente.
  - **XHunt**: imprescindible para jugar en X: te da el ranking de cada KOL y los posts más en boga del momento.
  - **Radar de seguimiento mutuo de X**: marca en la página las relaciones mutuas y unidireccionales, y puedes elegir mostrar el ratio following / followers.
  - **FireShot**: captura la pantalla de una web, la edita y la guarda en PDF, JPEG, GIF, PNG o BMP.
  - **Proton Pass**: gestor de contraseñas de diseño elegante, con sincronización entre dispositivos.
  - **Traducción inmersiva**: la veterana extensión de traducción bilingüe, conectada a la API de DeepSeek V4 Flash.
  - **Codex**: imprescindible para conectar Codex con Chrome: con ella se automatiza cualquier cosa del navegador, como escribir la reclamación si te bloquean la cuenta.