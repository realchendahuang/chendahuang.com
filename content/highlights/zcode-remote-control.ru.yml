content: |
  Безумно хвалю удалённое управление ZCode — это просто эталон дистанционного управления локальным Agent с мобильного.
  Порог входа почти нулевой: регистрируешь аккаунт с телефона, членский взнос не нужен. Сканируешь QR-код на компьютере и заодно привязываешь к WeChat или Feishu.
  А самое крутое — встроенный бесплатный туннель: о сетевой обстановке думать вообще не нужно. Лёг на диван или пьёшь кофе вне дома, отправил сообщение с телефона — и Agent на компьютере в любой момент запускает код.
