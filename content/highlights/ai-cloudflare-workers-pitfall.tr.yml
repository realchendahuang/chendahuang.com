content: |
  Pek çok kişi AI ile Cloudflare projeleri yazdırıyor; işler patladığında sorun sözdiziminde değil.
  Asıl sorunlar şunlar:
  AI'ın Worker'ları Node.js gibi yazması
  Binding'lere process.env muamelesi yapması
  await'i unutması
  istek durumunu global değişkenlerde saklaması
  statik dosya isteklerinin ücretsiz olduğunu bilmemesi
  ve kendi R2'sini Worker içinden REST API ile çağırması
  Bütün bu tuzakları Cloudflare Playbook'ta topladım.
  Bu arada, bir şey daha üzerinde çalıştım