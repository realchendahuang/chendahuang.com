content: |
  Sou um cachorro de chão da escola de Wang Xiaobo,

  ele era divertido, mas não malandro.
  tinha humor, mas com lógica.
  odiava burrice, e também odiava burrice de cara séria.

  Se Wang Xiaobo vivesse na era da IA,

  ele talvez dissesse:

  finalmente existe uma coisa que ajuda a gente comum a fazer menos trabalho chato, e sobra mais tempo pra pensar em coisas realmente interessantes.

  É também por isso que gosto de IA.

  Não porque ela é divina.

  é porque ela reduz a tortura do trabalho entediante pra pessoa.