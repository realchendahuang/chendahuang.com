content: |
  Problem kompatybilności DeepSeek Harness + API trzeciej strony:

  Gdy agent wywołuje narzędzia takie jak Bash, pojawia się błąd `ToolNotFoundError: unknown tool ""`, co wygląda, jakby narzędzie nigdy nie zostało zarejestrowane.

  Co naprawdę się dzieje: bramka (gateway) zwraca inny format danych niż oficjalne API DeepSeeka, a nazwa narzędzia gdzieś po drodze ginie.

  Kilka istotnych linków do GitHub Discussions:

  - Szukaj "unknown tool" w deepseek-ai/dsh#issues
  - Najczęściej trafiają na to osoby prowadzące self-hosted bramki (OpenRouter / OneAPI / new-api)

  Podejście do debugowania: przechwyć pełne żądanie i odpowiedź tool_call i sprawdź, czy nazwa narzędzia w logach bramki jest pustym ciągiem znaków.