title: "O desktop universal de AI Coding não existe — cada modelo fica com o par de origem"
description: "GPT vai para o Codex, Gemini para o AntiGravity, modelos abertos vão para o ZCode — numa casca de terceiros, a degradação do modelo é inevitável."
