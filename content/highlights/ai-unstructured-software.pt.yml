  Onde está a nova oportunidade de software na era da IA?

  Uma oportunidade bem grande é processar aquela parte que o software tradicional não consegue registrar: os chamados dados de contexto não estruturados.

  Por exemplo: um CRM de verdade AI-native, na hora de registrar o desconto dado a um cliente, registra junto por que esse desconto e não outro, por que as outras propostas foram recusadas, e quem convenceu quem dentro disso.

  O software tradicional tem um monte de informação escondida assim que não consegue registrar. Já na era da IA, dá pra usar a capacidade de entender texto e vídeo pra extrair dados estruturados, e analisar toda essa informação redundante e oculta.