content: |
  C'est quoi, la gestion des connaissances ?

  Dès qu'on en parle, le premier réflexe de beaucoup : collectionner des articles, trier des liens, prendre des notes, construire une belle bibliothèque d'infos.

  Mais en première principe, le vrai problème que la gestion des connaissances doit résoudre, c'est :

  **L'info que je vois aujourd'hui, peut-elle continuer à m'aider à décider demain ?**

  La mémoire humaine est limitée, l'attention est limitée, et l'expérience se perd facilement.

  Si une ressource est juste collectionnée, elle finit souvent en cimetière d'infos.

  Une gestion des connaissances qui vaut quelque chose doit accomplir une transformation :

  faire de l'info externe et de l'expérience personnelle une capacité d'action consultable, appelable, réutilisable, à jour.

  - Un article, uniquement collectionné, reste une ressource.
  - Tu en extrais un point de vue, elle devient de l'info.
  - Tu la connectes à tes projets, tes scénarios, tes jugements, elle commence à devenir connaissance.
  - Enfin elle t'aide à écrire des articles, faire des produits, prendre des décisions, concevoir des workflows : c'est là qu'elle devient capacité.

  Donc je suis de plus en plus convaincu que la destination de la gestion des connaissances ne devrait pas être une bibliothèque d'infos.

  C'est plutôt une infrastructure cognitive.

  Elle t'aide à absorber l'info, structurer les jugements, faire décanter les méthodes, et produire en continu du contenu, des produits et des actions.

  Surtout depuis que les agents IA existent, la gestion des connaissances devient plus intéressante.

  Avant on s'appuyait sur l'humain pour trier, classer, chercher, réutiliser.

  À l'avenir, beaucoup d'actions peuvent être confiées à l'agent :

  résumé automatique, tag automatique, association automatique aux projets, génération automatique de plans, rappel automatique des connaissances périmées, et même transformer directement des ressources en articles, plans, diapos et tâches.

  C'est aussi pour ça que la gestion des connaissances m'intéresse récemment.

  En surface, c'est prendre des notes.

  Au fond, c'est construire un système cognitif qui se compose sur le long terme.