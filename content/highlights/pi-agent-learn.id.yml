content: |
  Ada yang bertanya:

  adakah tulisan yang bagus tentang Claude Code untuk dipelajari?

  Jawaban saya: di era AI, selalu berpikir dengan AI — biarkan AI membantumu belajar.

  Kalau kamu benar-benar ingin belajar cara kerja agents,

  pergilah lihat proyek Pi Agent.

  Kecil tapi lengkap — sempurna untuk belajar, dan kualitas kodenya tinggi.

  Claude Code bukan open source; itu kebocoran kode sumber.

  Pi Agent-lah yang benar-benar open source.
