  Un ami m'a demandé : c'est quoi la marque de la batterie externe sur la photo ?

  Bon, je me lance dans l'apologie du produit.

  C'est la CoolState 25 Super Power Bank SE (CoolState, c'est l'ancien ZMI).

  140 yuans, 25 000 mAh, sortie max 120 W, câble de charge intégré.

  Elle fait tenir mon MacBook Air tout un après-midi de boulot intense.

  Le bon plan du bureau en terrasse : Starbucks, McDonald's, KFC, la campagne, tout est bon !