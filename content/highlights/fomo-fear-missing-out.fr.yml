content: |
  Je vous présente un concept, le FOMO, pour Fear of Missing Out, la peur de manquer quelque chose.
  Je suis sûr que beaucoup souffrent de ce truc : tu scrolles un bon truc et tu veux le sauvegarder, tu vois un nouvel outil, une nouvelle tendance et tu veux suivre, tu as toujours l'impression que si tu ne suis pas tu vas rater quelque chose d'important. Résultat : des favoris de plus en plus pleins, un cerveau de plus en plus bordélique, et ton attention se fait grignoter petit à petit dans tout ce processus.