content: |
  Liang Wenfeng ने एक इन्वेस्टर मीटिंग में कहा:
  "बुद्धि का अंतिम छोर शायद सब सन्निहित हो। क्योंकि एक आम इंसान को कंप्यूटर नहीं — मेहनत चाहिए।"
  वे शब्द बिल्कुल सटीक हैं। आम लोगों को कभी स्मार्ट कंप्यूटर नहीं चाहिए; वे "मेहनत" चाहते हैं जो असल में काम निकाल दे। टेक्स्ट कितना भी सक्षम हो, वह सिर्फ़ एक मध्यवर्ती अवस्था है। https://t.co/2xg5o5hNjt