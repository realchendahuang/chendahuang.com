content: |
  После многих лет активного использования macOS — вот программы, которые я счёл по-настоящему отличными:

  - **QuickRecorder**: жемчужина записи экрана — крошечная, но мощная.
  - **ClashParty**: обход блокировок на ядре Mihomo — много протоколов, быстрые обновления и красивый интерфейс.
  - **V2rayN**: обход блокировок, много протоколов; интерфейс слегка устаревший, но стабильный и бесплатный.
  - **Клавиатура Doubao**: голосовой ввод точный до жути. Поддерживает macOS, iOS, Android; Windows в пути.
  - **Brave**: браузер с приоритетом приватности и встроенной фильтрацией рекламы — чище, чем фильтрация расширениями, и лучший спутник для просмотра YouTube.
  - **Mos**: делает прокрутку колесом мыши шёлково-плавной.
  - **Amphetamine**: не даёт ноутбуку засыпать при закрытой крышке — лучший спутник для vibe coding.
  - **UU Remote**: инструмент удалённого рабочего стола от NetEase, бесплатный и быстрый. С ним качество картинки ограничивает не подписка, а твоя скорость сети. Обычно я захожу с телефона на свой Mac, чтобы проверить результаты vibe coding; маппинг клавиш до абсурда эффективный.
  - **Tencent Lemon**: чистильщик мусора для Mac от Tencent — удаление приложений гладкое, а иконка в меню-баре удобная.
  - **Mole**: самый сильный чистильщик мусора для Mac — терминальная версия бесплатная, версия с интерфейсом платная.
  - **Tailscale**: удалённая сеть на базе WireGuard. С ним ты можешь дотянуться до своего домашнего компьютера с края земли.
  - **Obsidian**: в эпоху ИИ — инструмент управления знаниями с приоритетом локальности. Экосистема просто слишком хороша — в паре с официальным браузерным расширением Web Clipper творит чудеса.