content: |
  Many people use AI to write Cloudflare projects, and the failure isn't about syntax.
  The real problems are:
  AI often writes Workers like Node.js
  treats Bindings like process.env
  forgets await
  randomly uses global variables to store request state
  doesn't know static asset requests are free
  calls its own R2 from a Worker via the REST API
  I've organized all these pitfalls into the Cloudflare Playbook.
