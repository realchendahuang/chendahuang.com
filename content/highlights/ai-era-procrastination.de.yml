  Im AI-Zeitalter. Die verbreitetste Prokrastination:
  Tools horten, Kurse kaufen, Communities beitreten, Modelle wechseln, Prompts tunen.
  Jeden Tag hart anstrengen.
  Aber der Frage nie ins Gesicht schauen:
  Habe ich überhaupt ein echtes Geschäft in der Hand, für das es sich lohnt, AI einzusetzen?
  Messer schärfen ist anstrengend.
  Aber viele trauen sich nicht mal, das Schwein zu schlachten.