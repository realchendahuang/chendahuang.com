content: |
  宣言する：

  Cloudflare は本当の AI Native 企業だ。

  AI Agent を中心に開発者体験を作り直してる。

  さっき発表された Temporary Accounts なら、AI Agent がコードを書き終えたらそのままデプロイして、一時 URL を取得し、自分でテストして、自分で繰り返し改善できる。

  シルキーすぎる。

  Cloudflare 公式 Skills と組み合わせて、一行コマンドでインストール：

  `npx skills add cloudflare/skills`

  AI Native って何だよ？

  これこそ AI Native の GOAT。