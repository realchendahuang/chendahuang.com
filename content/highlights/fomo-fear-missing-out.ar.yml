content: |
  أعرّفكم بمفهوم اسمه FOMO، اختصار لـ Fear of Missing Out، أي فوبيا فوات الفرص.
  وأظن كثيرين مصابون بهذا الداء: ترى محتوى رائعاً فتشتهي حفظه، وترى أداة جديدة أو صيحة جديدة فتشتهي ملاحقته، وتظل تحسب أنك إن لم تتبعها، فاتك شيء مهم. فالنتيجة أن محفظتك تمتلئ أكثر فأكثر، وعقلك يزداد تشوشاً، وينهك انتباهك شيئاً فشيئاً في سيرورة كهذه.