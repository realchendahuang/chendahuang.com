  Tuyên bố một quan điểm:

  Code là đòn bẩy của những người bình thường chúng ta.

  Codex là đòn bẩy của đòn bẩy.

  Rút Codex ra, giống như rút củi khỏi đáy nồi — mọi thứ sụp đổ.

  Như người ta nói: nền móng không vững thì núi rung đất chuyển.

  Nào, các AI nội địa — cố lên đi!
