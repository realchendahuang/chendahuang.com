content: |
  So well put — this is the GPT-5 generation's endemic flaw:

  It keeps writing internal requirements into the UI copy to prove its workload. To prove itself — oh look, I really did it, aren't I great, I didn't slack off, I've laid every one of your requirements out on the table.

  And the UI copy is bloated beyond belief. From 5.0 all the way to 5.6 — generation after generation — this still hasn't been fixed. It's in the marrow.

  Anyone who's actually shipped frontend products knows:

  - Every bit of text on the interface, big or small, is user-facing copy
  - Text that belongs in chat feedback to developers should never be written into the product

  But it doesn't just write crappy copy — it often writes internal feedback into the product to "show" that it did something.