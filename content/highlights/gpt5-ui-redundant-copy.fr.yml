title: "Le travers commun à la génération GPT-5 : écrire les besoins internes dans les textes de l'interface"
description: "Si les textes de l'interface sont redondants, c'est qu'il n'a jamais séparé le texte destiné aux utilisateurs du retour destiné aux développeurs."
