content: |
  Tellement juste, c'est le travers commun à toute la génération GPT-5 :

  il écrit toujours les besoins internes dans les textes de l'interface, pour prouver sa charge de travail. Pour montrer : regarde, oui, je l'ai vraiment fait, tu vois comme je suis balèze, je n'ai pas lésiné, j'ai étalé tous tes besoins devant toi.

  Et en plus, les textes de l'interface sont très redondants. De la 5.0 à la 5.6, des générations entières d'itérations, et le problème n'a toujours pas changé : c'est gravé dans les os.

  Ceux qui ont vraiment fait du front le savent :

  - dans l'interface, petit ou grand texte, tout relève du texte adressé à l'utilisateur
  - ce qui doit être remonté aux développeurs dans le chat ne devrait jamais être écrit dans le produit

  Mais lui, non seulement il écrit mal, en plus il écrit souvent des retours internes dans le produit pour « montrer » qu'il a vraiment fait quelque chose.