  Vou soltar uma opinião:

  código é a alavanca da gente, gente comum.

  Codex é a alavanca da alavanca.

  Tirar o Codex da jogada é tirar a lenha da fogueira.

  Como se diz: alicerce frágil, tudo treme.

  As IAs nacionais, acordem logo pro jogo!