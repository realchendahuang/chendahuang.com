  Tôi làm một Skill hơi lố:

  **Dahuang AI Tone**

  Ai cũng nói về "loại bỏ mùi AI". Nhưng rốt cuộc mùi AI là gì?

  Nó làm được hai việc:

  - Viết lại một đoạn văn bản bình thường thành mùi AI của một model được chỉ định
  - Hoặc ngược lại: chỉ ra chỗ nào trong một đoạn văn bản có mùi AI, và giống giọng văn của model nào

  Giá trị của nó:

  Phải ngửi được mùi AI trước, mới biết cách gỡ mùi AI đi.

  GitHub: https://github.com/realchendahuang/dahuang-ai-tone
