  Reduzi a frequência de rolar o X ultimamente.

  Não sei se entrei no modo sábio.

  Depois de me examinar, descobri que me importo mais com uma questão:

  tudo o que rolo todo dia, no fim vira produto real ou não?

  Por mais atualização de ferramenta que eu veja, não bate estourar um cenário específico.

  Nesse período, quero colocar mais energia em produto, comunidade e conteúdo de longo prazo.