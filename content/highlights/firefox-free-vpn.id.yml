  Astaga! Saya baru tahu browser Firefox memberikan 50G trafik VPN gratis per bulan untuk setiap pengguna.

  Sangat membantu untuk dilema ayam-dan-telur yang canggung itu.

  Cara pakai:

  1. Ketik `about:config` di bilah alamat
  2. Masuk ke preferensi lanjutan dan klik "Show all"
  3. Cari `browser.ipProtection.enabled`
  4. Ubah nilai entri itu menjadi true