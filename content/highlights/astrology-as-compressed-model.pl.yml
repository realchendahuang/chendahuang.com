  Wpadłem właśnie na całkiem ciekawy kąt.

  Znaki zodiaku, roczne znaki chińskiego zodiaku, astrologia, wróżby — to wszystko można chyba rozumieć jako "skompresowane modele" z ery ludzkości o niskiej mocy obliczeniowej.

  Starożytni nie mieli baz danych, narzędzi statystycznych ani AI.

  Jedyne, co mogli zrobić, to obserwować pory roku, zjawiska na niebie, kalendarze rolnicze, osobowość, konwencje społeczne i cykle społeczne przez długie okresy, a potem skompresować to złożone doświadczenie w system symboli łatwy do zapamiętania i rozpowszechnienia.

  12 znaków zodiaku, 12 rocznych znaków chińskiego zodiaku, osiem znaków losu, heksagramy — to wszystko w istocie sposoby na zredukowanie złożonego świata do niższych wymiarów.

  Oczywiście nie można ich traktować jako rygorystyczną naukową przepowiednię.

  Ale nie są też koniecznie czystym przesądem.

  To bardziej destylacja doświadczenia — zbudowana przez starożytnych, z historiami, symbolami i regułami, w czasach, gdy mocy obliczeniowej było mało, danych było mało i narzędzi było mało.