  یک نکته‌ی کوچک برای پست‌گذاشتن در X:

  هر پست باید مستقل و خودکفا باشد.

  چون تو مرکزِ جهان نیستی — هیچ‌کس قرار نیست واردِ پروفایلت شود و کلِ ماجرا را تکه‌تکه کنار هم بگذارد.

  اولین بار که یک غریبه به پستت می‌رسد، باید همان لحظه یک نظر یا یک نکته‌ی کاربردی (know-how) بگیرد.

  فقط چنین پست‌هایی ارزش دارند.
