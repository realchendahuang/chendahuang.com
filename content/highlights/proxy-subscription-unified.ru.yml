content: |
  Если ты купил «аэропорт» для обхода блокировок и при этом построил свои VPS-узлы, и хочешь, чтобы они управлялись единообразно, маршрутизировались единообразно и выдавались одной ссылкой подписки.
  Ты хочешь, чтобы правила маршрутизации, фильтрация узлов и логика комбинирования поддерживались на серверной стороне, а не настраивались на каждом клиенте по отдельности.
  Ты хочешь запускать это лёгким развёртыванием на Cloudflare — без серверов, без сервисов баз данных, без сложных фоновых задач для поддержки.