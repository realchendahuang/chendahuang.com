  分享一個寶藏網站：Buzzing

  它適合想拓寬資訊來源、想打破資訊繭房的人。

  它會持續抓取 Hacker News、Reddit、BBC、Reuters、Bloomberg、Product Hunt 等國外熱門內容，並把標題翻譯成中文。

  它最大的價值，是讓你先用中文把標題瀏覽一遍。

  如果看到感興趣的、值得閱讀的文章，再點進去看看詳情。

  這時候可以配合沉浸式翻譯做雙語閱讀。