  의견 하나 밝힌다:

  코드는 우리 같은 보통 사람들의 레버리지다.

  Codex는 레버리지의 레버리지다.

  Codex를 빼내는 것은 곧 솥 밑의 장작을 빼는 것과 같다 — 모든 게 무너진다.

  흔히 말하듯: 기초가 단단하지 않으면 산이 흔들리고 땅이 진동한다.

  자, 국산 AI들아 — 정신 차리고 일어나라!
