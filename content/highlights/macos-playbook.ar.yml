  صنعتُ دليلاً عملياً لـ macOS.

  يناسب من اشترى Mac للتو، ومن انتقل لتوه من Windows إليه، أو من ظل طوال الوقت يحس أن Mac لا يطاوع يده.

  وجمعت فيه:

  - ما يثبّت أولاً بعد شراء Mac
  - كيف يتأقلم مستخدمو Windows مع macOS
  - كيف تختار أدوات مثل Rectangle / AltTab / Homebrew
  - كيف تتعامل عبر الأجهزة المتعددة
  - كيفية ضبط بيئة الطرفية وGit وSSH وبرمجة الذكاء الاصطناعي
  - كيفية صيانة النظام، واستكشاف الأعطال، والنسخ الاحتياطي الآمن، والهجرة إلى جهاز جديد

  Playbook: [chendahuang.com/playbooks](/playbooks)