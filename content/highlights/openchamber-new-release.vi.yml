  OpenChamber vừa ra mắt bản mới. Cảm giác tác giả thật sự đang rất tâm huyết chăm chút dự án này. Đây có thể là dự án open source chăm chút front end nhất mà tôi từng thấy.
  Bộ combo OpenChamber+OpenCode+DeepSeek V4 Flash mà tôi dùng suốt thời gian qua thật sự đã.
