  最近刷 X 的頻率降下來了。

  不知道是不是進入了賢者模式。

  仔細反省之後，我發現自己更關心一個問題：

  我每天刷的這些東西，最後到底能不能變成真實的產品。

  工具更新看再多，不如把一個具體場景打穿。

  接下來這段時間，我想把更多精力放在產品、社群和長期內容上。
