content: |
  اگر برای دور زدنِ فیلترینگ اشتراک خریده باشی و روی VPSِ خودت هم نود گذاشته باشی، و بخواهی یکپارچه مدیریتشان کنی، یکپارچه مسیریابی کنی و به‌صورتِ یک لینکِ اشتراک بیرونشان بدهی.
  می‌خواهی قوانینِ مسیریابی، فیلترِ نودها و منطقِ ترکیب در سمتِ سرور نگهداری شود، نه اینکه توی هر کلاینتی جدا جدا پیکربندی کنی.
  می‌خواهی با روشِ سبکِ Cloudflare اجرایش کنی — بدونِ اینکه مجبور باشی سرور، سرویسِ دیتابیس یا کارهای پیچیده‌ی پس‌زمینه نگهداری کنی.
