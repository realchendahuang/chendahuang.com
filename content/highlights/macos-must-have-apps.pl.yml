content: |
  Po latach intensywnego używania macOS to oprogramowanie, które okazało się naprawdę świetne:

  - **QuickRecorder**: klejnot do nagrywania ekranu – malutki, a potężny.
  - **ClashParty**: omijanie blokad na jądrze Mihomo – mnóstwo protokołów, szybkie aktualizacje i ładny interfejs.
  - **V2rayN**: omijanie blokad z mnóstwem protokołów; UI trochę datowane, ale stabilne i darmowe.
  - **Klawiatura Doubao**: rozpoznawanie głosu z przerażającą dokładnością. Na macOS, iOS, Android; Windows w drodze.
  - **Brave**: przeglądarka z prywatnością na pierwszym miejscu, z wbudowanym filtrowaniem reklam – czyściej niż filtrowanie rozszerzeniami i najlepszy towarzysz oglądania YouTube.
  - **Mos**: sprawia, że kółko myszy przewija się jedwabiście gładko.
  - **Amphetamine**: trzyma laptopa w stanie czuwania przy zamkniętej pokrywie – najlepszy towarzysz vibe codingu.
  - **UU Remote**: narzędzie do zdalnego pulpitu od NetEase, darmowe i szybkie. Dzięki niemu limitem jakości obrazu nigdy nie jest abonament – tylko twoja prędkość sieci. Zwykle używam go, żeby z telefonu wejść zdalnie na mojego Maca i sprawdzić wyniki vibe codingu; mapowanie klawiszy jest absurdalnie wydajne.
  - **Tencent Lemon**: czyściak śmieci na macOS od Tencent – odinstalowywanie aplikacji jest płynne, a ikona w pasku menu wygodna.
  - **Mole**: najmocniejszy czyściak śmieci na Maca – wersja terminalowa darmowa, wersja z UI płatna.
  - **Tailscale**: zdalne sieciowanie oparte na WireGuard. Dzięki niemu dosięgniesz swojego małego domowego komputera z krańców ziemi.
  - **Obsidian**: w erze AI narzędzie do zarządzania wiedzą z priorytetem plików lokalnych. Ekosystem jest po prostu za dobry – zestaw z oficjalnym rozszerzeniem Web Clipper do przeglądarki działa cuda.