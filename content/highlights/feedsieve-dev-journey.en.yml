  I got so annoyed by garbage accounts like "Fu Bu Hei" lately.
  
  In a fit of anger, I wrote a browser extension — it's called "FeedSieve".
  
  After several rounds of iteration it's in a good place, and it's about to go live.
  
  For those who need it, bookmark this — I'll open-source it and put it on the Chrome Web Store soon.
