  He hecho un Skill un poco desquiciado:

  **Dahuang AI Tone**

  Todo el mundo habla de «quitar el olor a IA». Pero ¿qué es exactamente el olor a IA?

  Hace dos cosas:

  - transforma un texto normal para que tenga el olor a IA de un modelo concreto
  - y a la inversa, señala qué parte de un texto parece de IA y a qué modelo imita

  Su valor:

  primero hay que oler el olor a IA, para saber cómo quitarlo.

  GitHub: https://github.com/realchendahuang/dahuang-ai-tone