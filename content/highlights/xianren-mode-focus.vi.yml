  Dạo này tần suất lướt X của mình giảm hẳn.

  Không biết có phải mình đã vào chế độ tiên nhân rồi không.

  Thành thật soi lại mình, mình nhận ra có một câu hỏi mình quan tâm hơn tất thảy:

  thứ mình lướt qua mỗi ngày, liệu có thể kết tinh thành một sản phẩm thật không?

  Xem trăm cái cập nhật công cụ cũng không bằng bứt phá được một tình huống cụ thể.

  Dạo này mình muốn dồn nhiều năng lượng hơn vào sản phẩm, cộng đồng và nội dung dài hơi.
