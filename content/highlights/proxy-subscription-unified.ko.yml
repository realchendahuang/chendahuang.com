content: |
  인터넷 검열 우회용 에어포트(airport)를 샀고 자체 VPS 노드도 만들었다면, 이것들을 통합 관리하고, 통합 분기하고, 구독 링크 하나로 통합 출력하고 싶을 것이다.
  분기 규칙, 노드 필터링, 조합 로직을 서버 쪽에서 유지 관리하고 싶지, 클라이언트마다 반복해서 설정하고 싶지는 않을 것이다.
  Cloudflare의 경량 배포 방식으로 돌리고 싶지, 서버와 데이터베이스 서비스, 복잡한 백그라운드 작업을 관리하고 싶지는 않을 것이다.
