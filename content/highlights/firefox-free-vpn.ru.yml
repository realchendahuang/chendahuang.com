  Офигеть! Только что узнал: браузер Firefox выдаёт каждому пользователю 50 ГБ бесплатного VPN-трафика в месяц.

  Очень выручает в этой неловкой ситуации с курицей и яйцом.

  Как пользоваться:

  1. Введите `about:config` в адресной строке
  2. Зайдите в расширенные настройки и нажмите «Показать все»
  3. Найдите `browser.ipProtection.enabled`
  4. Переключите значение в true