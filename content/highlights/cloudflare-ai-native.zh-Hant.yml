  我宣布：

  Cloudflare 是真正的 AI Native 公司。

  它真的在圍繞 AI Agent 重做開發者體驗。

  剛發布的 Temporary Accounts 可以讓 AI Agent 寫完程式碼，直接部署，拿到臨時 URL，自己測試，自己迭代。

  絲滑的一批。

  結合 Cloudflare 官方 Skills，一行指令安裝：

  `npx skills add cloudflare/skills`

  什麼叫 AI Native 啊？

  這才是 AI Native 的 GOAT。