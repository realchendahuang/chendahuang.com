  معرفی یک وبسایت گنجینه: Buzzing

  برای هر کسی که میخواهد منابع اطلاعاتیش را گستردهتر کند و از حباب اطلاعاتی خودش بیرون بزند مناسب است.

  مدام محتوای داغ را از Hacker News، Reddit، BBC، Reuters، Bloomberg، Product Hunt و دیگر منابع خارجی جمع میکند و تیترها را به چینی ترجمه میکند.

  بزرگترین ارزشش: میتوانی اول تیترها را به چینی مرور کنی.

  اگر چیزی توجّهت را جلب کرد و ارزش خواندن داشت، کلیک کن و برو سراغ جزئیاتش.

  در آن مرحله هم کنارش از Immersive Translate برای خواندن دوزبانه استفاده کن.