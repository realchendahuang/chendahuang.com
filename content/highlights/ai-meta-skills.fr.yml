content: |
  À l'ère de l'IA, la compétence la plus importante, ce sont les méta-compétences.

  Autrement dit, ces savoir-faire de base qui restent utiles même quand tu changes d'outil, de modèle ou de secteur.

  - Est-ce que tu sais exposer clairement un problème ?
  - Est-ce que tu sais mettre de l'ordre dans un tas de matériaux en vrac ?
  - Est-ce que tu sais découper une idée floue en étapes ?
  - Est-ce que tu sais voir où l'IA a raison et où elle déblatère ?
  - Est-ce que tu sais batailler avec l'IA pour transformer une réponse brute en quelque chose d'utilisable ?

  Tout ça vaut plus cher qu'une collection d'outils.

  Les outils changent chaque jour, les modèles se succèdent.

  Mais celui qui sait questionner, organiser, juger, découper et valider, où qu'il aille, il se fait amplifier par l'IA.

  Ce qui creuse vraiment l'écart à l'ère de l'IA, c'est peut-être ces méta-compétences qui semblent basiques mais qui valent le plus sur le long terme.