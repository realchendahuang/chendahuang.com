  X 投稿の小発見をシェア：

  どのポストにも独立性を持たせよう。

  なぜならあなたは世界の中心じゃないから。わざわざあなたのプロフィールを開いて、事の経緯を理解してくれる人はいない。

  初めてあなたを見かけた他人は、即座に一つの意見、あるいは一つの know-how を得られるべきだ。

  そういうポストこそ、価値がある。