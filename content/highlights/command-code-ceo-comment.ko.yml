content: |
  어제 Command GOAT와 OpenCode Go의 비교 글을 올렸는데, Command Code의 CEO가 직접 찾아와 댓글을 달았다.

  그는 내가 항목 하나를 놓쳤다고 했다 — 캐시 비용. 파고들어 보니 Command Code는 뭔가가 있다.

  Coding Agent는 본질적으로 거대한 Prefix Cache 머신이다. 수십만 토큰짜리 세션도 다음 라운드로 넘어가면 진짜로 새로 생긴 토큰은 수천 개에 불과할 수 있다. 시스템 프롬프트, 도구, 코드 컨텍스트, 대화 기록은 거의 변하지 않는다. 캐시 적중률이 높을수록 그 오래된 컨텍스트는 더 싸진다.

  Command Code는 최근에 제대로 한 라운드의 Cache Thrashing 작업을 진행했는데, 주로 이런 전략들이다:

  세션을 같은 GPU pod에 고정해 KV cache를 따뜻하게 유지하고; 안정적인 prefix를 최대한 온전하게 유지해 provider 폴백이 컨텍스트를 망치지 못하게 하며; 거기에 그들의 Tool Call Repair — 모델이 파라미터를 잘못 쓰면 harness가 로컬에서 바로 고쳐서, 모델에게 에러를 돌려보내 재시도시키지 않는다.

  v0.33.0 체인지로그에는 말 그대로 이렇게 적혀 있다: Major Cache Overhaul, median cost reduction 2.9×. 이제 공식적으로 캐시 적중률 95–99%를 지속적으로 달성한다고 주장한다.

  같은 모델, 같은 $10 요금제 — 하지만 캐싱 때문에 생긴 차이는 쌓이고 쌓여 완전히 다른 결과를 만들어 낸다.
