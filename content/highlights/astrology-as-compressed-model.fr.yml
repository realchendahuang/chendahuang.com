content: |
  Je viens de penser à un angle plutôt intéressant.

  Les signes astrologiques, les animaux du zodiaque, les astres, la divination — tout ça, on peut peut-être le comprendre comme des « modèles compressés » de l'ère où l'humain avait une faible puissance de calcul.

  Nos anciens n'avaient ni base de données, ni outils statistiques, ni IA.

  Ils ne pouvaient qu'observer sur la durée les saisons, le ciel, le calendrier agricole, les caractères, les rapports humains et les cycles sociaux, puis compresser toute cette expérience complexe en un système de symboles facile à mémoriser et à transmettre.

  12 signes astrologiques, 12 animaux du zodiaque, les huit caractères du BaZi, les hexagrammes — au fond, tout ça c'est comme réduire la complexité du monde en dimension inférieure.

  Évidemment, ça ne peut pas servir de prédiction scientifique stricte.

  Mais ce n'est pas forcément que de la superstition pure non plus.

  C'est plutôt une distillation d'expérience, faite avec des récits, des symboles et des règles, à une époque où nos anciens manquaient de puissance de calcul, de données et d'outils.