  Zajęło mi to chwilę, ale wdrożyłem Sub-Store na Cloudflare.

  Połączyłem moje własne węzły i zapasowe węzły z airportu w jedno i dopiąłem reguły routingu ACL4SSR na automatycznej subskrypcji.

  Załatwione jednym linkiem subskrypcji:

  - Scalanie węzłów od wielu dostawców
  - Filtrowanie węzłów
  - Konfiguracja reguł routingu
  - Automatyczna aktualizacja konfiguracji

  Gładsze niż gładkie.