content: |
  Ich finde, DeepSeek Harness hat die Formfrage perfekt gelöst.
  
  Statt direkt in eine menschenfeindliche TUI zu springen, liefert es eine Web UI.
  
  Und es braucht kaum Speicher — weil es gar keinen Installer gibt. Kein Electron-Framework, das einen Browser-Engine hineinzwängt. Das spart eine Menge Speicher.
  
  Der einzige Nachteil: Man nutzt es im Browser. Dabei kann man es einfach als PWA-Programm installieren. Dann ist es von einem nativen Client kaum zu unterscheiden.
  
  Webseiten über Chrome als App zu installieren ist eine wirklich praktische Funktion. In meinem Screenshot hier ist es zwar eine Webseite, fühlt sich aber in der Nutzung nicht anders an als eine Desktop-Anwendung.
