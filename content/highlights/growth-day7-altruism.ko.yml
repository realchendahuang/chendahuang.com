content: |
  운영 7일 차에 팔로워 2000 돌파 — 짧게 복기해 본다.

  핵심은 한 단어: 이타심.

  주로 두 종류의 실용 콘텐츠를 공유했다:

  - macOS 헤비 유저용 소프트웨어 목록 (조회 48k)
  - Cloudflare 무료 할당량 표 + Playbook (X에서 성적이 괜찮았고, 어떤 형님이 퍼다가 표절해서 Zhihu에 올리기까지 해서 몇 백 개나 북마크를 받기도 했다)
  - 그리고 OPC 1인 기업 리소스 추천 (조회 38k)

  팔로워를 어떻게 늘릴까 같은 건 생각하지 않았다. 그냥 연구해서 정리한 것들을 공짜로 내놓았다. 그런데 오히려 더 빨리 늘었다.

  앞으로도 이런 실용 콘텐츠를 계속 낼 예정이다. 응원해 주셔서 감사합니다.
