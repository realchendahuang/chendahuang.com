content: |
  DeepSeek Harness는 폼 팩터를 제대로 잡았다고 생각한다.

  반인간적인 TUI부터 들이미는 대신, Web UI를 기본으로 내놓는다.

  그리고 저장 공간을 거의 차지하지 않는다 — 설치 프로그램이 아예 없기 때문이다. Electron 같은 프레임워크로 브라우저 엔진을 억지로 우겨 넣지 않는다. 그 덕에 저장 공간이 크게 절약된다.

  유일한 단점은 브라우저 안에서 산다는 것 — 하지만 PWA로 설치하면 네이티브 클라이언트와 전혀 다를 바 없이 느껴진다.

  Chrome으로 웹 앱을 애플리케이션처럼 설치하는 기능은 정말 유용하다. 여기 스크린샷 속 페이지도 웹페이지이지만, 데스크톱 앱과 다를 바 없이 동작한다.
