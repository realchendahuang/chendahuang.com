title: "DeepSeek Harness는 형태를 제대로 잡았다"
description: "앞에서부터 비인간적인 TUI를 들이밀지 않고 Web UI를 기본으로 제공한다. 설치 프로그램도 없고, 브라우저 엔진도 우겨 넣지 않아 저장 공간을 거의 차지하지 않는다."
