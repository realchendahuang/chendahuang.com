content: |
  AI 시대에 가장 중요한 능력은 메타 스킬이다.

  쉽게 말하면, 도구를 바꾸고 모델을 바꾸고 업계를 바꿔도 여전히 통하는 바탕 능력이다.

  - 문제를 명확하게 말할 수 있는가?
  - 뒤죽박죽인 자료를 정리해 의미를 파악할 수 있는가?
  - 막연한 아이디어를 여러 단계로 쪼갤 수 있는가?
  - AI가 맞는 말을 하는지 헛소리를 하는지 분간할 수 있는가?
  - AI와 주고받으며 거친 답변을 쓰임새 있는 것으로 다듬을 수 있는가?

  이런 것들은 도구를 잔뜩 쌓아 두는 것보다 값지다.

  도구는 매일 바뀌고, 모델도 세대를 거듭해 교체된다.

  하지만 질문하고, 정리하고, 판단하고, 분해하고, 검증할 줄 아는 사람은 어디서든 AI로 자신을 확장할 수 있다.

  AI 시대에 진짜 차이를 만드는 것은 아마 바로 이런 메타 스킬일 것이다. 기초처럼 보이지만 장기적으로 가장 값진 능력이다.
