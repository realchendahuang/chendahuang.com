  Suelto una opinión:

  el código es la palanca de la gente corriente.

  Codex es la palanca de la palanca.

  Quitar a Codex es quitarle la leña al fuego por debajo de la olla.

  Como dice el refrán: si los cimientos no son sólidos, tiembla la tierra y se tambalean las montañas.

  ¡Las IA de casa, espabilaros ya!