content: |
  Vou apresentar um conceito: FOMO, sigla de Fear of Missing Out — o medo de ficar de fora.
  Aposto que muita gente tem esse defeito: viu coisa boa, já quer colecionar; conheceu ferramenta nova, tendência nova, já quer seguir; sempre com medo de que, se não correr atrás, vai perder algo importante. Resultado: o favoritos fica cada vez mais cheio, a cabeça cada vez mais bagunçada, e a atenção vai sendo consumida gota a gota nesse processo.