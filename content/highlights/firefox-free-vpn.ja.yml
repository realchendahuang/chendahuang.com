  なんてこった！ Firefox ブラウザがユーザーごとに毎月 50G の無料 VPN トラフィックを提供してるのを今知った。

  「鶏が先か卵が先か」みたいな困ったシチュエーションに、とても役立つ。

  使い方：

  1. アドレスバーに `about:config` を入力
  2. 詳細設定に入って「すべて表示」をクリック
  3. 検索欄に `browser.ipProtection.enabled` を入力
  4. その項目の値を true に切り替え