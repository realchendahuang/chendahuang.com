  Compartilhando uma dica pequena de postar no X:

  todo post precisa ter independência.

  Porque você não é o centro do mundo; ninguém vai clicar no seu perfil de propósito pra entender o contexto da história.

  Um estranho, na primeira vez que passa pelo seu post, deveria sair com uma opinião, ou um know-how, na hora.

  Um post assim é que tem valor.