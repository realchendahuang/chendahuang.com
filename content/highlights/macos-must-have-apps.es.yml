content: |
  Tras años usando macOS a fondo, te resumo estos programas de la hostia:

  - **QuickRecorder**: la herramienta de grabación de pantalla definitiva: pequeñísima, y con un poder bestial.
  - **ClashParty**: para la evasión de censura, con núcleo Mihomo, muchos protocolos, actualizaciones rápidas y una interfaz bonita.
  - **V2rayN**: evasión de censura, muchos protocolos; la interfaz es algo retro, pero estable y gratis.
  - **Input de Doubao**: el dictado por voz es certero a rabiar; soporta macOS, iOS y Android; Windows va de camino.
  - **Brave**: el navegador con la privacidad por bandera, con filtro de anuncios integrado que limpia mejor que las extensiones; el mejor compañero para ver YouTube.
  - **Mos**: hace que la rueda del ratón ruede con más suavidad.
  - **Amphetamine**: evita que tu portátil apague la pantalla al cerrar la tapa; el mejor compañero para Vibe Coding.
  - **UU Remote**: la herramienta de escritorio remoto de NetEase, gratis y rápida. Con ella, lo que limita la calidad de imagen nunca es la membresía, sino la velocidad de la red. Normalmente la uso para controlar mi macOS desde el móvil y ver el resultado del Vibe Coding: el mapeo de teclas es eficientísimo.
  - **Tencent Lemon**: el limpiador de basura de macOS de Tencent; desinstalar software va finísimo y el icono de la barra de estado también es útil.
  - **Mole**: el limpiador de basura más potente de macOS; la versión de terminal es gratis, la de UI es de pago.
  - **Tailscale**: software de redes remotas entre sitios basado en WireGuard. Con él te conectas desde el fin del mundo al pequeño ordenador de tu casa.
  - **Obsidian**: en la era de la IA, la herramienta de gestión del conocimiento local-first. El ecosistema es buenísimo, y en combinación con el recortador Web Clipper oficial hace maravillas.