  Frekuensi scroll X-ku belakangan menurun.

  Entah apakah aku sudah masuk mode bijak.

  Setelah introspeksi jujur, aku sadar aku paling peduli satu pertanyaan:

  bisakah hal-hal yang kus scroll setiap hari berubah menjadi produk yang nyata?

  Menonton seratus update tools tidak ada lawannya dengan menembus satu skenario yang konkret.

  Belakangan ini aku ingin menaruh lebih banyak energi ke produk, komunitas, dan konten jangka panjang.
