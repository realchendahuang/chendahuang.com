  मैं Wang Xiaobo का पक्का अनुयायी हूँ।

  वह बुद्धिमान हैं, लेकिन कभी चालाक नहीं।
  वह मज़ाकिया हैं, लेकिन हमेशा तर्कसंगत।
  वह मूर्खता से नफ़रत करते थे — और उस गंभीर, संजीदा मूर्खता से भी उतनी ही नफ़रत करते थे।

  अगर Wang Xiaobo AI युग में होते,

  तो शायद कहते:

  आख़िरकार कुछ ऐसा आया जो आम लोगों की बेवकूफ़ी भरी मेहनत थोड़ी कम करता है और सच में दिलचस्प सोच के लिए थोड़ा और समय बचाता है।

  यही वजह है कि मुझे AI पसंद है।

  इसलिए नहीं कि यह दिव्य है।

  बल्कि इसलिए कि यह लोगों को नीरस काम की कुछ पीड़ा से बचा सकता है।