content: |
  今日、友達がコメント欄で一人会社に関する株式責任の問題をシェアしてくれた。

  まず、この親切な注意に感謝したい。

  彼の見解は、自分の家族に最低 1% の株式を持たせるべきだ、というもの。

  一人有限会社の問題は、株主が一人だけのとき、会社のお金と個人のお金が分かれていると説明できないと、株主が会社の債務に対して連帯責任を負う可能性があることだ。『会社法』第 23 条がこのロジック。

  会社に株主が複数いれば、会社は「一人会社」から「普通の有限責任会社」に変わり、一人会社特有の立証リスクを避けられ、自分に一層の低コストな緩衝を加えられる。

  みんなの参考になれば。

  でも普段から注意すべきは、公私のお金の帳簿を明確に分けること。重要な送金は一筆ずつ説明できるように努めよう。

  - お金がどこから来て、なぜ来て、どの口座に入ったのか。
  - お金がどこへ行き、なぜ払い、誰が承認したのか。
  - 会社から受け取るお金が、給料か、経費精算か、借入か、配当か。

  この三つのことをちゃんと説明できれば、リスクを大幅に下げられる。