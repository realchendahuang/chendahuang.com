  Судит человек. Усиливает ИИ.

  Внимание человека ограничено. Человек занимается только самой критичной частью суждений.

  Нужно тратить своё ограниченное внимание там, где оно чего-то стоит, а ИИ отдавать больше черновой работы.

  В этом весь смысл ИИ-воркфлоу.

  Пусть ИИ-воркфлоу забирает на себя всю черновую работу; человек берёт на себя финальное суждение — проверку или приёмку самых ценных, самых ключевых, итоговых результатов.

  Вот к какому состоянию я хочу прийти. Я последнее время как раз в свободное время изучаю такие воркфлоу.