content: |
  ZCode のリモートコントロールは本当に推したい。モバイルからローカル Agent を遠隔指揮する手本のような存在です。
  操作コストはほぼゼロ：スマホでアカウントを登録するだけで、有料会員も不要。パソコンの QR コードをスキャンして、そのついでに WeChat か Feishu に紐付ければ完了。
  いちばん強いのは内蔵の無料トンネリングで、ネット環境は完全に無視できる。ソファに横になっても、出先でコーヒーを飲んでいても、スマホからメッセージを 1 通送るだけで、いつでもパソコンの中の Agent にコードを走らせられます。
