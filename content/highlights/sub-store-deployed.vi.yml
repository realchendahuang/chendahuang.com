content: |
  Mất một khoảng thời gian, nhưng cuối cùng mình đã triển khai được Sub-Store trên Cloudflare.

  Gộp node tự dựng và node dự phòng của sân bay thành một, kèm quy tắc route ACL4SSR tự cập nhật.

  Xong xuôi chỉ với một link subscription duy nhất:

  - Gộp node từ nhiều nhà cung cấp
  - Lọc node
  - Cấu hình quy tắc route
  - Tự động cập nhật cấu hình

  Mượt còn hơn mượt.
