content: |
  Os cuento mi experiencia poniéndole nombre a mi empresa.

  Usé GPT 5.5 y Gemini 3.1 Pro. Con estos dos modelos hice sesiones de brainstorming de lo más intensas, y llevaba dos o tres días sin dar con un buen nombre.

  ¿Por qué? Porque descubrí que estos modelos no innovan. Las opciones de nombre que te dan son puro apilamiento de palabras bonitas y combinaciones de caracteres.

  Si les propones tus propias ideas, te las devuelven dándole vueltas y más vueltas al mismo círculo, hasta que me subió la tensión.

  Hay otro problema gordo: cuando por fin das con unos cuantos nombres que te convencen, abres Qichacha y… vaya, o ya están registrados, o hay otros que se parecen.

  Ahí te recomiendo el 88cha de Alibaba, parecido a Qichacha pero gratis: sirve para comprobar si hay nombres parecidos ya cogidos.

  Si no quieres repetirte siempre, lo mejor es elegir nombres de cuatro caracteres, y con unas ideas de lo más abiertas.

  Tienes que cambiar de modelo varias veces, cambiar de «cerebro».

  Puedes darle a la IA buenos nombres como referencia, por ejemplo DeepSeek 深度求索, ByteDance 字节跳动.

  Esos nombres que tú consideras buenos, déjaselos a la IA para que los use como referencia. Solo juntando lo mejor de cada casa sale un nombre de la hostia.