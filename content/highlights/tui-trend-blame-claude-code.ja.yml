content: |
  最近、AI Coding Agent がやれ TUI だのなんだのやたら採用するけど、この風潮については、Claude Code が大きな責任を負うべきです。
  ターミナルで AI と対話しながらコードを書くということを、極限までやり切ったのは事実。
  でも問題は、どうも「本当にハイレベルな Coding Agent はデフォルトでターミナル UI であるべき」みたいな空気になっていて、Web 版はどちらかというとおまけ扱い、下手をするとプログラマーらしくないと嘲笑される始末。
  で、その結果？
  まずは複雑な TUI を用意して
  色とりどりの配色、ステータスバー、ショートカット、モード切り替え
  それから「没入型」「効率的」「プログラマーを尊重」と美名を冠する
  マジで？
  毎日ターミナルに浸かってる一部の人にとっては、確かに最高だ。でももっと多くの人にとっては、ただ人為的にハードルを作ってるだけ。機能はキーとモードの裏に隠れて、新規ユーザーはお手上げ、ベテランだって各ツール独自のキーバインドに一から慣れ直す羽目になる。
  Web UI だって、速くてクリーンなものは普通に作れる。PWA として入れてしまえばデスクトップアプリとほぼ変わらないし、更新ももっと手軽。それなのに無理やり 80 年代のターミナルパラダイムに押し戻しておいて、逆に Web を見下すのは、よほどの自己満だ。
  Claude Code 自体は強い、そこは問題ない。ただ「TUI こそ正統」という美意識と経路依存を流行らせてしまって、その後を追う連中のやらかしがさらにひどい。
  ツールは人が使うためのもので、「誰がよりオタクか」を証明するためのものじゃない。
  人間向きじゃないインタラクションをハイエンド風に包装するのは、本当に滑稽なことだ。
