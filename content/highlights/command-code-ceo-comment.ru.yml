content: |
  Вчера я опубликовал сравнение Command GOAT и OpenCode Go, и CEO Command Code лично пришёл комментировать.
  
  Он сказал, что я упустил одну статью расходов — счёт за кэширование. Я копнул, и у Command Code действительно что-то есть.
  
  Coding Agent — это по сути гигантская машина для Prefix Cache. Сессия на несколько сотен тысяч токенов — к следующему кругу по-настоящему новых может быть всего несколько тысяч. Системный промпт, инструменты, контекст кода и история диалога почти не меняются. Чем выше доля попаданий в кэш, тем дешевле обходятся эти старые контексты.
  
  Command Code недавно серьёзно прошлись по Cache Thrashing, в основном такими стратегиями:
  
  Пиновать сессии на один и тот же GPU pod, чтобы KV cache оставался тёплым; держать стабильный префикс как можно более целостным и не давать фолбэкам провайдера ломать контекст; плюс их Tool Call Repair, где харнесс чинит неверные параметры модели на месте, вместо того чтобы отправлять ошибку обратно модели на повтор.
  
  В чейнджлоге v0.33.0 прямо написано: Major Cache Overhaul, median cost reduction 2.9×. Теперь они официально заявляют стабильную долю попаданий в кэш на уровне 95–99%.
  
  Та же модель, тот же тариф за $10 — но из-за кэширования разница накапливается в совершенно разный результат.
