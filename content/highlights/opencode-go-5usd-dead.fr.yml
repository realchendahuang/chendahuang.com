content: |
  L'OpenCode Go « génial à 5 $ » que tout le monde vantait sur X s'est complètement effondré.
  
  OpenCode Go avait autrefois une offre à 5 $ le premier mois qui maintenait son bon rapport qualité-prix — désormais, même ça, c'est fini, 10 $ dès le départ.
  
  En comparaison, les formules Command GOAT du concurrent commencent à avoir de plus en plus de gueule.
  
  DeepSeek V4 Flash, GLM-5.3 Flash, GLM-5.3 — ce sont les modèles vraiment adaptés au coding intensif et à l'exécution d'agents en ce moment.
  
  En fait, je classe désormais les modèles de coding en deux catégories simples : les modèles principaux et les bêtes de somme.
  
  V4 Pro, GLM-5.3 et compagnie sont les modèles principaux, chargés de ronger les os durs. Architectures complexes, bugs coriaces, grosses refactorisations, décisions clés : quand le problème est vraiment difficile, on leur confie.
  
  V4 Flash et GLM-5.3 Flash sont les bêtes de somme. Lire des repos, fouiller le code, modifier des fichiers, lancer des tests, du traitement par lots, défricher : ce genre de boulot ingrat, c'est exactement pour que Flash s'y épuise.
  
  La formule Command GOAT offre un quota confortable pour les bêtes de somme, et sans lacune évidente pour les modèles principaux non plus.
  
  Alors je le déclare : la formule Command GOAT est la réponse définitive de la version actuelle.
