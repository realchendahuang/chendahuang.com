content: |
  Дал шанс Workbuddy от Tencent — есть такой классический сценарий: получение купонов Meituan.

  На шаге входа он сгенерировал QR-код, чтобы я отсканировал и вошёл.

  Потом я просто рявкнул «иди получи мои купоны» — и он сходил и получил столько-то для меня.

  Использовать ИИ-агента для чего-то вроде получения купонов — абсолютно потрясающе.