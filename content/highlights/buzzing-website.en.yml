  Sharing a treasure site: Buzzing

  It's for people who want to broaden their information sources and break out of their information cocoon.

  It continuously fetches hot content from Hacker News, Reddit, BBC, Reuters, Bloomberg, Product Hunt, and other foreign sources, and translates the titles into Chinese.

  Its biggest value is letting you first browse the titles in Chinese.

  If you see an article that interests you and is worth reading, click in to see the details.

  At that point you can pair it with Immersive Translate for bilingual reading.
