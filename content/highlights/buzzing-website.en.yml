  Sharing a treasure of a site: Buzzing

  It's for anyone who wants to widen their information sources and bust out of their echo chamber.

  It continuously pulls hot content from Hacker News, Reddit, BBC, Reuters, Bloomberg, Product Hunt and other foreign sources, and translates the headlines into Chinese.

  Its biggest value: you get to skim the headlines in Chinese first.

  If something catches your eye and looks worth reading, click in for the details.

  At that point, pair it with Immersive Translate for bilingual reading.