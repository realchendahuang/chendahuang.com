content: |
  Saya adalah murid setia Wang Xiaobo.

  Ia jenaka, tapi tidak licin.
  Ia lucu, tapi selalu logis.
  Ia membenci kebodohan — dan ia sama bencinya dengan kebodohan yang khusyuk dan serius.

  Seandainya Wang Xiaobo hidup di era AI,

  mungkin ia akan berkata:

  akhirnya, ada sesuatu yang bisa membuat orang biasa mengurangi sedikit kerja bodoh dan menyisakan lebih banyak waktu untuk memikirkan hal-hal yang benar-benar menarik.

  Itu juga alasan saya menyukai AI.

  Bukan karena ia ilahi.

  Tapi karena ia bisa menyelamatkan orang dari sedikit siksaan pekerjaan yang membosankan.
