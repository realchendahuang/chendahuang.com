  Seorang teman bertanya, power bank di foto itu merek apa.

  Baiklah, saatnya saya mulai berpromosi.

  Ini CoolState Power Bank No. 25 Super SE (CoolState adalah Zimi yang dulu).

  Sedikit di atas 140 yuan, 25.000 mAh, output hingga 120W, kabel chargenya sudah bawaan.

  Ia membuat MacBook Air saya bertahan sepanjang sore kerja berat.

  Teman kantor yang sempurna untuk Starbucks, McDonald's, KFC, pedesaan, dan semua tempat lainnya!