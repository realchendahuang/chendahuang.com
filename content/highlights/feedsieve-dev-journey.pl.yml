  Ostatnio strasznie wkurzały mnie konta spam, takie jak "Fu Bu Hei".

  W przypływie złości napisałem rozszerzenie przeglądarki — nazywa się "FeedSieve".

  Po kilku rundach iteracji jest w dobrym miejscu i zaraz wejdzie na żywo.

  Dla tych, którzy tego potrzebują, zapiszcie to — wkrótce zrobię z tego open source i wrzucę do Sklepu Chrome Web.
