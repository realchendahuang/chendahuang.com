  В последнее время я обдумываю один план.
  Перенести всё моё личное управление знаниями, сбор информации и выдачу знаний целиком на Cloudflare.
  Бесплатный аккаунт уже даёт 10 ГБ объектного хранилища и 5 ГБ базы данных.

  По сути, это самостоятельно размещённая, облачная, вечно бесплатная система управления знаниями.