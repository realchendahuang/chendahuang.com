content: |
  Fan absolu du contrôle à distance de ZCode — l'exemple parfait du pilotage d'un Agent local depuis le mobile.
  Le coût de mise en route est quasi nul : on crée un compte depuis son téléphone, sans prendre d'abonnement premium. On scanne le QR code affiché sur l'ordinateur, et on en profite pour le lier à WeChat ou Feishu.
  Le plus fort, c'est le tunneling gratuit intégré : plus aucune préoccupation réseau. Allongé sur le canapé ou en train de boire un café dehors, un message depuis le téléphone suffit pour solliciter à tout moment l'Agent de votre ordinateur et lui faire tourner du code.
