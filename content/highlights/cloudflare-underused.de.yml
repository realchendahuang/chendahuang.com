content: |
  Ich habe das Gefühl, Cloudflare wird von den meisten noch zu unter 1 % ausgeschöpft.

  Es sind inzwischen viel zu viele Features.

  - Objektspeicher: R2
  - Backend-API: Worker
  - AI-Gateway: AI Gateway
  - Rechenintensives: Container
  - Cache: KV
  - Datenbank: D1
  - Für PostgreSQL: per HyperDrive andocken

  Und so weiter, und so fort – denk dir was aus, es hat es schon.

  Vor allem: Es ist verdammt billig. Das Gratis-Kontingent trägt ewig. Was heißt Gratis-Kontingent? Keine müde Mark zahlen – Cyber-Bodhisattva.