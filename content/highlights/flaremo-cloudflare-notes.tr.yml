  Cloudflare teknoloji stack'i üzerine inşa edilmiş bir not uygulaması — FlareMo.

  Ücretsiz bir Cloudflare hesabı aç, deploy ettikten sonra 10G dosya depolama ve 5G veri depolama alanın olur.

  Sonsuza dek ücretsiz — altyapı maliyeti yok, trafik maliyeti yok, veriler bölgeler arasında yedekli, yüksek kullanılabilirlik daha doğuştan içinde.

  7/24 bulutta hizmet veriyor, Memos ekosistemiyle tam uyumlu.

  O anki geliştirme durumu: çekirdek işlevleri bir günde ayaklandım, tamamen kullanılabilir durumda.

  Bundan sonrası: daha fazla kullanım ve deploy rehberi, mühendislik test senaryoları, AI ajan teknikleri ve çoklu platform desteği. Build in public.