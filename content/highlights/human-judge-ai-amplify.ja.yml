content: |
  人が判断する。AI が増幅する。

  人の注意力は有限だ。人は一番肝心な部分の判断だけを担当する。

  限られた注意力を、必ず価値のある場所に配分しよう。AI に、もっと多くの雑務をやらせる。

  これが AI ワークフローの存在意義だ。

  AI ワークフローに雑務を丸ごと請け負わせ、人は最終判断、最も価値のある、最も中核の、最終目標となる、そうしたレビューや成果物の検収を担当する。

  これが俺がなんとか実現したい状態だ。最近、暇を見つけてはこうしたワークフローを研究してる。