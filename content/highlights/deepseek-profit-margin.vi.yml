  Đây là một sự thật thú vị — bạn có thể nghĩ DeepSeek đang bán token lỗ vốn.

  API của họ định giá rẻ, nhưng phía chính thức từng nhắc tới biên lợi nhuận 545% của mảng này!!!

  Vậy nên DeepSeek không chỉ là một vị bồ tát AI cyber, mà về mặt kỹ thuật còn là một quái vật.

  Nguyên văn: [DeepSeek Open Infra Index](https://github.com/deepseek-ai/open-infra-index/blob/main/202502OpenSourceWeek/day_6_one_more_thing_deepseekV3R1_inference_system_overview.md)
