  DeepSeek Harness + problème de compatibilité d'API tierce :

  Quand l'agent appelle des outils comme Bash, il renvoie `ToolNotFoundError: unknown tool ""`, on dirait que l'outil n'est pas enregistré.

  En réalité, le format de données renvoyé par la passerelle diffère de celui de l'officiel DeepSeek, et le nom de l'outil se perd en chemin.

  Quelques liens GitHub Discussions liés :

  - chercher « unknown tool » dans deepseek-ai/dsh#issues
  - ceux qui montent leur propre passerelle (OpenRouter / OneAPI / new-api) tombent le plus facilement dans ce piège

  Piste de débug : attraper une requête et une réponse tool_call complètes, et comparer si le nom de l'outil dans les logs de la passerelle est une chaîne vide.