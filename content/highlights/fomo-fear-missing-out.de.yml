content: |
  Ich stelle euch ein Konzept vor: FOMO, die Angst, etwas zu verpassen.
  Vermutlich haben viele diesen Tick: Beim Scrollen gutes Zeug entdecken und sofort speichern wollen; neue Tools, neue Trends sofort nachlaufen; immer das Gefühl, man versäumt etwas Wichtiges. Ergebnis: Die Sammlung wird immer voller, im Kopf immer chaotischer – und die Aufmerksamkeit verbrennt in diesem Prozess nach und nach.