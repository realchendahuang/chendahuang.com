  AI çağında en yaygın erteleme biçimi:
  araç biriktirmek, kurs almak, topluluklara katılmak, model değiştirmek, prompt kurcalamak.
  Her gün meşgulsün.
  Ama tek bir soruyla yüzleşmeye asla cesaret edemiyorsun:
  elimde gerçekten AI'ı üstüne atacak bir iş var mı?
  Bıçağı bilemek insanı epey meşgul eder.
  Ama bir sürü insan domuz kesmeye bir türlü cesaret edemez.