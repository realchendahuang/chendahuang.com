content: |
  حقاً أُسلّم في النهاية، OpenAI جنّت. GPT-5.6-Luna خُفّض 80%: 0.2 دولار للإدخال، و1.2 دولار للإخراج، و0.02 دولار عند إصابة الكاش.
  وبالمقارنة مع DeepSeek V4 Pro، على مستوى الاستهلاك النموذجي للبرمجة: في 100 مليون token يسجل 95% منها إصابةً في الكاش، فيأتي الحساب النهائي لـ DeepSeek حوالي 20 يواناً، ولـ Luna حوالي 26.
  ولو اشتركت في باقة Codex لتشغيل Luna، فستوافق الحصة خمسة أمثال ما كانت توافقه سابقاً — خمسة أضعاف كاملة من الاستخدام الزائد! https://t.co/fBVVfyN2OC