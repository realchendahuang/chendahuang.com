content: |
  OpenChamber hat wieder ein neues Release veröffentlicht. Man spürt, wie viel Herzblut der Maintainer in die Pflege steckt — das könnte das sorgfältigste Frontend sein, das ich je in einem Open-Source-Projekt gesehen habe.
  Die Kombination OpenChamber + OpenCode + DeepSeek V4 Flash, die ich ständig nutze, fühlt sich einfach richtig gut an.
