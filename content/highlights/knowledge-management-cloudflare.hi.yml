content: |
  इन दिनों मैं एक योजना के बारे में सोच रहा हूँ।
  अपने पर्सनल नॉलेज मैनेजमेंट, जानकारी जुटाने और नॉलेज आउटपुट को पूरी तरह Cloudflare पर ले जाना।
  मुफ़्त अकाउंट के साथ ही 10G ऑब्जेक्ट स्टोरेज और 5G डेटाबेस मिल जाता है।

  यानी असल में एक सेल्फ-होस्टेड, क्लाउड-आधारित, हमेशा के लिए मुफ़्त नॉलेज मैनेजमेंट सिस्टम।