content: |
  Phát hiện ra thứ hay ho — DeepSeek thực sự tích hợp tìm kiếm web ngay trong API của mình.
  Gọi model deepseek-v4-flash qua giao diện Responses, chỉ cần khai báo tool web_search trong tham số request là dùng trực tiếp được khả năng tìm kiếm chạy phía server của họ.
  Không cần tích hợp công cụ tìm kiếm bên thứ ba, không cần xin riêng một API key tìm kiếm.
  Toàn bộ pipeline tìm kiếm do đội ngũ chính thức của họ vận hành.
  Nguyên văn: https://t.co/D4AXo7crHw
