content: |
  En la era de la IA, la procrastinación más común hoy:
  acumular herramientas, comprar cursos, unirse a comunidades, cambiar de modelo, tocar el prompt.
  Cada día se esfuerzan un montón.
  Pero nunca se atreven a enfrentar una pregunta:
  ¿tengo de verdad un negocio real entre manos que merezca que use la IA para resolverlo?
  Investigar y afilar el cuchillo da mucha ocupación.
  Pero mucha gente no se atreve a matar el cerdo.