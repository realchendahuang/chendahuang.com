  Bence DeepSeek Harness form faktörünü tutturdu.
  
  Doğrudan insanlık dışı bir TUI'ye atlamak yerine bir Web UI ile geliyor.
  
  Üstelik neredeyse hiç depolama kaplamıyor — çünkü hiç yükleyici yok. İçine tarayıcı motoru sokuşturan bir Electron framework yok. Bu sayede epey depolama kazanılıyor.

  Tek eksisi tarayıcıda yaşaması — ama PWA olarak kurabilirsin, o zaman tamamen yerel bir istemci gibi hissettiriyor.

  Bir web uygulamasını Chrome üzerinden uygulama olarak kurmak gerçekten işe yarıyor. Buradaki ekran görüntüsünde bir web sayfası olmasına rağmen masaüstü uygulamasından hiçbir farkı yok.
