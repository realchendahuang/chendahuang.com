content: |
  いいもの見つけた。DeepSeek公式、まさかのAPIにWeb検索を内蔵してた。
  Responses形式のエンドポイントでdeepseek-v4-flashモデルを呼び、リクエストパラメータでweb_searchツールを宣言するだけで、彼らのサーバー側で実行される検索能力がそのまま使える。
  自分でサードパーティの検索エンジンに繋がなくても、検索APIキーの追加申請も不要。
  検索フロー全体を公式が丸ごとホスティングしてくれてる。
