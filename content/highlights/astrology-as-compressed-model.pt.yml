content: |
  De repente me veio um ângulo bem interessante.

  Signo, horóscopo chinês, astrologia, adivinhação — essas coisas talvez possam ser entendidas como "modelos comprimidos" da era de baixo poder computacional humana.

  Os antigos não tinham banco de dados, nem ferramenta estatística, nem IA.

  Só lhes restava observar a longo prazo estações, céu, agronomia, temperamentos, relações humanas e ciclos sociais, e comprimir toda essa experiência complexa num sistema de símbolos fácil de memorizar e de propagar.

  12 signos, 12 signos do zodíaco chinês, bazi, hexagramas — no fundo tudo parece uma redução de dimensionalidade do mundo complexo.

  Claro, não dá pra encarar como previsão científica rigorosa.

  Mas também não é só superstição pura.

  É mais como uma destilação de experiência que os antigos produziram com histórias, símbolos e regras, num ambiente de poder computacional insuficiente, dados insuficientes e ferramentas insuficientes.