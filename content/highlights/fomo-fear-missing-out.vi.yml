content: |
  Giới thiệu cho mọi người một khái niệm: FOMO, viết tắt của Fear of Missing Out (hội chứng sợ bỏ lỡ).

  Chắc hẳn không ít người dính phải vấn đề này: thấy thứ gì hay là muốn bookmark, thấy công cụ hay xu hướng mới là muốn nhảy vào, lúc nào cũng sợ không làm thì sẽ bỏ lỡ điều quan trọng nào đó. Kết quả: bookmark ngày càng đầy, đầu óc ngày càng rối, còn sự tập trung thì từ từ bị gặm mòn trên đường đi.
