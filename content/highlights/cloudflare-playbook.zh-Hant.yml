  我做了一個 Cloudflare Playbook。

  適合所有想用 AI Coding 做產品的獨立開發者。

  裡面整理了：

  - Cloudflare 常用服務怎麼選
  - Workers / Pages / D1 / R2 / KV / AI Gateway 怎麼用
  - 免費額度到底夠不夠
  - $5 Workers Paid 什麼時候該買
  - AI 寫 CF 程式碼最容易翻車的坑
  - Codex / Claude Code 怎麼配 Cloudflare Skill 和 MCP
  - 有哪些開源專案可以直接參考

  我的目標很簡單：

  用 AI 寫程式碼，用 Cloudflare 部署到全球。

  Playbook：[chendahuang.com/playbooks](/playbooks)