  分享一個 X 發文小心得：

  每則貼文都要有獨立性。

  因為你不是這個世界的中心，沒人會特地點開你的個人頁面，去了解事情的來龍去脈。

  一個陌生人第一次刷到你，就應該立刻收穫一個觀點，或是一個 know-how。

  這樣的貼文，才有價值。
