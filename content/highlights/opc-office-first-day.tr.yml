content: |
  Bugün OPC ofisine resmî olarak taşınmamın ilk günü. Bir OPC'yi nasıl kurduğumu adım adım anlatayım.

  İlk motivasyonum basitti: ödeme almak ve ürün yayınlamak için uyumlu bir tüzel kişiliğe sahip olmak. Bu yüzden internette şirket tescil bilgileri aradım.

  Şehir konusunda seçici değildim: Nanjing, Suzhou, Hangzhou, Ningbo — gelişmiş herhangi bir sahil şehri adaydı.

  Tesadüfen, bir gün iş için Nanjing'deydim ve boş vaktimde Nanjing ile ilgili WeChat hesaplarında gezinirken bir OPC topluluğu irtibatının telefon numarasını buldum. Hemen ekledim.

  Projemi kısaca tanıttıktan sonra sorumlu kişi tamam dedi ve aynı öğleden sonra yerinde ziyaret ayarladı.

  İstedikleri şey: haftada üç gün yerinde çalışmak. Bunu kabul edebilirsem şirketi burada tescil ettirmeme izin vereceklerdi.

  Nanjing devlet varlıklarına bağlı olduğu için politika koşulları mükemmel — su, elektrik, internet ve site aidatı tamamen ücretsiz, teorik olarak üç yıl boyunca. Hatta şirketimi tescil ettirmem, şirket mührümü kazımam, işletme ruhsatını almam ve banka hesabı açmam için bana özel bir muhasebeci bile atadılar. O kadar iyiler ki insanın aklı almıyor.

  İki üç hafta süren tescil sürecinden sonra nihayet tüm evrakları aldım.

  Park müdürü bana bir çalışma istasyonu seçmemi söyledi. Çalışma istasyonundan beklentim düşük — bir koltuk, bir tabure ve elektrik yeter.

  Sonra üç proje başvuru formu doldurmamı istediler; bunlar esas olarak projemin güçlü yönlerini, ekibin profilini ve AI ile ilgili ayrıcalığı kapsıyordu. Başvurular sağlam ve inandırıcıysa, 50.000–100.000 yuan'lık bir politika sübvansiyonu alma şansı var.

  Nanjing bu konuyu gerçekten iyi halletmiş. Herkes kendi şehrinde benzer politikalar olup olmadığını, ya da kendi il merkezinin daha iyisini sunup sunmadığını kontrol etmeli.

  İyi politikalar beklemez — gidip sorman gerekir. Bugün geldiğimde bu parka çoktan birçok şirket taşınmıştı; ben aslında geç kalanlardanım.

  Bugünlük bu kadar. Girişim yolculuğumu ve yol boyunca yaptığım retrospektifleri paylaşmaya devam edeceğim.

  İlginiz için herkese teşekkürler.
