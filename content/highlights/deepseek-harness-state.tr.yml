content: |
  Geçenlerde DeepSeek Harness reposuna ve Discussions'a tekrar göz attım; proje çok ilginç bir aşamada:

  DeepSeek Harness'ın 150 bin artı yıldızı ve repoda 12.000'den fazla commit'i var.

  Yine de resmî README hâlâ çok net söylüyor: şu an yalnızca bir Developer Preview ve geriye dönük uyumsuz değişiklikler hâlâ gelecek.

  rc.7 17 Ağustos'ta yayınlandı. Issue ve PR oluşturma kısıtlı; geri bildirimler Discussions üzerinden gidiyor.

  Topluluk devasa, ama çekirdek geliştirme birkaç elde yoğunlaşmış. Hatalar durmadan çıkıyor — "unknown tool" sorunu gibi.

  En çok eksik olanlar: test kapsamı, sağlayıcı uyumluluğu ve oturum güvenilirliği.

  Mimari olarak hâlâ cazip, bir ajan işletim sisteminin temeli gibi:

  - Her şey bir Plugin
  - Cordis kompozisyon mimarisi
  - Preset / Skill / MCP / Agent / Provider — hepsi plugin'leştirilmiş

  Proje, "etkinin mühendisliğin önünde koştuğu" aşamada.