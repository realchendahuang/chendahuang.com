content: |
  O humano cuida do julgamento. A IA cuida de amplificar.

  A atenção humana é limitada. O humano só cuida da parte mais crítica do julgamento.

  É preciso colocar a atenção limitada nos lugares que valem. Deixar a IA fazer os serviços sujos.

  É esse o sentido de existir do fluxo de trabalho com IA.

  Deixar o fluxo de IA engolir o serviço sujo, e o humano cuidar do julgamento final — da revisão e da aceitação do resultado mais valioso, mais central, do objetivo final.

  É um estado que eu quero muito alcançar. Ultimamente ando estudando esses fluxos de trabalho nas horas vagas.