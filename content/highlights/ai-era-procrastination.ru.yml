content: |
  В эпоху ИИ самая распространённая форма прокрастинации:
  копить инструменты, покупать курсы, вступать в сообщества, менять модели, крутить промпты.
  Каждый день — кипучая деятельность.
  Но так и не смеешь задать себе один вопрос:
  а есть ли у меня вообще настоящий бизнес, ради которого стоит привлекать ИИ?
  Точить нож — занятие очень насыщенное.
  Но многие так и не решаются зарезать свинью.