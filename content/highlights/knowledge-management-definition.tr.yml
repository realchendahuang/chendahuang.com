  Bilgi yönetimi nedir?

  İnsanların çoğu bilgi yönetimi deyince ilk aklına gelen şey: makale kaydetmek, bağlantıları düzenlemek, not almak, güzel bir kütüphane kurmak.

  Ama ilk prensiplerden bakınca, bilgi yönetiminin gerçekten çözmesi gereken sorun şu:

  **Bugün gördüğüm bilgi, gelecekte de kararlar almama yardımcı olmaya devam edebilir mi?**

  İnsan hafızası sınırlıdır, dikkat sınırlıdır ve deneyim kolayca kaybolur.

  Bir materyal sadece kaydedilirse, büyük olasılıkla bir bilgi mezarlığına dönüşür.

  Gerçekten değerli bilgi yönetimi tek bir dönüşümü tamamlamalı:

  dış bilgiyi ve kişisel deneyimi aranabilir, çağrılabilir, yeniden kullanılabilir ve güncellenebilir bir eylem yeteneğine dönüştürmek.

  - Sadece kaydedilen bir makale, sadece bir materyaldir.
  - Görüşünü damıtırsan bilgiye dönüşür.
  - Onu kendi projelerinle, senaryolarınla ve kararlarınla ilişkilendirirsen ancak o zaman bilgi olmaya başlar.
  - Son olarak makale yazmana, ürün yapmana, karar vermene ve iş akışı tasarlamana yardımcı olduğunda yetenek hâline gelir.

  Bu yüzden giderek daha çok düşünüyorum ki bilgi yönetiminin son noktası bir kütüphane olmamalı.

  O daha çok bilişsel bir altyapı gibi.

  Bilgiyi özümsemene, kararları düzenlemene, yöntemleri yerleştirmene yardımcı olur; içerik, ürün ve eylem üretmeye devam eder.

  Hele ki artık AI ajanları varken, bilgi yönetimi çok daha ilginç hâle geliyor.

  Eskiden düzenlemek, sınıflandırmak, aramak ve yeniden kullanmak için insanlara güveniyorduk.

  Bundan sonra bu işlerin çoğu ajanlara devredilebilir:

  otomatik özetleme, otomatik etiketleme, projelere otomatik ilişkilendirme, otomatik taslak oluşturma, eskimiş bilgiyi otomatik işaretleme — hatta materyali doğrudan makaleye, teklife, slayta ve göreve dönüştürme.

  Son zamanlarda bilgi yönetimine ilgi duymamın nedeni de bu.

  Görünüşte not almaktır.

  Özünde ise uzun vadede bileşik büyüyen bilişsel bir sistem kurmaktır.
