content: |
  몇 년째 곁에 두고 쓰는 브라우저 확장 프로그램을 공유한다.

  - **Wetab**: 새 탭 확장 프로그램. 자주 쓰는 것들을 넣어 두고 검색 엔진도 커스터마이즈할 수 있으며, 계정 로그인만 하면 기기 간 무료 동기화가 된다. 나는 여기에 구글 기반의 X 검색 엔진을 따로 만들어 뒀는데, 기본 검색보다 훨씬 낫다.
  - **Video Speed Controller**: 배속을 자유자재로 조절해 주는 확장 프로그램. 지식을 효율적으로 흡수하기에 좋다.
  - **XHunt**: X를 즐기는 사람에게 필수. 각 KOL의 순위와 지금 가장 뜨거운 게시물을 볼 수 있다.
  - **X 상호 팔로우 레이더**: 페이지에서 맞팔로우와 일방 팔로우 관계를 표시해 주고, 원하면 following / followers 비율도 보여 준다.
  - **FireShot**: 웹페이지를 캡처해 편집한 뒤 PDF, JPEG, GIF, PNG, BMP로 저장할 수 있다.
  - **Proton Pass**: 디자인이 세련된 비밀번호 관리 도구. 여러 기기에서 동기화된다.
  - **Immersive Translate**: 오랜 역사를 가진 이중언어 번역 확장 프로그램. DeepSeek V4 Flash API에 연결해 쓰고 있다.
  - **Codex**: Codex를 Chrome에 연결할 때 필수. 이것만 있으면 브라우저에서 하는 모든 일을 자동화할 수 있다. 예를 들어 계정이 정지됐을 때 이의 신청 메일을 쓰는 것 같은 일까지.
