title: "TUI सड़ने लगा है: यह सिस्टेमैटिक तौर पर आपकी कॉग्निटिव बैंडविड्थ घटाता है"
description: "यह सारी स्थिति आपकी शॉर्ट-टर्म मेमोरी में ठूंसने को मजबूर करता है और सोचने की कीमत को इंटरफ़ेस चलाने में लगाने पर मजबूर करता है।"
