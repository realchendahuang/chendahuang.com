content: |
  TUI, सीधी-सीधी बात करूँ तो, सड़ने लगा है।
  इसकी सबसे घिनौनी चीज़ यह नहीं कि इसका इस्तेमाल मुश्किल है — यह है कि यह इंसान की कॉग्निटिव बैंडविड्थ को सिस्टेमैटिक तौर पर घटाता है।
  आपको लगता है कि आप टूल से चुस्ती से बात कर रहे हैं, जबकि आप लगातार तीन काम कर रहे होते हैं:
  शॉर्टकट और मोड याद करना
  स्क्रॉल होते कैरेक्टर-स्ट्रीम में जानकारी ढूँढना
  और दुआ करना कि ग़लती से किसी अजीब स्टेट में नहीं घुस गए
  अब यह इंटरैक्शन नहीं रहा — यह इंटरफ़ेस से कुश्ती है।
  सच में असरदार इंटरफ़ेस वह है जो स्टेट को आपके सामने बिछा दे, ताकि आप आँखों और स्पेशियल सेंस से समझ सकें — न कि सब कुछ शॉर्ट-टर्म मेमोरी में ठूंसने के लिए मजबूर करे। TUI उल्टा करता है — इन्फॉर्मेशन डेंसिटी को चरम पर पहुँचा देता है, और पढ़ने की क्षमता व वापस लौटने की क्षमता को न्यूनतम पर कुचल देता है।
  इससे भी बुरा यह कि यह एक बहुत बुरी आदत भी विकसित कर रहा है: किसी टूल की कीबाइंडिंग चलाना आना, उसे ही क्षमता मान लेना। नतीजा यह कि इंसान समस्या सोचने की बजाय इंटरफ़ेस से ढलने में ढेर सारी एनर्जी खर्च करता है।
  एक अच्छा टूल सोचने की कीमत घटाना चाहिए, सोचने की कीमत को इस इंटरफ़ेस को चलाने के तरीके में नहीं ढेलना चाहिए।
  TUI की आज की लोकप्रियता काफ़ी हद तक इंटरैक्शन डिज़ाइन की सुस्ती और घमंड को गीक-फ़िल्टर के मेकअप से ढकना है।
