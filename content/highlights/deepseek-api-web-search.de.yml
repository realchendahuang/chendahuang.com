content: |
  Ich hab was Gutes entdeckt: DeepSeek hat Websuche direkt in die API eingebaut.
  Rufst du mit dem Responses-Endpoint das Modell deepseek-v4-flash auf und deklarierst in den Request-Parametern nur das web_search-Tool, nutzt du direkt ihre serverseitig ausgeführte Suchfunktion.
  Kein eigener Anschluss an Drittanbieter-Suchmaschinen, kein eigenen Such-API-Key.
  Den kompletten Suchkram hostet offiziell DeepSeek.
