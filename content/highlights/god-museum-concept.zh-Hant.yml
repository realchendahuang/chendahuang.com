  東西神話圖鑑的名字想好了——God-Museum · 眾神博物館：

  把《山海經》《西遊記》、古希臘、北歐、古埃及這幾套互不相干的神譜塞進同一個宇宙裡，讓它們不打架。

  同一個雷電法則，在希臘叫宙斯、在東方叫雷震子；

  同一場大洪水，東方人記得是女媧補天，希伯來人記得是諾亞方舟。

  認真追問下去，整個神話世界就得重排一遍。

