content: |
  मैंने हाल ही में DeepSeek Harness के रेपो और Discussions को फिर से पलटा, और यह प्रोजेक्ट एक बहुत दिलचस्प चरण में है:

  DeepSeek Harness के पास पहले से ही 150k+ स्टार और रेपो में 12,000 से अधिक commits हैं।

  फिर भी आधिकारिक README अभी भी बहुत स्पष्ट रूप से कहता है: यह अभी केवल Developer Preview है, और ब्रेकिंग चेंजेस अभी भी आ रहे हैं।

  rc.7 17 अगस्त को जारी हुआ। Issue और PR बनाना प्रतिबंधित है; फ़ीडबैक Discussions के ज़रिए होता है।

  समुदाय बड़ा है, लेकिन कोर डेवलपमेंट कुछ ही हाथों में केंद्रित है। बग लगातार निकलते रहते हैं — जैसे unknown tool "" समस्या।

  सबसे ज़्यादा जिस चीज़ की कमी है: टेस्ट कवरेज, प्रोवाइडर संगतता और सत्र विश्वसनीयता।

  आर्किटेक्चर की दृष्टि से यह अभी भी आकर्षक है, एजेंट ऑपरेटिंग सिस्टम की नींव की तरह:

  - Everything is a Plugin
  - Cordis संरचना आर्किटेक्चर
  - Preset / Skill / MCP / Agent / Provider सभी प्लगइनाइज़्ड

  यह प्रोजेक्ट "प्रभाव इंजीनियरिंग से आगे चल रहा है" वाले चरण में है।
