content: |
  많은 사람이 AI로 Cloudflare 프로젝트를 작성하는데, 문제가 생겨도 문법 때문이 아니다.
  진짜 문제는:
  AI가 Workers를 Node.js처럼 작성한다
  Binding을 process.env처럼 취급한다
  await를 빠뜨린다
  요청 상태를 전역 변수에 저장한다
  정적 자산 요청이 무료라는 것을 모른다
  그리고 Worker 안에서 REST API로 자신의 R2를 호출한다
  이런 함정들을 모두 Cloudflare Playbook에 정리해 두었다.
  그리고 덤으로,
