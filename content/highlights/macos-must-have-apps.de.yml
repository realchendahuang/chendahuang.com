content: |
  Nach jahrelanger macOS-Intensivnutzung fasse ich diese starken Programme hier zusammen:

  - **QuickRecorder**: Bildschirmaufnahme-Wunder, klein, aber mächtig.
  - **ClashParty**: unzensiertes Surfen, Mihomo-Kern, viele unterstützte Protokolle, schnelle Updates, schicke Oberfläche.
  - **V2rayN**: unzensiertes Surfen, viele Protokolle, Oberfläche etwas retro – dafür stabil und gratis.
  - **Doubao-Eingabemethode**: Spracheingabe, verdammt genau; macOS, iOS, Android unterstützt, Windows noch unterwegs.
  - **Brave**: datenschutzorientierter Browser mit eingebautem Werbefilter – filtert gründlicher als Plugins, der beste Begleiter für YouTube.
  - **Mos**: macht das Scrollen deines Mausrads geschmeidig.
  - **Amphetamine**: display bleibt an, auch wenn das Notebook zugeklappt ist – der beste Begleiter für Vibe Coding.
  - **UU Remote**: kostenloses Remote-Desktop-Tool von NetEase, schnell. Seitdem es das gibt, ist nicht mehr das Abo der Qualitätsbremser, sondern die Leitung. Ich nutze es meist, um per Handy macOS fernzusteuern und die Vibe-Coding-Ergebnisse anzuschauen – die Tastenbelegung ist enorm effizient.
  - **Tencent Lemon**: das Müll-Entfernungstool für macOS von Tencent, sehr sanft beim Deinstallieren, auch das Menüleisten-Icon ist praktisch.
  - **Mole**: das stärkste Müll-Reinigungstool für macOS – die Terminal-Version ist gratis, die UI-Version kostet.
  - **Tailscale**: WireGuard-basiertes Tool zum Vernetzen ferner Standorte. Damit erreichst du deinen kleinen PC zu Hause von jedem Fleck der Welt.
  - **Obsidian**: im AI-Zeitalter das lokalitätsorientierte Wissensmanagement-Tool. Das Ökosystem ist traumhaft – kombiniert mit dem offiziellen Web-Clipper-Plugin eine Wunderwaffe.