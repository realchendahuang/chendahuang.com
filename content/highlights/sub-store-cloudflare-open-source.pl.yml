  Przeniosłem agregację subskrypcji do omijania blokad na Cloudflare.

  Uwolniłem jako open source projekt agregujący linki subskrypcji, który wdraża się całkowicie za darmo na Cloudflare.

  Składa wszystkie twoje linki subskrypcji i własne węzły w jeden link, z dołączonymi regułami routingu.

  Naprawdę jeden link – działa w każdym kliencie, bez konfiguracji per klient.

  GitHub: https://github.com/realchendahuang/sub-store-cloudflare

