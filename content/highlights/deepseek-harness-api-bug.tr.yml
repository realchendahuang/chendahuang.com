content: |
  DeepSeek Harness + üçüncü taraf API uyumluluk sorunu:

  Ajan Bash gibi araçları çağırdığında `ToolNotFoundError: unknown tool ""` hatası alıyor; araç hiç kaydedilmemiş gibi görünüyor.

  Aslında olan şu: ağ geçidi, DeepSeek'in resmî API'sinden farklı bir veri formatı döndürüyor ve aracın adı arada bir yerde kayboluyor.

  Birkaç ilgili GitHub Discussions bağlantısı:

  - deepseek-ai/dsh#issues içinde "unknown tool" araması yapın
  - Kendi barındırdığı ağ geçitlerini kullananlar (OpenRouter / OneAPI / new-api) bununla en çok karşılaşanlar

  Hata ayıklama yaklaşımı: tam bir tool_call isteği ve yanıtını yakalayın, ağ geçidi günlüklerinde araç adının boş bir dize olup olmadığını kontrol edin.