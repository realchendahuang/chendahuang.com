content: |
  OpenChamber가 또 새 버전을 출시했다. 개발자가 정말 정성을 다해 유지보수하고 있다는 게 느껴진다. 내가 본 오픈소스 중에서는 프론트엔드에 가장 진심을 담은 프로젝트일지도 모른다.
  늘 쓰고 있는 OpenChamber + OpenCode + DeepSeek V4 Flash 조합이 진짜 제대로 짜릿하게 좋다.
