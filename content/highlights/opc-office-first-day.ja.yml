content: |
  今日は正式に OPC オフィスに入居する初日。OPC を立ち上げた過程の経験を話す。

  俺の初心は単純に、罰則的でない法人格でお金を受け取り、プロダクトを出品できることだった。だからネットで関連の会社登録情報を探した。

  都市へのこだわりはそこまでなかった：南京、蘇州、杭州、寧波、沿海の先進地区ならどこでも候補だった。

  偶然が重なって、ある日南京に出張に行き、ヒマだったので南京関連の公衆番号を眺めてたら、OPC コミュニティの連絡先の電話番号を見つけた。それで連絡を加えた。

  自分のプロジェクトを簡単に紹介したあと、担当者が OK と判断し、その日の午後に現地見学に行く手配をしてくれた。

  彼らが提示した要件は、週 3 日は駐在でオフィスに出ること。それを受け入れられたら、ここで会社を登録させてもらえるとのこと。

  南京国资旗下のプロジェクトなので、政策条件がとても良く、水道・電気・ネット・管理費はすべて無料で、理論上は 3 年間無料。さらには専任の代行会計が会社登録、印鑑作成、営業許可証取得、銀行口座開設の連絡までやってくれて、感謝でぶっ飛ぶレベル。

  2 〜 3 週間の登録手続きを経て、ようやく全部の書類が揃った。

  園区のマネージャーに、ここで自分の仕事場を選ぶよう言われた。仕事場への要求は高くない。椅子と電源があればそれでいい。

  園区のマネージャーに、申請書類を 3 枚書くよう言われた。主にプロジェクトの強み、チームメンバーの状況、AI との組み合わせの強みを紹介するものだ。上手く書けて、信頼できそうなら、5〜10 万元の政策補助のチャンスがある。

  南京は、このへん本気でうまくやってると思う。みんなも自分の都市に似た政策があるか、自分の省都にもっと良い政策がないか見てみるといい。

  良い政策は待ってくれないから、絶対にたくさん聞いて回るべきだ。今日ここに着いたとき、実はもうかなりの企業が入居してて、俺はどちらかというと遅い方だった。

  今日のシェアはこんなところ。今後も創業の経験と過程の振り返りをシェアし続ける。

  みんなの気遣いに感謝。