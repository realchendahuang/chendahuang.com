content: |
  Aplausos de pé para o controle remoto do ZCode — o exemplo perfeito de comandar um Agent local pelo celular.
  O custo para começar é quase zero: cria uma conta pelo celular, sem precisar de assinatura premium. Escaneia o QR code que aparece no computador e já aproveita para vincular ao WeChat ou Feishu.
  O melhor é o tunneling grátis embutido: a rede deixa de ser um problema. Deitado no sofá ou tomando um café lá fora, uma mensagem do celular basta para acionar quando quiser o Agent do computador e pô-lo para rodar código.
