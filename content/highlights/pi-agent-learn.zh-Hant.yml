  有老哥問：

  有沒有 Claude Code 比較好的分析文件可以學習？

  我的回答是，在 AI 時代，一定要處處想到 AI，要讓 AI 輔助你去學習。

  如果真的想學 Agent 的原理。

  可以去看看 Pi Agent 這個專案。

  麻雀雖小五臟俱全，太適合學習了，程式碼品質還很高。

  Claude Code 並非開源，是原始碼外洩。

  Pi Agent 才是真正的開源。
