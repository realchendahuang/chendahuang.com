content: |
  지금 내 구도는 이렇다.

  중국 모델이라면 ZCode(DeepSeek V4 Flash, GLM 5.3 Flash 같은 모델)를 붙여 쓰는 걸 추천한다.

  GPT라면 그냥 Codex로 가면 된다.

  빠른 게 필요하면? Pi.

  빠르면서도 마음 편한 게 필요하면? OMP.

  기업에 맞춤형 클라이언트 앱을 만들어 준다면? DSH.

  인내심을 단련하고 싶다면? Workbuddy.
