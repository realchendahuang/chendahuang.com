content: |
  أزداد يوماً بعد يوم اقتناعاً أن قيمة المشاعر عالية جداً.

  ولِمَ استطاع بنو الإنسان العاقل أن يتحدوا معاً لتحقيق أمور عظيمة؟

  لأن إيماناً مشتركاً بقصةٍ ما، أو بمشاعرَ ما، أو بطَوطمٍ ما، أو بأسطورةٍ ما، أو بسرديةٍ ما — هو ما شكّل التنظيمات، ودفع إلى التعاون، والتكبير والتقوية، وبناء المجد المشترك.

  أليست هذه قيمةً من قيم المشاعر؟