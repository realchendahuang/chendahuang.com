content: |
  多くの人は普段 AI ツールを使うとき、API Key の設定が必要で、時にはインターフェース形式を選ばされることもある。

  このインターフェース形式は、簡単にこう理解できる：

  あなたとモデルサービスの間で取り決めた会話の方法。

  例えば昔から一番馴染み深い OpenAI 互換インターフェースは、多くの場合 Chat Completions を指してた。この形式はチャットに適してて、シンプルなテキスト生成にも適してる。だから国内外の多くのモデルベンダーが、まずこれを優先で互換する。

  でも今、AI アプリを作るとなると、シーンはもうかなり複雑になってる。モデルはファイルを読み、Web を検索し、関数を呼び、コードを走らせ、MCP に接続し、コンテキストを保持しながら、続きのタスクを遂行することがよくある。

  このときこそ、OpenAI が打ち出した Responses API の価値が出てくる。

  - その推論モデルの効果はより良い。同じモデルでも、より適切なインターフェース構造に置けば、タスクの完成度が上がる。
  - ネイティブに Agent 向き。モデルは 1 回の API リクエストの中で複数のツールを呼び出せる。
  - より節約になる。Responses API のキャッシュ利用率は Chat Completions より 40% から 80% 改善してる。キャッシュ利用率が高ければ高いほど、繰り返し呼び出しのコストは下がり、応答速度も最適化しやすい。