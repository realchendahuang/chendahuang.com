content: |
  Je le déclare :

  Cloudflare est une vraie société AI Native.

  Elle refait vraiment l'expérience développeur autour des agents IA.

  Les Temporary Accounts tout juste sortis permettent à un agent IA d'écrire le code, de déployer direct, de récupérer une URL temporaire, de tester tout seul, d'itérer tout seul.

  Lisse comme de l'huile.

  Combiné aux Skills officiels Cloudflare, une seule commande à installer :

  `npx skills add cloudflare/skills`

  C'est quoi, AI Native ?

  Ça, c'est la GOAT de l'AI Native.