content: |
  بالأمس نشرت مقارنة بين Command GOAT وOpenCode Go، فجاء الرئيس التنفيذي لـ Command Code ليكتب تعليقًا بنفسه.
  
  قال إنني أغفلت بندًا — فاتورة التخزين المؤقت. فتتبعتُ الأمر، ووجدت أن لدى Command Code شيئًا يستحق الاهتمام.
  
  Coding Agent هو في جوهره آلة ضخمة من Prefix Cache. جلسة تضم مئات الآلاف من الرموز — وفي الجولة التالية، قد لا يكون عدد الرموز الجديدة فعليًا سوى بضعة آلاف. إطار النظام والأدوات وسياق الكود وسجل المحادثة بالكاد تتغير. وكلما ارتفع معدل الإصابة في التخزين المؤقت، انخفضت تكلفة تلك السياقات القديمة.
  
  قامت Command Code مؤخرًا بعمل جاد حول Cache Thrashing، بشكل رئيسي بهذه الاستراتيجيات:
  
  تثبيت الجلسات على نفس عقدة GPU للحفاظ على دفء KV cache؛ والحفاظ على البادئة المستقرة سليمة قدر الإمكان ومنع تحويلات المزود من إفساد السياق؛ إضافة إلى Tool Call Repair، حيث تُصحح الـ harness معاملات النموذج الخاطئة محليًا بدلًا من إعادة الأخطاء إلى النموذج للمحاولة مجددًا.
  
  سجل التغييرات في v0.33.0 يذكر حرفيًا: Major Cache Overhaul، خفض التكلفة الوسيطي 2.9×. وهم الآن يعلنون رسميًا عن معدلات إصابة مستدامة للتخزين المؤقت تتراوح بين 95–99%.
  
  نفس النموذج، نفس باقة الـ 10 دولارات — لكن بفضل التخزين المؤقت، يتضاعف الفرق ليعطي نتيجة مختلفة كليًا.
