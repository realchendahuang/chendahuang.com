content: |
  J'ai pris un peu de temps pour finir le déploiement de Sub-Store sur Cloudflare.

  Mes nœuds maison et les nœuds de secours du fournisseur sont tous fondus ensemble, avec en plus l'abonnement automatique des règles de routage ACL4SSR.

  Avec un seul lien d'abonnement, je obtiens :

  - la fusion des nœuds multi-fournisseurs
  - le filtrage des nœuds
  - la configuration des règles de routage
  - la mise à jour automatique de la config

  Lisse comme de l'huile.