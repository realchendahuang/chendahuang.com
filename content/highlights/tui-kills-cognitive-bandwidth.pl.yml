title: "TUI zaczyna śmierdzieć: systematycznie obniża twoją przepustowość poznawczą"
description: "Zmusza cię do wciskania całego stanu w pamięć krótkotrwałą i przerzuca koszt myślenia na obsługę interfejsu."
