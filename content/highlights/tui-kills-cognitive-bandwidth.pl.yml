content: |
  TUI, mówiąc brutalnie, zaczyna już śmierdzieć.
  Najbardziej obrzydliwe jest w nim to, że nie tyle jest niewygodne, co systematycznie obniża ludzką przepustowość poznawczą.
  Wydaje ci się, że efektywnie rozmawiasz z narzędziem, a tak naprawdę non stop robisz trzy rzeczy:
  przypominasz sobie skróty i tryby,
  wypatrujesz informacji w przewijającym się strumieniu znaków,
  i modlisz się, żeby przez przypadek nie wpakować się w jakiś dziwny stan.
  To już nie jest interakcja — to walka z interfejsem.
  Naprawdę wydajny interfejs rozkłada stan przed twoimi oczami i pozwala zrozumieć go wzrokiem i wyobraźnią przestrzenną, zamiast zmuszać do wciskania wszystkiego do pamięci krótkotrwałej. TUI robi dokładnie odwrotnie — wypycha gęstość informacji do granic, a czytelność i odzyskiwalność depcze do minimum.
  Co gorsza, wychowuje też fatalny nawyk: traktowanie biegłości w mapach klawiszy danego narzędzia jako umiejętności samej w sobie. Efekt: człowiek zużywa masę energii na adaptację do interfejsu zamiast na myślenie o problemie.
  Dobre narzędzie powinno obniżać koszt myślenia, a nie przerzucać ten koszt na zastanawianie się, jak w ogóle obsługiwać ten interfejs.
  Obecna popularność TUI to w dużej mierze geekowski filtr, za którym kryje się lenistwo i arogancja w projektowaniu interakcji.
