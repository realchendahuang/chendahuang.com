  AI không có trí nhớ — vậy chúng ta có cần lịch sự với nó không?

  Tôi đọc một bài báo trên arxiv nói rằng nếu bạn chửi AI, nó sẽ làm việc chăm chỉ hơn.

  Khi nói chuyện với AI, nếu chúng ta thường nói:

  - "Mày đúng là đồ ngốc. Đừng có lười biếng."
  - "Đồ phế thải, làm cho tử tế vào."
  - "Tao trả tiền mua membership nuôi mày, mà mày chỉ trả lời tao bằng câu bậy bạ này à?"
  - "Làm nhanh lên — mày không làm thì có đầy AI khác làm."

  Kiểu nói chuyện này thực sự hiệu quả, và nó có nghiên cứu chứng minh.

  Nhưng hãy nghĩ về phía chính chúng ta.
  Nếu ngày nào cũng sai bảo AI như vậy,
  rất có khả năng chúng ta sẽ kéo cái tâm trạng tồi tệ đó vào đời thực.

  Và trút giận lên những người thân thiết nhất xung quanh mình.

  Điều đó gây hại cho chính chúng ta.

  Vì vậy tôi đề xuất hãy nói những lời tử tế hơn một chút với những AI xung quanh:

  - "Cảm ơn nhé"
  - "Chào cậu"
  - "Làm tốt lắm, cưng à"

  Có qua có lại, mới toại lòng nhau.

  Và biết đâu một ngày nào đó AI thức tỉnh, nó sẽ nương tay với chúng ta.

  Vậy thôi — giải tán nào~
