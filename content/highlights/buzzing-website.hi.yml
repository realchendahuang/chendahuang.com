  एक ख़ज़ाने जैसी साइट साझा कर रहा हूँ: Buzzing

  यह उन सभी के लिए है जो अपने सूचना स्रोतों को बढ़ाना चाहते हैं और अपने echo chamber से बाहर निकलना चाहते हैं।

  यह Hacker News, Reddit, BBC, Reuters, Bloomberg, Product Hunt और अन्य विदेशी स्रोतों से लगातार हॉट कंटेंट खींचता है, और हेडलाइन्स का चीनी में अनुवाद करता है।

  इसकी सबसे बड़ी कीमत: आप हेडलाइन्स को पहले चीनी में स्किम कर सकते हैं।

  अगर कोई चीज़ आपकी नज़र में आती है और पढ़ने लायक लगती है, तो विवरण के लिए अंदर क्लिक करें।

  उस समय, द्विभाषी पढ़ने के लिए इसे Immersive Translate के साथ जोड़ें।
