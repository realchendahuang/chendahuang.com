content: |
  我目前的格局是这样的。
  如果是国产模型，就推荐挂上ZCode（Deepseek V4 Flash、 GLM 5.3 Flash这种模型。）
  如果是GPT直接用Codex。
  如果想速度快，就用Pi。
  如果想既速度快又省心，就用omp
  如果想给企业做定制化的客户端开发，就用dsh。
  如果想锻炼脾气，就用Workbuddy。
