  Erişim (circumvention) abonelik agregasyonumu Cloudflare'e taşıdım.

  Cloudflare üzerinde tamamen ücretsiz dağıtılan bir abonelik bağlantısı agregasyon projesini açık kaynak yaptım.

  Tüm erişim abonelik bağlantılarını ve kendi kurduğun düğümleri, yönlendirme kuralları eklenmiş tek bir bağlantıda toplar.

  Gerçekten tek bir bağlantı — her istemcide kullanılabilir, istemci bazında yapılandırma yok.

  GitHub: https://github.com/realchendahuang/sub-store-cloudflare

