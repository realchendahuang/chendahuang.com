content: |
  Puji habis-habisan remote control ZCode — benar-benar teladan cara mengomandani Agent lokal dari perangkat mobile.
  Biaya operasionalnya hampir nol: daftar akun dari HP saja, tidak perlu langganan premium. Scan QR code yang muncul di komputer, sekalian tautkan ke WeChat atau Feishu.
  Yang paling mantap: tunneling bawaannya gratis, kondisi jaringan sama sekali tidak perlu dipikirkan. Rebahan di sofa atau ngopi di luar, kirim satu pesan dari HP, dan Agent di komputer rumah langsung disuruh menjalankan kode kapan saja.
