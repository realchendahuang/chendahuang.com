content: |
  Après des années d'usage intensif de macOS, voici les logiciels de ouf que j'ai retenus :

  - **QuickRecorder** : la merveille pour l'enregistrement d'écran, petit format, fonctionnel à fond.
  - **ClashParty** : pour le réseau, noyau Mihomo, beaucoup de protocoles supportés, mises à jour rapides, interface magnifique.
  - **V2rayN** : pour le réseau, beaucoup de protocoles supportés, interface un chouïa vieillotte mais stable et gratuite.
  - **IME Doubao** : la saisie vocale d'une précision folle, supporte macOS, iOS, Android, Windows en route.
  - **Brave** : le navigateur qui privilégie la vie privée, blocage de pubs intégré, plus propre que les extensions, le meilleur compagnon pour YouTube.
  - **Mos** : rend la molette de ta souris infiniment plus fluide.
  - **Amphetamine** : garde ton laptop allumé même couvercle fermé, le meilleur compagnon du Vibe Coding.
  - **UU Remote** : l'outil de bureau à distance de NetEase, gratuit et rapide. Avec lui, ce qui limite la qualité, ce n'est plus l'abonnement, c'est le débit. Je m'en sers pour piloter mon macOS depuis le téléphone et surveiller mes résultats de Vibe Coding : le mapping des touches est ultra efficace.
  - **Tencent Lemon** : le nettoyeur macOS de Tencent, désinstallation ultra fluide, icône de barre de menus pratique.
  - **Mole** : le nettoyeur le plus puissant de macOS, version terminal gratuite, version UI payante.
  - **Tailscale** : le tool de réseau inter-sites basé sur WireGuard. Avec lui, tu branches ta petite machine de la maison même au bout du monde.
  - **Obsidian** : à l'ère de l'IA, l'outil de gestion de connaissances local-first. L'écosystème est excellent, combiné au Web Clipper officiel, c'est magique.