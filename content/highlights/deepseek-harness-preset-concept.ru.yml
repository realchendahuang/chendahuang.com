content: |
  В последнее время я изучаю DeepSeek Harness. Есть концепция под названием Preset, на которую стоит обратить внимание.

  Preset можно понимать как единицу дистрибуции агента. Загрузи на одной и той же модели разные Preset — и она превратится в совершенно разных агентов.

  В чём самое большое отличие Preset от Skill?

  - Skill для анализа финансовой отчётности: учит агента, как анализировать финансовые отчёты.
  - Preset для анализа финансовой отчётности: упаковывает вместе Skill анализа отчётов, веб-поиск, Browser, PDF, Python, субагентов, исследовательские промпты и стратегию контекста — и выдаёт тебе готового к использованию агента.

  В будущем, скорее всего, одновременно появятся два рыночных уровня.

  - Один: маркетплейс Plugin / Skill, в основном для разработчиков и продвинутых пользователей, собирающих агентов;
  - Второй: маркетплейс Preset / Agent, по-настоящему ориентированный на обычных пользователей.

  Это очень близко к логике App Store. App Store показывает целое приложение; Preset показывает целое агентное приложение.

  Раньше люди делились промптами. Потом начали делиться скиллами. Дальше, скорее всего, будут делиться Preset'ами.