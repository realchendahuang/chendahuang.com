  Bana kalırsa Cloudflare'ın hâlâ %1'inden azını kullanıyoruz.

  Fazlasıyla özellik çıkardı.

  - Nesne depolama: R2
  - Backend API: Workers
  - AI geçidi: AI Gateway
  - Ağır hesaplama: Container
  - Önbellek: KV
  - Veritabanı: D1
  - PostgreSQL mi kullanıyorsun? HyperDrive ile bağla

  Bu daha başlangıç — liste uzayıp gidiyor. Aklına ne gelirse, onu yapabilir.

  İşin asıl komik yanı, gerçekten yok pahasına olması. Ücretsiz katman bile uzun süre yetiyor. Ücretsiz katman ne demek? Kuruş ödememek demek — siber bodhisattva, hem de gerçek bir aziz.