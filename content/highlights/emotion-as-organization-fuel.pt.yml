content: |
  Cada vez mais sinto que o valor da emoção é muito valioso.

  Por que a gente, Homo sapiens, consegue se unir pra fazer coisa grande?

  É porque acredita junto numa história, numa emoção, num totem, num mito, numa narrativa — foi isso que formou organizações, cooperação mútua, ficar grande, ficar forte, criar glória juntos.

  Isso não é um valor da emoção?