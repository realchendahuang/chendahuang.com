content: |
  Me tiré un rato y completé el despliegue de Sub-Store en Cloudflare.

  Fundí en uno mis nodos propios y los nodos de respaldo del servicio de proxys, y le puse encima la suscripción automática de reglas de enrutamiento ACL4SSR.

  Con una sola suscripción conseguí:

  - la fusión de nodos de varios proveedores
  - el filtrado de nodos
  - la configuración de reglas de enrutamiento
  - la actualización automática de la configuración

  De lo más terso.