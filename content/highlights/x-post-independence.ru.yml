  Делюсь небольшим советом по постингу в X:

  каждый пост должен стоять сам по себе.

  Потому что ты не центр мира — никто не будет заходить в твой профиль, чтобы собрать полную картину.

  Когда незнакомец впервые натыкается на тебя в ленте, он должен сразу получить мнение или кусочек практического знания.

  Только такие посты несут ценность.