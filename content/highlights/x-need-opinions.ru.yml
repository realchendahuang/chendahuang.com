  В X у тебя обязательно должны быть мнения.

  Люди без мнений просто производят информационный шум.

  С позицией тебя запоминают.

  С проницательностью за тобой хотят следить.

  В X нет недостатка в репостерах — не хватает тех, кто может объяснить вещи до конца.