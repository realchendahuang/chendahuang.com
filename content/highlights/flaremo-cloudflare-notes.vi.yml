  Một ứng dụng ghi chú xây dựng native trên tech stack Cloudflare — FlareMo.

  Đăng ký một tài khoản Cloudflare miễn phí, sau khi triển khai bạn có 10G lưu trữ file và 5G lưu trữ dữ liệu.

  Miễn phí vĩnh viễn — không tốn chi phí hạ tầng, không tốn chi phí băng thông, dữ liệu được sao lưu đa vùng, khả năng sẵn sàng cao có sẵn từ khi sinh ra.

  Phục vụ trên cloud 24/7, tương thích hoàn toàn với hệ sinh thái Memos.

  Tiến độ phát triển tại thời điểm đó: hoàn thiện chức năng lõi trong một ngày, đã hoàn toàn dùng được.

  Sắp tới: thêm nhiều tutorial dùng và triển khai, test case kỹ thuật, kỹ thuật AI-agent, và hỗ trợ đa nền tảng. Build in public.
