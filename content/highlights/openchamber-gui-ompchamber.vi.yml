content: |
  Tôi đã trải qua gần như toàn bộ client Harness GUI open source trên thị trường, và phần lớn xét về thiết kế lẫn trải nghiệm thì... khó nói thành lời.
  OpenChamber là client Harness GUI open source được đánh bóng tốt nhất mà tôi từng dùng: tinh tế, ổn định, thỉnh thoảng có bug cũng không cản trở việc dùng lâu dài.
  Nhưng nó chỉ dùng được cùng OpenCode, không chuyển sang Harness khác được. Có người dùng phản hồi rằng hiệu năng tổng thể của OpenCode chưa tốt, dễ kìm hãm mô hình.
  Thế là tôi phác thảo một dự án: giữ front end của OpenChamber làm khung xương, thay phần lõi bên trong bằng Oh My Pi — kiểu vậy có khi hợp với nhu cầu của tôi hơn.
  Sao không dùng Pi Agent nguyên bản mà lại dùng Oh My Pi?
  Vì Pi Agent nguyên bản quá linh hoạt, không thể nào làm thành một GUI phổ thông được.
  Cân về phương án dung hoà, Oh My Pi coi như một bản distribution của Pi Agent. Trải nghiệm tương tác plugin tổng thể khá ổn định.
  Nên tôi nghĩ việc biến OpenChamber + Oh My Pi thành sản phẩm dùng ngay khi mở hộp là một nhu cầu tiềm năng.
  Tôi đặt tên dự án này là OMPChamber, hiện vẫn đang được phát triển và thử nghiệm dày đặc — ai có nhu cầu thì cứ star nhé.
  https://github.com/realchendahuang/OMPChamber
