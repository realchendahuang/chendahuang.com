content: |
  많은 사람이 Cloudflare Workers를 아직 1%도 이해하지 못한 것 같다.

  Workers는 사이버 노동자다.

  웹사이트 뒤에서 벌어지는 더럽고 힘든 잡일을 대신 처리해 준다.

  폼 제출, 파일 업로드, AI 호출, 로그인 검증, 결제 알림 처리, 소규모 제품의 API — Workers가 다 해낸다.

  Workers에서 가장 말도 안 되는 점: 무료 사용자는 하루 10만 건의 요청을 한 푼도 내지 않고 쓸 수 있다.

  10만 건이면 어느 정도일까?

  사이트에 하루 1,000명의 사용자가 있다고 치자. 사이트가 24시간 쉬지 않고 돌아가면서 매초 누군가 방문해도 하루 방문은 86,400회뿐이다 — 여전히 할당량을 다 쓸 수 없다.

  만약 정말 그 무료 할당량을 다 태울 수 있다면...

  뭘 기다리겠는가? 당신은 곧 부자가 된다.

  지금 당장 로직을 작성해서 Worker에 맡겨 실행하면 된다.
  Hono API 프레임워크와 조합하면 그게 바로 베스트 프랙티스다.

  그래서 Cloudflare Workers가 이토록 매력적이다.

  돈을 내라고? 무슨 돈.

  Cloudflare는 마음이 착하다.

  당신이 돈 쓰는 꼴을 차마 못 본다.
