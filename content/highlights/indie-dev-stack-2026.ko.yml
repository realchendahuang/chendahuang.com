content: |
  1년 넘게 피와 눈물로 겪은 인디 개발 함정 경험을 공유한다.

  2026년, 인디 개발자가 앱을 만들고 싶다면 베스트 프랙티스는:

  **MVP 단계에서는 일단 Web + PWA로.** 개발도 빠르고, 디버깅도 빠르고, 반복도 빠르다.

  Web 스택:

  React + TanStack Start + Vite + TypeScript + shadcn/ui + Base UI + Tailwind CSS + better-auth + Vercel AI SDK + oxfmt / oxlint

  백엔드 통일:

  Hono + Cloudflare Workers

  Web 디버깅:

  Chrome DevTools MCP + Codex Chrome 확장 프로그램

  제품이 진짜 돌아가기 시작하면, 그다음에 모바일로 간다.

  모바일 스택:

  React Native + Expo + Expo Router + NativeWind + React Native Reusables + Reanimated + Gesture Handler + EAS Build / Submit / Update

  핵심 아이디어는 간단하다:

  Web + PWA로 먼저 수요를 검증한다.

  진짜 유저가 생기면, React Native + Expo로 본격적인 앱을 만든다.
