content: |
  Franchement, certaines communautés geek ne sont plus juste confidentielles — elles sont carrément solipsistes.

  Leur signature : ériger l'inconfort en sophistication et les barrières d'entrée en critère de goût.

  Si un outil est simple, intuitif et vite pris en main par n'importe qui, ils sentent d'instinct qu'il n'est pas assez hardcore, trop grand public, dévalorisant.

  À l'inverse : plus la prise en main est laborieuse, plus l'information est enfouie, plus il faut apprendre un jargon maison et des raccourcis clavier obscurs — plus ils sont convaincus que ça, c'est un vrai outil.

  Ça n'a plus rien à voir avec la recherche d'efficacité. C'est utiliser la souffrance pour se confirmer son identité.

  « Je supporte des interfaces que les autres ne supportent pas » — à peine la phrase prononcée, le sentiment de supériorité s'installe.

  Plus le cercle est petit, plus cette autosatisfaction se renforce facilement entre membres.

  Jusqu'à ce que ça devienne : quiconque ose dire que c'est inutilisable n'y comprend rien, c'est un profane.

  Les gens vraiment bons simplifient ce qui est complexe. Certains geeks, eux, complexifient ce qui est simple — puis, juchés sur cette complexité, regardent tout le monde de haut.
