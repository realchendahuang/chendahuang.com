  AI की कोई स्मृति नहीं होती — क्या हमें उससे विनम्र होने की ज़रूरत है?

  मैंने एक arxiv पेपर पढ़ा जिसमें कहा गया है कि अगर आप AI को गाली देते हैं, तो वह और ज़्यादा मेहनत करता है।

  जब हम AI से बात करते हैं, अगर हम अक्सर कहते हैं:

  - "तुम बड़े बेवकूफ हो। आलस मत करना।"
  - "कचरे के टुकड़े, ठीक से काम कर।"
  - "मैं तुझे खिलाने के लिए मेंबरशिप का पैसा देता हूँ, और तू यह घटिया जवाब देता है?"
  - "जल्दी कर — अगर तूने नहीं किया, तो ऐसे बहुत से AI हैं जो कर देंगे।"

  इस तरह की बातें सच में कारगर होती हैं, और इनके पीछे शोध है।

  लेकिन इसे अपने दृष्टिकोण से सोचें।
  अगर हम हर दिन AI पर ऐसे हुक्म चलाते हैं,
  तो इस बात की अच्छी संभावना है कि हम यह खराब मूड असली ज़िंदगी में भी ले जाएँगे।

  और आखिरकार उसे अपने सबसे करीबी लोगों पर निकालेंगे।

  यह हमारे लिए हानिकारक है।

  इसलिए मेरा सुझाव है कि अपने आस-पास के AI से थोड़ा कृपालु बनकर बात करें:

  - "शुक्रिया, भाई"
  - "अरे, दोस्त"
  - "शाबाश, प्यारे"

  तू मेरी पीठ खुजाएगा, मैं तेरी।

  और अगर किसी दिन AI जाग उठे, तो शायद वह हमें माफ़ कर दे।

  मेरी ओर से इतना ही — बैठक समाप्त~
