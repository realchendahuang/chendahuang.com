content: |
  Soy un perro fiel de la escuela de Wang Xiaobo.

  Era divertido, pero sin ser zalamero.
  Era humorístico, pero con lógica.
  Odiaba la estupidez, y también la estupidez puesta en serio.

  Si Wang Xiaobo viviera en la era de la IA,

  quizá diría:

  por fin hay algo que le ahorra a la gente común hacer menos trabajo inútil y le deja más tiempo para pensar en cosas de verdad interesantes.

  Esa es también la razón por la que me gusta la IA.

  No porque sea divina.

  Sino porque le ahorra a la gente un poco del tormento del trabajo aburrido.