  Der Name für den mythologischen Atlas des Ostens und Westens steht – God-Museum · Museum der Götter:

  Die Berge und Meere der Klassiker (Shan Hai Jing), Die Reise nach dem Westen, das antike Griechenland, die Nordische Mythologie und das Alte Ägypten – fünf unabhängige Götterlisten in einem einzigen Universum, ohne dass sie sich in die Haare kriegen.

  Das gleiche Gesetz des Donners heißt im Griechischen Zeus, im Osten Leizhenzi;

  Dasselbe große Hochwasser erinnert der Osten als Nüwa flickt den Himmel, die Hebräer als Arche Noah.

  Wenn man ernsthaft weiterfragt, muss die ganze Mythenwelt neu sortiert werden.

