  Mình đã chuyển việc gộp subscription vượt tường lửa sang Cloudflare.

  Mã nguồn mở một dự án gộp link subscription, triển khai trên Cloudflare hoàn toàn miễn phí.

  Nó gộp tất cả link subscription và node tự dựng của bạn thành một link duy nhất, kèm theo quy tắc route.

  Đúng nghĩa một link — client nào cũng dùng được, không cần cấu hình từng client.

  GitHub: https://github.com/realchendahuang/sub-store-cloudflare

