content: |
  Znalazłem coś świetnego — DeepSeek wbudował wyszukiwanie w sieci bezpośrednio w swoje API.
  Wywołaj model deepseek-v4-flash przez interfejs Responses i po prostu zadeklaruj narzędzie web_search w parametrach żądania, żeby korzystać bezpośrednio z ich wyszukiwania po stronie serwera.
  Żadnej integracji z wyszukiwarką trzeciej strony, żadnego ubiegania się o osobny klucz API do wyszukiwania.
  Cały pipeline wyszukiwania jest prowadzony przez oficjalny zespół.
