content: |
  काफ़ी समय लगा, लेकिन मैंने Sub-Store Cloudflare पर डिप्लॉय कर लिया।

  अपने सेल्फ-बिल्ट नोड्स और एयरपोर्ट के बैकअप नोड्स को एक में मिलाया, और ACL4SSR रूटिंग नियमों के साथ ऑटो-सब्सक्राइब पर जोड़ दिया।

  एक ही सब्सक्रिप्शन लिंक से सब कुछ:

  - कई प्रोवाइडरों के नोड्स का मर्ज
  - नोड फ़िल्टरिंग
  - रूटिंग नियम कॉन्फ़िगरेशन
  - ऑटोमैटिक कॉन्फ़िग अपडेट्स

  स्मूथ से भी स्मूथ।