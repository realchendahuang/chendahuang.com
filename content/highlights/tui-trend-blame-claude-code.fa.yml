title: "این موج TUI را باید به گردن Claude Code انداخت"
description: "وقتی وابستگی مسارِ «TUI راه اصلی است» رواج پیدا کرد، مقلدها هم شروع کردند به ساختن سد مصنوعی برای کاربران."
