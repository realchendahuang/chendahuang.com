content: |
  این روزها عده زیادی AI Coding Agent مدام سراغ TUI میروند، و سهم بزرگی از مقصر بودن این موج، به گردن Claude Code است.
  این ابزار تجربه گفتگو با AI در ترمینال برای نوشتن کد را به کمال رسانده.
  اما مشکل اینجاست که انگار Coding Agent واقعاً پیشرفته باید بهطور پیشفرض رابط ترمینالی داشته باشد، نسخه Web در حالت ضمیمه بماند، و حتی با تمسخر «به اندازه کافی برنامهنویسانه نیست» خطاب شود.
  نتیجه چه میشود؟
  اول یک TUI پیچیده میسازی
  با کلی رنگ، نوار وضعیت، کلید میانبر و جابهجایی حالت
  بعد اسمش را میگذاری «غرقشونده» و «پربازده» و «محترم به برنامهنویس»
  مطمئنی؟
  برای عده کوچکی که همه روز در ترمینال زندگی میکنند، آره، واقعاً عالی است. اما برای خیلیهای دیگر، این یعنی ساختن سد از سر تصمیم. قابلیتها پشت کلیدها و حالتها پنهاناند، کاربر تازهکار کاملاً گیج است، و حتی کاربر قدیمی هم باید دوباره خودش را با کلیدبندیِ هر ابزار وفق دهد.
  Web UI کاملاً میتواند سریع و تمیز باشد؛ بعد از نصب به شکل PWA تقریباً هیچ فرقی با کلاینت دسکتاپ ندارد، و آپدیتش هم راحتتر است. اصرار بر اینکه تعامل را بهزور به الگوی ترمینال دهه 80 برگردانی، بعد هم Web را تحقیر کنی، مقداری خودشیفتگی دارد.
  Claude Code خودش قوی است، در این شکی نیست. اما این سلیقه و وابستگی مسارِ «TUI راه اصلی است» را رواج داد، و عده زیادی که دنبالش تقلید کردند، از این هم عجیبتر شدند.
  ابزار برای استفاده آدمهاست، نه برای اثبات اینکه چه کسی «گیکتر» است.
  بستهبندی تعامل ضدانسانی به اسم پیشرفته بودن، واقعاً مایه خنده است.
