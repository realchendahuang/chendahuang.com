  بگذارید یک مفهوم را معرفی کنم: FOMO، مخفف «ترس از جا ماندن» (Fear of Missing Out).

  مطمئنم خیلی‌ها این مشکل را دارند: چیز خوبی می‌بینید و دلتان می‌خواهد بوکمارکش کنید، ابزار یا ترند جدیدی می‌بینید و دلتان می‌خواهد سوارش شوید و همیشه حس می‌کنید اگر نروید، چیز مهمی را از دست خواهید داد. نتیجه این می‌شود: بوکمارک‌هاتان پر و پرتر، ذهنتان شلوغ و شلوغ‌تر، و حواستان هم در همین مسیر لقمه‌لقمه خورده می‌شود.
