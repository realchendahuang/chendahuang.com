content: |
  AI 時代、最も重要な能力はメタスキルだ。

  簡単に言えば、ツールを替えても、モデルを替えても、業界を替えても、依然として使える地力のこと。

  - 問題をきちんと説明できるか？
  - ぐちゃぐちゃの資料を整理できるか？
  - ぼんやりしたアイデアをいくつかのステップに分解できるか？
  - AI のどこが正しくて、どこがでたらめかを見抜けるか？
  - AI と何度もやり取りして、粗い回答を実際に使えるものまで磨けるか？

  こういうのは、ツールを貯め込むよりずっと価値がある。

  ツールは毎日変わるし、モデルも世代ごとに入れ替わる。

  でも質問できて、整理できて、判断できて、分解できて、検収できる人は、どこへ行っても AI で自分を増幅できる。

  AI 時代に本当に差がつくのは、こういう、とても基礎的に見えて長期的に一番価値のあるメタスキルかもしれない。