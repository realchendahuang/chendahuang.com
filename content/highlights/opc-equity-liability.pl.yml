content: |
  Dziś znajomy podzielił się w moich komentarzach kilkoma uwagami na temat udziałów i odpowiedzialności w firmach jednoosobowych.

  Po pierwsze, wielkie dzięki temu znajomemu za uprzejmą przestrogę.

  Jego zdanie: powinieneś sprawić, by członek rodziny trzymał co najmniej 1% udziałów.

  Problem ze spółką jednoosobową z o.o.: gdy jest tylko jeden udziałowiec i nie da się wyraźnie oddzielić pieniędzy spółki od prywatnych, udziałowiec może ponosić odpowiedzialność solidarną za długi spółki. Art. 23 prawa spółek działa dokładnie według tej logiki.

  Jeśli spółka ma wielu udziałowców, zmienia się z „spółki jednoosobowej” w „zwykłą spółkę z ograniczoną odpowiedzialnością”, omijając szczególne ryzyko ciężaru dowodu spółki jednoosobowej i dając sobie dodatkową warstwę taniej ochrony.

  Mam nadzieję, że posłuży wam jako punkt odniesienia.

  Ale na co dzień powinniśmy wyraźnie oddzielać firmowe i prywatne konta i dążyć do tego, by każdą ważniejszą kwotę dało się wyjaśnić.

  - Skąd przyszły pieniądze, dlaczego i na które konto trafiły.
  - Dokąd poszły pieniądze, na co je wydano i kto je zatwierdził.
  - Gdy wyciągasz pieniądze ze spółki – czy to pensja, zwrot kosztów, pożyczka czy dywidenda.

  Jak ogarniesz te trzy rzeczy, ryzyko dramatycznie spada.