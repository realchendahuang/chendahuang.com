content: |
  Je partage les extensions navigateur que je garde précieusement depuis des années.

  - **Wetab** : extension de nouvel onglet, pour y mettre les trucs du quotidien, avec moteur de recherche personnalisable et synchro multi-appareils gratuite après connexion. J'y ai monté un moteur de recherche X basé sur Google, bien plus pratique que l'intégré.
  - **Video Speed Controller** : règle la vitesse de la vidéo finement, parfait pour ingérer du savoir efficacement.
  - **XHunt** : indispensable pour jouer sur X, tu vois le classement de chaque KOL et les posts les plus chauds du moment.
  - **X Radar de suivi mutuel** : repère en page les relations « tu me suis tu me suis pas », avec l'option d'afficher le taux de following / followers.
  - **FireShot** : capture le site en screenshot, le retouche et le sauvegarde en PDF, JPEG, GIF, PNG ou BMP.
  - **Proton Pass** : gestionnaire de mots de passe au design élégant, synchronisé sur tous les appareils.
  - **Immersive Translate** : la vieille dame des extensions de traduction bilingue, avec l'API DeepSeek V4 Flash branchée dessus.
  - **Codex** : indispensable pour connecter Codex à Chrome, ça automatise n'importe quoi dans le navigateur, par exemple écrire un mail de réclamation quand ton compte est banni.