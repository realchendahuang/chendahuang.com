content: |
  یک چیز عالی پیدا کردم — DeepSeek واقعاً جستجوی وب را مستقیم توی APIاش کار گذاشته.
  مدل deepseek-v4-flash را از طریق رابط Responses صدا بزن و فقط کافی است یک ابزار web_search را در پارامترهای درخواست اعلام کنی تا مستقیم از جستجوی سمت سرورِ آنها استفاده کنی.
  نه نیازی به یکپارچه کردن موتور جستجوی شخص ثالث است، نه درخواست جداگانهی API key برای جستجو.
  کل خط لولهی جستجو توسط تیم رسمی میزبانی میشود.
