  X'te mutlaka görüşün olmalı.

  Görüşü olmayan insanlar sadece bilgi gürültüsü üretir.

  Bir duruşun olursa, insanlar seni hatırlar.

  Bir içgörün olursa, insanlar seni takip etmek ister.

  X'te yeniden paylaşanların eksikliği yok — sonuna kadar anlatabilen insanların eksikliği var.
