  Doğu-Batı mitoloji derlemesinin adı belli oldu — God-Museum · Tanrılar Müzesi:

  Birbirine hiç değmemiş bu hikâye kümelerini — *Dağlar ve Denizler Klasiği*, *Batı'ya Yolculuk*, antik Yunan, İskandinav ve antik Mısır panteonlarını — tek bir evrene sığdır ve birbirleriyle çatışmasınlar.

  Aynı yıldırım yasası Yunan'da Zeus, Doğu'da Leizhenzi;

  aynı büyük tufan Doğu'da Nüwa'nın göğü yaması, İbranilerde ise Nuh'un Gemisi olarak hatırlanır.

  Bu ipi ciddi ciddi kovalamaya devam edersen, tüm mitoloji dünyasının yeniden düzenlenmesi gerekir.

