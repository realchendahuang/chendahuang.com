content: |
  OpenChamber опять выпустил новую версию. Чувствуется, что автор по-настоящему вкладывается в поддержку проекта. Возможно, это самый заботливо сделанный фронтенд из всех open-source-проектов, что я встречал.
  OpenChamber + OpenCode + DeepSeek V4 Flash, на котором я сижу постоянно, доставляет просто дикое удовольствие.
