content: |
  Я потратил целый день на добротное исследование «удаления вкуса ИИ из статей».

  Сравнил основные Humanizer'ы, Skill'ы по удалению AI-вкуса и подходы на основе промптов.

  Затем добавил свой опыт использования LLM с 2023 года — как меня день за днём мучили «вкусы ИИ» от GPT, Claude, Gemini и Doubao.

  И сделал это:

  **Dahuang Human Tone**

  Skill для удаления «вкуса ИИ», созданный для китайского контекста.

  Моё пожелание:

  Пусть на свете не будет нечитабельных AI-сочинений.

  GitHub: https://github.com/realchendahuang/dahuang-human-tone