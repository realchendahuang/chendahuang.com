content: |
  多くの人が Coding Agent を選ぶときの第一反応は、ごく自然なものだ：
  Claude を使うなら Claude Code、GPT なら Codex、GLM なら ZCode、DeepSeek ならもちろん DeepSeek 純正の Harness を優先的に考える。
  この発想自体は完全に理にかなってる。開発元の最大の強みは、自分のモデルを一番よく知ってることだから。
  モデルがどんな Prompt を好むか、Tool Schema をどう設計すれば最も安定するか、長い Context をどう整理するか、新バージョンで何が増えたか、どこで一番コケやすいか——こういうことは、通常サードパーティより開発元のほうが早く知ってる。
  だから Claude Code や Codex のようにモデルと Harness を長期間一緒に磨いてきた製品では、開発元の組み合わせがしばしば最強の答えになる。
  でも DeepSeek や GLM みたいなオープンモデルになると、話が面白くなり始める。良いモデルを訓練することと、良い Harness を作ることは、実はまったく別の工学だからだ。
  Coding Agent が本当に動き出すと、モデル以外の問題が山ほど出てくる：ファイルをどう読むか、コードをどう直すか、Agent Loop をどう制御するか、Context をどう圧縮するか、Cache をどう活用するか、Tool Call が失敗した後にどう復旧するか、Subagent をどうスケジューリングするか、権限をどう管理するか。
  これらの出来が、そのまま同じモデルの最終的な使い心地を左右する。
  もう一つ問題がある：モデルの更新が速すぎる。
  今日は GLM が強くて、来月には DeepSeek がもっと強い Flash をまた出すかもしれないし、そのうちまた別のモデルが追いついてくる。Coding ワークフロー全体がある一家の開発元製品に縛られてると、モデルを替えるたびにツールも習慣も一緒に替える羽目になりがちだ。
  サードパーティ Harness の価値はまさにここにある。
  使い慣れたツール、Skills、MCP、権限、ワークフローを固定して、下に載るモデルだけを差し替えればいい。今日は DeepSeek、明日は GLM、あさってはまた別のもの——作業環境を作り直す必要がない。
  だから僕がもっと気にするのは：このモデルはどの Harness に載せれば一番うまく仕事をしてくれるか。
  開発元には開発元のモデル適合の強みがあるし、サードパーティもツール、Context、Cache、Agent Loop、拡張性の面でより強くなれる。
  オープンモデル時代が到来して、モデルと Harness はもう完全に別々に選べるようになった。
