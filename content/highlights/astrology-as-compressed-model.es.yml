content: |
  Se me ha ocurrido un ángulo bastante interesante.

  Los signos del zodíaco, el zodíaco chino, la astrología, la adivinación... se pueden entender quizá como los «modelos comprimidos» de la era de baja computación humana.

  Los antiguos no tenían bases de datos, ni herramientas estadísticas, ni IA.

  Solo podían observar a largo plazo las estaciones, los cielos, el calendario agrícola, la personalidad, las relaciones humanas y los ciclos sociales, y luego comprimir toda esa experiencia compleja en un sistema de símbolos fácil de memorizar y de difundir.

  Los 12 signos, los 12 animales del zodíaco chino, los Ocho Caracteres, los hexagramas... en el fondo todos reducen la dimensionalidad del mundo complejo.

  Claro que no pueden usarse como predicción científica estricta.

  Pero tampoco son superstición pura a secas.

  Se parecen más a una destilación de experiencia hecha por los antiguos con historias, símbolos y reglas, cuando les faltaba computación, datos y herramientas.