content: |
  Hari ini ada teman yang membagikan beberapa poin di kolom komentarku tentang masalah ekuitas dan tanggung jawab pada perusahaan satu orang.

  Pertama, terima kasih banyak kepada teman ini atas pengingat yang ramah.

  Pandangannya: kamu sebaiknya meminta anggota keluarga memegang minimal 1% saham.

  Masalah dengan perseroan terbatas satu orang: saat hanya ada satu pemegang saham dan kamu tidak bisa memisahkan dengan jelas uang perusahaan dari uang pribadi, pemegang saham bisa menanggung tanggung jawab bersama atas utang perusahaan. Pasal 23 UU Perusahaan (Company Law) persis logika ini.

  Kalau perusahaan punya banyak pemegang saham, statusnya bergeser dari "perusahaan satu orang" menjadi "perseroan terbatas biasa," menghindari risiko beban pembuktian khusus perusahaan satu orang dan memberimu satu lapis perlindungan murah ekstra.

  Semoga ini bisa jadi referensi untuk semua orang.

  Tapi sehari-hari, kita harus memisahkan dengan jelas rekening bisnis dan pribadi, dan berusaha membuat setiap jumlah uang yang signifikan bisa dijelaskan.

  - Uang itu dari mana, kenapa, dan masuk ke rekening mana.
  - Uang itu ke mana, kenapa dibelanjakan, dan siapa yang menyetujui.
  - Saat kamu mengambil uang dari perusahaan, apakah itu gaji, penggantian biaya, pinjaman, atau dividen?

  Kalau tiga hal ini beres, risikonya turun drastis.
