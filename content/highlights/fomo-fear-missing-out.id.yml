content: |
  Saya perkenalkan sebuah konsep: FOMO, singkatan dari Fear of Missing Out — takut ketinggalan.

  Saya yakin banyak orang punya masalah ini: melihat sesuatu yang bagus langsung ingin menyimpannya, melihat tools atau tren baru langsung ingin ikut, selalu merasa kalau tidak ikut akan melewatkan sesuatu yang penting. Hasilnya: bookmark makin penuh, kepala makin kacau, dan perhatianmu terkikis sedikit demi sedikit di sepanjang jalan.
