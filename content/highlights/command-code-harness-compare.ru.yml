content: |
  Я ещё раз внимательно проштудировал Command Code как Harness и заодно сравнил его с Pi, OMP, DeepSeek Harness и OpenCode.
  Самое ценное в Command Code сейчас — это Harness Engineering, который он делает для открытых моделей.
  У Pi философия минимализма: Harness вмешивается в модель по минимуму — легко, быстро, с низкими расходами токенов и при этом очень гибко; OMP же наворачивает поверх Pi тяжёлые Coding-возможности вроде LSP, Debugger, Browser, AST — почти как дать Agent'у полноценную IDE.
  DeepSeek Harness идёт ещё дальше: Everything is Plugin — Agent Loop, инструменты, права, Preset, UI можно разобрать и собрать заново, идеально для изучения Agent Runtime следующего поколения.
  OpenCode — самый сбалансированный вариант: open source, много Provider'ов, большая экосистема, зрелые Client/Server, десктоп и Subagent — универсал, который подключит любую модель и потянет любую работу.
  Command Code идёт другим путём: он обожает подтирать за моделью. Ошиблись в параметрах Tool Call — Harness исправит локально; файл только что читали, а просят перечитать — Harness уберёт дубли; в длинном Session держит Stable Prefix, чтобы поднять Cache Hit; когда Context вот-вот переполнится — делает Compaction; плюс Session Affinity, Taste, изоляция Subagent и прочее.
  На моделях-работягах вроде DeepSeek V4 Flash или GLM-5.3 Flash такой подход даёт ещё больше ценности: модель послабее — Harness дополнит.
  Так что вот как я бы сейчас расставил акценты между этими Harness'ами:
  Pi — лучше всего подходит как база для собственного долгосрочного Agent: просто, чисто, переделывай как хочешь.
  OMP — для по-настоящему тяжёлого Coding: LSP, Debugger, навигация по сложному Repo.
  DeepSeek Harness — лучший вариант, чтобы ковыряться в архитектуре Agent'ов, Preset, мульти-Agent и Runtime следующего поколения.
  OpenCode — для тех, кто хочет зрелый универсальный мульти-модельный Coding Agent.
  Command Code — особенно для активных пользователей открытых моделей вроде DeepSeek / GLM, особенно тех, кто массово гоняет Flash-модели-работяги.
  Если смотреть только на долгосрочную гибкость, я по-прежнему предпочитаю Pi. Но если бы сегодня мне поручили всерьёз пахать на DeepSeek V4 Flash / GLM-5.3, я бы уже сейчас попробовал Command Code на вкус.
