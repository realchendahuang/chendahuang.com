  Berbagi tips kecil untuk posting di X:

  setiap post harus berdiri sendiri.

  Karena kamu bukan pusat dunia — tidak ada yang akan klik ke profilmu untuk merangkai kisah utuhnya.

  Saat pertama kali orang asing scroll ke kamu, mereka harus langsung mendapat satu sudut pandang, atau satu know-how.

  Hanya post seperti itu yang bernilai.
