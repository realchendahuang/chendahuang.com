content: |
  Проблема совместимости DeepSeek Harness + сторонние API:

  Когда агент вызывает такие инструменты, как Bash, появляется ошибка `ToolNotFoundError: unknown tool ""`, и выглядит это так, будто инструмент вообще не был зарегистрирован.

  Что происходит на самом деле: шлюз возвращает другой формат данных, нежели официальный API DeepSeek, и имя инструмента теряется где-то на полпути.

  Несколько ссылок на соответствующие GitHub Discussions:

  - Ищи «unknown tool» в deepseek-ai/dsh#issues
  - Чаще всего на это попадают те, кто поднимает свой шлюз (OpenRouter / OneAPI / new-api)

  Подход к отладке: снять полный запрос и ответ tool_call и проверить, не является ли имя инструмента в логах шлюза пустой строкой.