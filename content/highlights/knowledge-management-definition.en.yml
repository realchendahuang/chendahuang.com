content: |
  What is knowledge management?

  Mention knowledge management and most people's first reaction is: bookmarking articles, organizing links, taking notes, building a beautiful library.

  But from first principles, the problem knowledge management actually has to solve is:

  **Can the information I see today keep helping me make judgments in the future?**

  Human memory is limited, attention is limited, and experience slips away easily.

  If a piece of material merely gets bookmarked, it'll likely end up as an information graveyard.

  Truly valuable knowledge management should complete one transformation:

  turn external information and personal experience into an action capability that's retrievable, callable, reusable, and updatable.

  - An article, merely bookmarked, is just material.
  - You distill its viewpoint and it becomes information.
  - You connect it to your own projects, scenarios, and judgments — only then does it start becoming knowledge.
  - Finally, when it helps you write articles, build products, make decisions, and design workflows, it becomes capability.

  So I increasingly feel the endpoint of knowledge management shouldn't be a library.

  It's more like cognitive infrastructure.

  Helping you absorb information, organize judgments, settle methods, and keep outputting content, products, and action.

  Especially now that AI agents exist, knowledge management gets a lot more interesting.

  In the past we relied on humans to organize, classify, search, and reuse.

  Going forward, a lot of that can be handed to agents:

  auto-summarize, auto-tag, auto-link to projects, auto-generate outlines, auto-flag outdated knowledge — even turn material directly into articles, proposals, slides, and tasks.

  That's also why I've gotten interested in knowledge management lately.

  On the surface it's note-taking.

  At bottom, it's building a cognitive system that compounds over the long term.