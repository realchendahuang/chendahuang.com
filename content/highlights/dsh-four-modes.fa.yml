content: |
  مدتی روی چهار حالت DeepSeek Harness وقت گذاشتم — اینجا مزایا، معایب و موارد استفادهی هر کدام را میگویم.
  
  ۱. Standard — بهترین برای توسعهی روزمره
  Standard همان Coding Agent کامل و پیشفرض DeepSeek Harness است. همهی چیزهایی که توسعهی روزمره نیاز دارد را همراه دارد و مخصوصاً برای کارهایی مناسب است که هنوز نمیدانی مشکل کجاست و عامل باید خودش کاوش کند.
  
  اما چون بیشتر کارها به صورت LLM → Tool → LLM → Tool → LLM → Tool است، وقتی کارها پیچیده میشوند، رفتوآمدهای (round trips) Tool Calling روی هم جمع میشوند و تأخیر و هزینهی توکن بالا میرود.
  
  پس: کارهای کاوشمحور بروند سراغ Standard.
  
  ۲. PTC — حالت بهرهوری برای کارهای پیچیده
  PTC به مدل اجازه میدهد یک تکه TypeScript بنویسد که چند فراخوانی ابزار را در یک اجرا ترکیب میکند.
  
  Standard شاید این باشد: جستجوی فایل، برگشت به مدل، خواندن فایل، برگشت به مدل، جستجو، برگشت به مدل، ویرایش، برگشت به مدل.
  PTC میشود این: مدل TypeScript مینویسد، یک بار اجرا میشود، جستجو + حلقه + فیلتر + خواندن + پردازش، و بعد نتیجهی نهایی برمیگردد.
  
  این رفتوآمدها را کم میکند و حجم عظیمی از دادههای میانی بیمعنا را از کانتکست مدل بیرون نگه میدارد. پس پردازشهای دستهای، تکراری و ساختاریافته جایی است که PTC میدرخشد.
  
  ۳. Minimal — فقط Bash + Editor در اختیار مدل
  بزرگترین نقطه قوتش سادگی است: ابزار کم، شمای ابزار (tool schema) کوچک، سربار ثابت prompt پایین.
  
  اما نه Web هست، نه Skills، نه Subagent، نه Workflow — کارهای پیچیده را باید یک عامل بهزور انجام بدهد. و Minimal آن Context Compaction کامل Standard را هم ندارد. پس هر چند در کارهای کوتاه سربار توکن ثابت پایین است، در نشستهای خیلی طولانی با خروجی Bash زیاد، ممکن است در عمل توکنی ذخیره نکند.
  
  Minimal برای کارهای کوچکِ شفاف و خوبتعریفشده انتخاب است — هر چه واضحتر و کوتاهتر، بهتر.
  
  ۴. Creator — با یک عامل، عامل ساختن
  Standard را دارد به اضافهی Cordis Runtime، آزمایشهای پلاگین و ساخت Preset. حتی خود عامل را هم تبدیل میکند به چیزی ترکیبپذیر و قابلخلق.
  
  راستش یکجورایی بامزه است: مدل برای خودش بساطی پهن میکند که جنس بفروشد و بعد خودش هم سر و کلهی همان بساطش را میزند — خودکفا.
  
  اما بزرگترین مشکل Creator سطح دسترسی بالایش است. این نکته را در نظر داشته باش.
  