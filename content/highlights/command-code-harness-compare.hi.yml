content: |
  मैंने Command Code इस Harness को एक बार फिर ध्यान से पढ़ा, और साथ में इसकी तुलना Pi, OMP, DeepSeek Harness और OpenCode से भी कर ली।
  Command Code की अभी की सबसे बड़ी वैल्यू उसका Harness Engineering है, जो वह ओपन मॉडल्स के लिए करता है।
  Pi का फ़लसफ़ा मिनिमल है: Harness मॉडल में जितना हो सके कम दखल देता है — हल्का, तेज़, टोकन का खर्च कम, और तोड़ने-मोड़ने में बेहद आसान; वहीं OMP Pi के ऊपर LSP, Debugger, Browser, AST जैसी हैवी Coding क्षमताएँ चढ़ाता जाता है, जैसे Agent को पूरा IDE चढ़ा दिया हो।
  DeepSeek Harness और भी आगे जाता है: Everything is Plugin — Agent Loop, टूल्स, परमिशन, Preset, UI सब खोलकर दोबारा जोड़े जा सकते हैं, और नेक्स्ट-जेन Agent Runtime समझने के लिए यह बेहतरीन है।
  OpenCode फिलहाल सबसे संतुलित कैटेगरी है: ओपन सोर्स, Provider ज़्यादा, इकोसिस्टम बड़ा, Client/Server, डेस्कटॉप ऐप और Subagent काफ़ी मैच्योर — यानी ऐसा ऑलराउंड खिलाड़ी जो कोई भी मॉडल ले ले और कोई भी काम कर दे।
  Command Code का रास्ता थोड़ा अलग है। उसे मॉडल के पीछे साफ़-सफ़ाई करना बहुत पसंद है। Tool Call के पैरामीटर गलत लिखे गए तो Harness लोकल ठीक कर देता है; फ़ाइल अभी पढ़ी ही थी कि दोबारा पढ़ने की ज़रूरत पड़ी, तो Harness डी-डुप्लीकेट कर देता है; लंबे Session में Stable Prefix बनाए रखता है ताकि Cache Hit बढ़े; Context फटने ही वाला हो तो Compaction कर देता है; इनके अलावा Session Affinity, Taste, Subagent आइसोलेशन जैसी चीज़ें भी।
  यही सोच जब DeepSeek V4 Flash, GLM-5.3 Flash जैसे वर्कहॉर्स मॉडल्स पर लागू होती है, तो वैल्यू और बढ़ जाती है — मॉडल जितना कमज़ोर, Harness उतनी भरपाई कर देता है।
  तो अब मैं इन Harness की पोज़िशनिंग ऐसे करूँगा:
  Pi — अपना लॉन्ग-टर्म Agent बेस बनाने के लिए सबसे फ़िट: सिंपल, क्लीन, जैसे चाहो वैसे तोड़-मोड़ो।
  OMP — सच्चे हैवी Coding के लिए, जिन सीन में LSP, Debugger और कॉम्प्लेक्स Repo नेविगेशन चाहिए।
  DeepSeek Harness — Agent आर्किटेक्चर, Preset, मल्टी-Agent और नेक्स्ट-जेन Runtime के साथ खाँटा खेलने के लिए सबसे उपयुक्त।
  OpenCode — जिसे एक मैच्योर, जनरल-पर्पज़, मल्टी-मॉडल Coding Agent चाहिए, उसके लिए सबसे उपयुक्त।
  Command Code — DeepSeek / GLM जैसे ओपन मॉडल्स के हैवी यूज़र्स के लिए खास तौर पर, और खासकर जो Flash वर्कहॉर्स मॉडल्स को बड़े पैमाने पर चलाते हैं।
  तो अगर सिर्फ़ लॉन्ग-टर्म फ्लेक्सिबिलिटी देखी जाए, तो मुझे आज भी Pi ज़्यादा पसंद है। लेकिन अगर आज मुझसे DeepSeek V4 Flash / GLM-5.3 से ज़ोरदार काम करवाना कहा जाए, तो Command Code का स्वाद मैं अभी सच में चखूँगा।
