content: |
  Masalah kompatibilitas DeepSeek Harness + API pihak ketiga:

  Saat agent memanggil tool seperti Bash, muncul error `ToolNotFoundError: unknown tool ""`, yang terlihat seperti tool-nya tidak pernah didaftarkan.

  Yang sebenarnya terjadi: gateway mengembalikan format data yang berbeda dari API resmi DeepSeek, dan nama tool-nya hilang entah di mana di tengah proses.

  Beberapa tautan GitHub Discussions yang relevan:

  - Cari "unknown tool" di deepseek-ai/dsh#issues
  - Orang yang menjalankan gateway self-hosted (OpenRouter / OneAPI / new-api) paling rentan kena masalah ini

  Cara penelusuran: tangkap satu permintaan dan respons tool_call lengkap, lalu periksa apakah nama tool di log gateway berupa string kosong.