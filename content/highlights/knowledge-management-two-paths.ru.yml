content: |
  В последнее время я заново обдумываю управление знаниями.

  Я понял, что здесь на самом деле два пути.

  **Один — построить на Feishu.**

  Его преимущества очевидны:

  бесплатно, синхронизация на всех устройствах, доступно для шаринга, легко для совместной работы и достаточно богато по формам.

  Документы, многомерные таблицы, таблицы, презентации, канва, Todo, базы знаний — эти модули вместе уже покрывают множество личных и командных сценариев управления знаниями.

  Особенно я верю в многомерные таблицы.

  Они отлично подходят как хаб знаний.

  Сбор информации, архивирование материалов, управление статусами, структурная организация, переработка контента — всё может вращаться вокруг них.

  Добавь CLI Feishu и ИИ-агентов — и Feishu перестаёт быть просто офисным инструментом.

  Он становится больше похож на систему знаний-воркфлоу, которой могут управлять агенты.

  **Другой путь — построить своё на Cloudflare.**

  Этот путь свободнее и лучше подходит для продакшн-изации.

  FlareMo — то, что я сейчас строю, — это попытка сделать продукт управления знаниями на Cloudflare.

  Преимущество Cloudflare в том, что базовые возможности полные:

  фронтенд, бэкенд, база данных, объектное хранилище, векторный поиск, ИИ — всё комбинируется.

  Но это требует разработки.

  И нужно самому проектировать структуру данных, поисковый опыт, систему прав и продуктовую логику.

  Поэтому моё текущее мнение:

  - Feishu подходит, чтобы быстро поднять систему управления знаниями, которой можно пользоваться уже сегодня.
  - Cloudflare подходит, чтобы превратить управление знаниями в по-настоящему контролируемый, итерируемый продукт.

  Оба пути стоит изучить.

  Один ближе к воркфлоу.

  Один ближе к продакшн-изации.