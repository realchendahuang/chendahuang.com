  Ngày thứ 7 vận hành, vượt mốc 2000 follow — điểm lại nhanh.

  Cốt lõi chỉ một chữ: vị tha.

  Mình chủ yếu chia sẻ hai loại nội dung thực dụng:

  - Danh sách phần mềm dùng nặng trên macOS (48k lượt đọc)
  - Bảng Cloudflare miễn phí + Playbook (số liệu trên X cũng ổn; có người còn cào về viết lại đăng lên Zhihu, kéo được vài trăm bookmark)
  - Cộng thêm loạt gợi ý tài nguyên OPC — công ty một người (38k lượt đọc)

  Mình chẳng nghĩ đến chuyện làm sao tăng follow — chỉ gom những gì tự rút ra được rồi cho không. Vậy mà growth đến còn nhanh hơn.

  Mình sẽ tiếp tục ra những nội dung thực dụng kiểu này. Cảm ơn mọi người đã ủng hộ.
