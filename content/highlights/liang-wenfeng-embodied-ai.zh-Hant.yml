content: |
  梁文鋒在投資人會議上說：
  「智能的終點可能都是具身。因為對一個正常人來講，他的需求並不是電腦，而是人力。」
  這句話說得很準。普通人要的從來不是更聰明的電腦，而是能幹活的「人力」。文字再強，也只是中間態。 https://t.co/2xg5o5hNjt
