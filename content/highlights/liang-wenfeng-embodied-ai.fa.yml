content: |
  لیانگ وِن‌فنگ در جلسه‌ی سرمایه‌گذاران گفت:
  «نقطه‌ی پایانِ هوش، شاید همه‌جا تجسم‌یافته باشد. چون برای یک آدمِ معمولی، چیزی که نیاز دارد کامپیوتر نیست — نیرویِ کار است.»
  این حرف درستِ درست است. آدم‌های عادی هیچ‌وقت کامپیوترِ باهوش‌تر نخواسته‌اند؛ آنها «نیرویِ کارِ» واقعی می‌خواهند که کارها را انجام بدهد. متن هر چقدر هم توانا باشد، فقط یک حالتِ میانی است. https://t.co/2xg5o5hNjt
