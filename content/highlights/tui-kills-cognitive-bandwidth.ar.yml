title: "TUI بدأت تتعفّن: يخفض بنيوياً عرضك المعرفي"
description: "يفرض عليك حشر كل الحالة في ذاكرتك قصيرة المدى، وينقل تكلفة تفكيرك إلى تشغيل الواجهة."
