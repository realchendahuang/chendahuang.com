content: |
  TUI، بصراحة قاسية، بدأ يتعفّن.
  أقبح ما فيه ليس صعوبة استخدامه، بل أنه يخفض بنيوياً النطاق المعرفي للإنسان.
  تظن أنك تحاور الأداة بكفاءة، بينما أنت في الحقيقة تكرر ثلاث مهام باستمرار:
  استرجاع الاختصارات والأنماط
  تحديد موقع المعلومات داخل تيار حرفي متدفق
  والدعاء ألا تكون ضغطت خطأً فدخلت في حالة غريبة ما
  هذا لم يعد تفاعلاً، هذا عراك مع واجهة.
  الواجهة الفعالة حقاً يجب أن تنشر الحالة أمام عينيك لتفهمها بعينيك وإحساسك بالفضاء، لا أن تفرض عليك حشر كل شيء في ذاكرتك قصيرة المدى. TUI يفعل العكس تماماً — يدفع كثافة المعلومات إلى أقصاها، ويسحق قابلية القراءة وقابلية الاسترجاع إلى أدنى درجة.
  والأسوأ أنه يغرس عادة سيئة جداً: اعتبار إتقان اختصارات أداةٍ ما مهارة بحد ذاتها. النتيجة أن الإنسان يصرف طاقة هائلة على التأقلم مع الواجهة بدل التفكير في المشكلة.
  الأداة الجيدة يجب أن تخفض تكلفة التفكير، لا أن تنقل تكلفة التفكير إلى كيفية تشغيل واجهتها.
  شعبية TUI اليوم، في جزء كبير منها، استخدام فلتر الـ geek لإخفاء الكسل والغطرسة في تصميم التفاعل.
