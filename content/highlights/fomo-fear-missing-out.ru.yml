content: |
  Познакомлю вас с концепцией: FOMO, сокращение от Fear of Missing Out.

  Уверен, у многих есть эта проблема: видишь что-то хорошее — хочется заложить, видишь новый инструмент или тренд — хочется прыгнуть в него, всё время кажется, что иначе упустишь что-то важное. Итог: закладки пухнут, голова мутнеет, а внимание потихоньку отъедается по кусочку.