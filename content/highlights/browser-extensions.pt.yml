content: |
  Vou compartilhar as extensões de navegador que guardo há anos.

  - **Wetab**: extensão de nova aba — dá pra colocar as coisas de uso frequente, customizar mecanismo de busca, e sincronizar de graça entre aparelhos logando na conta. Montei nela um mecanismo de busca do X baseado no Google, muito melhor que o que vem de fábrica.
  - **Video Speed Controller**: ajusta a velocidade do vídeo com flexibilidade, ótimo pra absorver conhecimento de forma eficiente.
  - **XHunt**: essencial pra usar o X — mostra o ranking dos KOLs e os posts mais bombados do momento.
  - **X 互关雷达**: marca no page os perfis com relação mútua e unilateral, e dá pra escolher exibir a taxa following / followers.
  - **FireShot**: captura screenshot da página, edita e salva como PDF, JPEG, GIF, PNG ou BMP.
  - **Proton Pass**: gerenciador de senhas com design elegante, sincroniza entre aparelhos.
  - **沉浸式翻译 (Tradução Imersiva)**: a extensão veterana de tradução bilíngue, agora conectada à API do DeepSeek V4 Flash.
  - **Codex**: essencial pra conectar o Codex ao Chrome — com ela dá pra automatizar qualquer coisa no navegador, tipo escrever recurso de apelação quando a conta é banida.