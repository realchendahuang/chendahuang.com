  Últimamente estoy dándole vueltas a un plan.
  Mudar a Cloudflare toda la gestión del conocimiento personal, la recogida de información y la producción de conocimiento.
  La cuenta gratuita ya trae 10G de almacenamiento de objetos y 5G de base de datos.
  Es como tener un sistema de gestión del conocimiento autogestionado, en la nube y gratis para siempre.