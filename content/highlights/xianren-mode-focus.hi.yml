  मेरी X-स्क्रॉलिंग आवृत्ति हाल में घट गई है।

  पता नहीं क्या मैं संत-अवस्था में प्रवेश कर गया हूँ।

  ईमानदारी से आत्म-विमर्श के बाद, मैंने पाया कि मुझे एक ही सवाल सबसे ज़्यादा मायने रखता है:

  क्या मैं रोज़ जो कुछ भी स्क्रॉल करके गुज़रता हूँ, वह एक असली प्रोडक्ट बन सकता है?

  सौ टूल अपडेट्स देखना, एक ठोस सीन को तोड़ने के आगे कुछ नहीं।

  इन दिनों मैं प्रोडक्ट्स, कम्युनिटी और लंबी अवधि की सामग्री में ज़्यादा ऊर्जा लगाना चाहता हूँ।