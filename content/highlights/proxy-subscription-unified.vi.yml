content: |
  Nếu bạn đã mua “sân bay” vượt tường lửa, lại còn tự dựng node VPS riêng, và muốn chúng được quản lý thống nhất, route thống nhất, rồi đổ ra một link subscription duy nhất.
  Muốn quy tắc route, lọc node và logic phối hợp được bảo trì ở phía server, thay vì phải cấu hình từng client một.
  Muốn chạy nó bằng triển khai siêu nhẹ của Cloudflare — không server, không dịch vụ database, không tác vụ nền phức tạp để bảo trì.
