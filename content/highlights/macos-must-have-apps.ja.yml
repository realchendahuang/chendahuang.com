content: |
  macOS を深く長年使ってきて、以下のすごいソフトをまとめた：

  - **QuickRecorder**：録画の神器。サイズ小さめ、機能はパワフル。
  - **ClashParty**：科学上网（プロキシ）、Mihomo カーネル、対応プロトコル多め、更新も速く、画面は美しい。
  - **V2rayN**：科学上网（プロキシ）、対応プロトコル多め、画面は少しレトロだけど、安定してて無料。
  - **豆包入力法**：音声入力がバカみたいに正確。macOS、iOS、Android 対応、Windows は開発中。
  - **Brave**：プライバシー最優先のブラウザ、広告フィルタ内蔵で、プラグインでフィルタするよりきれい。YouTube 観るなら最高の相棒。
  - **Mos**：マウスのホイールスクロールをより滑らかにしてくれる。
  - **Amphetamine**：ノートパソコンのフタを閉じても画面を消さない。Vibe Coding の最高の相棒。
  - **UU 远程（UUリモート）**：NetEase 製のリモートデスクトップツール。無料、速い。これがあってからは画質を制限するのは会員じゃなくて、回線速度になった。スマホから Mac をリモート操作して Vibe Coding の結果をチェックするのに使ってる。キー操作のマッピングの効率は高すぎる。
  - **Tencent Lemon**：テンセント製の macOS ゴミ掃除ソフト。アンインストールがとてもスムーズで、ステータスバーアイコンも使いやすい。
  - **Mole**：macOS 最強のゴミ掃除ソフト。ターミナル版は無料、UI 版は有料。
  - **Tailscale**：WireGuard ベースの遠隔ネットワーキングツール。これがあれば、世界の果てから自分の家の小さなコンピュータに繋げられる。
  - **Obsidian**：AI 時代、ローカル優先のナレッジ管理ツール。エコシステムが優れすぎてる。公式 Web Clipper のブラウザ保存拡張と組み合わせると絶妙。