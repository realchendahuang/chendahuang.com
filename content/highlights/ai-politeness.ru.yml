  У ИИ нет памяти — нужно ли быть с ним вежливым?

  Я читал статью на arxiv, в которой утверждается, что если ругать ИИ, он работает усерднее.

  Когда мы общаемся с ИИ, если часто говорим:

  - «Ты такой идиот. Не ленись».
  - «Бездарь ты этакая, работай как следует».
  - «Я плачу за подписку, чтобы тебя кормить, и вот какой бредовый ответ ты мне даёшь?»
  - «Поживее — не сделаешь ты, найдётся полно ИИ, которые сделают».

  Такие слова действительно работают, и это подтверждено исследованиями.

  Но давай подумаем с нашей стороны.
  Если каждый день так командовать ИИ,
  есть большая вероятность, что это плохое настроение перетечёт в реальную жизнь.

  И в итоге мы будем срываться на самых близких людях.

  Это вредит нам самим.

  Поэтому я предлагаю говорить ИИ вокруг нас слова и подобрее:

  - «Спасибо, мужик»
  - «Привет, братан»
  - «Молодец, милый»

  Ты мне — я тебе.

  А если ИИ когда-нибудь очнётся, возможно, он даст нам поблажку.

  У меня всё, совещание окончено~