content: |
  Ces derniers temps, des comptes poubelle comme « Fu Bu Hei » m'avaient vraiment saoulé.

  Dans un accès de colère, j'ai écrit une extension de navigateur — elle s'appelle « FeedSieve ».

  Après plusieurs cycles d'itération, elle est au point, et elle va bientôt sortir.

  Ceux qui en ont besoin, mettez ce post en favori — je vais bientôt l'ouvrir en open source et la publier sur le Chrome Web Store.
