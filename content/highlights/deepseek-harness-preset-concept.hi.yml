content: |
  इन दिनों मैं DeepSeek Harness का अध्ययन कर रहा हूँ। इसमें Preset नाम की एक अवधारणा है जिस पर ध्यान देना चाहिए।

  Preset को एजेंट की वितरण इकाई के रूप में समझा जा सकता है। उसी मॉडल पर अलग-अलग Preset लोड करें, और यह पूरी तरह अलग एजेंट बन जाता है।

  Preset और Skill के बीच सबसे बड़ा अंतर क्या है?

  - एक वित्तीय-रिपोर्ट-विश्लेषण Skill: एजेंट को सिखाता है कि वित्तीय रिपोर्ट का विश्लेषण कैसे करें।
  - एक वित्तीय-रिपोर्ट-विश्लेषण Preset: वित्तीय-रिपोर्ट-विश्लेषण Skill, वेब सर्च, Browser, PDF, Python, subagents, रिसर्च prompts और कॉन्टेक्स्ट रणनीति — सब कुछ एक साथ बाँध देता है, और आपको एक तैयार-से-उपयोग एजेंट सौंपता है।

  भविष्य में, दो बाज़ार परतें एक साथ उभरने की संभावना है।

  - एक: Plugin / Skill Marketplace, मुख्यतः उन डेवलपर्स और पावर यूज़र्स के लिए जो एजेंट बनाते हैं;
  - एक: Preset / Agent Marketplace, जो सच में आम उपयोगकर्ताओं के लिए है।

  यह वास्तव में App Store के तर्क के बहुत करीब है। App Store एक संपूर्ण ऐप दिखाता है; एक Preset एक संपूर्ण एजेंट अनुप्रयोग दिखाता है।

  पहले लोग Prompt साझा करते थे। फिर उन्होंने Skills साझा करनी शुरू कीं। अगला कदम शायद Presets साझा करना होगा।
