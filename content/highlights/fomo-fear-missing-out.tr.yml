content: |
  Bir kavram tanıtayım: FOMO, açılımı Fear of Missing Out, yani bir şeyleri kaçırma korkusu.

  Eminim pek çok kişide bu sorun vardır: iyi bir şey görünce kaydetmek istersin, yeni bir araç ya da akım görünce hemen atlamak istersin, hep "kaçırırsam önemli bir şeyi kaçırırım" hissedersin. Sonuç: yer imlerin dolup taşar, kafan daha da karışır ve dikkatin bu süreçte azar azar tükenir.
