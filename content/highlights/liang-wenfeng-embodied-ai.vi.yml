content: |
  Liang Wenfeng từng nói tại một buổi gặp mặt nhà đầu tư:
  “Điểm cuối của trí tuệ có lẽ đều là hiện thân. Bởi với một người bình thường, thứ họ cần không phải là máy tính — mà là lao động.”
  Câu đó chuẩn không cần chỉnh. Người bình thường chưa bao giờ muốn một chiếc máy tính thông minh hơn; họ muốn “lao động” thật sự giải quyết được việc. Dù văn bản có giỏi đến đâu, nó cũng chỉ là trạng thái trung gian. https://t.co/2xg5o5hNjt
