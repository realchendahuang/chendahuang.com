content: |
  Ultimamente, contas-lixo tipo “Fu Bu Hei” estavam me dando nos nervos.

  Num acesso de raiva, escrevi uma extensão de navegador — o nome dela é “FeedSieve”.

  Depois de várias rodadas de iteração ela está num bom ponto, e vai entrar no ar em breve.

  Quem precisar, dá um bookmark aí — logo mais eu abro o código e publico no Chrome Web Store.
