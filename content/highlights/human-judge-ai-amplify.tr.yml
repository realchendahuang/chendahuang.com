  İnsanlar yargılar. AI büyütür.

  İnsan dikkati sınırlıdır. İnsanlar yalnızca en kritik yargı dilimini üstlenir.

  Sınırlı dikkatini değerli olduğu yere harcamalı ve AI'ın angaryanın daha fazlasını üstlenmesine izin vermelisin.

  AI iş akışlarının var olma sebebi tam olarak bu.

  AI iş akışı tüm angaryayı yutsun; insanlar en değerli, en çekirdek, nihai hedef sonuçların gözden geçirmesini ya da kabulünü, yani son yargıyı yapsın.

  Ulaşmak istediğim durum bu. Son zamanlarda ben de bu iş akışlarını araştırıyorum.
