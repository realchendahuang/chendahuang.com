  Heute ist der erste Tag im OPC-Büro. Ich erzähle von meinem Weg zur OPC-Gründung.

  Mein ursprünglicher Wunsch war nur: eine rechtskonforme Einheit, die Geld annehmen und Produkte in den Store bringen kann. Also habe ich im Internet nach Firmenregistrierungs-Infos gesucht.

  An die Stadt hatte ich keine großen Ansprüche: Nanjing, Suzhou, Hangzhou, Ningbo – solange es eine entwickelte Küstenregion ist, kommt sie in Frage.

  Durch einen glücklichen Zufall war ich eines Tages geschäftlich in Nanjing, hatte Langeweile und scrollte durch Nanjing-bezogene WeChat-Accounts. Dabei stieß ich auf die Telefonnummer eines OPC-Community-Kontakts. Die habe ich hinzugefügt.

  Nach einer kurzen Vorstellung meines Projekts fand die Verantwortliche es okay und organisierte für den Nachmittag eine Besichtigung vor Ort.

  Ihre Anforderung: an drei Tagen pro Woche vor Ort arbeiten. Wenn ich das akzeptiere, darf ich hier meine Firma registrieren.

  Weil es ein Projekt des staatlichen Nanjing-Kapitals ist, sind die Konditionen großzügig: Wasser, Strom, Netz und Mietnebenkosten sind komplett gratis – theoretisch drei Jahre lang. Sogar ein Steuerberater hilft mir bei der Firmenregistrierung, sticht den Firmenstempel, holt die Gewerbelizenz und organisiert das Bankkonto. Das ergriff mich bis ins Mark.

  Nach zwei, drei Wochen Anmeldeverfahren hielt ich endlich alle Unterlagen in der Hand.

  Der Park-Manager ließ mich einen eigenen Arbeitsplatz aussuchen. Meine Ansprüche daran waren gering: ein Tisch, ein Stuhl, Strom – fertig.

  Der Park-Manager ließ mich drei Projekt-Antragsformulare ausfüllen: Vorstellen der Projektvorteile, der Teamzusammensetzung und der Stärken in Kombination mit AI. Wenn es überzeugend und verlässlich geschrieben ist, gibt es Chancen auf eine staatliche Förderung von 50.000 bis 100.000 Yuan.

  Ich finde, Nanjing macht das wirklich gut. Ihr könnt auch prüfen, ob eure Stadt oder die Landeshauptstadt ähnliche oder bessere Förderungen hat.

  Gute Förderungen warten nicht – fragt aktiv herum. Als ich heute ankam, hatten sich schon viele Firmen im Park angesiedelt; ich war einer der Nachzügler.

  Das war's für heute. Ab jetzt teile ich kontinuierlich meine gesamten Gründererfahrungen und die Retrospektiven.

  Danke für eure Anteilnahme.