content: |
  TUI ini, kalau mau jujur, sudah mulai bau.
  Hal paling menjijikkannya bukan karena sulit dipakai, melainkan karena ia secara sistematis menurunkan bandwidth kognitif manusia.
  Kau pikir kau sedang berdialog efisien dengan alat, padahal kau terus-menerus melakukan tiga hal:
  mengingat shortcut dan mode
  mencari informasi di tengah arus karakter yang bergulir
  dan berdoa supaya tidak tersentuh salah masuk ke suatu keadaan aneh
  Ini bukan interaksi lagi, ini berkelahi dengan antarmuka.
  Antarmuka yang benar-benar efisien seharusnya membentangkan status di depan matamu, membiarkan mata dan insting spasialmu yang memahami, bukan memaksa segala sesuatu diselipkan ke memori jangka pendek. TUI justru sebaliknya — ia menumpuk kepadatan informasi sampai ekstrem, tapi membanting keterbacaan dan kemudahan pemulihan sampai serendah mungkin.
  Lebih parah lagi, ia juga memupuk kebiasaan buruk: menganggap menguasai tata tombol suatu alat sebagai kemampuan itu sendiri. Akibatnya, orang menghabiskan banyak tenaga untuk menyesuaikan diri dengan antarmuka, bukan untuk memikirkan masalah.
  Alat yang baik seharusnya menurunkan biaya berpikir, bukan memindahkan biaya berpikir itu ke urusan cara mengoperasikan antarmukanya.
  Popularitas TUI saat ini, sebagian besar hanyalah filter geek untuk menutupi kemalasan dan kesombongan pada desain interaksinya sendiri.
