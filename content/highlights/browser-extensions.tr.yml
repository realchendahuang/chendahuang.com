content: |
  Yıllardır elimden bırakmadığım tarayıcı eklentilerini paylaşıyorum.

  - **Wetab**: yeni sekme eklentisi. Sık kullandıklarını içine koy, arama motorlarını özelleştir, hesapla cihazlar arasında ücretsiz senkronize et. İçine Google tabanlı bir X arama motoru kurdum — dahili olandan çok daha iyi.
  - **Video Speed Controller**: video hızına ince ayar çeker, bilgiyi verimli öğrenmek için harika.
  - **XHunt**: X için olmazsa olmaz. Her KOL'un sıralama tablosunu ve o anki en ateşli gönderileri gösteriyor.
  - **X Karşılıklı Takip Radarı**: sayfada karşılıklı ve tek taraflı takipleri işaretliyor, takip / takipçi oranını da gösterebiliyor.
  - **FireShot**: web sayfası ekran görüntüsü al, düzenle, PDF, JPEG, GIF, PNG veya BMP olarak kaydet.
  - **Proton Pass**: şık tasarımlı, çoklu cihaz senkronlu parola yöneticisi.
  - **Immersive Translate**: iki dilli çeviri eklentisinin duayeni, DeepSeek V4 Flash API'sine bağlı.
  - **Codex**: Codex'i Chrome'a bağlamak için olmazsa olmaz. Onunla tarayıcıda her şeyi otomatikleştirebilirsin — hesabın banlanınca itiraz e-postası yazmak gibi.