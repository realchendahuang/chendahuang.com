content: |
  امروز یک دوست در بخشِ کامنت‌هایم نکته‌هایی درباره‌ی مسائلِ سهام و مسئولیت در شرکت‌های یک‌نفره گذاشت.

  اول از همه، خیلی از این دوست به‌خاطرِ تذکرِ مهربانانه‌اش ممنونم.

  نظرِ او این است: باید یک عضوِ خانواده حداقل 1٪ از سهام را در دست بگیرد.

  مشکلِ شرکتِ با مسئولیتِ محدودِ تک‌شریکه: وقتی فقط یک سهامدار هست و نمی‌توانی پولِ شرکت را شفاف از پولِ شخصی جدا کنی، ممکن است سهامدار در برابرِ بدهی‌های شرکت مسئولیتِ تضامنی داشته باشد. ماده‌ی 23 قانونِ شرکت‌ها دقیقاً همین منطق است.

  اگر شرکت چند سهامدار داشته باشد، از «شرکتِ یک‌نفره» به «شرکتِ سهامیِ با مسئولیتِ محدودِ معمولی» تبدیل می‌شود و ریسکِ ویژه‌ی اثباتِ بارِ شرکتِ یک‌نفره را دور می‌زنی و یک لایه‌ی محافظتِ کم‌هزینه برای خودت می‌سازی.

  امیدوارم برای همه مرجعِ مفیدی باشد.

  اما در کارِ روزمره باید حسابِ کاری و شخصی را شفاف از هم جدا نگه داریم و تلاش کنیم تکلیفِ هر پولِ مهمی روشن باشد.

  - پول از کجا آمد، چرا آمد و واردِ کدام حساب شد.
  - پول کجا خرج شد، چرا خرج شد و چه کسی تأییدش کرد.
  - وقتی از شرکت پول بیرون می‌کشی، حقوق است، هزینه‌ی قابلِ بازپرداخت، وام یا سودِ سهام؟

  اگر این سه چیز را روشن کنیم، ریسک به شکلِ چشمگیری پایین می‌آید.
