content: |
  Очень точно подмечено — это хроническая болезнь поколения GPT-5:

  Он постоянно вписывает внутренние требования в тексты интерфейса, чтобы доказать свою работу. Доказать себя — мол, смотри, я же действительно сделал, разве я не молодец, я не отлынивал, я выложил все твои требования на стол.

  А тексты интерфейса раздуты до невозможности. С 5.0 и до самой 5.6 — поколение за поколением — это так и не починили. Оно у него в костном мозге.

  Тот, кто реально выпускал фронтенд-продукты, понимает:

  - Каждый кусочек текста в интерфейсе, большой или маленький, — это текст для пользователя
  - Текст, который должен попадать в чат как обратная связь разработчику, никогда не должен попадать в продукт

  Но он не просто пишет плохие тексты — он часто вписывает внутреннюю обратную связь прямо в продукт, чтобы «показать», что он что-то сделал.