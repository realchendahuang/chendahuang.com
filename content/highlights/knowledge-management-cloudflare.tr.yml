  Son zamanlarda bir plan üzerinde düşünüyorum.
  Kişisel bilgi yönetimimi, bilgi toplamayı ve bilgi üretimini tamamen Cloudflare üzerine taşımak.
  Ücretsiz bir hesapta zaten 10G nesne depolama ve 5G veritabanı var.

  Bu, kendi kendine barındırılan, bulut tabanlı, sonsuza dek ücretsiz bir bilgi yönetim sistemi demek.
