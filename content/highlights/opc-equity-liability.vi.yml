content: |
  Hôm nay một người bạn chia sẻ trong phần bình luận của mình vài điểm về vấn đề cổ phần và trách nhiệm của công ty một người.

  Trước hết, xin cảm ơn người bạn này đã nhắc nhở tận tình.

  Quan điểm của bạn ấy: nên để một thành viên trong gia đình nắm ít nhất 1% cổ phần.

  Vấn đề của công ty TNHH một thành viên: khi chỉ có một cổ đông duy nhất mà không thể tách bạch rõ tiền công ty với tiền cá nhân, thì cổ đông có thể phải chịu trách nhiệm liên đới đối với các khoản nợ của công ty. Điều 23 Luật Công ty chính là logic này.

  Nếu công ty có nhiều cổ đông, nó chuyển từ “công ty một người” thành “công ty TNHH thông thường”, né được rủi ro đặc biệt về nghĩa vụ chứng minh của công ty một người, và tự thêm một lớp bảo vệ chi phí thấp.

  Hy vọng điều này có ích làm tài liệu tham khảo cho mọi người.

  Nhưng trong sinh hoạt hằng ngày, chúng ta nên tách bạch rõ ràng tài khoản kinh doanh với tài khoản cá nhân, và tập giải trình được từng khoản tiền lớn.

  - Tiền từ đâu ra, vì sao có, vào tài khoản nào.
  - Tiền đi đâu, vì sao chi, ai duyệt.
  - Khi rút tiền ra khỏi công ty, đó là lương, hoàn ứng, khoản vay hay cổ tức?

  Làm rõ được ba điều này, rủi ro sẽ giảm đi đáng kể.
