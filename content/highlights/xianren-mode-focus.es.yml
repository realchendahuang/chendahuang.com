content: |
  Últimamente he bajado la frecuencia con la que hago scroll en X.

  No sé si he entrado en modo reflexivo.

  Después de reflexionar con calma descubrí que me preocupa más una pregunta:

  si todo lo que barro cada día puede acabar convirtiéndose en un producto real.

  Por muchas actualizaciones de herramientas que vea, mejor es atravesar de un solo golpe un escenario concreto.

  Este tiempo quiero poner más energía en el producto, la comunidad y el contenido a largo plazo.