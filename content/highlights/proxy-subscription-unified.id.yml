content: |
  Kalau kamu sudah membeli airport circumvention dan juga membangun node VPS sendiri, dan ingin keduanya dikelola secara seragam, di-routing seragam, dan keluar sebagai satu tautan langganan.
  Kamu ingin aturan routing, penyaringan node, dan logika kombinasi dipelihara di sisi server, bukan dikonfigurasi klien per klien.
  Kamu ingin menjalankannya dengan deployment ringan Cloudflare — tanpa server, tanpa layanan database, tanpa pekerjaan latar belakang kompleks yang harus dipelihara.
