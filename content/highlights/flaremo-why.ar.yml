  بحثتُ عن أداة لـ«التدوين العابر، ثم النمو شيئاً فشيئاً حتى تشكّل معرفة».

  أردت من Flomo جني الأفكار الفورية بلا إزعاج، كما تُفتح العلبة وترى ما بداخلها؛

  وأردت من Memos النظام الناضج مفتوح المصدر، والبيانات القابلة للهجرة، والواجهة التي تُلعب بها؛

  بينما لا أريد فتح VPS جديد، ولا إدارة Docker أو Postgres أو عمليات Node المقيمة.

  فما الحل؟ إن منهج FlareMo هو اعتبار نموذج بيانات Memos وواجهته «مواصفة»، ثم إعادة بناء بيئة التشغيل كلها على Cloudflare:

  Workers تشغّل الواجهة، وD1 تخزن الملاحظات، وR2 يحمل المرفقات، وQueues/Cron تدير المهام الخلفية، وVectorize + Workers AI محجوزان للبحث الدلالي وسير عمل الذكاء الاصطناعي في المستقبل.

  واقفاً على أكتاف Memos، أبني مكتبة معرفة شخصية تترعرع على السحابة الطرفية.