content: |
  요즘 계획 하나를 생각 중이다.
  개인 지식 관리, 정보 수집, 지식 출력을 전부 Cloudflare로 옮기는 것.
  무료 계정만으로도 객체 스토리지 10GB와 데이터베이스 5GB가 기본으로 딸려 온다.

  말하자면 자체 구축에, 클라우드 기반에, 영구 무료인 지식 관리 시스템인 셈이다.
