  Jour 7 d'exploitation, plus de 2000 followers, petit bilan.

  Le cœur tient en un mot : l'altruisme.

  J'ai partagé surtout deux types de contenu utile :

  - la liste des logiciels macOS que j'utilise à fond (48k lectures)
  - le tableau des quotas gratuits Cloudflare + Playbook (belles données sur X, copié-collé et lavé sur Zhihu par un mec, qui a même attrapé plusieurs centaines de favoris)
  - et aussi ma sélection de ressources OPC one-person company (38k lectures)

  Je ne cherchais pas à gagner des followers : je triais ce que j'avais compris et je le donnais gratuitement. Résultat : ça a grimpé vite.

  Je continue à sortir ce genre de contenu pratique. Merci de votre soutien.