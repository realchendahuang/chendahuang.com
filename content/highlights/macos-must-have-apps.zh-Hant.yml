content: |
  macOS 重度使用多年，我整理了下面這幾個真的很猛的軟體：

  - **QuickRecorder**：螢幕錄影神器，體積小，功能強大。
  - **ClashParty**：翻牆工具，Mihomo 核心，支援的協定多、更新快、介面美觀。
  - **V2rayN**：翻牆工具，支援的協定多，介面復古了一點，但勝在穩定、免費。
  - **豆包輸入法**：語音輸入準到不行，支援 macOS、iOS、Android，Windows 還在路上。
  - **Brave**：隱私優先的瀏覽器，內建廣告過濾，比擴充功能過濾得更乾淨，看 YouTube 的最佳夥伴。
  - **Mos**：讓你的滑鼠滾輪滾動得更絲滑。
  - **Amphetamine**：讓你的筆電闔蓋也不會關螢幕，Vibe Coding 的最佳夥伴。
  - **UU 遠端**：網易出品的遠端桌面工具，免費、速度快。有了它以後，限制畫質的從來不是會員，是網速。我通常用它透過手機遙控 macOS 看 Vibe Coding 的結果，按鍵映射效率太高了。
  - **Tencent Lemon**：騰訊出品的 macOS 垃圾清理軟體，卸載軟體很順暢，狀態列圖示也很好用。
  - **Mole**：macOS 最強的垃圾清理軟體，終端機版免費，UI 版要收費。
  - **Tailscale**：基於 WireGuard 的遠端異地組網軟體。有了它，你在天涯海角都能連上家裡的小電腦。
  - **Obsidian**：AI 時代，本地優先的知識管理工具。生態太好了，搭配官方 Web Clipper 瀏覽器剪藏擴充功能有奇效。
