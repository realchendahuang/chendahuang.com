title: "왜 Responses API가 Chat Completions보다 Agent에 더 적합한가"
description: "평소에 AI 도구를 쓰는 사람들은 대부분 API 키를 설정해야 하고, 가끔은 인터페이스 형식을 고르라고 하기도 한다."
