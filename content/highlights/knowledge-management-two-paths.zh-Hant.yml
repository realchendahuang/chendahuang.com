content: |
  最近在重新思考知識管理這件事。

  我發現這裡其實有兩條路線。

  **一條是基於飛書搭建。**

  它的優勢很直接：

  免費、多端同步、可分享、協作方便，形式也夠豐富。

  文件、多維表格、試算表、簡報、畫布、Todo、知識庫，這些模組組合起來，已經能涵蓋很多個人和團隊的知識管理場景。

  我尤其看好多維表格。

  它很適合當作知識中樞。

  資訊收集、資料歸檔、狀態管理、結構化整理、內容再生產，都可以圍繞它展開。

  再加上飛書 CLI 和 AI Agent，飛書就不只是一個辦公軟體了。

  它更像一個可以被 Agent 操作的知識工作流系統。

  **另一條路線是基於 Cloudflare 自行開發。**

  這條路更自由，也更適合產品化。

  比如我現在正在做的 FlareMo，就是想基於 Cloudflare 去做一個知識管理產品。

  Cloudflare 的好處是底層能力很完整：

  前端、後端、資料庫、物件儲存、向量檢索、AI 能力，都可以組合起來。

  但它需要開發。

  也需要自己設計資料結構、搜尋體驗、權限系統和產品邏輯。

  所以我現在的判斷是：

  - 飛書適合快速搭一套能馬上上線的知識管理系統。
  - Cloudflare 適合把知識管理做成一個真正可控、可迭代的產品。

  這兩條路線都值得研究。

  一條偏工作流。

  一條偏產品化。
