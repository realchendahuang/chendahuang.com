content: |
  나는 왕샤오보의 골수 추종자다.

  그는 재밌지만, 능글맞지 않다.
  그는 유머러스하지만, 늘 논리적이다.
  그는 어리석음을 혐오했고, 아주 진지하게 차려입은 어리석음도 그만큼 혐오했다.

  왕샤오보가 AI 시대에 살았다면,

  아마 이렇게 말했을 것이다:

  드디어 보통 사람들이 어리석은 헛수고를 조금 덜 하고, 진짜로 재미있는 생각을 할 시간을 조금 더 남겨 주는 무언가가 나타났다고.

  이것이 내가 AI를 좋아하는 이유이기도 하다.

  신적이어서가 아니다.

  사람들이 지루한 노동의 고통을 조금 덜 겪게 해 주기 때문이다.
