content: |
  最近ますます、感情の価値はとても価値があると思うようになってきた。

  俺たちホモ・サピエンスがなぜ結束して大きなことを成し遂げられるのか？

  それは共通の物語、共通の感情、共通のトーテム、共通の神話、共通のナラティブを信じているからこそ、組織ができて、互いに協力し合い、大きくなって、共に栄えを築いてきた。

  これこそ、感情の価値じゃないか？