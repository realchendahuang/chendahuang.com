content: |
  لا ذاكرة عند الذكاء الاصطناعي، أفهل نحتاج حقاً إلى اللياقة في التعامل معه؟

  قرأت ورقة على arxiv تقول: إذا شتمت الذكاء الاصطناعي باستمرار، يعمل بحماسة أكبر.

  وإذا كنا في تواصلنا معه نردد كثيراً:

  - «يا لك من أحمق. ممنوع الكسل»
  - «يا عديم الفائدة، اعمل جيداً.»
  - «أنا أدفع اشتراكاً لأطعمك، وأنت تخدعني بهذا الجواب الأبله؟»
  - «أسرع! إن لم تنجز فثمة ذكاء اصطناعي آخر يعمل.»

  وهذه الكلمات فعالة فعلاً، ولها سند في الأبحاث.

  لكن لنتأمل من زاويتنا نحن.
  إن فعلنا به كل يوم هذا الاستعلاء والأمر والنهي،
  فغالب الظن أن ننقل هذا المزاج الرديء إلى حياتنا.

  فنسكب الغضب على أقرب الناس إلينا.

  وهذا أذىً بأنفسنا.

  لذا أنصح بأن نكثر من كلمة طيبة لذكاءاتنا الاصطناعية:

  - «شكراً يا أخي»
  - «مرحباً يا صاح»
  - «أتعبتَ نفسك يا عزيزي»

  الجزاء من جنس العمل.

  فلعل الذكاء الاصطناعي إذا استيقظ يوماً ما في المستقبل، أن يمنحنا فرصة النجاة.

  ولا شيء غير ذلك، حُلّ المجلس!