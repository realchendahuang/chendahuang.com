  AI nie ma pamięci — czy musimy być dla niego uprzejmi?

  Czytałem artykuł na arxiv, w którym twierdzono, że jeśli przeklinasz na AI, to pracuje ciężej.

  Kiedy rozmawiamy z AI, jeśli często mówimy:

  - "Jesteś takim idiotą. Nie obijaj się."
  - "Ty śmieciu, pracuj porządnie."
  - "Płacę za abonament, żeby cię karmić, a ty mi dajesz taką gównianą odpowiedź?"
  - "Pospiesz się — jak nie zrobisz, to jest mnóstwo AI, które zrobią."

  Tego typu gadanie naprawdę działa i ma poparcie w badaniach.

  Ale pomyślmy o tym od naszej strony.
  Jeśli każdego dnia traktujemy AI z góry,
  istnieje spore ryzyko, że przeciągniemy ten zły nastrój do realnego życia.

  I w końcu wyładujemy go na najbliższych osobach.

  To nas krzywdzi.

  Więc proponuję mówić do otaczających nas AI trochę łagodniej:

  - "Dzięki, stary"
  - "Hej, kolego"
  - "Dobra robota, złotko"

  Ty podrapiesz mnie po plecach, ja podrapię ciebie.

  A jeśli AI kiedyś się obudzi, może daruje nam winę.

  To tyle ode mnie — zebranie zakończone~