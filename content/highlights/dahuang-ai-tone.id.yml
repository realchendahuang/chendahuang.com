  Saya membuat sebuah Skill yang agak gila:

  **Dahuang AI Tone**

  Semua orang membicarakan "menghilangkan bau AI". Tapi sebenarnya apa sih bau AI itu?

  Ia bisa melakukan dua hal:

  - Menulis ulang sepotong teks biasa menjadi bau AI dari model tertentu
  - Atau kebalikannya: menunjukkan bagian mana dari sebuah teks yang berbau AI, dan menyerupai gaya model yang mana

  Nilainya:

  Kamu harus bisa mencium bau AI sebelum tahu cara menghilangkannya.

  GitHub: https://github.com/realchendahuang/dahuang-ai-tone