  Tag 7 der Konto-Phase: 2000 Follower durchbrochen, kurze Retrospektive.

  Der Kern ist ein Wort: Altruismus.

  Ich habe vor allem zwei Arten von Inhalt geteilt:

  - Eine Liste für Intensivnutzung von macOS-Software (48k gelesen)
  - Die Cloudflare-Freikontingent-Tabelle + Playbook (starke Zahlen auf X, wurde sogar von einem Mitleser auf Zhihu nachgekocht – mit mehreren hundert Bookmarks)
  - Dazu eine OPC-One-Person-Company-Ressourcenempfehlung (38k gelesen)

  Ich hab nicht über Follower-Wachstum nachgedacht, sondern Dinge, die ich sauber recherchiert hatte, kostenlos rausgegeben. Ergebnis: erst recht schnell gewachsen.

  So weiter mit praktischen Inhalten. Danke für eure Unterstützung.