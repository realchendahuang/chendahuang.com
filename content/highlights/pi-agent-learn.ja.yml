  ある兄貴が聞いてきた：

  Claude Code の分析資料で、学ぶのにいいものはない？

  俺の回答は、AI 時代は、常に AI のことを考えること。AI に学習をアシストさせろ、だ。

  本当に Agent の原理を学びたいなら。

  Pi Agent というプロジェクトを見てみるといい。

  麻雀は小さいけど五臓六腑は揃ってる、学ぶのに最高に適してる、しかもコードの品質も高い。

  Claude Code はオープンソースじゃない。ソースコードの流出だ。

  Pi Agent こそが本当のオープンソース。