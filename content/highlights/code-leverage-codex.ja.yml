  一つの見解を述べる：

  コードは俺たち普通の人のレバレッジだ。

  Codex はレバレッジのレバレッジ。

  Codex を引き抜かれたら、釜の下の薪を抜かれるようなもの。

  まさに、基盤が固くなければ、地動山揺（土台が揺れれば天地が揺れる）。

  国産の AI たち、さっさと本気を出せよ！