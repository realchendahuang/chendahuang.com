content: |
  دنبال ابزاری می‌گردم که «گذرا یادداشت کنم و کمک‌کم به دانش تبدیل شود».

  می‌خواهم همان ثبتِ بی‌اصطکاکِ ایده در لحظه را داشته باشم که Flomo می‌دهد — باز کن و بنویس؛

  می‌خواهم اکوسیستم متن‌بازِ بالغِ Memos را داشته باشم، با داده‌هایی که قابل انتقال‌اند و APIای که بشود با آن بازی کرد؛

  اما دلم نمی‌خواهد دوباره یک VPS بالا بیاورم و تا ابد پای Docker و Postgres و یک پروسه‌ی Node که همیشه روشن است بنشینم.

  پس چاره چیست؟ ایده‌ی FlareMo این است: مدل داده و API مِمس را «اسپک» بگیر و کل رانتایم را از نو روی Cloudflare بساز:

  Workers API را اجرا می‌کند، D1 یادداشت‌ها را ذخیره می‌کند، R2 پیوست‌ها را نگه می‌دارد، Queues/Cron کارهای پس‌زمینه را انجام می‌دهند و Vectorize + Workers AI هم برای آینده کنار گذاشته شده‌اند — برای جست‌وجوی معنایی و ورک‌فلوهای هوش مصنوعی.

  روی شانه‌های Memos بایست و یک پایگاه دانش شخصی بساز که روی ابرِ لبه (Edge Cloud) زندگی می‌کند.
