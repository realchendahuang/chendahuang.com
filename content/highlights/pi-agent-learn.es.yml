  Un colega preguntó:

  ¿hay buena documentación de análisis de Claude Code para aprender?

  Mi respuesta: en la era de la IA, hay que pensar en la IA en todo momento y dejar que la IA te ayude a aprender.

  Si de verdad quieres aprender los principios de los Agents,

  puedes ir a mirar el proyecto Pi Agent.

  Pequeño pero completo: perfectísimo para aprender, y con una calidad de código altísima.

  Claude Code no es open source: es una filtración del código fuente.

  Pi Agent es open source de verdad.