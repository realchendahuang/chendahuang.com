content: |
  今の俺の陣容はこんな感じだ。
  
  国産モデルなら、ZCode を載せるのを推奨（DeepSeek V4 Flash、GLM 5.3 Flash あたりのモデル）。
  
  GPT ならそのまま Codex。
  
  速さを求めるなら Pi。
  
  速くて安心も欲しいなら OMP。
  
  企業向けにカスタマイズしたクライアント開発をするなら DSH。
  
  忍耐力を鍛えたいなら Workbuddy。
