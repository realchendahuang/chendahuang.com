content: |
  Aujourd'hui un ami a partagé dans mes commentaires des questions de responsabilité sur les parts d'une one-person company.

  D'abord, un grand merci à cet ami pour son gentil rappel.

  Son point de vue : il faut que ta famille détienne au moins 1 % des parts.

  Le problème de la société à responsabilité limitée à un seul associé : quand il n'y a qu'un seul actionnaire, si on ne peut pas prouver que l'argent de la société et l'argent perso sont séparés, on risque une responsabilité solidaire sur les dettes de l'entreprise. L'article 23 de la loi sur les sociétés dit exactement ça.

  S'il y a plusieurs actionnaires, la société passe de « one-person company » à « société à responsabilité limitée ordinaire », et on évite le risque de charge de la preuve particulier de la one-person company, en se donnant une couche de tampon à bas coût.

  J'espère que ça servira de référence.

  Mais au quotidien, on doit veiller à séparer les comptes pro et perso. Chercher à pouvoir expliquer chaque argent important.

  - D'où vient l'argent, pourquoi il est là, dans quel compte il est entré.
  - Où va l'argent, pourquoi il y va, qui l'a approuvé.
  - Quand tu prends de l'argent à la société : salaire, remboursement de frais, emprunt, ou dividendes.

  Ces trois choses une fois dites clairement, le risque baisse nettement.