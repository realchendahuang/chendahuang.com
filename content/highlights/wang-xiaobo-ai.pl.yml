  Jestem zagorzałym uczniem Wang Xiaobo.

  Jest dowcipny, ale nigdy śliski.
  Jest zabawny, ale zawsze logiczny.
  Nienawidził głupoty – i równie mocno nienawidził uroczystej, śmiertelnie poważnej głupoty.

  Gdyby Wang Xiaobo żył w erze AI,

  mógłby powiedzieć:

  wreszcie coś, co pozwala zwykłym ludziom odwalić trochę mniej głupiej roboty i zachować trochę więcej czasu na naprawdę interesujące myśli.

  To także powód, dla którego lubię AI.

  Nie dlatego, że jest boskie.

  Ale dlatego, że może oszczędzić ludziom trochę męki monotonnej pracy.