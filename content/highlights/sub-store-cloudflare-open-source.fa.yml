content: |
  اشتراک‌های دور زدنِ فیلترینگم را بردم روی Cloudflare.

  یک پروژه‌ی متن‌بازِ اگریگیتِ لینکِ اشتراک را منتشر کردم که کاملاً رایگان روی Cloudflare مستقر می‌شود.

  همه‌ی لینک‌های اشتراکِ فیلترشکن و نودهایِ شخصی‌ات را جمع می‌کند توی یک لینک، با قوانینِ مسیریابی که می‌توانی به‌ش ببندی.

  واقعاً فقط یک لینک — توی هر کلاینتی کار می‌کند، بدونِ پیکربندیِ جداگانه برای هر کلاینت.

