content: |
  Сегодня мой первый день официального переезда в офис OPC. Проведу вас через то, как я открыл OPC.

  Моя изначальная мотивация была проста: иметь легальную структуру для приёма платежей и публикации продуктов. Поэтому я пошёл в интернет искать информацию о регистрации компании.

  Я не был привередлив к городу: Нанкин, Сучжоу, Ханчжоу, Нинбо — любой развитый прибрежный город подходил.

  По совпадению, однажды я был в Нанкине по работе, и, листая аккаунты в WeChat про Нанкин, нашёл номер контакта OPC-сообщества. Я его добавил.

  После краткого представления моего проекта ответственный сказал «ок» и договорился о визите на место в тот же день после обеда.

  Их требование: работать на месте три дня в неделю. Если я могу это принять, они разрешат мне зарегистрировать здесь компанию.

  Поскольку это под государственными активами Нанкина, условия политики выдающиеся — вода, электричество, интернет и коммунальные платежи бесплатны, теоретически на три года. Они даже выделили бухгалтера, который зарегистрировал компанию, вырезал печать компании, получил лицензию на бизнес и открыл банковский счёт. Настолько трогательно, что почти абсурдно.

  После двух-трёх недель процесса регистрации я наконец получил все документы.

  Менеджер парка сказал мне выбрать рабочее место. Моя планка для рабочего места низкая — просто стул, табуретка и розетка.

  Затем они попросили меня заполнить три формы заявки на проект, в основном о сильных сторонах проекта, профиле команды и ИИ-преимуществе. Если заявки солидные и заслуживают доверия, есть шанс на субсидию по политике в 50 000–100 000 юаней.

  В Нанкине с этим действительно справились хорошо. Всем стоит проверить, есть ли в их городе похожие политики, или предлагает ли их столица провинции что-то лучше.

  Хорошие политики не ждут — нужно идти и спрашивать. К тому моменту, как я приехал сегодня, в парке уже разместилось немало компаний; я, честно говоря, из поздних.

  На сегодня всё. Продолжу делиться своим предпринимательским путём и ретроспективами по пути.

  Спасибо всем за заботу.