  Hazine niteliğinde bir siteyi paylaşıyorum: Buzzing

  Bilgi kaynaklarını genişletmek ve yankı odasından çıkmak isteyen herkes için.

  Hacker News, Reddit, BBC, Reuters, Bloomberg, Product Hunt gibi yabancı kaynaklardan popüler içerikleri sürekli çekip başlıkları Çinceye çeviriyor.

  En büyük değeri: başlıkları önce Çince gözden geçirebiliyorsun.

  Gözüne takılan, okumaya değer görünen bir şey olursa detaylara girmek için tıklıyorsun.

  O noktada iki dilli okuma için Immersive Translate ile birleştir.