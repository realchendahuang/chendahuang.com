content: |
  Menemukan sesuatu yang bagus — DeepSeek ternyata membangun web search langsung di dalam API-nya.
  Panggil model deepseek-v4-flash lewat interface Responses, dan cukup deklarasikan tool web_search di parameter permintaan untuk langsung memakai kemampuan pencarian sisi server mereka.
  Tidak perlu integrasi mesin pencari pihak ketiga, tidak perlu mengajukan API key pencarian terpisah.
  Seluruh alur pencarian dihosting langsung oleh tim resmi.
