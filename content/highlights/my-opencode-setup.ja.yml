content: |
  今使っている OpenCode の構成をシェアします。私の構成は 3 つのコア要件を軸に組み立てています：
  コンテキスト管理——長いセッションでもコンテキストを溢れさせず、お金と Token を節約
  メモリシステム——セッションをまたいでユーザーの好み、プロジェクトの意思決定、過去の教訓を覚えておく
  外部能力——ドキュメント検索、コード検索、デスクトップ自動化
  主に使っているプラグインは以下のとおり:
  1. opencode-dcp（オープンソース）動的コンテキスト剪定プラグイン。
  コンテキストが閾値に達すると、古い内容を自動で技術サマリーに圧縮。キー情報は残し、ノイズは捨て、重複内容は自動で掃除し、ツールのエラーログのような低価値コンテンツはコンテキストから取り除きます。
  2. opencode-goal-plugin
  Goal モードのプラグイン。長いタスクにゴール管理を追加します
  3. Hermes Memory（需要があれば後日オープンソース化します）
  これが私のいちばん重いプラグイン——Hermes agent の階層メモリ機構を OpenCode に移植したものです。
  4. context7-MCP
  ライブラリ/フレームワークの最新公式ドキュメントを調べられます。
  5. grep-MCP
  GitHub コード検索。GitHub 全サイトのコードから実際の使われ方を探せます。
  6. open-computer-use（デスクトップ自動化）
  AI に macOS アプリを直接操作させます——クリック、入力、スクロール、ドラッグ、スクリーンショット、アクセシビリティツリーの読み取り。
