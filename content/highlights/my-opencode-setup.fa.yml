content: |
  تنظیمات فعلی OpenCodeام را به اشتراک میگذارم. تنظیماتم حول سه نیاز اصلی چیده شده:
  مدیریت کانتکست — سشنهای طولانی که کانتکست را منفجر نکنند، صرفهجویی در پول و توکن
  سیستم حافظه — یادسپاری ترجیحات کاربر، تصمیمهای پروژه و درسهای گذشته بین سشنها
  قابلیتهای بیرونی — جستجوی مستندات، جستجوی کد، اتوماسیون دسکتاپ
  مهمترین پلاگینهایی که استفاده میکنم:
  1. opencode-dcp (متنباز) پلاگین هرس پویای کانتکست.
  هر وقت کانتکست به حد آستانه برسد، خودکار محتوای قدیمی را به خلاصههای فنی فشرده میکند؛ اطلاعات کلیدی را نگه میدارد و نویز را دور میریزد، محتوای تکراری را خودکار پاک میکند و محتوای کمارزش مثل خطاهای ابزارها را از کانتکست حذف میکند
  2. opencode-goal-plugin
  پلاگین حالت Goal که به تسکهای طولانی مدیریت هدف اضافه میکند
  3. Hermes Memory (اگر تقاضا باشد بعداً متن بازش میکنم)
  این سنگینترین پلاگین من است — سازوکار حافظه لایهلایهی Hermes agent را روی OpenCode منتقل (port) کردهام.
  4. context7-MCP
  گرفتن آخرین مستندات رسمی کتابخانهها و فریمورکها.
  5. grep-MCP
  جستجوی کد در GitHub، پیدا کردن استفادههای واقعی در کل کدهای GitHub.
  6. open-computer-use (اتوماسیون دسکتاپ)
  به AI اجازه میدهد مستقیم اپهای macOS را کنترل کند — کلیک، تایپ، اسکرول، درگ، اسکرینشات و خواندن accessibility tree.
