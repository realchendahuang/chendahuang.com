  मैं घोषणा करता हूँ:

  Cloudflare एक सच्ची AI-native कंपनी है।

  यह सच में AI एजेंटों के इर्द-गिर्द डेवलपर अनुभव को फिर से बना रही है।

  अभी जारी किए गए Temporary Accounts एक AI एजेंट को कोड लिखने, सीधे डिप्लॉय करने, अस्थायी URL पाने, खुद का परीक्षण करने और खुद ही iterate करने देते हैं।

  चिकनाई से भी ज़्यादा चिकना।

  इसे Cloudflare के आधिकारिक Skills के साथ जोड़ें, एक कमांड में इंस्टॉल करें:

  `npx skills add cloudflare/skills`

  AI-native का मतलब क्या होता है?

  यही तो AI-native का GOAT है।
