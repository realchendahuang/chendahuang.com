  2000 подписчиков за 7 дней работы — краткий разбор.

  Суть в одном слове: альтруизм.

  В основном я делился двумя видами полезного контента:

  - Список софта для активного использования macOS (48 тыс. просмотров)
  - Таблица бесплатных лимитов Cloudflare + Playbook (хорошие цифры в X; один парень даже скрейпнул и переписал её на «Чжиху», собрав несколько сотен закладок)
  - Плюс подборка ресурсов OPC — компаний одного человека (38 тыс. просмотров)

  Я не думал о том, как набрать подписчиков — просто систематизировал то, что понял, и раздал бесплатно. И рост пришёл быстрее.

  Продолжу выпускать такой практический контент. Спасибо всем за поддержку.