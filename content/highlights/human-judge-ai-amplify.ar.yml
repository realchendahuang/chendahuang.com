  الإنسان يحكم. والذكاء الاصطناعي يضخّم.

  انتباه الإنسان محدود. فلا يشغل نفسه إلا بالجزء الأخطر من الحكم.

  احرص على توزيع انتباهك المحدود حيث القيمة، واترك للذكاء الاصطناعي المزيدَ من الأعمال القذرة.

  وهذا هو أصل معنى سير عمل الذكاء الاصطناعي.

  اجعل سير عمل الذكاء الاصطناعي يلتهم الأعمال القذرة كلها، فيتفرغ الإنسان للأحكام الأخيرة: المراجعة عن الأعزّ والأنفس، والهدف النهائي، أو استلام النتائج.

  وهذه حالة أحب بلوغها كثيراً. وقد انشغلت أخيراً بدراسة سير العمل هذه فيما فرغ.