  Chia sẻ một mẹo nhỏ khi đăng bài trên X:

  mỗi bài viết phải tự đứng được trên đôi chân của mình.

  Vì bạn không phải là trung tâm của thế giới — chẳng ai sẽ bấm vào profile của bạn để ráp nối câu chuyện đầy đủ đâu.

  Lần đầu một người lạ lướt thấy bạn, họ phải nhận được ngay một quan điểm, hoặc một mẹo hay ho.

  Chỉ những bài như thế mới mang lại giá trị.
