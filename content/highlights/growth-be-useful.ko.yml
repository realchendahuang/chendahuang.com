content: |
  X에서 팔로워를 가장 빨리 늘리는 방법은 계속 사람들이 이렇게 느끼게 하는 것:

  너를 팔로우하지 않는 것이 그들의 손해다.

  자신을 남에게 계속 쓸모 있는 사람으로 만들어라.
