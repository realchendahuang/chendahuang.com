content: |
  ردة الفعل الأولى لدى كثيرين عند اختيار Coding Agent طبيعية تماماً:
  مع Claude تذهب إلى Claude Code؛ ومع GPT تذهب إلى Codex؛ ومع GLM تذهب إلى ZCode؛ ومع DeepSeek بالطبع تعتبر أولاً Harness الخاص بـ DeepSeek نفسه.
  وهذا التفكير منطقي تماماً في الحقيقة. أكبر ميزة لدى الشركة الأم أنها الأكثر معرفة بنموذجها.
  أي نوع من Prompt يحبه النموذج، وأي تصميم لـ Tool Schema يكون الأكثر استقراراً، وكيف تنظّم السياقات الطويلة، وما القدرات التي أضافها الإصدار الجديد، وأين أكثر الأماكن عرضة للتعثر — الشركة الأم عادة تعرف كل هذا قبل أي طرف ثالث.
  لذا في منتجات مثل Claude Code و Codex، حيث يتكرر تطوير النموذج و Harness معاً على المدى الطويل، غالباً ما تكون تركيبة الشركة الأم هي الإجابة الأقوى عن أي نسخة.
  لكن عند وصولك إلى النماذج المفتوحة مثل DeepSeek و GLM، تبدأ الأمور تصبح ممتعة — لأن تدريب نموذج جيد وبناء Harness جيد هما في الحقيقة نوعان مختلفان تماماً من الهندسة.
  وحين يبدأ Coding Agent بالعمل فعلاً، تظهر الكثير من المشاكل التي تتجاوز النموذج نفسه: كيف تُقرأ الملفات، وكيف يُعدل الكود، وكيف يُضبط Agent Loop، وكيف يُضغط Context، وكيف يُستغل الكاش، وكيف يُستعاد الوضع بعد فشل Tool Call، وكيف تُجدول Subagents، وكيف تُدار الصلاحيات.
  وجودة هذه الجوانب تؤثر مباشرة على ما إذا كان النموذج نفسه سيبدو جيد الاستخدام في النهاية.
  وهناك مشكلة أخرى: سرعة تحديث النماذج مذهلة.
  اليوم GLM قوي، الشهر القادم قد يطلق DeepSeek نسخة Flash أقوى للقتال، وبعد فترة يصل نموذج جديد يلحق بالجميع. إذا كان سير عملك البرمجي كله مربوطاً بمنتج شركة أم واحدة، فتبديل النموذج يعني غالباً تبديل الأدوات والعادات معه.
  قيمة Harness الطرف الثالث تظهر هنا بالضبط.
  يمكنك تثبيت الأدوات و Skills و MCP والصلاحيات وسير العمل التي تتقنها، وتبديل النموذج الذي تحتها فقط. تشغّل DeepSeek اليوم، تنتقل إلى GLM غداً، ثم إلى غيره بعد غد — بيئة عملك لا تحتاج إلى هدم من جديد.
  لذا ما يهمّني أكثر هو: في أي Harness سيؤدي هذا النموذج عمله على أفضل وجه.
  للشركة الأم ميزتها في ملاءمة النموذج، وقد يتفوق الطرف الثالث في الأدوات و Context و Cache و Agent Loop وقابلية التوسع.
  في عصر النماذج المفتوحة، أصبح اختيار النموذج و Harness أمرين منفصلين تماماً.
