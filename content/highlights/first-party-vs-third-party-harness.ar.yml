title: "أصبح بالإمكان الآن اختيار النموذج و Harness بشكل منفصل تماماً"
description: "الشركة الأم أدرى بنموذجها، لكن في عصر النماذج المفتوحة يمكنك تثبيت سير عملك في Harness طرف ثالث وتبديل النموذج فقط."
