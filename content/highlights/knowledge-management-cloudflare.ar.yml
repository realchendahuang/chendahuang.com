content: |
  أنوي التفكير في خطة مؤخراً.
  أنوي نقل إدارة المعرفة الشخصية، وجمع المعلومات، وإخراج المعرفة — كلها — إلى Cloudflare.
  فالحساب المجاني وحده محمّل مسبقاً بـ10 غيغا تخزين كائنات و5 غيغا لقاعدة البيانات.
  أي أنك تملك فعلاً نظام إدارة معرفة مبنياً ذاتياً، في السحابة، ومجاني إلى الأبد.