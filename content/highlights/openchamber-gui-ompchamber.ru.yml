content: |
  Я перепробовал практически все open-source Harness GUI-клиенты на рынке, и у большинства с дизайном и удобством дела обстоят так себе.
  OpenChamber — лучший из отполированных open-source Harness GUI-клиентов, что я использовал: аккуратный, стабильный, и редкие баги не мешают долгосрочному использованию.
  Но он работает только в связке с OpenCode и не переключается на другие Harness'ы. Пользователи жалуются, что общая производительность OpenCode не блещет и легко тормозит модель.
  Поэтому я задумал проект: взять фронтенд OpenChamber как скелет и заменить его ядро на oh my pi — так, возможно, будет ближе к моим собственным нуждам.
  Почему не нативный Pi Agent, а Oh My Pi?
  Потому что нативный Pi Agent слишком гибкий — универсальный GUI на нём не сделаешь.
  Как компромисс, Oh My Pi — это своего рода дистрибутив Pi Agent: общий опыт работы с плагинами довольно стабильный.
  Так что, на мой взгляд, сделать из OpenChamber + Oh My Pi продукт «из коробки» — это потенциальная потребность.
  Я назвал проект: OMPChamber. Сейчас идёт плотная разработка и тестирование — если он вам нужен, добро пожаловать ставить star.
  https://github.com/realchendahuang/OMPChamber
