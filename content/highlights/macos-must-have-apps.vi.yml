content: |
  Sau nhiều năm dùng macOS sâu, đây là những phần mềm mình thấy thật sự đáng gờm:

  - **QuickRecorder**: viên ngọc quay màn hình — nhỏ mà thôi.
  - **ClashParty**: vượt tường lửa với lõi Mihomo — nhiều giao thức, cập nhật nhanh, giao diện đẹp.
  - **V2rayN**: vượt tường lửa với nhiều giao thức; UI hơi cũ, nhưng ổn định và miễn phí.
  - **Bàn phím Doubao**: nhập liệu bằng giọng nói chính xác đến mức đáng sợ. Hỗ trợ macOS, iOS, Android; Windows sắp ra.
  - **Brave**: trình duyệt ưu tiên quyền riêng tư, chặn quảng cáo sẵn trong trình duyệt — sạch hơn hẳn kiểu chặn bằng extension, và là bạn đồng hành xem YouTube số một.
  - **Mos**: giúp con lăn chuột cuộn mượt như tơ.
  - **Amphetamine**: giữ laptop thức ngay cả khi đóng nắp — bạn đồng hành số một của vibe coding.
  - **UU Remote**: công cụ remote desktop của NetEase, miễn phí và nhanh. Có nó, thứ giới hạn chất lượng hình ảnh không bao giờ là gói hội viên — mà là tốc độ mạng của bạn. Mình thường dùng nó remote vào Mac ở nhà từ điện thoại để xem kết quả vibe coding; ánh xạ phím hiệu quả đến mức vô lý.
  - **Tencent Lemon**: công cụ dọn rác Mac của Tencent — gỡ app mượt mà, icon trên menu bar tiện lợi.
  - **Mole**: phần mềm dọn rác Mac mạnh nhất — bản terminal miễn phí, bản giao diện trả phí.
  - **Tailscale**: mạng từ xa nền WireGuard. Có nó, từ tận cùng trái đất bạn vẫn chạm được tới cái máy tính nhỏ ở nhà.
  - **Obsidian**: trong kỷ nguyên AI, công cụ quản lý tri thức local-first. Hệ sinh thái quá đỉnh — ghép với extension Web Clipper chính chủ của trình duyệt là thành thần.
