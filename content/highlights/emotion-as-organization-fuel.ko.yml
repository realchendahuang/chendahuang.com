content: |
  나는 점점 감정의 가치가 아주 값지다고 확신하게 된다.

  우리 호모 사피엔스는 왜 뭉쳐서 큰일을 해낼 수 있을까?

  바로 우리가 어떤 이야기, 어떤 감정, 어떤 토템, 어떤 신화, 어떤 내러티브를 공동으로 믿기 때문이다 — 그것이 조직을 만들고, 협력을 이끌어 내며, 우리를 강하게 성장시키고, 위대한 일을 가능하게 한다.

  그것 자체가 어쩌면 감정의 가치 아닌가?
