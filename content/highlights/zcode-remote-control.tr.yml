content: |
  ZCode'un uzaktan kontrolüne bayıldım — telefondan yerel Agent'ı uzaktan komuta etmenin ders kitabı örneği.
  Kurulum maliyeti neredeyse sıfır: telefondan hesap açıyorsun, üyelik gerekmiyor. Bilgisayardaki QR kodu okutup bir de WeChat veya Feishu'ya bağlıyorsun.
  Asıl şahane olan, ücretsiz dahili tünelin olması — ağ ortamıyla hiç uğraşmana gerek yok. Kanepene uzan ya da dışarıda kahve iç; telefondan bir mesaj at, bilgisayardaki Agent istediğin an kodu çalıştırır.
