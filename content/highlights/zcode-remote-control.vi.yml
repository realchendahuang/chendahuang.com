content: |
  Khen hết cỡ tính năng điều khiển từ xa của ZCode — đúng là hình mẫu của việc chỉ huy Agent cục bộ từ điện thoại.
  Chi phí thao tác gần như bằng không: đăng ký tài khoản trên điện thoại, không cần mua gói thành viên. Quét mã QR trên máy tính, tiện tay liên kết với WeChat hoặc Feishu.
  Tuyệt nhất là có sẵn tunneling miễn phí, hoàn toàn không cần bận tâm môi trường mạng. Thả người lên sofa hay ngồi nhâm nhi cà phê nơi xa, nhắn một tin từ điện thoại là Agent trong máy tính nhà bạn chạy code ngay lập tức.
