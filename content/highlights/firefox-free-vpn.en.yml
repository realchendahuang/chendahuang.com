  Holy crab! I just learned that the Firefox browser provides every user with 50G of free VPN traffic per month.

  Very helpful for the awkward chicken-and-egg scenario.

  How to use:

  1. Type `about:config` in the address bar
  2. Enter advanced preferences, click "Show All"
  3. Search for `browser.ipProtection.enabled`
  4. Toggle the entry's value to true
