  What the crab! I only just found out the Firefox browser gives every user 50G of free VPN traffic per month.

  Extremely handy for that awkward chicken-and-egg situation.

  How to use:

  1. Type `about:config` in the address bar
  2. Go to advanced preferences and click "Show all"
  3. Search for `browser.ipProtection.enabled`
  4. Flip that entry's value to true