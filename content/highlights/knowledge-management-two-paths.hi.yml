content: |
  इन दिनों मैं नॉलेज मैनेजमेंट पर दोबारा सोच रहा हूँ।

  मुझे एहसास हुआ कि यहाँ असल में दो रास्ते हैं।

  **एक है Feishu पर बनाना।**

  इसके फ़ायदे सीधे हैं:

  मुफ़्त, मल्टी-डिवाइस सिंक, शेयर करने योग्य, आसान सहयोग, और फ़ॉर्म में काफ़ी समृद्ध।

  डॉक्यूमेंट्स, मल्टी-डायमेंशनल टेबल्स, स्प्रेडशीट्स, स्लाइड्स, कैनवास, Todo, नॉलेज बेसेस — ये मॉड्यूल मिलकर पहले से ही निजी और टीम नॉलेज-मैनेजमेंट के काफ़ी परिदृश्य कवर करते हैं।

  मैं ख़ास तौर पर मल्टी-डायमेंशनल टेबल्स पर भरोसा करता हूँ।

  वे नॉलेज हब के रूप में बेहद उपयुक्त हैं।

  जानकारी जुटाना, सामग्री का संग्रह, स्थिति प्रबंधन, संरचित व्यवस्था, सामग्री का दोबारा उत्पादन — यह सब उनके इर्द-गिर्द घूम सकता है।

  Feishu CLI और AI एजेंट्स जोड़ दो, और Feishu सिर्फ़ एक ऑफ़िस टूल नहीं रहता।

  यह एक ऐसी नॉलेज वर्कफ़्लो प्रणाली बन जाता है जिसे एजेंट संचालित कर सकते हैं।

  **दूसरा रास्ता है Cloudflare पर अपना ख़ुद का बनाना।**

  यह रास्ता ज़्यादा आज़ाद है और प्रोडक्टाइज़ेशन के लिए बेहतर उपयुक्त।

  FlareMo, जो मैं अभी बना रहा हूँ, Cloudflare पर एक नॉलेज-मैनेजमेंट प्रोडक्ट बनाने का एक प्रयास है।

  Cloudflare का फ़ायदा यह है कि अंतर्निहित क्षमताएँ पूरी हैं:

  फ्रंटएंड, बैकएंड, डेटाबेस, ऑब्जेक्ट स्टोरेज, वेक्टर सर्च, AI — सब संयोजनीय।

  लेकिन इसमें डेवलपमेंट चाहिए।

  और डेटा संरचना, सर्च अनुभव, अनुमति प्रणाली और प्रोडक्ट लॉजिक ख़ुद डिज़ाइन करने पड़ते हैं।

  तो मेरा मौजूदा नज़रिया:

  - Feishu उस नॉलेज-मैनेजमेंट सिस्टम को जल्दी खड़ा करने के लिए है जिसे आज इस्तेमाल किया जा सके।
  - Cloudflare नॉलेज मैनेजमेंट को सच में नियंत्रणीय, इटरेट करने लायक प्रोडक्ट बनाने के लिए है।

  दोनों रास्ते पढ़ने लायक हैं।

  एक वर्कफ़्लो की ओर झुकता है।

  एक प्रोडक्टाइज़ेशन की ओर।