  يا عجبي! لم أعلم إلا الآن أن متصفح Firefox يمنح كل مستخدم 50 غيغا من حركة VPN مجاناً كل شهر.

  ومفيد جداً للمواقف المحرجة من طراز «أيهما أسبق: الدجاجة أم البيضة» التي لا تجد لها مخرجاً.

  طريقة الاستخدام:

  1. أدخل `about:config` في شريط العنوان
  2. ادخل إلى الخيارات المتقدمة، واضغط «إظهار الكل»
  3. ابحث بإدخال `browser.ipProtection.enabled`
  4. حوّل قيمة هذا البند إلى true