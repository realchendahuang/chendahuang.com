title: "TUI beginnt zu stinken: Sie senkt systematisch deine kognitive Bandbreite"
description: "Sie zwingt dich, alle Zustände ins Kurzzeitgedächtnis zu stopfen, und verlagert die Denkkosten auf die Bedienung der Oberfläche."
