content: |
  Das TUI — um es unangenehm direkt zu sagen — hat angefangen zu stinken.
  Das Ekelhafteste daran ist nicht, dass es schwer zu bedienen ist, sondern dass es die kognitive Bandbreite der Menschen systematisch senkt.
  Du glaubst, du führst ein effizientes Gespräch mit dem Werkzeug, aber in Wirklichkeit machst du ständig drei Dinge:
  Shortcuts und Modi abrufen
  Informationen im scrollenden Zeichenstrom orten
  beten, dass du nicht versehentlich in irgendeinen seltsamen Zustand geraten bist
  Das ist keine Interaktion mehr — das ist Ringen mit einer Oberfläche.
  Ein wirklich effizientes Interface breitet den Zustand vor dir aus, damit Augen und Raumgefühl ihn erfassen — statt dich zu zwingen, alles ins Kurzzeitgedächtnis zu stopfen. Das TUI macht das Gegenteil — es häuft die Informationsdichte aufs Äußerste und tritt Lesbarkeit und Wiederherstellbarkeit aufs Tiefste.
  Schlimmer noch: Es erzieht eine fiese Gewohnheit — die Beherrschung des Keymaps eines Tools als Fähigkeit an sich zu betrachten. Das Ergebnis: Menschen stecken enorme Energie hinein, sich an die Oberfläche anzupassen, statt über das Problem nachzudenken.
  Ein gutes Werkzeug sollte die Kosten des Denkens senken, nicht sie in die Frage verlagern, wie man diese Oberfläche überhaupt bedient.
  Die heutige TUI-Mode ist zu großen Teilen Geeker-Filterschminke über Faulheit und Arroganz im Interaktionsdesign.
