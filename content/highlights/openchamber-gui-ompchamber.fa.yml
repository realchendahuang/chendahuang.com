title: "OpenChamber بهترین Harness GUIای است که کار کردهام — پس هستهاش را با OMP عوض کردم"
description: "فرانتاند OpenChamber + هسته Oh My Pi = OMPChamber؛ در حال توسعه و تست فشرده."
