content: |
  تقریباً همه کلاینتهای Harness GUI متنباز بازار را امتحان کردهام و بیشترشان از نظر تجربه طراحی وضعیت رقتانگیزی دارند.
  OpenChamber بهترین کلاینت Harness GUI متنبازی است که تا حالا استفاده کردهام: ظریف، پایدار، و باگهای گاهبهگاهش هم استفاده بلندمدت را خراب نمیکند.
  ولی فقط با OpenCode جور درمیآید و نمیشود به Harness دیگری سوییچ کرد. بعضی کاربرها میگویند عملکرد کلی OpenCode آنقدر خوب نیست و راحت پای مدل را میلنگاند.
  برای همین ذهنم درگیر یک پروژه شد: فرانتاند OpenChamber را اسکلت نگه دارم و هستهاش را با oh my pi عوض کنم؛ شاید اینطور بیشتر با نیاز خودم جور دربیاید.
  چرا به جای Pi Agent خالص از Oh My Pi استفاده میکنم؟
  چون Pi Agent خالص بیش از حد انعطافپذیر است و نمیشود دورش یک GUI همهکاره ساخت.
  بهعنوان یک راه میانه، Oh My Pi در واقع یک توزیع از Pi Agent است و تجربه تعامل پلاگینهایش نسبتاً پایدار است.
  پس به نظرم ساختن یک محصول آمادهبهکار از OpenChamber + Oh My Pi یک نیاز پنهان و واقعی است.
  اسم پروژه را گذاشتم OMPChamber؛ فعلاً در حال توسعه و تست فشرده است، اگر بهش نیاز دارید، star بزنید.
  https://github.com/realchendahuang/OMPChamber
