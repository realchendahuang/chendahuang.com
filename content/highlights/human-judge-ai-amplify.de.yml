  Der Mensch urteilt. AI verstärkt.

  Die Aufmerksamkeit des Menschen ist begrenzt. Der Mensch übernimmt nur den kritischsten Teil des Urteilens.

  Die begrenzte Aufmerksamkeit unbedingt an wertvollen Stellen einsetzen. Lass AI den ganzen Müll erledigen.

  Genau das ist der Sinn von AI-Workflows.

  Lass den AI-Workflow die Drecksarbeit komplett abdecken; der Mensch übernimmt das finale Urteil, die wertvollste, kritischste, zielführendste Prüfung – die Abnahme des Ergebnisses.

  So einen Zustand möchte ich erreichen. Zuletzt habe ich mich auch zwischendurch mit solchen Workflows beschäftigt.