content: |
  Im AI-Zeitalter ist die wichtigste Fähigkeit der Meta-Skill.

  Konkret: die Grundfähigkeiten, die du noch einsetzen kannst, wenn du Tool, Modell oder Branche wechselst.

  - Kannst du ein Problem klar formulieren?
  - Kannst du einen Haufen chaotisches Material sortieren?
  - Kannst du eine vage Idee in einzelne Schritte zerlegen?
  - Siehst du, wo AI Recht hat und wo sie schwafelt?
  - Kannst du mit AI hin- und herfeilen, bis aus der groben Antwort was Brauchbares wird?

  Das ist mehr wert, als einen Haufen Tools zu horten.

  Tools ändern sich jeden Tag, Modelle kommen und gehen Generation für Generation.

  Aber wer fragen, sortieren, beurteilen, zerlegen und abnehmen kann, verstärkt sich überall mit AI.

  Was im AI-Zeitalter wirklich den Unterschied macht, sind vielleicht genau diese simpel wirkenden Meta-Skills – die langfristig am wertvollsten sind.