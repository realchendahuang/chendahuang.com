  Di mana letak peluang software baru di era AI?

  Salah satu yang besar: bagian yang tidak bisa dicatat oleh software tradisional — dengan kata lain, data latar belakang yang tidak terstruktur.

  Misalnya, CRM yang benar-benar AI-native, saat mencatat diskon yang diberikan kepada klien, juga bisa mencatat mengapa diskon inilah yang diberikan dan bukan yang lain, mengapa opsi lain ditolak, dan siapa yang membujuk siapa.

  Software tradisional punya banyak sekali informasi tersembunyi seperti ini yang mustahil dicatatnya. Era AI, dengan kemampuannya memahami teks dan video, bisa menarik informasi tersembunyi yang sangat redundan ini menjadi data terstruktur untuk dianalisis.