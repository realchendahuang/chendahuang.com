title: "GPT-5 这一代的通病：把内部需求写在 UI 文案上"
description: "界面文案冗余的根源，是它根本没把面向用户的文字和面向开发者的反馈分开。"
date: 2026-08-12
likes: 2
bookmarks: 0
reposts: 1
views: 1500
url: https://x.com/realchendahuang/status/2087349882101370909
content: |
  说的太精辟了，这个就是 GPT-5 这一代的通病：

  总是会把内部的需求写在界面文案上，来证明自己的工作量。来证明自己，哦，我确实做了，你看我牛逼吧，我没有偷懒哦，我把所有你的需求都摆在台面上了哦。

  而且界面上的文案非常的冗余。从 5.0 迭代到 5.6，整整迭代了这么多代，还是没有改变这个问题，已经深入骨髓了。

  真正做过前端产品的人都懂：

  - 界面上无论小字还是大字，都是面向用户的文案
  - 该在聊天里反馈给开发者的文字，绝不应该写到产品里

  但它不仅文案写得烂，还经常把内部反馈写到产品里来「显示」它确实做了什么事情。
