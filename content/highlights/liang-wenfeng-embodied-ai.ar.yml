  قال ليانغ وين فنغ في اجتماع المستثمرين:
  «نهاية الذكاء قد تكون جميعها التجسّد. فبالنسبة للإنسان العادي، ليست حاجته حاسوباً، بل طاقةً بشرية.»
  هذه الجملة دقيقة. ما طلبه الناس يوماً ليس حاسوباً أذكى، بل «طاقة بشرية» تعمل. فمهما بلغ النص قوة، فهو مجرد حالة وسطى. https://t.co/2xg5o5hNjt