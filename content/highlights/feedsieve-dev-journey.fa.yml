content: |
  اخیراً از حسابهای زبالهای مثل «Fu Bu Hei» حسابی حرص خوردم.
  
  در یک لحظهی عصبانیت، یک افزونهی مرورگر نوشتم — اسمش «FeedSieve» است.
  
  بعد از چند دور تکرار و بهبود به جای خوبی رسیده و در آستانهی انتشار است.
  
  آنهایی که نیاز دارند، نشانهاش کنند — به زودی متنبازش میکنم و روی Chrome Web Store میگذارم.
  