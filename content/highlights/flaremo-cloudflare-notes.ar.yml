  برنامج ملاحظات مطوّر بنفسه على حزمة Cloudflare التقنية — FlareMo.

  سجّل حساب Cloudflare مجاناً، وبعد النشر تملك 10 غيغا لتخزين الملفات و5 غيغا لبياناتك.

  مجاني إلى الأبد: لا سنت للعتاد، ولا سنت للانسياب؛ وبياناتك مكررة في عدة مناطق، فآلية التوفر العالي مدمجة في أصلها.

  خدمة سحابية على مدار الساعة من أي مكان، ومتوافقة تماماً مع نظام Memos.

  وكان تقدم التطوير آنذاك: يوم واحد كلفتُه إنجاز الوظائف الأساسية كاملة، وبات قابلاً للاستخدام فعلاً.

  وسأضيف لاحقاً مزيداً من دروس الاستخدام والنشر، وحالات اختبار هندسية، وتقنيات متعلقة بوكلاء الذكاء الاصطناعي، ودعم الأجهزة المتعددة. بناءٌ في العلن (Build in public).