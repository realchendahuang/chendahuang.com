  Tencent के Workbuddy को आज़माया — एक क्लासिक सीन है: Meituan कूपन क्लेम करना।

  लॉगिन स्टेप पर, इसने मेरे स्कैन करने और साइन इन करने के लिए एक QR कोड बना दिया।

  फिर मैंने बस कहा "जाकर मेरे कूपन क्लेम करो" और उसने इतने सारे कूपन क्लेम कर दिए।

  कूपन क्लेम जैसे काम के लिए AI एजेंट इस्तेमाल करना — बिल्कुल कमाल है।