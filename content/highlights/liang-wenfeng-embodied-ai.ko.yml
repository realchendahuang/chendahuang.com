title: "량원펑: 지능의 종착점은 어쩌면 전부 엠보디드일지도 모른다"
description: "'지능의 종착점은 어쩌면 전부 엠보디드일지도 모른다' — 일반인이 원하는 것은 더 똑똑한 컴퓨터가 아니라 노동력이다."
