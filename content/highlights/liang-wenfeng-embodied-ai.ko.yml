content: |
  량원펑이 투자자 미팅에서 말했다:
  "지능의 종착점은 어쩌면 전부 엠보디드일지도 모른다. 보통 사람의 입장에서 그가 필요로 하는 것은 컴퓨터가 아니라 노동력이기 때문이다."
  이 말 정확하다. 일반인이 원한 적 있는 것은 한 번도 더 똑똑한 컴퓨터가 아니라, 일을 해내는 "노동력"이다. 텍스트가 아무리 강해도 그것은 중간 상태일 뿐이다. https://t.co/2xg5o5hNjt
