  Movi a agregação de assinaturas de proxy pra Cloudflare.

  Abri o código de um projeto totalmente gratuito e hospedado em Cloudflare que agrega URLs de assinatura de proxy.

  Ele te ajuda a juntar todas as suas URLs de assinatura de proxy e os nós próprios numa única URL, e ainda dá pra configurar regras de roteamento junto.

  De verdade: uma URL só, utilizável em todos os clientes, sem precisar configurar cliente por cliente.

  GitHub: https://github.com/realchendahuang/sub-store-cloudflare

