  I made a somewhat ridiculous Skill:

  **Dahuang AI Tone**

  Everyone talks about "removing the AI flavor." But what exactly is the AI flavor?

  It does two things:

  - Rewrite a piece of normal text into the AI flavor of a specified model
  - Or the reverse: point out where a piece of text smells like AI, and which model's tone it resembles

  Its value:

  You have to smell the AI flavor before you know how to strip it off.

  GitHub: https://github.com/realchendahuang/dahuang-ai-tone