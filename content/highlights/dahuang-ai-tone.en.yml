  I made a somewhat absurd Skill:

  **Dahuang AI Tone**

  Everyone talks about "removing the AI flavor." But what exactly is the AI flavor?

  It can do two things:

  - Rewrite a piece of normal text into the AI flavor of a specified model
  - Conversely, point out where a piece of text sounds like AI and which model's tone it resembles

  Its value is:

  Only by smelling the AI flavor can you know how to remove the AI flavor.

  GitHub: https://github.com/realchendahuang/dahuang-ai-tone
