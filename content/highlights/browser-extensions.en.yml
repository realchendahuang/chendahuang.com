content: |
  Sharing the browser extensions I've treasured for years.

  - **Wetab**: a new-tab extension that lets you put frequently used things in, customize search engines, and sync across devices for free with an account. I built a Google-based X search engine on it, which is much better than the built-in one.
  - **Video Speed Controller**: flexibly adjust video playback speed, great for efficiently absorbing knowledge.
  - **XHunt**: a must-have for X, showing each KOL's leaderboard and the current hottest posts.
  - **X Mutual Follow Radar**: marks mutual-follow and one-way-follow relationships on the page, and can show the following / followers ratio.
  - **FireShot**: capture webpage screenshots, edit and save as PDF, JPEG, GIF, PNG, or BMP.
  - **Proton Pass**: an elegantly designed account and password manager with multi-device sync.
  - **Immersive Translate**: a veteran bilingual translation extension, connected to the DeepSeek V4 Flash API.
  - **Codex**: essential for connecting Codex to the Chrome browser, letting you automate anything in the browser, like writing an appeal email when your account gets banned.
