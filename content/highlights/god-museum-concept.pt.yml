content: |
  O nome da enciclopédia de mitologia do Oriente e Ocidente tá decidido — God-Museum · Museu dos Deuses:

  juntar no mesmo universo os panteões que não têm nada a ver entre si — Clássico das Montanhas e Mares, Jornada ao Oeste, Grécia Antiga, mitologia nórdica e Egito Antigo — sem deixar eles se estranharem.

  A mesma lei do trovão: na Grécia se chama Zeus, no Oriente se chama Lei Zhenzi (o Deus do Trovão);

  o mesmo grande dilúvio: os orientais lembram da deusa Nüwa remendando o céu, os hebreus lembram da arca de Noé.

  Se você leva a sério a investigação, o mundo mitológico inteiro precisa ser reordenado.

  Experimente online: https://chendahuang.com/god-museum/