  Beaucoup critiquent le fait que Deepseek V4 Flash n'a pas de fonctionnalité multimodale.
  En enquêtant, le modèle de lecture d'images au meilleur rapport qualité/prix est Qwen-3.7-Flash.
  Reconnaître une image coûte entre 0,0004 et 0,001 yuan ; reconnaître 1 000 images courantes ≈ 0,6 à 0,8 yuan.
  Sur la base de tout ça, on obtient la vraie solution du pack IA du radin :
  1. Forfait OpenCode Go à 5 dollars avec Deepseek V4 Flash pour écrire du code.
  2. https://t.co/mlvdSTaD6M