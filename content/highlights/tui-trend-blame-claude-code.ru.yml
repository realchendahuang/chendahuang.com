content: |
  Сейчас куча AI Coding Agent норовит выпустить TUI при любом удобном случае, и за эту моду Claude Code несёт большую часть ответственности.
  Он довёл до предела само ремесло — разговоры с AI в терминале ради написания кода.
  Но проблема в том, что теперь будто бы по-настоящему продвинутый Coding Agent обязан по умолчанию иметь терминальный интерфейс, веб-версия становится довеском, а то и высмеивается как «недостаточно программистская».
  И что в итоге?
  Сначала соорудить сложный TUI:
  всякие цвета, статус-бары, горячие клавиши, переключение режимов,
  а потом красиво обозвать это «погружением», «эффективностью» и «уважением к программистам».
  Правда?
  Для тех немногих, кто каждый день живёт в терминале, — да, реально кайф. Но для многих остальных это искусственно воздвигнутый барьер: функции спрятаны за клавишами и режимами, новички сидят в полной растерянности, а бывалым приходится заново привыкать к раскладкам каждого инструмента.
  Web UI может быть таким же быстрым и чистым: поставил как PWA — почти не отличить от десктопного клиента, да и обновляться проще. А насильно запихивать взаимодействие обратно в терминальную парадигму восьмидесятых и потом ещё презрительно фыркать на Web — это уже чистое самолюбование.
  Claude Code сам по себе силён, тут спору нет. Но именно он привил эстетику и зависимость от пути «TUI — единственно верная», а толпа идущих следом подражателей ушла уже в полный отрыв.
  Инструменты созданы для людей, а не для того, чтобы доказывать, кто больший «гик».
  Упаковывать античеловечный интерфейс в обёртку «продвинутости» — это по-настоящему комично.
