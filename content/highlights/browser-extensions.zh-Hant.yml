content: |
  分享一下我珍藏多年的瀏覽器擴充功能。

  - **Wetab**：新分頁擴充功能，可以把常用東西放進來，還能自訂搜尋引擎，登入帳號免費多裝置同步。我在上面特別搞了一個基於 Google 的 X 搜尋引擎，比內建的還好用的多。
  - **Video Speed Controller**：靈活調整影片倍速，適合高效攝取知識。
  - **XHunt**：玩 X 必備，可以看到每個 KOL 的排行榜，以及目前最熱門的貼文。
  - **X 互關雷達**：在頁面標記互關和單向關注關係，並可選擇顯示 following / followers 關注率。
  - **FireShot**：捕捉網頁截圖，編輯並儲存為 PDF、JPEG、GIF、PNG 或 BMP。
  - **Proton Pass**：設計優雅的帳號密碼管理工具，多裝置同步。
  - **沉浸式翻譯**：老牌雙語翻譯擴充功能，接入 DeepSeek V4 Flash API。
  - **Codex**：Codex 連接 Chrome 瀏覽器必備，有了它可以自動化任何在瀏覽器上的事情，比如帳號被封寫申訴郵件。