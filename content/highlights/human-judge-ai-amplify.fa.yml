  انسان قضاوت می‌کند. هوش مصنوعی تقویت می‌کند.

  توجهِ انسان محدود است. انسان فقط حیاتی‌ترین بخشِ قضاوت را بر عهده می‌گیرد.

  باید توجهِ محدودت را خرجِ جایی کنی که ارزش دارد و بگذاری AI کارهای کسل‌کننده‌ی بیشتری را بگیرد.

  این دقیقاً همان نکته‌ی اصلیِ وجودِ ورک‌فلوهای هوش مصنوعی است.

  بگذار ورک‌فلوهای هوش مصنوعی همه‌ی کارهای تکراری را قورت بدهند؛ انسان قضاوتِ نهایی را بر عهده داشته باشد — بازبینی یا پذیرشِ ارزشمندترین، اصلی‌ترین و نتیجه‌های هدفِ نهایی.

  این حالتی است که می‌خواهم به آن برسم. این روزها اتفاقی مشغولِ تحقیق روی همین ورک‌فلوها هم هستم.
