content: |
  Açıkçası, bazı geek toplulukları artık sadece niş değil — tam anlamıyla solipsist.

  İmza hareketleri: rahatsızlığı incelik, giriş engellerini de zevk sanmak.

  Normal insanların kolayca, sezgisel ve hızlıca öğrenebildiği bir şey, onlara içgüdüsel olarak yeterince hardcore değilmiş, fazla ana akımmış, seviyelerinin altındaymış gibi gelir.

  Tersine, etkileşim ne kadar hantal, bilgi ne kadar gömülü ve özel bir jargon ile bir yığın kısayol öğrenmen ne kadar gerekliyse, "gerçek bir araç böyle olur" hissine o kadar kapılırlar.

  Bu artık verimlilik meselesi değil. Acıyı kendi kimliğini doğrulamak için kullanmak.

  "Başkalarının katlanamayacağı etkileşimlere katlanabiliyorum" — bu cümle ağzından çıktı mı, üstünlük kendiliğinden gelir.

  Çember ne kadar küçükse, bu kendini beğenmişlik o kadar kolay beslenir.

  Sonunda şuna dönüşür: buna kullanılamaz demeye cüret eden kişi anlamıyordur — o bir dışarılıdır.

  Gerçekten yetenekli insanlar karmaşık şeyleri basitleştirir. Bazı geekler ise basit şeyleri karmaşıklaştırır, sonra karmaşıklığın tepesine çıkıp herkese tepeden bakar.
