  友達に聞かれた：写真の中のモバイルバッテリーは何ブランド？

  よし、推しを語り始めるぞ。

  これは酷態科 25 号スーパー電源ブロック SE（酷態科はかつての紫米）。

  140 元ちょっとで、25000mAh、最大 120W 出力、充電ケーブル内蔵。

  MacBook Air を午後いっぱい高負荷で動かし続けられる。

  スターバックス、マクドナルド、ケンタッキー、出先（田舎）など、あらゆる場所でのオフィス良品！