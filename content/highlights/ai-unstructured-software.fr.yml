  Où sont les nouvelles opportunités logicielles de l'ère IA ?

  Une chance assez grosse, c'est de traiter la partie qui ne peut pas être enregistrée par les logiciels traditionnels : c'est-à-dire les données de contexte non structurées.

  Par exemple, un vrai CRM AI native, en enregistrant la remise accordée à un client, pourrait aussi noter pourquoi cette remise-là plutôt qu'une autre, pourquoi les autres options ont été rejetées, et qui a convaincu qui là-dedans ?

  Les logiciels traditionnels ont trop d'infos cachées de ce genre qu'ils ne peuvent pas enregistrer. À l'ère de l'IA, on peut utiliser la compréhension du texte et de la vidéo pour extraire de ces infos cachées, de toute cette masse d'infos redondantes, des données structurées à analyser.