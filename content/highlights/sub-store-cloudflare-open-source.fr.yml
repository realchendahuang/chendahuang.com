  J'ai déplacé mon agrégateur d'abonnements sur Cloudflare.

  J'ai ouvert un projet d'agrégation de liens d'abonnement, gratuit et déployé entièrement sur Cloudflare.

  Il agrège tous tes liens d'abonnement et nœuds réseau maison en un seul lien, avec règles de routage en option.

  Vraiment : un seul lien, utilisable dans tous les clients, sans configurer chaque client un par un.

  GitHub : https://github.com/realchendahuang/sub-store-cloudflare

