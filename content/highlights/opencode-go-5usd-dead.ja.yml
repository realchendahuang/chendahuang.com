content: |
  X で大いに持て囃されていた「5 ドルの OpenCode Go」は、完全に終わってしまった。
  
  以前の OpenCode Go は、初月 5 ドル特典のおかげでコスパを保てていた。今やその特典すら消え、最初から 10 ドルだ。
  
  対照的に、競合の Command GOAT プランはどんどん良く見えてくる。
  
  DeepSeek V4 Flash、GLM-5.3 Flash、GLM-5.3——これらこそ、今まさに高強度のコーディングやエージェント実行に適した主力モデルだ。
  
  実は今、コーディングモデルを「主力モデル」と「雑用モデル」の 2 種類に単純に分けている。
  
  V4 Pro、GLM-5.3 あたりが主力モデルで、硬い骨を噛み砕く担当。複雑なアーキテクチャ、難解なバグ、大規模リファクタリング、重要な判断——本当に難しい問題は彼らに任せればいい。
  
  V4 Flash、GLM-5.3 Flash は雑用モデル。リポジトリを読む、コードを検索する、ファイルを編集する、テストを回す、バッチ処理、開拓作業——こういう泥くさい作業は、Flash に全力でやらせるのが正解だ。
  
  Command GOAT プランは雑用モデルの割り当てが十分に大きく、主力モデルの割り当ても明確な弱点がない。
  
  だから宣言する：Command GOAT プランこそ、現時点のバージョンアンサーだ。
