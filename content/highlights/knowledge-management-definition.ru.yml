  Что такое управление знаниями?

  При упоминании управления знаниями у большинства первая реакция — сохранять статьи в закладки, сортировать ссылки, вести заметки, строить красивую библиотеку.

  Но если исходить из первых принципов, задача, которую на самом деле должно решать управление знаниями, такова:

  **Сможет ли информация, которую я вижу сегодня, продолжать помогать мне принимать решения в будущем?**

  Память человека ограничена, внимание ограничено, а опыт легко ускользает.

  Если материал просто сохранить в закладки, он, скорее всего, окажется на информационном кладбище.

  По-настоящему ценное управление знаниями должно совершить одно преобразование:

  превратить внешнюю информацию и личный опыт в способность к действию, которую можно находить, вызывать, переиспользовать и обновлять.

  - Статья, просто сохранённая в закладки, — это всего лишь материал.
  - Ты вычленяешь её точку зрения — и она становится информацией.
  - Ты связываешь её со своими проектами, сценариями и суждениями — и только тогда она начинает становиться знанием.
  - Наконец, когда она помогает тебе писать статьи, создавать продукты, принимать решения и проектировать воркфлоу — она становится способностью.

  Поэтому я всё больше чувствую, что конечная цель управления знаниями — не библиотека.

  Это скорее когнитивная инфраструктура.

  Которая помогает тебе впитывать информацию, упорядочивать суждения, осаждать методы и постоянно выдавать контент, продукты и действия.

  Особенно теперь, когда появились ИИ-агенты, управление знаниями становится гораздо интереснее.

  Раньше мы полагались на людей: систематизировать, классифицировать, искать, переиспользовать.

  Впредь многое можно переложить на агентов:

  авто-резюмирование, авто-теги, авто-привязка к проектам, авто-генерация планов, авто-пометка устаревших знаний — и даже превращение материала прямо в статьи, предложения, слайды и задачи.

  Именно поэтому я и заинтересовался управлением знаниями в последнее время.

  На поверхности это ведение заметок.

  По сути — это построение когнитивной системы, которая в долгую приносит сложный процент.