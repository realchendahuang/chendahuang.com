content: |
  Di era AI, kemampuan paling penting adalah meta-skills.

  Sederhananya: kemampuan dasar yang tetap berguna saat kamu ganti tool, ganti model, atau pindah industri.

  - Bisakah kamu menjelaskan masalah dengan jelas?
  - Bisakah kamu merapikan tumpukan bahan yang berantakan?
  - Bisakah kamu memecah ide yang masih samar menjadi langkah-langkah?
  - Bisakah kamu membedakan kapan AI benar dan kapan ia mengarang bebas?
  - Bisakah kamu berdiskusi bolak-balik dengan AI, mengubah jawaban kasar menjadi sesuatu yang benar-benar bisa dipakai?

  Hal-hal ini jauh lebih berharga daripada menimbun setumpuk tool.

  Tool berubah setiap hari, dan model digantikan dari generasi ke generasi.

  Tapi orang yang bisa bertanya, merapikan, menilai, memecah masalah, dan memverifikasi — di mana pun mereka berada, mereka bisa memakai AI untuk memperkuat dirinya.

  Yang benar-benar membedakan orang di era AI mungkin justru meta-skills ini: tampak mendasar, tapi paling bernilai dalam jangka panjang.