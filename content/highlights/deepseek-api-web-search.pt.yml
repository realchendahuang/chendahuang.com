content: |
  Achei uma joia: a DeepSeek embutiu busca na web na própria API oficial.
  Chamando o modelo deepseek-v4-flash pelo endpoint no formato Responses, é só declarar a ferramenta web_search nos parâmetros e já usa a busca executada no servidor deles.
  Sem integrar buscador de terceiros, sem pedir chave de busca.
  O fluxo de busca inteiro é hospedado oficialmente.
