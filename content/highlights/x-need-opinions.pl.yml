  Na X musisz mieć opinie.

  Ludzie bez opinii tylko produkują szum informacyjny.

  Z jasnym stanowiskiem ludzie cię zapamiętują.

  Z wnikliwością ludzie chcą cię obserwować.

  Na X nie brakuje osób przeklejających cudze treści – brakuje ludzi, którzy potrafią doprowadzić sprawę do końca.