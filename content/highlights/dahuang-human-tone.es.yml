content: |
  Me pasé un día entero estudiando a fondo el asunto de «quitarle el olor a IA a los textos».

  Comparé los Humanizer más conocidos del mercado, los Skills de quitar olor a IA y las soluciones de prompt.

  Y lo uní con la experiencia que llevo acumulando desde 2023 usando modelos de lenguaje: una tortura interminable a manos del olor a IA de GPT, Claude, Gemini y Doubao.

  He hecho esto:

  **Dahuang Human Tone**

  Un Skill para quitar el olor a IA pensado para el contexto de la escritura china.

  Mi deseo:

  que en el mundo no haya redacciones de IA que cueste leer.

  GitHub: https://github.com/realchendahuang/dahuang-human-tone