content: |
  Dạo này tôi đang nghiên cứu DeepSeek Harness. Có một khái niệm tên là Preset đáng để chú ý.

  Preset có thể hiểu là đơn vị phân phối của một agent. Tải các Preset khác nhau lên cùng một model, nó sẽ thành những agent hoàn toàn khác nhau.

  Khác biệt lớn nhất giữa Preset và Skill là gì?

  - Một Skill phân tích báo cáo tài chính: dạy agent cách phân tích báo cáo tài chính.
  - Một Preset phân tích báo cáo tài chính: gói gọn Skill phân tích báo cáo tài chính, tìm kiếm web, Browser, PDF, Python, subagents, prompt nghiên cứu và chiến lược context tất cả vào một mớ — trao cho bạn một agent dùng được ngay.

  Trong tương lai, hai tầng thị trường có khả năng sẽ xuất hiện cùng lúc.

  - Một: marketplace Plugin / Skill, chủ yếu cho developer và người dùng nâng cao dựng agent;
  - Một: marketplace Preset / Agent, thực sự hướng tới người dùng phổ thông.

  Điều này thực ra rất gần với logic của App Store. App Store trưng bày một ứng dụng hoàn chỉnh; một Preset trưng bày một ứng dụng agent hoàn chỉnh.

  Trước đây người ta chia sẻ prompt. Rồi bắt đầu chia sẻ skill. Tiếp theo, chắc họ sẽ chia sẻ Preset.
