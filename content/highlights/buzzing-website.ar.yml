  أشارككم موقعاً كنزاً: Buzzing

  يناسب من يريد توسيع مصادر معلوماته وكسر «فقاعة المعلومات».

  يستمر في جمع المحتوى الرائج الأجنبي من Hacker News وReddit وBBC وReuters وBloomberg وProduct Hunt وغيرها، ويترجم العناوين إلى الصينية.

  أعظم قيمته أنه يتيح لك مراجعة العناوين بهدوء قبل أي شيء.

  فإن وجدت مقالاً يثير اهتمامك ويستحق القراءة، ادخل إليه للاطلاع على التفاصيل.

  وعندها يمكن دمجه مع الترجمة الغامرة للقراءة ثنائية اللغة.