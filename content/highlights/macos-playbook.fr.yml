  J'ai fait un macOS Playbook.

  Pour ceux qui viennent d'acheter un Mac, qui passent de Windows au Mac, ou qui trouvent toujours le Mac pas pratique.

  Dedans j'ai réuni :

  - quels logiciels installer d'abord quand on achète un Mac
  - comment les utilisateurs Windows s'adaptent à macOS
  - comment choisir parmi Rectangle / AltTab / Homebrew
  - comment faire de la collaboration multi-appareils
  - comment configurer le terminal, Git, SSH, l'environnement AI Coding
  - comment gérer maintenance, dépannage, sauvegarde de sécurité et migration de machine

  Playbook : [chendahuang.com/playbooks](/playbooks)