  Ich habe die Proxy-Abo-Aggregation auf Cloudflare verlegt.

  Open Source veröffentlicht: ein Projekt, das Proxy-Abo-Links-Aggregation komplett gratis auf Cloudflare deployed.

  Es bündelt alle deine Proxy-Abo-Links und selbst gebauten Netzwerk-Nodes in einer einzigen Link – und du kannst zu passende Routing-Regeln konfigurieren.

  So brauchst du wirklich nur eine einzige Link, die in allen Clients funktioniert – kein Client muss mehr einzeln konfiguriert werden.

  GitHub: https://github.com/realchendahuang/sub-store-cloudflare

