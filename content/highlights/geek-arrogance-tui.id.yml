content: |
  Sejujurnya, sebagian komunitas geek itu bukan sekadar niche lagi — sudah benar-benar solipsistis, berpuas diri sendiri.
  
  Gerakan khas mereka: menganggap ketidaknyamanan sebagai kecanggihan, dan hambatan masuk sebagai selera.
  
  Kalau sesuatu itu gampang, intuitif, dan cepat dipelajari orang biasa, mereka otomatis merasa kurang hardcore, terlalu mainstream, tidak selevel.
  
  Sebaliknya, makin kaku interaksinya, makin dalam informasi disembunyikan, makin harus belajar jargon privat sendiri dan segudang pintasan — makin mereka merasa inilah bentuk tools yang sesungguhnya.

  Ini bukan soal efisiensi lagi. Ini soal memakai kepayahan untuk menegaskan identitas diri sendiri.

  "Aku bisa tahan dengan interaksi yang orang lain tidak tahan" — begitu kalimat itu keluar, rasa superior langsung jadi dengan sendirinya.

  Makin kecil lingkarannya, makin mudah rasa puas diri ini saling menguatkan.

  Ujung-ujungnya berubah jadi: siapa pun yang berani bilang tidak bisa dipakai, berarti dia yang tidak paham — dia orang luar.

  Orang yang benar-benar hebat membuat hal rumit menjadi sederhana. Sebagian geek malah membuat hal sederhana menjadi rumit, lalu berdiri di atas kerumitan itu sambil menunduk memandang semua orang.
