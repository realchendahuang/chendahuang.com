content: |
  Je vous raconte mon expérience de nomination de société.

  J'ai utilisé GPT 5.5 et Gemini 3.1 Pro, deux-trois jours de brainstorm multi-tours avec ces deux modèles, et toujours aucun bon nom en vue.

  Pourquoi ? Parce que j'ai découvert que ces modèles n'ont aucune créativité. Les noms qu'ils te proposent sont de l'empilement de mots et des combinaisons de caractères.

  Tu donnes ton idée, et il te la fait tourner en rond à l'infini, à me faire péter les plombs et monter ma tension.

  Et il y a un autre gros problème : tu arrives enfin à quelques noms qui te plaisent, tu ouvres Qichacha, et boum : soit déjà enregistré, soit trop ressemblant.

  Là je peux recommander le 88查 d'Alibaba, l'équivalent de Qichacha mais gratuit, pour vérifier les noms similaires.

  Si tu ne veux pas de répétitions, vise plutôt quatre caractères, et il faut vraiment ouvrir grand ta réflexion.

  Il faut changer plusieurs fois de modèle, changer plusieurs fois de cerveau.

  Tu peux donner de bons noms en référence à l'IA : DeepSeek 深度求索, ByteDance 字节跳动 par exemple.

  Tu prends les bons noms à ton goût et tu laisses l'IA s'en inspirer. À emprunter les forces de chacun, tu finis par trouver un nom de ouf.