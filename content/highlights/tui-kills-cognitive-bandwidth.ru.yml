content: |
  TUI, если говорить грубо, уже начал протухать.
  Самое мерзкое в нём не то, что им неудобно пользоваться, а то, что он системно снижает когнитивную пропускную способность человека.
  Кажется, будто ты эффективно общаешься с инструментом, а на самом деле ты безостановочно делаешь три вещи:
  вспоминаешь хоткеи и режимы,
  ищешь информацию в прокручивающемся потоке символов,
  и молишься, чтобы случайно не влететь в какое-нибудь странное состояние.
  Это уже не взаимодействие — это борьба с интерфейсом.
  По-настоящему эффективный интерфейс раскладывает состояние у тебя перед глазами и позволяет понять его глазами и пространственным мышлением, а не заставляет пихать всё в краткосрочную память. TUI делает ровно наоборот — он задирает плотность информации до предела, но вдавливает читаемость и восстанавливаемость до минимума.
  Хуже того, он ещё и воспитывает дурную привычку: считать умение пользоваться раскладкой конкретного инструмента способностью как таковой. В итоге человек тратит кучу сил на адаптацию к интерфейсу вместо того, чтобы думать над задачей.
  Хороший инструмент должен снижать стоимость мышления, а не переносить её в вопрос «как этим интерфейсом пользоваться».
  Нынешняя популярность TUI во многом — это гик-фильтр, за которым прячутся лень и высокомерие в дизайне взаимодействия.
