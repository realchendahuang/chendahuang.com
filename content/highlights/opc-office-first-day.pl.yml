content: |
  Dziś mój pierwszy dzień oficjalnego wejścia do biura OPC. Oprowadzę was po tym, jak założyłem OPC.

  Moja pierwotna motywacja była prosta: mieć zgodny z prawem podmiot do przyjmowania płatności i publikowania produktów. Poszedłem więc w sieć szukać informacji o rejestracji spółek.

  Nie byłem wybredny co do miasta: Nankin, Suzhou, Hangzhou, Ningbo – każde rozwinięte nadmorskie miasto wchodziło w grę.

  Zbiegiem okoliczności jednego dnia byłem służbowo w Nankinie i przeglądając od niechcenia nankińskie konta na WeChat, znalazłem numer telefonu osoby kontaktowej ze społeczności OPC. Więc ją dodałem.

  Po krótkim przedstawieniu mojego projektu osoba odpowiedzialna powiedziała OK i jeszcze tego popołudnia zorganizowała wizytę na miejscu.

  Ich warunek: praca na miejscu trzy dni w tygodniu. Jeśli mogę to zaakceptować, pozwolą mi zarejestrować tu spółkę.

  Ponieważ to projekt pod skrzydłami majątku państwowego Nankinu, warunki są wyśmienite – woda, prąd, internet i opłaty administracyjne darmowe, teoretycznie przez trzy lata. Przydzielili mi nawet księgowego, który zarejestrował spółkę, wyrzeźbił pieczęć firmową, załatwił licencję na działalność i pomógł założyć konto bankowe. Aż trudno uwierzyć, jak bardzo mnie to ruszyło.

  Po dwóch, trzech tygodniach formalności rejestracyjnych w końcu otrzymałem wszystkie dokumenty.

  Kierownik parku kazał mi wybrać stanowisko pracy. Moje wymagania są niskie – wystarczy miejsce do siedzenia, taboret i prąd.

  Potem kazał mi wypełnić trzy wnioski projektowe, głównie o mocnych stronach projektu, profilu zespołu i przewadze związanej z AI. Jeśli wnioski są solidne i wiarygodne, jest szansa na dopłatę polityczną w wysokości 50–100 tys. juanów.

  Nankin naprawdę dobrze to rozegrał. Każdy powinien sprawdzić, czy jego miasto ma podobne programy, albo czy jego stolica prowincji oferuje coś lepszego.

  Dobre programy nie czekają – trzeba ich samemu pójść szukać. Gdy dziś przyjechałem, w parku było już mnóstwo firm; jestem nawet na późnym etapie.

  Na dziś tyle. Będę dalej dzielić się moją przedsiębiorczą podróżą i retrospekcjami po drodze.

  Dziękuję wszystkim za troskę.