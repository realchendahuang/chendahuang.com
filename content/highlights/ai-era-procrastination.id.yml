content: |
  Di era AI, bentuk prokrastinasi yang paling umum:
  menimbun tool, membeli kursus, bergabung dengan komunitas, ganti-ganti model, mengutak-atik prompt.
  Sibuk setiap hari.
  Tapi tak pernah berani menghadapi satu pertanyaan:
  apakah saya benar-benar punya bisnis nyata yang layak dikerjakan dengan AI?
  Mengasah pisau memang membuat sibuk.
  Tapi banyak orang yang tidak pernah berani benar-benar menyembelih babinya.