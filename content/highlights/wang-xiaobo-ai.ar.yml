content: |
  أنا تلميذٌ متواضع من تلامذة وانغ شياو بو،

  كان طريفاً، بلا تملّق.
  وذا فكاهة، لكن بمنطق.
  كان يمقت الغباء، ويمقت الغباء الذي يتخفى بجدية ووقار.

  ولو عاش وانغ شياو بو في عصر الذكاء الاصطناعي،

  فلعله قال:

  وأخيراً وُجد شيء يعين العامي على تجنب أعمال الحمقى، ويدّخر له وقتاً للتفكير في أمورٍ حقاً ممتعة.

  وهذا أيضاً سبب إعجابي بالذكاء الاصطناعي.

  ليس لأنه معجزي.

  بل لأنه يعفي الإنسان شيئاً من تعذيب اللاعمل الممل.