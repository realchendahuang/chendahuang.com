content: |
  امروز اولین روزِ رسمیِ استقرارم در دفترِ OPC است. بگذارید قدم‌به‌قدم بگویم چطور یک OPC راه انداختم.

  انگیزه‌ی اولیه‌ام ساده بود: یک شخصیتِ حقوقیِ قانونمند داشته باشم که پول بگیرد و محصول منتشر کند. برای همین رفتم آنلاین دنبالِ اطلاعاتِ ثبتِ شرکت.

  درباره‌ی شهر سخت‌گیر نبودم: نانجینگ، سوژو، هانگژو، نینگ‌بو — هر شهری در منطقه‌ی توسعه‌یافته‌ی ساحلی، گزینه‌ی من بود.

  اتفاقاً یک روز برای کار آمده بودم نانجینگ و وقتی بیکار داشتم اکانت‌های وِیچتِ مربوط به نانجینگ را بالا و پایین می‌کردم، شماره‌ی تلفنِ یک نفرِ رابط در اجتماعِ OPC را پیدا کردم. همان‌جا اضافه‌اش کردم.

  بعد از معرفیِ کوتاهِ پروژه‌ام، مسئولِ آنجا گفت اوکی و همان بعدازظهر هماهنگ کرد از محل بازدید کنیم.

  خواسته‌شان این بود: هفته‌ای سه روز حضوری کار کنم. اگر می‌پذیرفتم، اجازه می‌دادند شرکت را اینجا ثبت کنم.

  چون این پروژه زیرمجموعه‌ی دارایی‌های دولتیِ نانجینگ است، شرایطش فوق‌العاده است — آب، برق، اینترنت و هزینه‌ی ساختمان همه رایگان، به‌صورتِ نظری برای سه سال. حتی یک حسابدار برایم گذاشتند که شرکت را ثبت کند، مهرِ شرکت را حک کند، گواهیِ ثبتِ شرکت را بگیرد و برایِ افتتاحِ حسابِ بانکی هماهنگ کند. آن‌قدر خوب که باورش سخت است.

  بعد از دو سه هفته پروسه‌ی ثبت، بالاخره همه‌ی مدارک را گرفتم.

  مدیرِ پارک گفت برو برای خودت یک میزِ کار انتخاب کن. توقعِ من از یک میزِ کار پایین است: یک صندلی، یک چهارپایه و برق کافی است.

  بعد گفت سه فرمِ درخواستِ پروژه را پر کنم؛ بیشتر درباره‌ی مزیت‌های پروژه، وضعیتِ اعضای تیم و وجهه‌ی مرتبط با هوش مصنوعی. اگر فرم‌ها درست و معتبر نوشته شوند، شانسِ گرفتنِ 50 تا 100 هزار یوان کمکیِ دولتی هست.

  نانجینگ واقعاً این کار را خوب انجام داده. شما هم حتماً چک کنید شهرِ خودتان چنین سیاستی دارد یا نه، یا پایتختِ استانتان پیشنهادِ بهتری دارد.

  سیاست‌های خوب منتظر نمی‌مانند — باید بروی بپرسی. وقتی امروز رسیدم، این پارک کلی شرکتِ ساکن داشت؛ در واقع من جزو دیرترها هستم.

  حرفِ امروز همین بود. از این به بعد مدام تجربه‌های استارتاپی‌ام و بازنگری‌های مسیر را به اشتراک می‌گذارم.

  مرسی که به فکر من بودید.
