content: |
  کمی وقت برد، اما بالاخره Sub-Store را روی Cloudflare مستقر کردم.

  نودهایِ شخصی‌ام و نودهایِ پشتیبانِ سرویسِ اشتراک را با هم ادغام کردم و با قوانینِ مسیریابیِ ACL4SSR روی اشتراکِ خودکار جفتش کردم.

  با یک لینکِ اشتراکِ واحد همه‌ی این‌ها انجام می‌شود:

  - ادغامِ نودهای چند سرویس‌دهنده
  - فیلترِ نود
  - پیکربندیِ قوانینِ مسیریابی
  - به‌روزرسانیِ خودکارِ کانفیگ

  روان‌تر از روان.
