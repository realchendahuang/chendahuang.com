  Um brother perguntou:

  tem algum bom documento de análise do Claude Code pra estudar?

  Minha resposta: na era da IA, tem que pensar em IA em todos os momentos, deixar a IA te ajudar a estudar.

  Se você realmente quer aprender os princípios de Agent,

  vai dar uma olhada no projeto Pi Agent.

  Pardalzinho pequeno, mas com todos os órgãos — perfeito pra estudar, e ainda tem código de alta qualidade.

  O Claude Code não é open source, é vazamento de código-fonte.

  O Pi Agent é que é open source de verdade.