content: |
  در عصر هوش مصنوعی، گستردهترین شکل تعلل این است:
  احتکار ابزار، خریدن دوره، پیوستن به جامعهها، عوض کردن مدلها و دستکاری prompt.
  هر روز حسابی سرت شلوغ است.
  اما هرگز جرئت نمیکنی با یک سؤال روبهرو شوی:
  آیا واقعاً یک کسبوکار واقعی دستم هست که ارزش داشته باشد هوش مصنوعی را به جانش بیندازم؟
  تیز کردن چاقو آدم را خیلی مشغول نگه میدارد.
  اما خیلیها هرگز جرئت نمیکنند خوک را واقعاً بکشند.