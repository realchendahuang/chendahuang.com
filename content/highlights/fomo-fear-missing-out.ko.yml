content: |
  개념 하나 소개할게요. FOMO, 풀 네임은 Fear of Missing Out, '놓치면 안 될까 봐 두려운 마음'입니다.

  이런 증상 가진 분들 많을 거예요: 좋은 걸 보면 북마크하고 싶고, 새로운 도구나 트렌드를 보면 따라가고 싶고, 늘 이걸 안 하면 중요한 걸 놓치는 것 같고. 결과는 뭐냐면, 북마크는 점점 쌓이고, 머릿속은 점점 어지러워지고, 주의력은 그 과정에서 조금씩 갉아먹히는 겁니다.
