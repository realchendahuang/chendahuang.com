content: |
  TUI, kaba söylemek gerekirse, kokmaya başladı.
  En iğrenç yanı kullanılmasının zor olması değil; insanın bilişsel bant genişliğini sistematik olarak düşürmesi.
  Aracıyla verimli konuştuğunu sanıyorsun, ama aslında durmadan üç şey yapıyorsun:
  kısayolları ve modları hatırlamaya çalışmak,
  kayan bir karakter akışında bilgiyi bulmaya çalışmak,
  ve tuhaf bir duruma yanlışlıkla düşmemiş olmak için dua etmek.
  Bu artık etkileşim değil, arayüzle boğuşma.
  Gerçekten verimli bir arayüz durumu gözünün önüne serer, anlamayı gözlerine ve mekân algına bırakır; her şeyi kısa süreli belleğe tıkıştırmaya zorlamaz. TUI tam tersini yapar — bilgi yoğunluğunu azamiye çıkarırken okunabilirliği ve geri dönüşülebilirliği asgariye ezer.
  Daha da kötüsü, çok kötü bir alışkanlık aşılar: bir aracın tuş düzenini kullanabilmeyi başlı başına bir yetenek saymak. Sonuç: insan, sorun üzerine düşünmek yerine arayüze uyum sağlamakla koca bir enerji harcıyor.
  İyi bir araç düşünme maliyetini düşürmeli; düşünme maliyetini bu arayüzü nasıl kullanacağına devretmeli değil.
  TUI'nin bugünkü popülerliği, büyük ölçüde etkileşim tasarımındaki tembelliği ve kibri bir geek filtresiyle örtmekten ibaret.
