  Saya membuat sebuah macOS Playbook.

  Untuk orang yang baru membeli Mac, baru pindah dari Windows, atau yang selalu merasa Mac-nya tidak pernah benar-benar klik.

  Isinya:

  - Software apa yang harus dipasang dulu setelah dapat Mac
  - Bagaimana pengguna Windows beradaptasi dengan macOS
  - Cara memilih tools seperti Rectangle / AltTab / Homebrew
  - Cara bekerja lintas perangkat
  - Cara mengatur terminal, Git, SSH, dan lingkungan coding AI
  - Cara menangani pemeliharaan sistem, pemecahan masalah, backup aman, dan migrasi perangkat

  Playbook: [chendahuang.com/playbooks](/playbooks)
