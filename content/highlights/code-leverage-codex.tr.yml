  Bir fikir beyan ediyorum:

  Kod, biz sıradan insanların kaldıracıdır.

  Codex, kaldıracın kaldıracıdır.

  Codex'i çektiğinde, kazanın altındaki odunları çekmiş gibi oluyorsun — her şey çöküyor.

  Dedikleri gibi: temel sağlam olmayınca dağlar sarsılır, yer titrer.

  Hadi artık, yerli AI'lar — kendinize gelin!