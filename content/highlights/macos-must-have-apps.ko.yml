content: |
  macOS를 수년간 깊이 써오면서 진짜 대단하다고 생각한 소프트웨어들:

  - **QuickRecorder**: 화면 녹화의 신기(神器) — 작은데 강력하다.
  - **ClashParty**: Mihomo 코어 기반 인터넷 우회 도구 — 지원 프로토콜이 많고, 업데이트가 빠르며, 인터페이스도 예쁘다.
  - **V2rayN**: 인터넷 우회 도구, 지원 프로토콜이 많다. UI가 좀 올드하지만 안정적이고 무료다.
  - **Doubao(도우바오) 입력기**: 음성 입력 정확도가 무섭게 좋다. macOS, iOS, Android 지원, Windows는 개발 중.
  - **Brave**: 프라이버시 우선 브라우저, 광고 필터 내장 — 확장 프로그램 방식 필터보다 더 깨끗하고, 유튜브 보기에 최고의 파트너다.
  - **Mos**: 마우스 휠 스크롤을 더욱 매끄럽게 만들어 준다.
  - **Amphetamine**: 노트북을 덮어도 화면이 꺼지지 않게 해 준다 — 바이브 코딩의 최고 파트너.
  - **UU Remote**: NetEase가 만든 원격 데스크톱 도구, 무료에 빠르다. 이걸 쓰고 나면 화질을 제한하는 건 절대 멤버십이 아니라 네트워크 속도다. 나는 주로 폰으로 Mac에 원격 접속해 바이브 코딩 결과를 확인하는데, 키 매핑 효율이 말도 안 되게 높다.
  - **Tencent Lemon**: Tencent가 만든 Mac용 정크 클리너 — 앱 삭제가 아주 매끄럽고, 메뉴바 아이콘도 편하다.
  - **Mole**: Mac에서 가장 강력한 정크 클리너 — 터미널 버전은 무료, UI 버전은 유료.
  - **Tailscale**: WireGuard 기반의 원격 네트워킹. 이게 있으면 세상 어디서든 집에 있는 작은 컴퓨터에 연결할 수 있다.
  - **Obsidian**: AI 시대의 로컬 우선 지식 관리 도구. 생태계가 너무 좋다 — 공식 Web Clipper 브라우저 확장과 함께 쓰면 신통력이 있다.
