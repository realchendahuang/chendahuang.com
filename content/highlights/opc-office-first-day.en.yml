  Today's my first day officially moving into the OPC office. Let me walk through how I started an OPC.

  My original motive was simple: have a compliant entity to receive payments and publish products. So I went online looking for company registration info.

  I wasn't picky about the city: Nanjing, Suzhou, Hangzhou, Ningbo — any developed coastal city was a candidate.

  By coincidence, I was in Nanjing for work one day, and while idly scrolling through Nanjing-related WeChat accounts, I found the phone number of an OPC community contact. So I added them.

  After a quick introduction of my project, the person in charge said OK and arranged a site visit the same afternoon.

  Their ask: work on-site three days a week. If I could accept that, they'd let me register the company here.

  Since this is under Nanjing's state-owned assets, the policy terms are outstanding — water, electricity, internet, and property fees all free, theoretically for three years. They even assigned a bookkeeping accountant to register the company for me, carve my company seal, get the business license, and set up the bank account. So touching it's almost absurd.

  After two or three weeks of the registration process, I finally got all the paperwork.

  The park manager told me to pick out a workstation. My bar for a workstation is low — just a seat, a stool, and power.

  Then they had me fill out three project application forms, mainly covering my project's strengths, the team's profile, and the AI-related edge. If the applications are solid and credible, there's a shot at a 50,000–100,000 yuan policy subsidy.

  Nanjing has genuinely handled this well. Everyone should check whether their own city has similar policies, or whether their provincial capital offers anything better.

  Good policies don't wait around — you have to go ask. By the time I arrived today, this park already had plenty of companies moved in; I'm actually on the late side.

  That's all for today. I'll keep sharing my startup journey and the retrospectives along the way.

  Thanks for the care, everyone.