  Today is the first day of officially moving into the OPC office. Let me tell you about my experience of starting an OPC.

  My original intention was just to have a compliant entity that could receive money and list products. So I searched online for company registration information.

  I didn't have strict requirements about the city: Nanjing, Suzhou, Hangzhou, Ningbo — as long as it's a developed coastal area, they were all candidates.

  By coincidence, one day I was on a business trip to Nanjing, and with nothing to do, I browsed some Nanjing-related public accounts. I found the phone number of a contact person in an OPC community, and added them.

  After briefly introducing my project, the person in charge thought it was fine and arranged for me to visit the site that afternoon.

  Their requirement was to work on-site three days a week, and if I could accept that, they'd let me register a company here.

  Because it's a project under Nanjing state-owned assets, their policy conditions are excellent — water, electricity, internet, and property are all free, theoretically free for three years, and they even have a dedicated bookkeeping accountant to help me register the company, carve the seal, get the business license, and contact the bank to open an account. Moved to the point of absurdity.

  After a registration process of two or three weeks, I finally got all the materials.

  The park manager let me pick a workstation here. My requirements for a workstation aren't high — just a seat, a stool, and electricity.

  The park manager had me fill out three project application forms, mainly introducing my project's advantages, the team members' situation, and the specialties combined with AI. If written well and reliable enough, there's a chance to get a 50,000–100,000 yuan policy subsidy.

  I think Nanjing has really done this well. Everyone can also check whether their own city has related policies, or whether their provincial capital has better policies.

  Good policies don't wait for people — you must ask around more. When I arrived today, this park already had many companies moved in, and I was relatively late.

  That's all for today's sharing. I'll continue sharing my entire entrepreneurial experience and process reviews.

  Thanks everyone for your concern.
