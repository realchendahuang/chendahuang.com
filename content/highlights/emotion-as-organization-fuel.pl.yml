content: |
  Coraz bardziej przekonuję się, że wartość emocji jest głęboko wartościowa.

  Dlaczego my, Homo sapiens, potrafimy się zjednoczyć, żeby robić wielkie rzeczy?

  Właśnie dlatego, że wspólnie wierzymy w jakąś historię, jakieś emocje, jakiś totem, jakiś mit, jakąś narrację — to tworzy organizacje, napędza współpracę, czyni nas silniejszymi i sprawia, że wielkość się wydarza.

  Czy to samo w sobie nie jest rodzajem wartości emocjonalnej?