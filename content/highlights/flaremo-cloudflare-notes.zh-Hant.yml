  基於 Cloudflare 技術棧原生開發的筆記軟體——FlareMo。

  註冊一個免費的 Cloudflare 帳號，部署完以後就可以擁有 10G 檔案儲存、5G 資料儲存。

  永久免費，裝備不花一分錢，流量不花一分錢，資料多地備份，天生自帶高可用機制。

  24 小時隨時隨地在雲端服務，完全相容 Memos 生態。

  當時開發進度：花了一天完成整體基本功能搭建，已經完全可用。

  後續會補充更多使用部署教學、工程化測試案例、AI Agent 相關技術，以及多端支援。Build in public。