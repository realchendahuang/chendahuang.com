  Sharing a small trick for rewriting.

  You can use the Doubao input method's voice-to-text.

  While looking at the draft you need to organize,

  speak it out, retelling it in your own words.

  This way there's less AI flavor.

  It's also efficient, free, and doesn't require a membership.

  You can do voice input anytime, anywhere, improving your output efficiency.
