  Liang Wenfeng sagte beim Investoren-Meeting:
  „Das Ende der Intelligenz könnte überall die Verkörperung sein. Denn für einen normalen Menschen ist seine Anforderung nicht der Computer, sondern Arbeitskraft."
  Dieser Satz sitzt. Normale Leute wollen nie einen schlaueren Computer, sondern Arbeitskraft, die was schafft. Egal wie stark Text ist – er bleibt ein Zwischenzustand. https://t.co/2xg5o5hNjt