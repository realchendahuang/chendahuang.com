content: |
  در X، حتماً باید نظر داشته باشی.

  آدم‌های بدونِ نظر فقط دارند نویزِ اطلاعاتی تولید می‌کنند.

  موضع داشته باشی، آدم‌ها یادت می‌مانند.

  بینش داشته باشی، آدم‌ها می‌خواهند فالوت کنند.

  X از بازنشرکننده کم ندارد — کم دارد آدم‌هایی که بتوانند موضوعی را تا ته و تهِش توضیح بدهند.
