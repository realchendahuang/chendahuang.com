content: |
  AI 시대의 새로운 소프트웨어 기회는 어디에 있을까?

  큰 기회 중 하나는 기존 소프트웨어로는 기록할 수 없었던 부분, 즉 비정형 배경 데이터다.

  예를 들어 진정한 AI 네이티브 CRM이라면, 고객에게 준 할인을 기록할 때 왜 이 할인이었고 다른 할인이 아니었는지, 왜 다른 안들이 기각됐는지, 그 과정에서 누가 누구를 설득했는지도 함께 기록할 수 있다.

  기존 소프트웨어는 이렇게 숨겨진 정보를 기록할 수 없는 경우가 많다. AI 시대는 텍스트와 영상을 이해하는 능력으로, 이렇게 숨겨져 있고 중복이 많은 정보를 구조화된 데이터로 뽑아내 분석할 수 있다.
