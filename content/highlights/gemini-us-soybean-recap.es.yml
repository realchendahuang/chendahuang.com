content: |
  Las opiniones sobre el «plan Soja americano» de Gemini vienen llenas de sustancia, así que preparé un pequeño resumen de los comentarios:
  A mucha gente le parece que Gemini no es cómodo de usar, y la razón de fondo es que confunden su posicionamiento con el de una máquina herramienta de ingeniería de cabecera.
  En realidad, su posicionamiento se parece más al de una navaja suiza completa: ligera, versátil, de coste marginal bajísimo, pero con límites bien definidos en ingeniería compleja y ejecución autónoma.
  En la entrada de información, el análisis nativo de YouTube es una de sus capacidades más cómodas. Sin scripts de descarga ni herramientas de transcripción que montar en local: envías el enlace y extrae en la nube la transcripción completa con marcas de tiempo, capturas de fotogramas clave y resúmenes estructurados.
  El workflow real de mucha gente ya tiene una división clara del trabajo: Grok sigue las discusiones y el pulso en directo de X, y Gemini procesa los podcasts técnicos y los vídeos de fondo de más de media hora.
  En visión y desarrollo front-end, su base multimodal es muy sólida. Páginas enteras de notas manuscritas, tablas complejas o escaneos de baja resolución: la precisión del reconocimiento es altísima y alucina poco.
  Y al prototipar front-end es de una velocidad brutal, con una estructura de código natural, sin esa marca de generación rígida y redundante.
  Muchos desarrolladores independientes usan prompts fijos para que genere estructuras de diapositivas en una sola página, o para producir rápido páginas utilizables a partir de capturas de diseño.
  En coste y combinación de herramientas, las cuentas de su ecosistema salen muy bien. La suscripción de 20 dólares al mes admite grupo familiar de hasta 6 personas, viene con varios TB de Google Drive y se integra a fondo con Docs y Sheets.
  Delegarle la búsqueda de información, el análisis multimodal y la construcción de páginas ligeras, y dejar el código complejo del núcleo a modelos de código dedicados: una forma eficaz de bajar el gasto total en herramientas de desarrollo.
  Y hay algunos usos avanzados que ya demostraron funcionar:
  Primero, aprovechar sus preferencias lógicas bastante directas para encargarle la revisión de la sobreingeniería y el código redundante que otros grandes modelos suelen producir;
  Segundo, combinarlo con NotebookLM para montar una base de conocimiento privada centrada en material concreto;
  Tercero, asignar la cuota premium a necesidades derivadas como la síntesis de voz o el procesamiento de imágenes.
  Pero al usarlo hay que tener muy claros sus límites.
  Primero, no está hecho para tareas complejas de terminal Agent: cuando le piden modificar reglas del sistema o desplegar entornos, suele negarse a ejecutar o no seguir instrucciones de varios pasos;
  Segundo, el código de negocio profundo debe pasar por revisión cruzada de tus modelos principales para no enterrar defectos ocultos; tercero, es bastante sensible al entorno de red: con nodos de calidad inestable es fácil toparse con restricciones del servicio o una experiencia degradada.
