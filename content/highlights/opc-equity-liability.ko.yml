content: |
  오늘 한 친구가 내 댓글 창에서 1인 기업의 지분과 책임 문제에 관한 몇 가지 포인트를 공유해 줬다.

  우선, 이 친구의 친절한 조언에 정말 감사드린다.

  그의 견해: 가족 중 한 명이 최소 1%의 지분을 갖게 해야 한다.

  1인 유한회사의 문제: 주주가 한 명뿐일 때, 회사 돈과 개인 돈이 분리되어 있다는 걸 명확히 설명할 수 없으면, 주주가 회사 채무에 대해 연대 책임을 질 수 있다. 회사법 제23조가 정확히 이 논리다.

  주주가 여럿이 되면 회사는 '1인 회사'에서 '보통 유한책임회사'로 바뀌어, 1인 회사의 특수한 입증 책임 리스크를 피하고 저비용 보호막을 한 겹 더 얻게 된다.

  모두에게 참고가 되길 바란다.

  다만 평소에 사업 계좌와 개인 계좌를 분명히 구분하고, 중요한 돈은 한 건 한 건 설명할 수 있어야 한다.

  - 돈이 어디서 왔는지, 왜 왔는지, 어느 계좌로 들어왔는지.
  - 돈이 어디에 쓰였는지, 왜 썼는지, 누가 승인했는지.
  - 회사에서 돈을 뺄 때, 급여인지, 경비 정산인지, 대출인지, 배당인지.

  이 세 가지만 또렷이 해 두면 리스크가 크게 줄어든다.
