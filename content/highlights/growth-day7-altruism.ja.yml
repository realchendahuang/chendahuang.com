  運用 7 日目で 2000 フォロワー突破、軽く振り返る。

  核心はたった一文字：利他。

  主に二種類の役立つ内容を共有した：

  - macOS ヘビーユーザー向けソフトウェアリスト（48k 閲覧）
  - Cloudflare 無料枠表 + Playbook（X での数字も良かったし、なんと知られてない人に転載・リライトされて知乎に載り、数百のブックマークまで稼がれた）
  - おまけに OPC 一人会社の資源おすすめ（38k 閲覧）

  フォロワーを増やすことを考えたわけじゃなく、調べ尽くしたことを整理して無料で公開しただけ。むしろその方が伸びた。

  今後もこういう実用コンテンツを出し続ける。応援感謝です。