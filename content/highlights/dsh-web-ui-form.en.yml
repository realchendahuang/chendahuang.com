content: |
  I think DeepSeek Harness nailed the form factor.
  
  Instead of jumping straight into an anti-human TUI, it ships a Web UI.
  
  And it barely takes any storage — because there is no installer at all. No Electron framework ramming a browser engine inside. That's a lot of storage saved.

  The only drawback is that it lives in the browser — but you can install it as a PWA, and then it feels exactly like a native client.

  Installing a web app as an application via Chrome is genuinely useful. In the screenshot here, it's a webpage, yet it behaves no differently from a desktop app.
