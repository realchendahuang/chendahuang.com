  A friend asked me what brand the power bank in the photo is.

  Alright, time for me to start pitching.

  This is the CoolState Power Bank No. 25 Super SE (CoolState is the former Zimi).

  A little over 140 yuan, 25,000 mAh, up to 120W output, built-in charging cable.

  It keeps my MacBook Air going through a whole afternoon of heavy work.

  The perfect office companion for Starbucks, McDonald's, KFC, the countryside, and every other place!