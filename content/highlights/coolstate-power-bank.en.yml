  A friend asked me what brand the power bank in the picture is.

  Alright, time to start recommending.

  This is the CoolState No. 25 Super Power Bank SE (CoolState is the former Zimi).

  A bit over 140 yuan, 25,000 mAh, up to 120W output, with a built-in charging cable.

  It can keep my MacBook Air working at high intensity for a whole afternoon.

  A great companion for working at Starbucks, McDonald's, KFC, the countryside, and other places!
