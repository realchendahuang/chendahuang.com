  L'humain juge. L'IA amplifie.

  L'attention humaine est limitée. L'humain ne s'occupe que de la partie du jugement la plus cruciale.

  Il faut absolument répartir l'attention limitée là où ça a de la valeur. Laisser l'IA faire davantage de boulot ingrat.

  C'est ça, le sens de l'existence des workflows IA.

  Que le workflow IA fasse le tour complet du boulot ingrat, et que l'humain assure le jugement final — la vérification ou la validation du résultat la plus précieuse, la plus centrale, la plus conforme à l'objectif final.

  C'est l'état que j'ai envie d'atteindre. Dernièrement je n'arrête pas d'explorer ces workflows.