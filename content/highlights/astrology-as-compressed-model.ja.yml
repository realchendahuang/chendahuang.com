content: |
  ふと思いついた、けっこう面白い視点。

  星座、干支、星象、占いみたいなものは、人類の低計算リソース時代の「圧縮モデル」として理解できるかもしれない。

  古人にはデータベースも、統計ツールも、AI もなかった。

  彼らは季節、天象、農時、性格、人情、社会のサイクルを長期間観察し、その複雑な経験を、覚えやすく伝わりやすい記号体系に圧縮するしかなかった。

  12 星座、12 干支、四柱推命、卦象——本質的にはどれも複雑な世界を次元圧縮しているようなものだ。

  もちろん、厳密な科学的予測にはなりえない。

  でも純粋な迷信と決めつけるのも間違いだろう。

  どちらかというと、計算もデータもツールも足りない時代に、古人が物語と記号とルールで作った一種の「経験の蒸留」だ。