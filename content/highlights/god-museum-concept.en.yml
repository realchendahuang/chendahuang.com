  The name for the Eastern and Western mythology guide is decided — God-Museum · Pantheon Museum:

  Put the *Classic of Mountains and Seas*, *Journey to the West*, ancient Greek, Norse, and ancient Egyptian pantheons — these unrelated systems — into the same universe, so they don't clash.

  The same law of thunder is called Zeus in Greece and Leizhenzi in the East;

  The same great flood is remembered by Easterners as Nüwa mending the sky, and by Hebrews as Noah's Ark.

  If you seriously keep asking, the entire mythological world has to be rearranged.

  Try it online: https://chendahuang.com/god-museum/
