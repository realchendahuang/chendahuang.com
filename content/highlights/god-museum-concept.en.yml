  The name for the Eastern-Western mythology compendium is set — God-Museum · Museum of the Gods:

  Cram the *Classic of Mountains and Seas*, *Journey to the West*, ancient Greek, Norse, and ancient Egyptian pantheons — these sets of stories that never touched — into one universe, and make them not collide.

  The same law of thunder is called Zeus in Greece and Leizhenzi in the East;

  the same great flood is remembered in the East as Nüwa mending the sky, and by the Hebrews as Noah's Ark.

  If you keep chasing that thread seriously, the whole mythological world has to be rearranged.

