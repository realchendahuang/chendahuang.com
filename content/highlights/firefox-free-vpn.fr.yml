  Halte-là ! Je viens d'apprendre que Firefox offre à chaque utilisateur 50 Go de VPN gratuits par mois.

  Pour les situations cocasses du poulet et de l'œuf, c'est d'un grand secours.

  Mode d'emploi :

  1. Tape `about:config` dans la barre d'adresse
  2. Entre dans les préférences avancées, clique sur « tout afficher »
  3. Recherche `browser.ipProtection.enabled`
  4. Passe la valeur de l'entrée sur true