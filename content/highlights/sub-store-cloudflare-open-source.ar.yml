  نقلتُ تجميع اشتراكات العبور الحر إلى Cloudflare.

  وفتحتُ مصدر مشروع تجميع روابط اشتراكات العبور الحر، المنشور مجاناً تماماً على Cloudflare.

  يجمع لك كل روابط اشتراكات العبور الحر وعقد الشبكة المبنية ذاتياً في رابط واحد، مع إمكانية ضبط قواعد توزيع الحركة في صاحبه.

  ويحقق ذلك فعلاً: تكفي رابطٌ واحد في كل العملاء، من دون إعداد منفرد لكل عميل.

  GitHub: https://github.com/realchendahuang/sub-store-cloudflare

