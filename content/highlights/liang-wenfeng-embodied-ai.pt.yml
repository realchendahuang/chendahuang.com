content: |
  O Liang Wenfeng disse numa reunião de investidores:
  «O destino da inteligência pode ser o corpo. Porque pra uma pessoa normal, o que ela precisa não é um computador, é mão de obra.»
  Essa frase é certeira. A pessoa comum nunca quis um computador mais esperto, e sim "mão de obra" que trabalha. Por mais forte que seja o texto, ele é só um estado intermediário. https://t.co/2xg5o5hNjt