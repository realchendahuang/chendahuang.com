content: |
  İlan ediyorum:

  Cloudflare gerçek bir AI-native şirket.

  Geliştirici deneyimini gerçekten AI ajanları etrafında yeniden inşa ediyor.

  Yeni çıkan Geçici Hesaplar sayesinde bir AI ajanı kod yazabiliyor, doğrudan deploy edebiliyor, geçici bir URL alıyor, kendini test ediyor ve kendi kendini geliştiriyor.

  Pürüzsüzün de pürüzsüzü.

  Bir de Cloudflare'ın resmi Skills'iyle birleştirin, kurulum tek komut:

  `npx skills add cloudflare/skills`

  AI-native olmak ne demek?

  İşte AI-native'in GOAT'ı bu.