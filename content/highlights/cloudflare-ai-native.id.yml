content: |
  Saya menyatakannya:

  Cloudflare adalah perusahaan AI-native sejati.

  Ia benar-benar membangun ulang pengalaman developer di sekitar AI agent.

  Temporary Accounts yang baru saja dirilis memungkinkan AI agent menulis kode, langsung deploy, mendapatkan URL sementara, menguji dirinya sendiri, dan mengiterasi dirinya sendiri.

  Lebih mulus dari mulus.

  Padukan dengan Skills resmi Cloudflare, cukup satu perintah untuk memasang:

  `npx skills add cloudflare/skills`

  Apa sih artinya AI-native?

  INI-lah GOAT-nya AI-native.