content: |
  Tôi tuyên bố:

  Cloudflare là công ty thực sự AI-native.

  Họ đang thực sự xây dựng lại trải nghiệm developer xoay quanh AI agent.

  Temporary Accounts vừa phát hành cho phép một AI agent viết xong code, triển khai trực tiếp, lấy được URL tạm thời, tự test và tự lặp lại.

  Mượt còn hơn cả mượt.

  Kết hợp với Skills chính thức của Cloudflare, cài chỉ bằng một lệnh:

  `npx skills add cloudflare/skills`

  AI-native nghĩa là gì cơ?

  Đây CHÍNH LÀ GOAT của AI-native.
