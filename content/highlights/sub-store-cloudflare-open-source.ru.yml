  Я перенёс агрегацию подписок обхода блокировок на Cloudflare.

  Открыл исходники проекта агрегации ссылок подписок, который полностью бесплатно разворачивается на Cloudflare.

  Он складывает все твои ссылки подписок обхода блокировок и собственные узлы в одну ссылку, с приложенными правилами маршрутизации.

  По-настоящему одна ссылка — работает в каждом клиенте, без настройки каждого клиента по отдельности.

  GitHub: https://github.com/realchendahuang/sub-store-cloudflare

