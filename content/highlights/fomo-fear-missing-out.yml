content: |
  给大家介绍一个概念，叫FOMO，全称Fear of Missing Out，错失恐惧。
  相信很多人都有这个毛病：刷到好东西就想收藏，看到新工具、新趋势就想跟，总觉得不跟就会错过什么重要的东西。结果就是收藏夹越来越满，脑子越来越乱，注意力就在这个过程中被一点点消耗掉了。
