content: |
  یکدفعه به یک زاویه دید جالبی فکر کردم.

  برجهای دوازدهگانه، حیوانات دوازدهگانه، ستارهبینی، فال — اینها را شاید بتوان «مدلهای فشرده» دوران کمبود قدرت محاسباتی بشر دانست.

  گذشتگان نه پایگاه داده داشتند، نه ابزار آماری و نه هوش مصنوعی.

  تنها کاری که از دستشان برمیآمد این بود که فصلها، پدیدههای آسمانی، تقویم کشاورزی، شخصیتها، عرف اجتماعی و چرخههای جامعه را در بازههای طولانی مشاهده کنند و بعد آن تجربه پیچیده را در یک نظام نمادین فشرده کنند که به خاطر سپردنش آسان و پخش کردنش ساده باشد.

  ۱۲ برج فلکی، ۱۲ حیوان، هشتنویسه (BaZi) و هگزاگرامها — همهشان اساساً راههایی برای فروکاستن جهان پیچیده به ابعاد کمترند.

  البته نمیشود آنها را پیشبینی علمیِ دقیق حساب کرد.

  اما لزوماً هم خرافهی صرف نیستند.

  بیشتر شبیه تقطیر تجربهاند — ساختهی گذشتگان، با داستان و نماد و قاعده، در روزگاری که قدرت محاسباتی کم بود، داده کم بود و ابزار کم بود.