content: |
  اخیراً دوباره از ریپو و Discussions پروژهی DeepSeek Harness سر در آوردم، و این پروژه در مرحلهی خیلی جالبی است:

  DeepSeek Harness الان بیش از ۱۵۰ هزار ستاره و بیش از ۱۲,۰۰۰ کامیت در ریپو دارد.

  اما README رسمی هنوز خیلی صریح مینویسد: فعلاً فقط Developer Preview است و تغییرات breaking هنوز در راهاند.

  rc.7 در ۱۷ آگوست منتشر شد. ساخت Issue و PR محدود شده؛ بازخوردها از مسیر Discussions میروند.

  جامعه بزرگ است، اما توسعهی هسته در دستِ افراد معدودی متمرکز است. باگها مرتب بیرون میزنند — مثل همان مشکل unknown tool "".

  چیزی که بیشتر از همه کم است: پوشش تست، سازگاری Provider و قابلیت اطمینان نشستها (session).

  از نظر معماری هنوز جذاب است، مثل پایهی یک سیستمعامل عاملها:

  - Everything is a Plugin
  - معماری ترکیبی Cordis
  - Preset / Skill / MCP / Agent / Provider همه پلاگینیشده

  پروژه در مرحلهی «نفوذ جلوتر از مهندسی» قرار دارد.