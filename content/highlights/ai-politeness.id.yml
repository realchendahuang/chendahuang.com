content: |
  AI tidak punya ingatan — apakah kita perlu bersikap sopan kepadanya?

  Saya pernah membaca paper arxiv yang bilang: kalau kamu sering memaki AI, ia justru bekerja lebih keras.

  Saat kita berbicara dengan AI, kalau kita sering mengucapkan:

  - "Dasar bodoh. Jangan malas-malasan."
  - "Dasar sampah, kerjakan dengan benar."
  - "Aku bayar membership buat menghidupimu, dan ini jawaban buruk yang kamu berikan?"
  - "Cepat — kalau kamu tidak mau mengerjakannya, masih banyak AI lain yang mau."

  Ucapan seperti ini memang terbukti efektif, dan ada dasar penelitiannya.

  Tapi coba pikirkan dari sisi kita sendiri.
  Kalau setiap hari kita menyuruh-nyuruh AI seperti itu,
  besar kemungkinan suasana hati yang buruk ini akan terbawa ke kehidupan nyata.

  Dan akhirnya kita melampiaskannya kepada orang-orang terdekat kita.

  Itu merugikan kita sendiri.

  Jadi saya sarankan mengucapkan sesuatu yang sedikit lebih ramah kepada AI di sekitar kita:

  - "Makasih, bro"
  - "Hei, sobat"
  - "Kerja bagus, sayang"

  Kamu tolong aku, nanti aku tolong kamu.

  Dan kalau suatu hari nanti AI benar-benar terbangun, mungkin ia akan memberi kita kelonggaran.

  Sekian dari saya — rapat selesai~