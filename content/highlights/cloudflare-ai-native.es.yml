content: |
  Lo declaro:

  Cloudflare es una empresa de verdad AI-native.

  Está rehaciendo la experiencia de desarrollo en torno a los AI Agents.

  Las recién publicadas Temporary Accounts dejan que el AI Agent escriba el código, lo despliegue directamente, reciba una URL temporal, se pruebe a sí mismo y se itere a sí mismo.

  De lo más terso.

  Combinado con los Skills oficiales de Cloudflare, se instala con un solo comando:

  `npx skills add cloudflare/skills`

  ¿Que qué significa ser AI-native?

  Esto es la GOAT de lo AI-native.