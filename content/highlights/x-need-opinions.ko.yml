content: |
  X에서는 반드시 관점이 있어야 한다.

  관점이 없는 사람은 그저 정보 소음만 만들어 낼 뿐이다.

  주관이 있어야 남들이 너를 기억한다.

  통찰이 있어야 남들이 너를 팔로우하고 싶어 한다.

  X에는 남의 글을 퍼 나르는 사람은 차고 넘친다 — 부족한 것은 한 가지를 끝까지 제대로 설명할 수 있는 사람이다.