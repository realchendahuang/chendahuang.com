  Cơ hội phần mềm mới của kỷ nguyên AI nằm ở đâu?

  Một cơ hội lớn: phần mà phần mềm truyền thống không ghi lại được — nói cách khác, dữ liệu nền phi cấu trúc.

  Ví dụ, một CRM thực sự AI-native, khi ghi nhận một khoản chiết khấu đã dành cho một khách hàng, cũng có thể ghi luôn lý do vì sao lại cho khoản chiết khấu này thay vì khoản khác, vì sao các phương án khác bị bác bỏ, và ai đã thuyết phục ai.

  Phần mềm truyền thống có rất nhiều thông tin ẩn kiểu như vậy mà đơn giản là không ghi lại được. Kỷ nguyên AI, với khả năng hiểu văn bản và video, có thể kéo phần thông tin ẩn, dư thừa này ra thành dữ liệu có cấu trúc để phân tích.
