content: |
  یک macOS Playbook ساختم.

  برای کسانی که تازه مک خریده‌اند، تازه از ویندوز به مک آمده‌اند یا همیشه حس کرده‌اند مک هیچ‌وقت دستشان نیامده.

  تویش جمع شده:

  - بعد از خریدنِ مک اول چه نرم‌افزارهایی نصب کنی
  - کاربرانِ ویندوز چطور با macOS کنار بیایند
  - ابزارهایی مثل Rectangle / AltTab / Homebrew را چطور انتخاب کنی
  - کارِ بینِ دستگاه‌ها را چطور پیش ببری
  - ترمینال، Git، SSH و محیطِ AI Coding را چطور راه بیندازی
  - نگهداریِ سیستم، رفعِ اشکال، بکاپِ امن و مهاجرتِ بینِ دستگاه‌ها را چطور مدیریت کنی

  Playbook: [chendahuang.com/playbooks](/playbooks)
