  Pewien gość zapytał:

  czy istnieje jakiś dobry materiał o Claude Code do nauki?

  Moja odpowiedź: w erze AI zawsze myśl z AI – pozwól, by AI pomogło ci się uczyć.

  Jeśli naprawdę chcesz zrozumieć, jak działają agenci,

  idź obejrzeć projekt Pi Agent.

  Mały, ale kompletny – idealny do nauki, a jakość kodu jest wysoka.

  Claude Code nie jest open source; to wyciek kodu źródłowego.

  Prawdziwie otwartoźródłowy jest Pi Agent.