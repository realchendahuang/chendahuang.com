  Chia sẻ một trang web kho báu: Buzzing

  Nó dành cho những ai muốn mở rộng nguồn thông tin và thoát khỏi vỏ bọc thông tin của mình.

  Nó liên tục kéo nội dung hot từ Hacker News, Reddit, BBC, Reuters, Bloomberg, Product Hunt và các nguồn nước ngoài khác, rồi dịch các tiêu đề sang tiếng Trung.

  Giá trị lớn nhất của nó: bạn được lướt qua các tiêu đề bằng tiếng Trung trước.

  Nếu thấy thứ gì thu hút và đáng đọc, click vào để xem chi tiết.

