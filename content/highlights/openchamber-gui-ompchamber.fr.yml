content: |
  J'ai testé quasiment tous les clients Harness GUI open source du marché, et côté design, la plupart sont franchement durs à regarder.
  OpenChamber est le client Harness GUI open source le mieux poli que j'aie utilisé : soigné, stable, et les bugs occasionnels n'empêchent pas de l'utiliser sur la durée.
  Mais il ne marche qu'avec OpenCode, impossible de basculer vers un autre Harness. Des utilisateurs remontent que les performances globales d'OpenCode ne sont pas terrible et qu'il a tendance à freiner le modèle.
  Du coup je construis un projet dans ma tête : garder le front d'OpenChamber comme squelette et remplacer le noyau par Oh My Pi, ce qui collerait mieux à mes propres besoins.
  Pourquoi pas le Pi Agent natif, et Oh My Pi ?
  Parce que le Pi Agent natif est beaucoup trop flexible : impossible d'en tirer un GUI universel.
  En compromis, Oh My Pi est en quelque sorte une distribution du Pi Agent, avec une expérience d'interaction des plugins globalement stable.
  Du coup je trouve que faire d'OpenChamber + Oh My Pi un produit prêt à l'emploi répond à un vrai besoin latent.
  J'ai appelé ce projet OMPChamber ; il est encore en plein développement et en tests intensifs — si ça vous intéresse, n'hésitez pas à mettre une star.
  https://github.com/realchendahuang/OMPChamber
