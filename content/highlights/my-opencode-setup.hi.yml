content: |
  शेयर कर रहा हूँ वह OpenCode सेटअप जो मैं अभी चला रहा हूँ। मेरा सेटअप तीन कोर ज़रूरतों के इर्द-गिर्द बना है:
  कॉन्टेक्स्ट मैनेजमेंट — लंबे सेशन में कॉन्टेक्स्ट न फटे, पैसे और टोकन की बचत
  मेमोरी सिस्टम — सेशन के पार यूज़र की प्रेफ़रेंस, प्रोजेक्ट के फ़ैसले और पुराने सबक याद रखना
  एक्सटर्नल कैपेबिलिटीज़ — डॉक्स लुकअप, कोड सर्च, डेस्कटॉप ऑटोमेशन
  मुख्य प्लगइन्स जो मैं इस्तेमाल करता हूँ:
  1. opencode-dcp (ओपन सोर्स) डायनामिक कॉन्टेक्स्ट प्रूनिंग प्लगइन।
  कॉन्टेक्स्ट जब थ्रेशोल्ड छू लेता है, तो पुराने कॉन्टेंट को अपने-आप टेक्निकल समरी में कंप्रेस कर देता है — की-इनफ़ो रखता है, नॉइज़ फेंकता है, डुप्लीकेट कॉन्टेंट अपने-आप साफ़ करता है, और टूल एरर जैसा लो-वैल्यू कॉन्टेंट कॉन्टेक्स्ट से बाहर निकल देता है
  2. opencode-goal-plugin
  Goal मोड प्लगइन, लंबे टास्क में गोल-मैनेजमेंट जोड़ता है
  3. Hermes Memory (डिमांड हुई तो आगे ओपन सोर्स कर दूँगा)
  यह मेरा सबसे भारी प्लगइन है — Hermes agent की लेयर्ड मेमोरी मैकेनिज़्म को OpenCode पर पोर्ट किया है।
  4. context7-MCP
  लाइब्रेरी/फ़्रेमवर्क का लेटेस्ट ऑफ़िशियल डॉक्स देखने के लिए।
  5. grep-MCP
  GitHub कोड सर्च, पूरे GitHub के कोड में रियल-वर्ल्ड यूज़ेज़ खोजने के लिए।
  6. open-computer-use (डेस्कटॉप ऑटोमेशन)
  AI को सीधे macOS ऐप्स चलाने देता है — क्लिक, टाइपिंग, स्क्रॉल, ड्रैग, स्क्रीनशॉट, accessibility tree पढ़ना।
