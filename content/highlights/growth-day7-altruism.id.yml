  Hari ke-7 operasi tembus 2000 pengikut — kilas balik singkat.

  Intinya satu kata: altruisme.

  Saya terutama membagikan dua jenis konten praktis:

  - Daftar software pemakaian berat macOS (48k dibaca)
  - Tabel kuota gratis Cloudflare + Playbook (angkanya lumayan di X; bahkan ada orang yang menggarapnya ulang dan mencurinya ke Zhihu, sampai dapat beberapa ratus bookmark)
  - Plus rekomendasi sumber daya OPC (one-person company) (38k dibaca)

  Saya tidak memikirkan cara menambah pengikut — saya cuma merapikan apa yang sudah saya pahami lalu memberikannya gratis. Hasilnya malah tumbuh lebih cepat.

  Ke depannya saya lanjut merilis konten praktis semacam ini. Terima kasih atas dukungannya semua.
