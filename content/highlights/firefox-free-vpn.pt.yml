  Que dialogo de filho! Descobri que o navegador Firefox dá 50G de VPN grátis por mês pra cada usuário.

  Uma mão na roda naquele dilema pavio curto de "quem veio primeiro".

  Como usar:

  1. Digita `about:config` na barra de endereço
  2. Entra nas preferências avançadas, clica em mostrar tudo
  3. Busca por `browser.ipProtection.enabled`
  4. Muda o valor dessa entrada pra true