content: |
  Looking for a tool that lets you "jot things down casually and slowly grow them into knowledge."

  I want Flomo's out-of-the-box, non-intrusive inspiration capture;

  I want Memos' mature open-source ecosystem, migratable data, and playable API;

  But I don't want to spin up another VPS and maintain Docker, Postgres, and a persistent Node process.

  So what to do? FlareMo's approach is to treat Memos' data model and API as a "spec," and rebuild the entire runtime on Cloudflare:

  Workers run the API, D1 stores notes, R2 holds attachments, Queues/Cron run background jobs, and Vectorize + Workers AI are reserved for future semantic search and AI workflows.

  Standing on Memos' shoulders, building a personal knowledge base that lives on the edge cloud.
