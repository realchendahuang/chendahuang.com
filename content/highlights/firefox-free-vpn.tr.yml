  Vay canına! Firefox tarayıcısının her kullanıcıya ayda 50G ücretsiz VPN trafiği verdiğini yeni öğrendim.

  O garip tavuk-yumurta ikilemi için biçilmiş kaftan.

  Nasıl kullanılır:

  1. Adres çubuğuna `about:config` yaz
  2. Gelişmiş tercihlere git, "Show all" butonuna tıkla
  3. `browser.ipProtection.enabled` değerini ara
  4. O girişin değerini true yap