  Comparto un sitio tesoro: Buzzing

  Le encaja a quien quiera ampliar sus fuentes de información y romper su burbuja informativa.

  Va recopilando de forma continua el contenido en boga de fuera: Hacker News, Reddit, BBC, Reuters, Bloomberg, Product Hunt... y traduce los titulares al chino.

  Su mayor valor es que primero repases los titulares en chino.

  Si ves un artículo que te interesa y merece la pena, entras a ver los detalles.

  Ahí puedes combinarlo con la traducción inmersiva para leerlo en bilingüe.