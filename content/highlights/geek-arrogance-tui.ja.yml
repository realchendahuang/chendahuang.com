content: |
  正直なところ、一部のギークコミュニティはもはやニッチどころではない——完全に独りよがりだ。

  彼らの十八番はこれ：使いにくさを洗練とみなし、参入の敷居をセンスとみなす。

  簡単で直感的で、普通の人でもすぐに覚えられるものが出ると、彼らは本能的に「ハードコアじゃない、メジャーすぎる、格が下がる」と感じてしまう。

  逆に、操作がぎこちなく、情報が奥深くに隠れ、専用の符丁やショートカットを覚えないといけないものほど、「これこそ本物のツールだ」と思う。

  これはもはや効率の追求ではない。苦痛を使って自分のアイデンティティを確認しているのだ。

  「他人には耐えられない操作に、俺は耐えられる」——この言葉を口にした瞬間、優越感が生まれる。

  コミュニティが小さければ小さいほど、そうした自己陶酔は互いに増幅されやすい。

  やがてこうなる：「使いにくい」と言うやつは理解していない、素人だ、と。

  本当にすごい人は、複雑なことをシンプルにする。ところが一部のギークは、シンプルなことを複雑にして、その複雑さの上に立って他人を見下す。
