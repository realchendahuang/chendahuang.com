content: |
  Os comparto el año y pico de experiencia de desarrollo independiente escrita con sangre, sudor y lágrimas.

  En 2026, si un desarrollador independiente quiere hacer una app, la mejor práctica es:

  **En la fase de MVP, primero hacer Web + PWA.** Desarrollas rápido, depuras rápido, iteras rápido.

  Pila web:

  React + TanStack Start + Vite + TypeScript + shadcn/ui + Base UI + Tailwind CSS + better-auth + Vercel AI SDK + oxfmt / oxlint

  Backend unificado:

  Hono + Cloudflare Workers

  Depuración web:

  Chrome DevTools MCP + plugin de Codex para Chrome

  Cuando el producto de verdad arranque, entonces toca el móvil.

  Pila móvil:

  React Native + Expo + Expo Router + NativeWind + React Native Reusables + Reanimated + Gesture Handler + EAS Build / Submit / Update

  La idea central es muy simple:

  primero valida la necesidad con Web + PWA.

  Cuando haya usuarios de verdad, entonces monta la app con React Native + Expo.