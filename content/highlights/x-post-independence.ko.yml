  X 발행에 관한 소소한 팁을 공유한다:

  모든 게시물은 그 자체로 독립적으로 성립해야 한다.

  네가 세상의 중심은 아니기 때문이다 — 아무도 네 프로필을 일부러 열어 전후 사정을 맞춰 보지 않는다.

  낯선 사람이 처음 네 글을 발견했을 때, 그 자리에서 바로 하나의 관점이나 하나의 노하우를 얻어 가야 한다.

  그런 게시물만이 가치가 있다.