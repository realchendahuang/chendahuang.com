content: |
  हाल ही में मैं "Fu Bu Hei" जैसे स्पैम अकाउंट्स से बहुत परेशान हो गया।

  गुस्से में आकर, मैंने एक ब्राउज़र एक्सटेंशन लिखा — इसका नाम है "FeedSieve"।

  कई दौर के iteration के बाद यह अच्छी जगह पर है, और लाइव होने वाला है।

  जिन्हें ज़रूरत हो, इसे bookmark कर लें — मैं जल्द ही इसे ओपन-सोर्स करूँगा और Chrome Web Store पर रखूँगा।
