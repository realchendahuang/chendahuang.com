  我做了一個 macOS Playbook。

  適合剛買 Mac、剛從 Windows 換到 Mac，或是一直覺得 Mac 用不順手的人。

  裡面整理了：

  - 買完 Mac 先裝什麼軟體
  - Windows 使用者怎麼適應 macOS
  - Rectangle / AltTab / Homebrew 這些工具怎麼選
  - 跨裝置協作怎麼用
  - 終端機、Git、SSH、AI Coding 環境怎麼設定
  - 系統維護、故障排除、安全備份、換機遷移怎麼處理

  Playbook：[chendahuang.com/playbooks](/playbooks)
